    - task-metadata
title: Applied Configuration
description: >-
  A bound Project's custom fields, or a shared scope's issue fields, issue
  types, labels, or milestones, as Manifold read them at the end of the
  last Apply that reached them, against which a plan tells drift on
  GitHub from a change to the declaration.
