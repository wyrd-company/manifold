    - gates
title: Grant round
description: >-
  One synchronous comparator loop for one gate, from the input change that starts it until the population is empty, the comparator returns `null`, a grant or
  evaluation fails, or the module stops. Each grant changes the population, holders, and balances seen by the next evaluation.
