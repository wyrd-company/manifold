$schema: https://refinery.systems/ontology/term
relationships:
  # GAP-EDGE: the term schema declares no relationship edges; `related-to`
  # is the best fit.
  related-to:
    - retention
    - retention-configuration
title: Retention window
description: >-
  How long Manifold's store keeps one kind of row it no longer needs, in
  whole days or `forever`, after which the service removes the row: an
  ended actor's consumed events and commands, a source event's record, a
  webhook delivery's or redelivery's record, a gate's comparator
  evaluation, or a closed escalation.
