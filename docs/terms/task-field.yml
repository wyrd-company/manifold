$schema: https://refinery.systems/ontology/term
# GAP-EDGE: the term schema declares no edge to the artifacts that use a
# term; `references` is the best fit for the specification that defines it.
relationships:
  references:
    - task-metadata-declaration
title: Task Field
description: >-
  A value of a bound GitHub Project's tasks that the task metadata
  declaration declares, with its type, its storage kind, and what an Apply
  does when its configuration changes on GitHub: a Project field, an
  organization issue field or issue type, a repository label or
  milestone, or a key of the issue body's front matter.
