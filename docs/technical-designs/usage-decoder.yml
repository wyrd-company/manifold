$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - portfolio
  mitigates:
    - task-usage-unattributable
  # GAP-EDGE: the technical-design schema declares no edge to a spike or a
  # specification; `references` is the best fit.
  references:
    - provider-capacity
    - cost-history
    - usage-record
    - host-cli-usage
objective: >-
  Turn the provider session files on one environment into calls that the
  service can price and post as actuals, each with its timestamp, model,
  every token class the provider reports, provider session id, and the
  usage unit that made it, without spawning a process, without losing a
  call, and without presenting a count the provider did not report.
background:
  current-design: >-
    The portfolio design states that the host CLI reads provider session
    files in process, decodes them with a pinned decoding library, and that
    the service prices each call and posts it to an actor. The decoding
    library is `@codeburn/core`. It decodes records the host hands it. It
    does no file I/O and no pricing.
  problems:
    - >-
      Non-secret Codex rollouts can carry quota observations alongside tokens.
      The provider-capacity spike separates those observations from calls and
      identifies Antigravity in the released T3 Code provider inventory.
    - >-
      Each provider keeps its sessions in its own layout: JSON Lines
      transcripts, rollout files, session directories, and SQLite databases.
    - >-
      A provider session file holds one usage unit, but the library folds a
      Codex child thread into its root session and drops the unit's own id,
      its parent, and its name.
    - >-
      The same call can appear in two files, a subagent replaying its parent
      or a fork replaying its origin, and the library removes the copy only
      when one dedup set spans every file of the provider.
    - >-
      Harnesses change their log shapes without notice, and a session file
      is read while its harness still writes it.
    - >-
      Cursor keeps a session that T3 Code runs in an undocumented ACP
      session store that the library does not decode, writes no agent
      transcript for it, and records no token counts for its calls.
design-challenges:
  one-seam: >-
    Five providers, five layouts, and two storage kinds must sit behind one
    call that a test can drive with a directory of fixtures.
  unit-identity: >-
    Attribution needs the unit's own id and its parent, and the library does
    not carry them for every provider.
  no-silent-loss: >-
    A malformed line, a truncated file, an unknown record, and a call on a
    model with no price must each be visible, and none may stop the other
    files or hide the calls that did decode.
  drift: >-
    A new library release or a new harness shape must change a test result
    before it changes an actual.
  absent-counts: >-
    A call whose provider records no token counts must still reach its
    thread, actor, and account, and must not carry counts that look
    measured.
proposed-design:
  high-level-overview: >-
    The usage decoder is one module in `packages/host-cli/src/usage/`. Its
    public seam is `decodeUsage(roots)`, an async iterable of usage records:
    a call record for each call, and a source error record for each problem
    with one source. A root names a provider and the directory where that
    provider keeps its sessions. For each root the decoder finds the
    provider's sources, reads each one in process with `node:fs` or
    `node:sqlite`, hands the records to the provider's `@codeburn/core`
    decoder, reads the unit identity the library does not carry from the
    source itself, and yields normalized records. `defaultUsageRoots(env,
    home)` resolves the roots a provider uses when no root is given. The
    `manifold-host usage decode` command writes the records as JSON Lines.
    The record format is the `usage-record` specification, and the command
    is the `host-cli-usage` specification. The decoder reads files and
    writes nothing. Pricing, mapping a provider session to a thread, and
    posting actuals are the service's work.
  public-interface: >-
    `packages/host-cli/src/usage/index.ts` exports exactly these.
    `type UsageProvider = "claude" | "codex" | "cursor" | "grok" |
    "opencode"`. `type UsageRoot = { provider: UsageProvider; path: string
    }`. `type UsageRecord = UsageCall | UsageSourceError`, the two shapes of
    the `usage-record` specification as TypeScript types.
    `decodeUsage(roots: readonly UsageRoot[]): AsyncIterable<UsageRecord>`.
    `decodeUsageBatches(roots: readonly UsageRoot[], options?: { skip?:
    (source: UsageSourceStamp) => boolean }): AsyncIterable<UsageBatch>`,
    with `type UsageSourceStamp = { provider: UsageProvider; path: string;
    files: readonly { path: string; size: number; modifiedMs: number }[] }`
    and `type UsageBatch = { sources: readonly UsageSourceStamp[]; records:
    readonly UsageRecord[] }`. `defaultUsageRoots(env: Readonly<Record<string, string | undefined>>,
    home: string): UsageRoot[]`. `runUsageCommand(args: readonly string[],
    io: { stdout: Writable; stderr: Writable; env; home }):
    Promise<number>`, which parses the command line, runs the decode, writes
    the records, and returns the exit code. `src/cli.ts` dispatches `usage`
    to `runUsageCommand` and holds no other usage logic. Everything else in
    the folder is internal: one adapter per provider, the source reader, and
    the record normalizer.
  providers: >-
    The decoder covers every T3 Code provider that `@codeburn/core` decodes.
    `claude` uses `@codeburn/core/providers/claude` over
    `<root>/projects/**/*.jsonl`, where a subagent transcript is
    `<session-id>/subagents/agent-<agent-id>.jsonl` beside its
    `agent-<agent-id>.meta.json`. `codex` uses
    `@codeburn/core/providers/codex` over `<root>/sessions/**/*.jsonl` and
    `<root>/archived_sessions/**/*.jsonl`. `cursor` uses
    the decoder's own ACP session adapter over every
    `<root>/acp-sessions/<session-id>/store.db`, the sessions T3 Code runs,
    as `cursor-sessions` states, and `@codeburn/core/providers/cursor-agent`
    over the agent transcripts of the runs Cursor makes outside the Agent
    Client Protocol: `<root>/projects/*/agent-transcripts/<id>/<id>.{txt,jsonl}`,
    `<root>/projects/*/agent-transcripts/<id>.{txt,jsonl}`, and
    `<root>/projects/agent-transcripts/<id>.{txt,jsonl}`, with the row for
    the conversation from the `conversation_summaries` table of
    `<root>/ai-tracking/ai-code-tracking.db`, or a null summary when the
    database or row is absent. The summary's integer `updatedAt` is handed
    to the library as its decimal text. A transcript's `turn_ended` record
    is a record type the adapter recognizes. `grok` uses `@codeburn/core/providers/grok`
    over each session directory `<root>/sessions/<cwd>/<session>/` holding
    `summary.json`, an optional `signals.json`, and `updates.jsonl`.
    `opencode` uses `@codeburn/core/providers/opencode-session` over the
    file layout `<root>/storage/session/**/*.json` with its
    `storage/message/<session-id>/` and `storage/part/<message-id>/` files,
    and over every `<root>/opencode*.db` database, read through its
    `session`, `message`, and `part` tables. A root directory that does not
    exist yields nothing. A source the library cannot address in this list
    is outside the decoder.
  default-roots: >-
    `defaultUsageRoots` is pure over its arguments. `claude` is
    `CLAUDE_CONFIG_DIR`, else `<home>/.claude`. `codex` is `CODEX_HOME`,
    else `<home>/.codex`. `cursor` is `<home>/.cursor`. `grok` is
    `GROK_HOME`, else `<home>/.grok`. `opencode` is `OPENCODE_DATA_DIR`,
    else `XDG_DATA_HOME/opencode`, else `<home>/.local/share/opencode`. A T3
    Code provider instance with its own home path is decoded by passing that
    path as a root.
  decode-order-and-dedup: >-
    The decoder gathers the sources of every root of one provider into one
    list and decodes them with one dedup set. A source is identified by its
    real path from `fs.realpath`, so a root given twice, or a source that two
    roots reach, decodes once, at its first position. Sources take the order
    of their first root in the order given, and within a root ascending
    order of their path compared as UTF-16 code units. For `claude` the set
    is the message-id set `groupIntoTurns` takes, so a session transcript
    decodes before its `subagents/` directory and a replayed message stays
    with the session. For `codex` the set is the `seenKeys` of `decodeCodex`,
    and each rollout file starts a fresh decode state. Before any Codex
    rollout decodes, the decoder reads the first `session_meta` record of
    every rollout of the provider, and orders each rollout after the rollout
    whose unit is its origin: `payload.forked_from_id` for a fork, and its
    parent for a child thread. The order is a stable topological sort of
    that relation over the path order, so an origin decodes before its fork
    wherever each file lives, and its calls stay with the origin's unit. A
    rollout whose origin is in no source of the decode, or whose origin
    cannot be read, decodes at its path position, and its replay of that
    origin stays with its own unit. A cycle in the relation, which no
    harness writes, decodes in path order. The other providers pass one
    `seenKeys` set per provider. The first copy of a session in decode
    order owns its calls, and a later copy, in the same root or another,
    yields only the calls the first copy lacks. A running total only grows,
    so of every copy of a session-total unit the decoder keeps the current
    one: the copy with the latest timestamp, then the greatest sum of its
    token classes, then the greatest token classes compared in the order
    of the record's `tokens` object. Copies whose totals conflict, where
    neither holds every class at or above the other, resolve by the same
    comparison. The decoder holds each `session-total` record until every
    source of its provider has decoded, and then yields one record per key,
    from the current copy, whatever the order of the roots. The order fixes
    which unit owns a duplicated call, so the same files always give the
    same records.
  source-batches: >-
    `decodeUsageBatches` yields the records `decodeUsage` yields, in the
    same order, grouped by the sources that complete them, and
    `decodeUsage` yields the records of its batches with no `skip`. A
    source's stamp names its real path and every file the decode of that
    source reads, with each file's size and modification time in epoch
    milliseconds: the transcript and its `.meta.json` for `claude`, the
    rollout for `codex`, the store for a `cursor` ACP session and the
    transcript and the tracking database for a `cursor` transcript, the session directory's files for `grok`, and the session,
    message, and part files, or the database, for `opencode`; a database's
    stamp includes its `-wal` file when one exists. The decoder takes each
    stamp before it reads the source, so a file that grows during the read
    has a stamp that differs at the next decode. Each source gives one
    batch holding its source error records and its call records of
    granularity `call`. After every source of a provider has decoded, one
    batch holds the provider's `session-total` records. The batch of a
    source names it, unless the source held a copy of a `session-total`
    record, in which case the provider's `session-total` batch names it,
    so a batch names exactly the sources whose records it completes. A
    root that cannot be read gives a batch that names no source. A source for which `skip` answers true is
    not read: it gives no batch, adds nothing to the dedup set, and holds
    no `session-total` copy, while its Codex `session_meta` record still
    orders the rollouts. A replay of a skipped origin's call then decodes
    on its fork or child unit under the key the origin's call had, as the
    convergence paragraph states.
  unit-identity: >-
    Every call carries `providerSessionId`, the session id the library
    assigns the call, which is the id the harness and T3 Code know, and a
    `unit` naming the usage unit whose file holds the call. `claude`: a
    session transcript is a `session` unit whose id is the file stem. A
    subagent transcript is a `subagent` unit whose id is the transcript's
    `agentId`, else the file stem without `agent-`. Its parent is the unit
    whose transcript records the spawn of that agent id, from the library's
    `collectSessionMeta` spawn links, else the library's `parentSessionId`.
    Its `name` is `description` and its `role` is `agentType` from the
    `.meta.json` file, when present. `codex`: the decoder reads the first
    `session_meta` record of each rollout file itself. The unit id is
    `payload.id`. The parent is `payload.parent_thread_id`, else
    `payload.source.subagent.thread_spawn.parent_thread_id`. A rollout with
    a parent is a `child-thread` unit, and one without is a `session` unit.
    `name` is `agent_nickname` and `role` is `agent_role`, read from the
    payload, else from `thread_spawn`. `cursor`: each ACP session store is
    a `session` unit whose id is the name of its directory, the session id
    T3 Code holds, and each transcript is a `session` unit whose id is the
    conversation id, the transcript's file stem. `grok`: each session
    directory is a `session` unit whose id is the library's session id.
    `opencode`: each session row or session file is a unit whose id is the
    session id. A session with a `parent_id` is a `subagent` unit with that
    parent. `name` is the session title. The decoder builds one library
    envelope per unit, holding only that unit's messages and parts, with the
    root session id as the envelope's session id.
  normalization: >-
    The normalizer maps each library call to one call record. Token classes
    map as `input` from `inputTokens`, `output` from `outputTokens`,
    `cacheRead` from `cacheReadInputTokens`, `cacheWrite` from
    `cacheCreationInputTokens`, `cacheWriteOneHour` from the Claude
    `cacheCreationOneHourTokens`, else 0, `reasoning` from
    `reasoningTokens`, and `webSearchRequests` from `webSearchRequests`.
    `speed` passes through. `model` is the library's model string, or null
    when it is empty. The timestamp is the library's timestamp written by
    `Date.prototype.toISOString`. A call whose timestamp does not parse
    takes the source's modification time and is `estimated`. A call is
    `estimated` when the library marks its cost estimated, or when its
    timestamp came from the source or from another record than the call's
    own. A `cursor` call has `tokens` null: Cursor records no token counts
    for a call, and the decoder neither derives counts from text nor
    writes 0 for a count it does not have, so it drops the counts the
    library derives from a transcript's text length. Its model is the
    model Cursor names for the call, or null, and never a name the
    library or the decoder supplies for an absent model. Grok and the OpenCode
    session-level arm report one running total for a session, so their call
    has granularity `session-total`. Every other call has granularity
    `call`. The key of a `call` record is `<provider>/<library dedup key>`.
    The key of a `session-total` record is
    `<provider>/<unit id>/session-total`, so a later decode of a grown
    session yields the same key with larger counts.
  cursor-sessions: >-
    An ACP session store is a SQLite database the decoder opens read-only
    and reads one statement from, `SELECT id, data FROM blobs ORDER BY
    id`; it never reads the `meta` table, which holds a blob encryption
    key. SQLite gives the statement one consistent snapshot of the store
    and its write-ahead log, so a session Cursor still writes yields the
    calls committed at the read and no partial record. Every blob is one
    of these kinds, tried in this order. A JSON message is data that
    parses as a JSON object. A Protocol Buffers record is data that the
    decoder's own wire reader, of varint, length-delimited, 32-bit, and
    64-bit fields, reads to its last byte with no field number 0. A
    conversation state is a record with a varint field 26, a time in epoch
    milliseconds, and one or more field 1 values, each 32 bytes, the blob
    id of a message. A tool record is a record whose only top-level field
    is 2, holding a string field 57, a tool-call id, and varint fields 59
    and 60, the tool call's start and end times in epoch milliseconds. The
    records the decoder needs nothing from are a record with field 26
    whose field 1 is not 32 bytes, a record whose only top-level field is
    3, a record whose only top-level field is 1, and a record whose
    top-level fields are among 1 to 5. A content blob is data of neither
    format whose id another blob names, as its hexadecimal text or its 32
    bytes, such as a file a tool result names by `contentBlobId`. The
    `t3code-session-mapping` spike records this census as measured; the
    store is undocumented, so each of its rules is also a check. A JSON
    message whose `role` is not `system`, `user`, `assistant`, or `tool`,
    a record of no kind above, and a record whose only top-level field is
    2 without string 57 and varints 59 and 60, are `unknown-record`. Data
    of neither format that no blob names, and a conversation state with a
    reference that names no blob, are `malformed-record`. A store that
    cannot be opened, or that has no `blobs` table, is `unreadable`.
    `firstRecord` is the blob's index in the statement's order.
    Each JSON message whose `role` is `assistant` is one call, one model
    response. Its key is `cursor/<session-id>/<blob id>`: the blob id is
    the hash of the message's content, which never changes and does not
    depend on the store's other blobs, while the message's own `id`
    repeats within a session. Its model is the first
    `providerOptions.cursor.modelName` of its `content` parts. An
    assistant message whose `content` is not an array is a
    `malformed-record` and yields no call. A call's timestamp is the
    earliest start time of the tool records whose tool-call ids its
    `tool-call` parts hold. A `tool-call` part whose id no tool record
    holds is an `unknown-record`, so a moved field shows as an error and
    not as a quiet change of time. A call with no tool record takes its
    time from its anchor and is `estimated`. Its anchor is the
    conversation state that ends with its reference and holds the fewest
    references, the least state blob id among equals; a state ends with a
    call when no assistant message's reference follows the call's. The
    time is the latest end time of the tool records of the calls before
    it in its anchor, else the anchor's field 26. Cursor writes the state
    that ends with a call when it writes the call, so an append, which adds
    references after the call, and a compaction state that holds later
    calls after it never become its anchor, and the anchor of one store is
    one state whatever the order of reads. A later state that ends with
    the call, holds no more references than its anchor, and gives another
    time would change the estimated time of a fresh decode; the
    `t3code-session-mapping` spike measures no such state, and the
    service keeps the first record of a key, so a pushed call keeps its
    time and its state visit. A call with no tool record
    and no state that ends with it yields nothing and is a
    `malformed-record`; it yields its call at the first decode after
    Cursor writes its state, and the service fixes its record then.
  unpriced-models: >-
    The decoder emits every call the library decodes, whatever its model,
    including a call with no model. It holds no price table. The service
    flags a call as unpriced when its price table has no entry for the
    model.
  source-errors: >-
    A problem with one source yields one source error record for each error
    code it has, naming the provider, the source path, the code, the count
    of affected records, and the zero-based index of the first. `unreadable`:
    the source or a file or database it needs cannot be opened or read; the
    source yields no calls. `truncated`: the last line of a JSON Lines
    source has no line terminator and does not parse; it is the record a
    harness is still writing. `malformed-record`: a line that does not
    parse, a record the library reports as `malformed-json`,
    `missing-required`, or `invalid-value`, or a JSON file of the layout
    that does not parse. `unknown-record`: a parsed record whose type is not
    one the provider's adapter recognizes, or one the library reports as
    `unknown-shape`. Each adapter holds the set of record types its
    provider's current shapes use. `decoder-failed`: the library threw on
    the source; the source yields no calls. A source with `truncated`,
    `malformed-record`, or `unknown-record` errors still yields every call
    the library decodes from it. No source error stops the decode of any
    other source.
  sqlite: >-
    SQLite sources open through `node:sqlite` `DatabaseSync` with
    `readOnly: true`, which both Node and the compiled Bun binary provide. A
    database that cannot be opened, is locked, or lacks a table or column
    the adapter reads yields `unreadable` for that database. The decoder
    sets no busy timeout of its own.
  convergence: >-
    The decoder holds no state between runs and changes no file. Running it
    twice over unchanged files yields the same records in the same order. A
    run that stops halfway leaves nothing to repair; the next run decodes
    every source again. A source that grows between runs yields its earlier
    calls under the same keys, and a session total yields its new counts
    under its old key. A deleted or unreadable origin file lets a replay
    reappear on its fork or child unit under the key the origin's call had, so the service treats
    the key as the idempotency key of a call and the last `session-total`
    record for a key as that key's value.
  dependency-pin: >-
    `packages/host-cli/package.json` depends on `@codeburn/core` at the
    exact version `0.9.20`, with no range operator. Raising the pin is a
    change to that line and the lockfile, which the golden fixture suite
    gates. No code checks the installed version.
  fixtures-and-drift-guard: >-
    Fixtures live in `packages/host-cli/src/usage/fixtures/`, one root
    directory per provider in that provider's layout. They are small,
    synthetic files with generic values in the record shapes of the current
    harness releases, and no content from a real session. They cover a
    session with calls on two models, every token class, a Claude subagent
    with its meta file, a Codex child thread whose library call carries the
    root session id, a Codex fork in `archived_sessions/` whose origin is in
    `sessions/` and which replays the origin's calls and adds calls of its
    own, a second fork whose origin file is absent, an OpenCode child
    session in a database, a Cursor ACP session store, a Cursor transcript
    in each of the three layouts, `.txt` and `.jsonl`, with and without a
    summary row, a Grok session, a call on a model no price table holds, a call with
    no model, a truncated file, a line that does not parse, and a record of
    an unknown type. `fixtures/expected.jsonl` holds the exact records
    `decodeUsage` yields over every fixture root. The golden test decodes
    the fixture roots and compares the records with that file, so a library
    release or an adapter change that alters any record fails it. Each
    fixture provider directory holds `shape.yml`, naming the harness
    version whose record shapes it follows. The Cursor ACP session store
    is built by the test from SQL in the fixture directory, whose JSON
    messages hold generic text and whose records are hexadecimal
    literals: conversation states for each turn, each ending with its
    turn's last call; assistant messages with one and with two tool calls
    on two models, one with no tool call, and one with no model name; a
    tool record for each tool call; a content blob a tool result names;
    and a record of each kind the decoder needs nothing from. Further
    stores each add one fault to that store: a message with an unknown
    role; an assistant message whose content is not an array; a tool
    record whose times are in fields 61 and 62; a record whose only
    top-level field is 7; data of neither format that no blob names; a
    state whose field 26 is a string; a state with a reference to no
    blob; and an assistant message with no tool call and no state that
    ends with it.
  tests: >-
    Tests drive `decodeUsage`, `defaultUsageRoots`, and `runUsageCommand`
    only, and never an adapter. The SQLite fixtures are built by the test
    from SQL in the fixture directory into a temporary directory. Every
    record a test sees validates against `usage-record.schema.yml`, parsed
    with `yaml` and compiled with Ajv's draft 2020-12 validator in strict
    mode, both development dependencies of the host CLI. The
    binary test compiles `src/cli.ts` with the package's Bun into a
    temporary directory, runs `manifold-host usage decode` with a `--root`
    for each fixture provider, and compares its standard output with
    `fixtures/expected.jsonl` line for line. Root tests drive `decodeUsage`
    with the same fixture root given twice, and with two distinct roots
    that each hold a copy of one Claude session and one Codex rollout, and
    check that the records equal those of the single root, with unique
    keys. A session-total test drives `decodeUsage` over two roots that each
    hold a copy of one Grok session and one OpenCode session, one copy
    older with smaller totals and one newer with larger totals, in both
    root orders, and checks that each order yields one record per key with
    the newer totals. A batch test drives `decodeUsageBatches` over the
    fixture roots and checks that its records, in order, equal
    `fixtures/expected.jsonl`, that every source is named by exactly one
    batch, and that a `skip` answering true for a source leaves its calls
    out and its stamp's files unread. Cursor tests decode the ACP fixture
    store and then, each from a copy of it, the store with the blobs of
    one more turn, with a compaction state that summarizes the earlier
    references and holds the text-only call before later calls, and with
    a second state of the anchor's length, with a greater blob id, that
    ends with the same call after the same tool calls, and decode the
    unchanged store again; each checks that every earlier
    record is unchanged in every field, that only the new turn's calls are
    added, and that no Cursor call has token counts. Each fault store
    yields its source error with the calls the fault does not touch, and
    the store whose tool record moved its times yields that call with its
    anchored time, `estimated`, beside the `unknown-record` error.
