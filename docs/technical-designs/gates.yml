$schema: https://refinery.systems/ontology/technical-design
relationships:
  mitigates:
    - token-lint-completeness-unproven
  related-to:
    - durable-event-delivery
    - portfolio
    - expressions
    - store
    - gate-xstate
    - escalations
    - blueprint-loader
objective: >-
  Let a process decide which tasks may proceed past a state, in what order,
  and with what budget, without a state machine above the task and without
  the task blueprint encoding anything about other tasks.
background:
  problems:
    - >-
      Ordering forty tasks under dependencies and budget is a function over a
      set. Written as states and transitions it is unreadable, and a
      rules engine sees one input at a time.
    - >-
      Dependency state and priority are facts a task can read for itself.
      Budget is not: two tasks reading the same balance in the same tick both
      pass, and both go.
design-challenges:
  reads-versus-takes: >-
    Guards read. Reserving budget writes. A write contended between task
    actors needs one decider so that the last of a balance goes to one task.
  population: >-
    The set of tasks competing at a state changes with every entry, exit,
    dependency change, and balance change, and it must be rebuilt after a
    restart from persisted state, never from memory.
  expressiveness: >-
    Greedy, skip, all-or-none, lottery, and one-at-a-time are all
    legitimate ways to release tasks, and the user must be able to write
    their own without Manifold knowing the strategy.
  double-grant: >-
    A token in flight during a crash must be delivered once and counted
    once, and a task that already holds a token must never be offered
    another.
proposed-design:
  high-level-overview: >-
    A gate is an implementation declared on a state in a blueprint. It holds
    that state's population, the task actors in it that hold no token, calls
    the process's comparator over the population, and hands out one token at
    a time until the comparator returns none. A token is delivered to the
    task actor as an event named `token`; the guarded transition out of the
    state requires it. The comparator is a pure TypeScript function in the process
    repository run in a sandbox. Orthogonal regions on the task machine hold
    derived facts so that every guard is a read of state.
  declaration: >-
    The gated state carries `meta.gate` naming the comparator file,
    whether a reservation accompanies the token, and where the token is
    returned. The transition out is
    guarded on being `in` the token-holding region state, and on any other
    regions the process requires, such as dependencies clear. Other
    transitions out of the same state, an issue closed by an operator, carry
    no guard and return nothing. A blueprint may put a gate on any state and
    may have none.
  regions: >-
    The task machine declares orthogonal regions for derived facts. A
    `dependencies` region moves between `blocked` and `clear` on dependency
    events. A `budget` region moves from `unreserved` to `reserved` on the
    token event. The comparator's input is assembled from region state and
    context, so what a blueprint exposes to the comparator is what its
    regions hold.
  comparator-contract: >-
    Input: the population, each task with its id, fields, age in the state,
    dependency facts, critical-path length, and portfolio item; the holders,
    tasks holding a token from this gate with their item; the available
    balances per item and account; a seeded random. Output: one task id with
    an optional list of reservations, each naming an account and an amount,
    or none. The function has no clock, no state between calls, no I/O, and
    cannot send events. `now` is not an input; age is computed by Manifold.
  loop: >-
    The gate runs the comparator after every grant until it returns none,
    and again on any event that changes an input: a task entering or leaving
    the state, a dependency change, a balance change, a token returned.
    Events that arrive during a pass are queued and applied after the pass,
    so a pass sees one consistent input. Each evaluation is recorded with its
    input, output, and seed, so any grant can be explained and replayed.
  token: >-
    A token belongs to one task actor and one gate. It is granted by the gate,
    delivered through the actor's inbox, and held until returned. The
    blueprint author decides where it is returned: on the guarded transition
    out of the gated state, or at a later state the blueprint marks as
    returning it, so that a one-at-a-time gate holds the token through the
    work that follows, as a merge queue does. An actor that ends returns
    every token it holds. There is no default: a gate that does not
    declare where its token is returned does not load. Holders are counted from
    unconsumed and consumed token rows, so a gate rebuilt after a restart
    counts a token in flight as held.
  token-lint: >-
    The blueprint lint, in the service on load and in the host CLI, checks
    that every granted token can be returned. For each gate it builds the
    configuration graph from the guarded transition out of the gated state
    and checks that the declared return point is the guarded transition or
    is entered after it, and that from every configuration reachable after
    the grant the return point or actor completion is still reachable.
    Actor completion is the actor reaching a top-level final state, which
    returns every token it holds. A final state inside a region does not
    end the actor and returns nothing. Every other configuration, a dead
    end or a cycle with no route out, is a trap, reported with the path of
    configurations that reaches it.
  token-lint-graph: >-
    A node of the graph is a configuration with everything XState v5 needs
    to choose its next step: the active states with their ancestors, the
    states each history state remembers, the queue of internal events, and
    the actor's status. Active states alone are not enough, since two
    configurations with the same active states and different remembered
    histories have different successors. From each node the lint follows
    every transition XState v5 can take there: transitions declared in any
    parallel region and on any ancestor, eventless transitions in XState's
    order of priority, history targets resolved from the node's memory, and
    every target of a multi-target transition. The return point counts as
    reached when the microstep enters it, so a return state that an
    eventless transition leaves at once still returns the token.
  token-lint-semantics: >-
    The lint gives every shape in `blueprint` a meaning, so no supported
    shape is left undecided. An external event may arrive in any
    configuration whose states take it. A delayed transition is an event
    that may arrive while its state stays active. An invoked actor's
    `onDone` and `onError` are events that may arrive while its state stays
    active. A wildcard transition is taken by one symbolic event that
    stands for every event type the state does not name. An `in` guard is
    evaluated exactly against the configuration. Every other guard, an
    expression or a named guard, may be true or false at each evaluation.
    An expression action changes context and raises nothing. A named action
    raises only the events its implementation declares in the
    implementation registry, and Manifold's registry declares them for
    every action it ships, so the host CLI and the service read the same
    declaration.
  token-lint-verdicts: >-
    Each gate gets one verdict. `proved`: no trap is reachable. `violation`:
    a trap is reachable on a path whose every guard choice is exact, so a
    run of the actor can strand the token; this is an error and the
    blueprint does not load. `potential`: every reachable trap depends on at
    least one choice of an expression or named guard, which the lint
    cannot evaluate; the finding names the path and each guard choice on
    it, and the blueprint loads with a warning. `unknown`: the graph
    exceeded the lint's configuration bound before exploration finished;
    the finding names the gate and the bound, and the blueprint loads with
    a warning. The bound is an option of the lint, set in service
    configuration for the service and by a flag for the host CLI, with a
    default of 20000 configurations, where one gate on a blueprint with
    three parallel regions of four states needs 65 and seven such regions
    take about a second.
  stranded-token: >-
    The graph is an over-approximation of what the actor can do, so a
    configuration from which the graph reaches neither the return point nor
    actor completion is one from which no run can. The lint gives each gate
    whose exploration finished the set of its trap configurations. After
    each save of an actor that holds a token, the gate checks the saved
    configuration against that set, and a holder that has entered a trap
    raises an escalation naming the actor, the gate, and the configuration,
    as `escalations` describes. A held token is never returned without that
    escalation's answer or the actor's end. At run time the gate also
    records, per token, the state in which it was returned, so a held token
    can be traced to the actor and state holding it.
  population-across-versions: >-
    A gate is identified by its blueprint's path and the gated state's path.
    Its population is every task actor in that state on any version of the
    blueprint at that path, so a push that changes the blueprint neither
    splits a gate's population nor resets its holders. The comparator and
    whether a reservation accompanies the token come from the newest
    loaded version of the blueprint. Each actor returns its token at the
    return point its own version declares, and the trap configurations it
    is checked against are its own version's.
  reservation: >-
    When the comparator's output carries reservations, the gate writes them
    to the ledger in the same transaction that records the token, under an
    idempotency key derived from the token id, so a replayed grant reserves
    once. A gate never refuses a reservation the comparator asked for; a
    comparator that must not overrun reads the balance it is given.
  strategies-as-bodies: >-
    Greedy stop returns the top task or none. Greedy skip returns the first
    task whose reservation fits. All-or-none checks that a whole batch fits
    before returning its first member, and relies on the pass seeing one
    consistent input. A lottery draws by weight from the seeded random and
    returns none when its own stop condition holds. One-at-a-time returns
    none while any holder exists. None of these is known to Manifold.
  restore: >-
    After a restart, actors are restored from snapshots and inboxes are
    drained before any gate runs. A gate rebuilds its population with the
    store's state query over persisted snapshot state values, and its holders
    from unconsumed and consumed token rows, reading rows and never an
    actor's memory. It runs in the router's `afterDrain` hook. The persisted
    state value
    and context carry everything membership and the comparator input need,
    so no derived column is required. It does not learn the population by
    replaying invocations, since a replayed callback cannot see region state
    and a renamed implementation joins no one without error.
