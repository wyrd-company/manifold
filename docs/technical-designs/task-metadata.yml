  convergence: >-
    `apply` twice with one revision gives the same declaration in force and
    writes one row. A crash before `apply` commits leaves the earlier
    declaration in force, and the follower applies the commit again at the
    next start. A move run twice for one invocation leaves GitHub holding
    one value, one card move row per resolved field and option, and one
    published change, as `github-event-source` states. A crash before
    GitHub takes the write leaves the actor in the invoking state, and the
    restored invoke sends the write as the first time. A crash after GitHub
    takes the write and before the actor's save restores the actor in the
    invoking state; its invoke writes again and resolves, and the actor
    takes `onDone`. A `transport` error leaves GitHub's value unknown; the
    blueprint that enters the state again sends a new move, which sets the
    option whatever the first did. A Project Apply plans every write from
    an observation made in the same Apply, so it never repeats a write
    GitHub has taken: run twice, the second run observes the first's
    result, plans no change, writes nothing to GitHub, replaces the applied
    configuration with the same fields, and answers `in-sync`. A crash
    after some writes and before the record leaves those writes on GitHub
    and the earlier applied configuration in the store; the next Apply
    observes them, finds those fields and options present by id or name,
    and makes only the rest, so no field or option is created twice. A
    change a crash left made is not drift, since drift is a planned change
    and the plan has none for it. A crash after a save and before the
    record leaves the saved commit, which the follower applies at the next
    start; the next Apply plans against it, finds the accepted fields in
    the declaration, and plans no declaration change, and a retried Apply
    that reaches the same text finds its save by its id. A plan writes
    only the mirror's fields, as an observation does, and twice gives the
    same changes and digest.
  tests: >-
    Tests run through a real store file in a temporary directory, router, actor host, blueprint loader,
    and GitHub event source, against the GitHub fake of the source's test
    suite, with blueprints and a task metadata declaration in a process
    repository fixture. Behaviours proved, each red before green: a
    blueprint that invokes `github-card-move` with a literal status moves
    the fake item's field to that option and takes `onDone`; the actor then
    takes `github.project-item.field-changed` with `movedBy` its own actor
    id, confirmed; a move that fails with `transport` before the fake
    applies it, followed by a person selecting the same option in the fake,
    reaches the actor unconfirmed, and a blueprint guarded on
    `event.movedBy.confirmed` does not take it; a person's change of the field in the fake, delivered by webhook,
    reaches the actor with `movedBy` `null`, and a blueprint guarded on
    `event.movedBy = null` takes only the person's change; a move whose
    status comes from a mapping moves the card; an input with no `status`
    and with a status of `7` fail with `input`; a child blueprint's move
    uses its root task's identity; a Project with no binding, a binding the
    declaration does not name, and a status the binding's options do not
    list each fail with `undeclared`; a field and an option the fake's
    Project lacks fail with `field-missing` and `option-missing`; an issue
    whose item the fake removed fails with `item-missing`; a `FORBIDDEN`
    answer fails with `forbidden`; a `502` and a mutation that never answers
    past `requestTimeoutMs` fail with `transport`; and another GraphQL
    error fails with `rejected`. A revision whose declaration has a finding
    returns `rejected` and leaves the earlier declaration in force, and a
    move before the first clean apply fails with `undeclared`. A service
    that applies a clean revision A, then rejects revision B, and restarts
    on B keeps A's declaration in force, holds B's rejection in
    `metadata_rejections`, and completes a card move with A's lifecycle
    field. A move on a
    restored actor whose invoke runs during the router's resume waits for
    the source to start and then moves the card. The fault test runs the
    service in a child Node process, which kills itself with `SIGKILL` from
    `probeMove` after the fake answers the mutation and before the actor's
    save; the test asserts the signal, starts the service again on the same
    store file, and checks that the fake's item holds the option, that each
    mutation in the fake's log set that same option, that one
    `field-changed` for the item and field was published, with `movedBy`
    the actor, confirmed, and that the actor's snapshot is in the state its `onDone`
    enters. Values are generic and never drawn from Manifold's own domain.
    Project configuration is tested in three layers, each red before
    green. `planProjectConfiguration` is tested as a pure function over
    literal declarations, fields, and applied configurations: an empty
    Project with a declaration plans the lifecycle field and each task
    field as creates, none drift, state `not-applied`; the same fields
    applied and observed plan nothing, `in-sync`; an option renamed on
    GitHub, matched by its applied id, plans a `change` of `name` with
    `drift`, and the Apply's update keeps that option's id; an option
    deleted on GitHub plans a `create` with `drift`; an option added on
    GitHub plans a `remove` with `drift` and `requiresRemoval`; an
    undeclared field held by the applied configuration plans a `remove`
    that is not drift and leaves `in-sync`; a declared option added since
    the Apply plans a `create`, not drift, `pending` 1; a declared color
    changes the option's color and an undeclared color is left as GitHub
    holds it; a reordered declaration plans one `order` change; a field of
    the declared name and another type plans a `remove` and a `create`,
    both `requiresRemoval`; a renamed field whose old name an undeclared
    field holds plans its rename `requiresRemoval`; drift in a field whose
    `whenChanged` is `accept` plans one `declaration` change, and drift in
    the lifecycle field never does; the same input twice gives the same
    changes and digest. `accept.ts` is tested on texts with comments: a
    renamed field keeps its position and the comments around it, an added
    option is written by name, an option with a declared color takes
    GitHub's color, and a removed field's key goes. The Projects API is
    tested through `requestListener` over a real store file, the GitHub
    source against its fake, the revision follower, and a process
    repository fixture, as `projects-api` states, and also: an Apply with
    a stale `digest` answers `409` `plan-stale` and the fake logs no
    mutation; two Applies of one binding sent together make each write
    once and the second answers `in-sync`; an Apply of an accepted field
    renamed in the fake saves one commit whose `task-metadata.yml` holds
    the new name, and the state after is `in-sync`; `planDeclaration` of a
    draft adding a field answers `pending` 1 for each Project that declares
    it; and a binding never observed is `not-applied` with `observedAt`
    `null`. The fault test runs the service in a child Node process that
    kills itself with `SIGKILL` from `probeFieldWrite` after the fake
    answers the second of three field writes; the test asserts the signal,
    starts the service again on the same store file, sends one Apply, and
    checks that the fake's Project holds each declared field and option
    once, that the fake logged no second create of a field or option the
    first run made, and that a third Apply makes no mutation and answers
    `in-sync`. The recreation-during-restart regression runs the same
    child process with `probeMove`: after the fake takes a card move and
    the process dies, the fake deletes and recreates the move's option with
    the same name, and after the restart the actor takes `onDone` and its
    `field-changed` for the new value carries `movedBy` the actor,
    confirmed, and `lifecycle` true. A blueprint guarded on
    `event.lifecycle` takes a person's move of a lifecycle field named
    `Phase` and not a change of another single-select field.
