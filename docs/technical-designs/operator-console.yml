$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - store
    - escalations
    - service-configuration
    - github-event-source
    - t3code-environment-source
    - gate-runtime
    - portfolio-ledger
  # GAP-EDGE: the technical-design schema declares no edge to a
  # specification; `references` is the best fit.
  references:
    - actors-api
    - blueprints-api
    - blueprint-version
    - tasks-api
    - escalation-contract
    - lint-console-edits-on-the-service
objective: >-
  Give the operator console one package that builds into static files, one
  place in the service that serves them and the API the console reads, and a
  shell in T3 Code's visual language that every later screen fills, so that
  an operator opens the console from the service's own HTTP host, moves
  between every screen `DESIGN.md` lists, sees every active actor with
  its blueprint, current state, and environment, sees where every task
  of each bound Project is, and reads and answers a task's escalations,
  state, threads, and usage on its Task page. It changes a process
  from the Blueprints screen: sees each blueprint as a graph of its states
  and transitions, edits its YAML with the service's own lint marking each
  finding as the text changes, and publishes it as a commit pushed to the
  process repository, which the service then runs with no redeploy.
background:
  current-design: >-
    `packages/console` holds a `package.json` and a README, and no framework.
    `DESIGN.md` is the console's visual design. The service has one HTTP host
    on which a module mounts request listeners under a path prefix with
    `mount(pathPrefix, listener)`. Access control belongs to the deployment. The
    store lists the active snapshots with `activeSnapshots()`, and the
    engine keeps an actor's identity at `context.manifold` in its snapshot.
  problems:
    - >-
      No package builds a user interface, so no screen can be built and no
      operator can see what Manifold runs.
    - >-
      The service has no listener that serves the console's files, and no
      endpoint that answers which actors are running.
    - >-
      A blueprint changes only by a push to the process repository from a
      host with a clone, and its author sees the lint's findings only after
      running `manifold-host blueprint lint` or after the service loads it.
design-challenges:
  client-routes: >-
    The console's routes exist only in the browser. A reload or a pasted
    link to any screen must load the application, while a missing asset
    must answer `404`, not the application's page.
  build-order: >-
    The service serves files that the console package builds, and the
    service's tests drive the built console. The build and test order must
    follow from the package graph, with no step a person remembers.
  shell-before-screens: >-
    Most screens are built in later tasks. The shell must give
    each its route, its navigation entry, and its title now, so that a later
    task replaces one component and touches nothing else.
  lint-parity: >-
    The editor must mark the same findings, at the same places, as the
    service reports when it loads the text and as `manifold-host blueprint
    lint` prints, token findings included, while the operator types.
  graph-from-text: >-
    The graph is a view of the YAML. It must follow the text as it changes,
    resolve every target as XState resolves it, and hold its place while
    the text is mid-edit and does not parse.
  edit-durability: >-
    An edit must survive a reload, a failed save, a service restart, and a
    branch that moved under it, and must reach the branch at most once
    however many times its save is retried.
  browser-proof: >-
    The console is proved only when a browser renders it from the service.
    The test must run inside `task check` on a developer machine and in CI.
proposed-design:
  high-level-overview: >-
    `packages/console` is a React 19 single-page application built with
    Vite+ into `packages/console/dist`, on the stack chosen in
    `build-the-console-on-t3-codes-web-stack`. The service's console module,
    `packages/service/src/console/`, exports `mountConsole(host, options)`.
    It mounts two listeners on the HTTP host: the console's files under
    `/console` with `mount`, and the actors read endpoint, specified in
    `actors-api`, under `/api/actors` with `mount`. The shell is
    `AppShell` with the header, the sidebar, and the content region from
    `DESIGN.md`. Every sidebar screen has a route. The Actors screen reads
    `GET /api/actors`. The Board reads `GET /api/tasks` and shows the tasks
    of each bound Project in lanes by lifecycle status, and a card opens
    the Task page, which reads `GET /api/tasks/{actorId}` and answers the
    task's open escalations through `POST /api/escalations/{id}/answer`.
    The tasks read model, `packages/service/src/tasks/`, specified in
    `tasks-api`, is mounted by service assembly under `/api/tasks` with
    `mount`. The Blueprints screen reads and writes through the
    blueprints endpoints of `blueprints-api`. The service module
    `packages/service/src/blueprints-api/` exports
    `mountBlueprintsApi(host, options)` and mounts those endpoints under
    `/api/blueprints` with `mount`. It lints with `lintBlueprint` and
    saves through the revision follower. Every other screen shows its
    title row and an empty state. The console and API are served without
    authentication; access control belongs to the deployment.
  console-package: >-
    `packages/console` holds `index.html`, `vite.config.ts`, `src/`, and
    `public/`. Its scripts are `build` (`vp build`, after building
    `@wyrd-company/manifold-shared`), `typecheck` (`tsc --noEmit`), and
    `test` (`vp test run`), each after building the shared package so that
    its exported types and runtime modules exist on a fresh checkout. Its
    TypeScript configuration extends the base
    with the DOM library, `jsx: react-jsx`, and bundler module resolution.
    `vite.config.ts` sets `base: "/console/"` and adds the React and
    Tailwind CSS plugins. The build writes hashed files under
    `dist/assets/` and `dist/index.html`, and empties `dist/` first. The
    package exports `"./dist/*"`, so that the service resolves the built
    files through the package graph. The root lint configuration adds the
    `react` plugin, so that `.tsx` files are linted with the rest.
  console-source: >-
    `src/main.tsx` mounts the router and the query client. `src/router.tsx`
    declares the routes in code, with TanStack Router's `basepath`
    `/console`. `src/shell/` holds `AppShell`, `Header`, `Sidebar`,
    `CommandSearch`, `ThemeToggle`, and `navigation.ts`, the one list of
    screens. `src/screens/` holds one `<Name>Content` component per sidebar
    screen, with the names `DESIGN.md` gives. `src/ui/` holds the
    primitives vendored from T3 Code's `apps/web/src/components/ui`
    (button, badge, table, dialog, sidebar, kbd, empty), each with T3
    Code's MIT notice in its header and its imports pointed at the
    console's own `cn`. `src/styles.css` sets every color token from
    `DESIGN.md` as a CSS custom property on `:root` and on `:root.dark`,
    and maps them into Tailwind's `@theme`. `src/api/` holds the API client.
  navigation: >-
    `navigation.ts` lists every sidebar screen once: its route, its label,
    its Lucide icon, its group, and its one-line description. The sidebar,
    the breadcrumb, the command search, and each screen's title row read
    this list. The groups and order are those of `DESIGN.md`: Overview,
    Board, Epics, Actors with no label; Portfolio under Plan; Blueprints,
    GitHub Projects, Environments under Configure; Settings at the bottom.
    The routes are `/console/` for Overview, then `board`, `epics`,
    `actors`, `portfolio`, `blueprints`, `projects`, `environments`, and
    `settings` under `/console/`. Settings has the routes
    `settings/task-fields`, `settings/accounts`, and `settings/general`
    for its tabs, and `settings` opens Task fields. A path under
    `/console/` that matches no route shows a "Page not found" empty state
    with a link to Overview.
  shell: >-
    `AppShell` lays out the header, the sidebar, and the content region as
    `DESIGN.md` states. The header holds the sidebar toggle, the Manifold
    mark and name, the breadcrumb (the current screen's label, and the
    Settings tab under Settings), the command search button with its `⌘K`
    hint, and the theme toggle. The sidebar shows the navigation list, with
    the current route selected. The toggle switches the sidebar between
    256px and the 48px icon rail; the mode is kept in `localStorage` under
    `manifold.sidebar`. The command search is a dialog, opened by its
    button and by `⌘K` or `Ctrl+K`, with a filter field over the navigation
    list; Enter opens the selected screen. Each screen starts with the
    title row: its label and its description from `navigation.ts`.
  theme: >-
    The theme toggle cycles System, Light, and Dark, and is a ghost button
    whose icon and `aria-label` name the current choice. System follows
    `prefers-color-scheme` and changes with it. The choice is kept in
    `localStorage` under `manifold.theme`, and the theme is the `dark`
    class on the root element. `public/theme.js`, loaded before the
    stylesheet, sets the class from the kept choice before the first paint,
    so that a reload in dark theme does not flash light.
  empty-screens: >-
    Overview, Epics, Portfolio, GitHub Projects,
    Environments, and every Settings tab show
    their title row and the empty state from `DESIGN.md`: a dashed border,
    the screen's icon, the title "Nothing here yet", and the line "This
    screen is not built in this version of Manifold." A later task
    replaces the screen's `<Name>Content` component and changes nothing in
    the shell.
  settings-general: >-
    The General tab of Settings shows its heading and the shared empty
    state: "Nothing here yet", "This screen is not built in this version
    of Manifold."
  api-client: >-
    `src/api/client.ts` exports `fetchActors()`. It sends `GET /api/actors`
    without authentication headers. It turns the answer into `ok` with the
    actors for `200`, or `failed` with a message for any other status, a
    network error, or a body that is not an actors response. The mapping
    from a status and a body to a result is a pure function. The body is
    checked at this boundary against the shape exported by
    `@wyrd-company/manifold-shared/actors-api`, and the rest of the console
    trusts it. Reads go through TanStack Query, which reads again when the
    window regains focus and when the screen opens. No timer reads on a
    schedule.
  actors-screen: >-
    `ActorsContent` reads `fetchActors()`. Its title row is "Actors" with
    its description, and it has no primary action. Under it, one row holds
    the actor count, right-aligned, and a ghost "Refresh" icon button that
    reads again. The table columns are the Actors list's columns in
    `DESIGN.md` that the endpoint answers, in its order: Task, Portfolio
    item, Blueprint, Current state, and Environment. Usage, Time, and
    Timeline join when the store holds what they show. Task is the issue
    reference in mono when the summary has `issue`, else the actor id in
    mono, with the actor id muted under a reference. Portfolio item is its
    value, or a muted dash when absent. Blueprint is the path in mono with
    the commit's first seven characters muted under it, or the `machine`
    value in mono when the summary has no `blueprint`. Current state is a
    success status dot and each state path in mono, one line each.
    Environment is its value in mono, or a muted dash when absent. The
    actor's status, the thread link, and the Active / Completed control
    and filters join with the screens that give them data.
    Rows follow the API's order and do not open a page. With no
    actor, the table is replaced by the empty state "No active actors",
    "Actors appear here while a blueprint runs." For `failed`, an error
    alert shows the message with "Try again".
  tasks-api-client: >-
    `src/api/tasks.ts` exports `fetchTasks()`, `fetchTask(actorId)`, and
    `answerEscalation(id, answer)`. `fetchTasks` sends `GET /api/tasks`
    and `fetchTask` sends `GET /api/tasks/{actorId}` with the id
    percent-encoded; each turns the answer into `ok` with the body, or
    `failed` with a message, as `fetchActors` does, and `fetchTask` turns
    `404` into `missing`. `answerEscalation` sends `POST
    /api/escalations/{id}/answer` with `{ choice }` or `{ text }` and
    turns the answer into `answered` or `closed` with the escalation for
    `200`, `invalid` with the service's `error` for `400`, `missing` for
    `404`, and `failed` with a message for any other status, a network
    error, or a body that does not validate. Each mapping from a status
    and a body to a result is a pure function. Bodies are checked at this
    boundary with the guards exported by
    `@wyrd-company/manifold-shared/tasks-api` and
    `@wyrd-company/manifold-shared/escalations-api`. Reads go through
    TanStack Query under the keys `["tasks"]` and `["task", actorId]`, as
    the Actors screen reads. An answer is a TanStack Query mutation; when
    it settles, it marks both keys stale, so the Board and the Task page
    read again. No timer reads on a schedule.
  board-screen: >-
    `BoardContent` reads `fetchTasks()`. Its title row is "Board" with its
    description, and it has no primary action. The filter row holds a
    Project select when more than one bound Project is listed, a Portfolio
    item select over the portfolio items the shown Project's tasks name,
    "Clear filters" when the Portfolio item filter is set, and,
    right-aligned, the shown task count and a ghost "Refresh" icon button.
    The selected Project and portfolio item are the route's search
    parameters `project`, as `<owner>/<number>`, and `item`, so a reload
    or a pasted link shows the same board; with no `project`, or one that
    names no listed Project, the board shows the first listed Project. The
    board has one lane per declared lifecycle option, in declared order,
    named by the option. A task whose status is `null` or names no
    declared option is in a "No status" lane before the declared lanes,
    shown only while it holds a task. A Project with no lifecycle
    declaration shows its tasks in the "No status" lane and, above the
    lanes, an info alert "This Project declares no lifecycle field." Lanes
    and cards are laid out as `DESIGN.md` states. Cards follow the API's
    order within a lane. A lane collapses and expands with its header's
    ghost button; collapsed lanes are kept in `localStorage` under
    `manifold.board.collapsed`, a JSON object from `<owner>/<number>` to
    the list of collapsed lane names, and every lane starts expanded. A
    card is a link that opens the task's page. With no bound Project, the
    board is replaced by the empty state "No bound Projects", "Bind a
    GitHub Project in the process repository to see its tasks here." For
    `failed`, an error alert shows the message with "Try again".
  task-card: >-
    `TaskCard` shows, from top to bottom: the issue reference,
    `<repository>#<number>`, in mono, with "Closed" and a check when the
    issue is closed; the title, or the reference again in muted text while
    the mirror has no title; the portfolio item in 12px muted text when the
    summary has one; and, when the summary has `actor`, the actor row: a
    status dot, the first state path in mono, the actor status, and an
    "Escalated" warning badge when `openEscalations` is above 0 or a
    "Failed" error badge when the actor is held. The dot is success for
    `active`, muted for `done` and `stopped`, and error for `held`. A task
    with no actor shows "Waiting for intake" in muted text in place of the
    actor row.
  task-route: >-
    The Task page is the route `board/task/$actorId` under `/console/`,
    with the actor id percent-encoded in its segment. It is a route of its
    own beside the Board's, so the Task page replaces the Board's content
    and the sidebar keeps Board selected. The breadcrumb shows "Board",
    linked to the Board with the search parameters the operator came from,
    and the issue reference. The page's back link "Board" returns there.
    A screen that opens a task later, such as Epics, adds its own
    `<screen>/task/$actorId` route with the same content.
  task-page: >-
    `TaskContent` reads `fetchTask(actorId)`. The header holds the issue
    reference in muted mono, the title, a lifecycle badge for each Project
    the task is on (a dot and the status name, or "No status"), and a meta
    line with the portfolio item and the blueprint path. On the right are
    "Open on GitHub" (outline, opening `issue.url` in a new tab, shown when
    the issue has a URL) and, as the one primary action, "Open thread",
    which opens the URL of the last thread in the list that has one. The
    main column holds, from top to bottom: the escalation panel; Current
    actor, with the actor status badge, each state path in mono, the
    blueprint path with the commit's first seven characters, the
    environment in mono, and when the actor was last saved, or "Waiting
    for intake" when the task has no actor; Threads, a table with each
    thread's title (or its id in mono), its latest turn state as a status
    dot and label, "Archived" when archived, and an "Open in T3 Code" link
    icon when it has a URL; and Escalations, the recent escalations, each
    with its title, its status, its answer as the choice's label or the
    text, the channel it came through, and when it closed. The right
    column holds Fields, with each Project's lifecycle field name and
    status and a lock icon, since Manifold sets it, and Usage, a table
    with one row per account: Account, Estimate, Actual, Variance, and
    Reserved, numbers right-aligned in tabular figures, a positive
    variance in warning text, and a caption "Settled" or "Open" from
    `usage.settled`. With no account, Usage shows "No usage recorded."
    For `missing`, the page shows the empty state "Task not found", "This
    issue is not on a bound Project.", with a link to the Board. For
    `failed`, an error alert shows the message with "Try again".
  escalation-panel: >-
    `EscalationPanel` lists the task's open escalations, oldest first,
    each on a warning surface with its title, its question as plain text
    with line breaks kept, and its controls: one outline button per
    choice, labelled with the choice's label, and, when it takes free
    text, a one-line answer field with an "Answer" button. Under the
    controls a muted line says "The first answer from any channel is
    recorded." With no open escalation, the panel is absent. Choosing or
    answering sends `answerEscalation` and disables every control of that
    escalation while it is in flight. On `answered`, the escalation shows
    "Answered: <label or text>" on a success surface. On `closed`, it
    shows how the escalation ended, from the escalation the service
    returned: "Already answered: <label or text> (<channel>)" for an
    answer from another channel, or "Withdrawn" for a withdrawal, on a
    neutral surface. On `invalid`, the service's error shows under the
    controls and they enable again. On `missing` or `failed`, an error
    shows under the controls and they enable again. A shown outcome stays
    until the task is read again, after which the escalation is in Recent.
  tasks-endpoint: >-
    The tasks read model is `packages/service/src/tasks/`. `openTasks`
    takes its reads as functions and structural parts, holds no state,
    and computes each answer per request from what they return, so each
    request reads the mirror, the store, the ledger, and the escalations
    as they are. Pure functions in `tasks.ts` build the answers:
    `boardProjects(projects, trackedIssues, snapshots, openEscalations)`
    and `taskDetail(...)`. `escalationsOfTask(escalations, task,
    tokenHolder)` picks a task's escalations by the rule in `tasks-api`;
    the module reads `escalations.list({})` once per request and filters
    it in memory. Leaf state paths and blueprint version keys use the same
    functions as the actors endpoint. `requestListener` implements
    `tasks-api` and writes the JSON. A read that throws answers `500` and
    the error goes to `log` with the request path.
  tasks-public-interface: |-
    `packages/service/src/tasks/index.ts` exports exactly these names.

    ```ts
    import type { RequestListener } from "node:http";
    import type { Store } from "../store/index.ts";
    import type { TaskResponse, TasksResponse } from "@wyrd-company/manifold-shared/tasks-api";

    export function openTasks(options: TasksOptions): Tasks;

    export interface TasksOptions {
      readonly store: Pick<Store, "loadSnapshot">;
      /** The router's `held`: whether the router holds the actor now. */
      held(actorId: string): boolean;
      /** The GitHub Project bindings in force that are not archived, in declaration order. */
      boundProjects(): readonly TasksBoundProject[];
      /** The GitHub source's `trackedIssueIds` and `trackedIssue`. */
      readonly github: TasksGitHub;
      /** The ledger's `actorUsage`. */
      actorUsage(actorId: string): TasksActorUsage;
      /** The escalations module's `list`. */
      listEscalations(filter: { readonly status?: "open" | "answered" | "withdrawn" }): readonly TasksEscalation[];
      /** The T3 Code source's `thread`. */
      thread(environment: string, threadId: string): TasksThreadView | undefined;
      /** The gates module's `tokenHolder`. */
      tokenHolder(tokenId: string): string | undefined;
      readonly log?: (entry: { level: "error"; path: string; error: string }) => void;
    }

    export interface TasksBoundProject {
      readonly binding: string;
      readonly owner: string;
      readonly number: number;
      readonly item: string;
      /** The declared lifecycle field; absent when the Project declares none. */
      readonly lifecycle?: { readonly field: string; readonly options: readonly string[] };
    }

    export interface Tasks {
      list(): TasksResponse;
      get(actorId: string): TaskResponse | undefined;
      /** Mounted with `mount("/api/tasks", ...)`. */
      readonly requestListener: RequestListener;
    }
    ```

    `TasksGitHub`, `TasksActorUsage`, `TasksEscalation`, and
    `TasksThreadView` are declared structurally in the module as the
    members it reads of the GitHub source's `TrackedIssue`, the ledger's
    `LedgerActorUsage`, the escalations module's `Escalation`, and the T3
    Code source's `ThreadView`, so each part satisfies them and a test
    passes fixtures of the same shape.

    `@wyrd-company/manifold-shared` adds the subpath export `./tasks-api`,
    which exports `tasksApiPath` (`/api/tasks`), the response types of
    `tasks-api`, `isTasksResponse`, and `isTaskResponse`, and the subpath
    export `./escalations-api`, which exports `escalationsApiPath`
    (`/api/escalations`), the `Escalation` and answer types of
    `escalation-contract`, `isEscalation`, and
    `isEscalationAnswerResponse`. Both are dependency-free type guards, as
    `./actors-api` is, so the console bundles no schema compiler; a shared
    test checks each guard against the OpenAPI and JSON Schema definitions
    with fixtures that pass and fail.
  tasks-wiring: >-
    Service assembly opens the tasks read model after the sources start
    and before the host listens, and mounts its `requestListener` at
    `/api/tasks` with `mount`. `boundProjects` reads the GitHub Project
    bindings of `portfolio.current()` that are not archived, each with the
    lifecycle field the process repository revision in force declares for
    it, as the lifecycle field declaration specifies. `github` is the
    GitHub source, `actorUsage` is `portfolio.ledger.actorUsage`,
    `listEscalations` is the escalations module's `list`, `thread` is the
    T3 Code source's `thread`, `tokenHolder` is the gates module's
    `tokenHolder`, and `held` is whether the router's `held` answers for
    the actor.
  board-and-task-convergence: >-
    The tasks endpoints only read, so a request that runs twice answers
    twice from the current state. An answer from the escalation panel is
    the escalations module's `answer`: a second answer, from the panel or
    any channel, finds the escalation closed and returns the first answer,
    which the panel shows; a crash after the answer commits and before the
    browser reads the response leaves the escalation answered, and the
    next read of the task shows it in Recent. The browser's one write is
    `manifold.board.collapsed`, set to the operator's latest choice.
  board-and-task-tests: >-
    Each behavior is red before green, and tests go through public
    interfaces. In `packages/service/src/tasks/`, the endpoint test in
    `tasks-api`'s validation criteria, with a real router for the held
    state: one actor whose restore the host refuses, which is `held` with
    no errored snapshot, and one actor whose delivery errored and whose
    `release` then restored it, which is `active` while the store keeps
    its errored snapshot. In `packages/console`, unit tests
    cover the three result mappings, the lane grouping of a Project's
    tasks, including the "No status" lane, and the reading and writing of
    collapsed lanes. The browser test,
    `packages/service/src/console/board.browser.test.ts`, starts the
    production HTTP host with the built console, the console and tasks
    mounts, and the escalations API, on a store with a ledger and an
    escalations module on one database file. Fixture tasks come from
    GitHub mirror and T3 Code thread fixtures over two declared lanes; one
    task's actor is saved with a settled ledger, with a reservation and
    actuals on one account, and an open escalation raised for it with two
    choices and free text. The test opens the Board, checks the lanes and
    each card, opens the escalated task's page, checks its state,
    blueprint, thread link, and estimate, actual, variance, and reserved,
    answers the escalation with a choice from the panel, and checks the
    panel's answered outcome, the escalation in Recent after the page
    reads again, and the escalation answered once through channel `api`
    in the escalations module. It then raises a second escalation,
    answers it through `POST /api/escalations/{id}/answer` with text, and
    answers it from the panel with a choice; the panel shows the text
    answer as the one recorded, and the module holds that answer only.
  blueprints-routes: >-
    The Blueprints screen has two routes: `blueprints`, the list, and
    `blueprints/$`, the editor, whose splat is the blueprint's path as the
    API names it, such as `/console/blueprints/blueprints/review.yml`. Both
    render `BlueprintsContent`, which shows the list or the editor by
    route, as `DESIGN.md` states. The breadcrumb shows "Blueprints / <path>"
    on the editor. The navigation entry, its label, and its description
    are unchanged.
  blueprints-list: >-
    `BlueprintsContent` on `blueprints` reads `GET /api/blueprints`. Its
    title row is "Blueprints" with its description, and it has no primary
    action. Under it, one row holds the blueprint count, right-aligned, and
    a ghost "Refresh" icon button. The table columns, in percent widths as
    `DESIGN.md` states for tables, are Name, Version, Lint, Active actors,
    and an Edit button. Name is the path in mono with the description
    muted under it, and a "Draft" badge on its own line when the browser
    holds a draft for the path. A path lists once, as the blueprint that
    runs there. Version is the version's commit, first seven characters,
    in mono, for a repository blueprint; for a bundled blueprint it is a
    "Bundled" badge with the bundle digest's first seven characters muted
    in mono under it. A repository blueprint that replaces a bundled one
    has the muted line "Replaces the bundled blueprint" under its
    description, and its Version is its commit. Lint is a success dot and "Loaded" with no
    finding or warning, an error dot and "N errors" for an invalid
    blueprint, and a warning dot and "N warnings" for a loaded one with
    warnings. Active actors is the count, or a muted dash for zero; at a
    replaced path it counts actors still running a bundled version too.
    Edit, or the name, opens the editor. With no blueprint, the table is replaced by the empty
    state "No blueprints", "Blueprints appear here when the process
    repository holds files under blueprints/." Before the first applied
    revision the list shows the bundled blueprints and the info alert
    "The process repository has not been read yet." A failed read shows an
    error alert with the message and "Try again".
  blueprint-editor: >-
    `BlueprintEditor`, under `src/screens/blueprints/`, is the editor
    route's content. It reads `GET /api/blueprints/source?path=` and opens
    the browser's draft for the path when one exists, or the source's text
    when none does. The header (56px) holds the path in mono, "Based on
    <short commit>" in muted mono, a "Draft · N changes" warning badge when
    the text differs from the base text, where N is the count of changed
    lines, then "Discard draft" (ghost) and "Publish" (primary). A bundled
    blueprint shows "Bundled <short digest>" in place of "Based on", and
    is edited as any blueprint is: publishing it adds the file at its path
    to the process repository, which replaces the bundled blueprint from
    that commit on. Its Publish dialog shows the file with `A` and the
    line "This file replaces the bundled blueprint." Under the
    header, the Source pane and the Graph pane sit side by side, each half
    the width; under 1024px of content width they become the tabs "Source"
    and "Graph". The Problems strip runs under both panes. Editing the
    graph is absent: the graph is a view of the text.
  source-pane: >-
    The Source pane is a CodeMirror 6 editor over the text, with line
    numbers, `@codemirror/lang-yaml`, the console's theme built from the
    `DESIGN.md` code colors, and the findings as `@codemirror/lint`
    diagnostics: each finding with a `range` is an error diagnostic and
    each warning with a `range` a warning diagnostic, over that range. A
    line that differs from the base text has the 3px warning bar in the
    gutter and the faint warning background `DESIGN.md` gives the Source
    tab, computed with `@codemirror/merge`'s diff of the base text and the
    text. A toolbar (48px) shows the file path, the legend for changed
    lines, and "Copy".
  lint-as-you-type: >-
    Each change to the text starts a 300 ms wait; a change during the wait
    starts it again. When the wait ends, the editor sends `POST
    /api/blueprints/lint` with the path and the text, and aborts the lint
    request still in flight, if any, with its `AbortController`. An answer
    is applied only when the text is still the text it was sent for, so
    the marks always belong to the text on screen. The source's own
    findings mark the text on open with no request. While a lint is
    pending, the Problems header shows "Checking…" in muted text and the
    previous marks stay. A lint request that fails shows "Cannot check
    this text. Try again." in the Problems header with a "Try again"
    button, and Publish stays disabled.
  graph-pane: >-
    The Graph pane is a ReactFlow canvas on the dotted grid, read only:
    nodes do not drag or connect, and the canvas pans and zooms, with the
    zoom controls at the bottom left. It draws the graph of the latest
    lint answer, or of the source on open. Each state is a `StateNode`,
    200×56 as `DESIGN.md` states, with its key in mono and its first
    invoke source under it, a "Gate" badge when gated, and a double border
    when final. A compound or parallel state is a group node holding its
    children, titled with its key, with a dashed border between a parallel
    state's regions. The initial state of each level has an incoming
    marker from a small filled dot. Each transition is an edge from its
    source to its target with its label as a mono pill, a guard icon in
    the pill when guarded, and the `graph-edge` style; a targetless
    transition is a pill on a short self loop. The layout is elkjs's
    `layered` algorithm, top to bottom, with `hierarchyHandling`
    `INCLUDE_CHILDREN`, run on the main thread with `elk.bundled.js`, so
    edges between levels route through their groups. Layout runs again
    when the set of states or transitions changes, and the viewport keeps
    its pan and zoom. When the latest lint answer has no graph, the pane
    keeps the last graph, dimmed, with the muted line "Showing the last
    text that parsed." Selecting a state draws its incoming and outgoing
    transitions in primary and moves the editor's cursor to the start of
    the state's range; moving the cursor into a state's range selects the
    deepest state whose range holds it. A state with a finding or warning
    whose location is the state's location or under it, and not under a
    child state's location, has the 16px "!" badge, error colored when any
    is a finding.
  problems-strip: >-
    The Problems strip is `DESIGN.md`'s: a 36px header with the error count
    in error color and the warning count in warning color, collapsible,
    and the list of findings then warnings, each with its kind in mono,
    its message, its state path when it falls in a state, and its line.
    Choosing one moves the editor's cursor to its range and selects its
    state. A finding with no range lists with its location in mono.
  blueprint-drafts: >-
    A draft is the edited text of one blueprint, with the commit it is
    based on, kept in the browser. It lives in `localStorage` under
    `manifold.blueprint-draft.<path>` as JSON `{ base, baseText, text,
    saveId?, message?, saved? }`. The editor writes the draft on each change
    to the text, and removes it when the text equals `baseText` and the
    draft has no `saved`, and when "Discard draft" is confirmed. A save
    that answers `200` does not remove the draft: it sets `saved` to the
    answer's commit and keeps `message`, so the text stays in the browser
    until the service has loaded the saved commit. A draft with `saved` is
    settled by a source read: one that answers the draft's text removes
    the draft. When a save answer carries `blueprint`, the service holds
    the saved commit, and the source read that follows it is the file as
    the branch now holds it; when that text differs from the draft's, a
    later commit changed the file after the save, and the draft becomes an
    ordinary draft based on that source: `base` and `baseText` become the
    source's commit and text, `text` stays the saved text, and `saved`,
    `saveId`, and `message` are removed. The editor is then editable, the
    header shows "Draft · N changes", and the info alert reads "Saved as
    <short saved commit>. <branch> changed this file since, at <short
    commit>. Your saved text is kept as a draft." with "Compare", the
    conflict alert's dialog against the branch's text. The operator
    discards the draft to accept the newer file, or publishes it to put
    the saved text back. A draft whose `base` is
    older than the source's commit keeps its base, and the header shows
    the info line "A newer version exists. Publishing keeps changes made
    since, unless they changed this file." "Discard draft" asks first, in
    the 400px alert dialog `DESIGN.md` gives, naming the number of changed
    lines and the version that stays. `src/screens/blueprints/draft.ts`
    holds the pure functions that read, write, and change a draft, and a
    draft that does not parse as that shape is removed and ignored.
  publish: >-
    "Publish" is enabled when the text differs from the base text, the
    latest lint answer is for the text on screen, and it has no finding;
    warnings do not block it. It opens `PublishDialog`, the 480px dialog of
    `DESIGN.md`: the file with its git status letter, `A` when the base has
    no file at the path and `M` otherwise, and its path in mono; a commit
    message field, prefilled with "Update <path>", or "Add <path>" for
    `A`; and the repository URL and branch from the list endpoint. "Commit
    and push" sends `POST /api/blueprints/save` with the path, the base,
    the text, the message, and the draft's `saveId`. When the draft has no
    `saveId`, the editor first sets one: 16 bytes from
    `crypto.getRandomValues` as 32 lower-case hexadecimal characters,
    written to the draft before the request, so a retry of the same text
    after a reload sends the same `saveId`. Any change to the text removes
    the `saveId`. The button shows a spinner and the dialog cannot close
    while the request runs. For `200`, the editor sets the draft's
    `saved` and shows "Saved as <short commit>" in a success toast for
    `saved`, "Already saved as <short commit>" for `already-saved`, and "No
    change to save" for `unchanged`. When the answer carries `blueprint`,
    the editor reads the list and the source again, and the source read
    settles the draft as blueprint-drafts states: the editor shows the new
    source with its base at the new commit, or the saved text as a draft
    based on a later commit that changed the file. When the answer has no `blueprint`, or the source
    read fails, the pending alert opens. For `422`,
    the dialog closes and the findings mark the text. For `409`, the
    dialog closes and the conflict alert opens. For `502`, `503`, a
    network failure, or a request whose answer never arrives, the dialog
    shows the message in an error alert with "Try again", which sends the
    same request.
  pending-save: >-
    A draft with `saved` is a pending save: the commit is on the branch,
    and the service has not yet answered a source read for it. The pending
    alert sits under the editor header in the info tint: "Saved as <short
    commit>. The service has not loaded it yet. Your text is kept." with
    "Load saved version". The editor shows the draft's text, read only;
    Publish is hidden and "Discard draft" stays, since the saved commit is
    on the branch whatever the browser keeps. "Load saved version" sends
    the save request again, with the draft's base, text, message, and
    `saveId`; the service's follower pulls before it saves and finds the
    saved commit by its trailer even under later commits, so the answer is
    `already-saved` with `blueprint` once the service holds the commit,
    and the editor then reads the source, which settles the draft. A
    failed request shows its message in the alert and keeps the draft. A
    reload reopens the draft with `saved` and the same alert, and a source
    read that already answers the draft's text removes it at once. A
    pending save therefore ends in one of three states: no draft, the
    saved text as a draft over a later commit, or the pending alert while
    the service cannot reach the branch.
  conflict: >-
    The conflict alert sits under the editor header in the error tint. For
    reason `file-changed` it reads "<path> changed on <branch> at <short
    head>. Your text is kept."; for reason `branch-moved` it reads
    "<branch> moved while saving, at <short head>. Your text is kept.
    Publish again." It has
    three buttons. "Compare" opens a 920px dialog with a `@codemirror/merge`
    `MergeView`: the branch's text on the left, read only, and the draft's
    text on the right, editable, so the operator can take changes across.
    "Use latest as base" sets the draft's base to the head and its base
    text to the branch's text, keeps the draft's text, and removes its
    `saveId`, so the next Publish replaces the branch's change with the
    draft's text by the operator's choice. "Discard draft" removes the
    draft after the alert dialog, and the editor reads the source again.
    The editor never discards the draft's text on its own.
  blueprints-client: >-
    `src/api/blueprints.ts` exports `fetchBlueprints()`,
    `fetchBlueprintSource(path)`, `lintBlueprintText(path, text, signal)`,
    and `saveBlueprint(request)`. Each sends its request without
    authentication headers, with `Content-Type: application/json` for a
    body, and turns the answer into a result: `ok` with the body, a typed
    `conflict`, `invalid`, or `failed` with the API's message, or `failed`
    with a generic message for a network error or a body that does not
    match. The mapping from a status and a body to a result is a pure
    function, and each body is checked at this boundary with the guards of
    `@wyrd-company/manifold-shared/blueprints-api`. Reads go through
    TanStack Query as the Actors screen's do; lint and save are mutations,
    never cached.
  blueprints-endpoints: >-
    `mountBlueprintsApi(host, options)` mounts one listener at
    `/api/blueprints` that implements `blueprints-api`, with the paths
    `""` (the list), `/source`, `/lint`, and `/save` under the prefix. The
    list reads `revisions.latest()` and the repository's files under
    `blueprints/` at its commit through `processRepository.revisionAt`. A
    path with a repository file is a `repository` item, with
    `replacesBundled` when the bundle holds the path too; a bundled path
    with no repository file is a `bundled` item with the bundle's digest.
    Each path that the load holds in `blueprints` is `loaded` with its
    warnings counted and its document's `description`, and each in
    `failures` is `invalid` with its findings and warnings counted apart; a
    bundled path the load does not hold takes its status and counts from
    the lint of its text. It counts active actors per path from
    `store.activeSnapshots()` with the blueprint version key parser, which
    reads both `<commit>:<path>` and `<commit>:<path>@<bundle-digest>`.
    Source reads the repository file at the latest commit, or the bundled
    text when the revision holds no file at the path, and lints it. Every lint, of source, lint, and save, calls
    `lintBlueprint(path, text, manifoldImplementationNames, {
    configurationBound })` with `blueprintLint.configurationBound`, then
    `findingRanges` and `blueprintGraph`, so the endpoint answers what the
    loader and the host CLI report. A save lints first, answers `422` for a
    finding, and otherwise awaits `revisions.save` and maps its result to
    the answer: `saved`, `already-saved`, and `unchanged` to `200` with the
    path's list item from the result's load, `conflict` to `409` with its reason,
    `ProcessRepositorySaveError` and `ProcessRepositoryPullError` to `502`
    with their kind (a pull error of kind `authentication` as
    `authentication`, `branch-missing` and `incomplete` as `remote`), a
    follower that is closed to `503`. Bodies are read up to 8 MiB, the
    usage endpoint's limit. The request checks of `blueprints-api` run
    before a body is read: method, `Content-Type`, then `Origin` and
    `Sec-Fetch-Site`. Any other error answers `500`, and goes to `log`
    with the path.
  blueprint-graph: >-
    `blueprintGraph(text)` in `packages/shared` returns the graph of
    `blueprints-api`, or `undefined` when the text does not parse as a
    blueprint document or its machine does not resolve. It parses the text
    as `lintBlueprint` does, validates the shape, builds the machine with
    XState's `createMachine` over a stub for every referenced name, as the
    lint does, and walks the state nodes depth first in document order.
    It reads each transition's targets from XState's resolved transition,
    so a sibling key, a `.child`, and a `#id` target resolve as they run.
    `after` transitions are labelled with their delay as written, and
    `onDone` and `onError` of an invoke with the invoke's id. It is pure.
  finding-ranges: >-
    `findingRanges(text, findings)` in `packages/shared` returns each
    finding with the `range` of `blueprints-api`. It parses the text once
    with the `yaml` package's document model and a `LineCounter`, walks
    each JSON Pointer through the document's nodes, and reads the node's
    `range`; for a `yaml` finding it converts its line and column. It is
    pure, and `blueprintGraph` uses it for each state's range.
  bundled-blueprints: >-
    Manifold's bundle is the set of blueprints compiled into the service
    as a generated module, with one digest, as the default process design
    specifies. Each bundled blueprint has an ordinary blueprint path, such
    as `blueprints/task.yml`, and a repository file at that path replaces
    it, even when the file fails lint. Its version key is
    `<commit>:<path>@<bundle-digest>`. `BlueprintsApiOptions.bundle` is the
    bundle's digest and its blueprints by path and text; until the default
    process design's bundle module merges, the option is a structural
    stand-in of that shape, which the service passes as an empty bundle,
    and the rebase replaces it with that module's export. A bundled
    blueprint is listed, read, and linted as a repository blueprint is,
    and a save of its path adds the repository file that replaces it.
  blueprints-public-interface: |-
    `packages/service/src/blueprints-api/index.ts` exports exactly these
    names.

    ```ts
    import type { HttpHost } from "../http-host/index.ts";
    import type { Store } from "../store/index.ts";
    import type { ProcessRepository } from "../process-repository/index.ts";
    import type { Revisions } from "../service/index.ts";

    export interface BlueprintsApiOptions {
      readonly revisions: Pick<Revisions, "latest" | "save">;
      readonly processRepository: Pick<ProcessRepository, "revisionAt">;
      readonly store: Pick<Store, "activeSnapshots">;
      /** The followed repository, for the list and the publish dialog. */
      readonly repository: { readonly url: string; readonly branch: string };
      /** `blueprintLint.configurationBound`. */
      readonly configurationBound: number;
      /** The blueprints Manifold bundles. */
      readonly bundle: BlueprintBundle;
      readonly log: (entry: { level: "error"; path: string; error: string }) => void;
    }

    export interface BlueprintBundle {
      /** The digest a bundled version key carries after `@`. */
      readonly digest: string;
      /** Each bundled blueprint's text by its path. */
      readonly blueprints: ReadonlyMap<string, string>;
    }

    /** Mounts the blueprints endpoints at `/api/blueprints`. */
    export function mountBlueprintsApi(host: HttpHost, options: BlueprintsApiOptions): void;
    ```

    `@wyrd-company/manifold-shared` exports `blueprintGraph`,
    `findingRanges`, and their types from its root, and adds the subpath
    export `./blueprints-api`, which holds no lint and no YAML parser so
    the console's bundle stays small: the paths, the request and response
    types of `blueprints-api`, and a guard for each response.

    ```ts
    export const blueprintsApiPath = "/api/blueprints";

    export interface FindingRange {
      readonly from: number;
      readonly to: number;
      readonly line: number;
      readonly column: number;
    }

    export interface ApiFinding {
      readonly kind: string;
      readonly location: string;
      readonly message: string;
      readonly range?: FindingRange;
      readonly [detail: string]: unknown;
    }

    export interface BlueprintGraph {
      readonly states: readonly GraphState[];
      readonly transitions: readonly GraphTransition[];
    }

    export interface GraphState {
      readonly path: string;
      readonly key: string;
      readonly parent?: string;
      readonly type: "atomic" | "compound" | "parallel" | "final" | "history";
      readonly initial: boolean;
      readonly invokes: readonly string[];
      readonly gated: boolean;
      readonly location: string;
      readonly range?: FindingRange;
    }

    export interface GraphTransition {
      readonly source: string;
      readonly target?: string;
      readonly trigger: "event" | "always" | "after" | "done" | "error";
      readonly label: string;
      readonly guarded: boolean;
      readonly location: string;
    }

    export interface BlueprintItem {
      readonly path: string;
      readonly source: "repository" | "bundled";
      readonly commit?: string;
      readonly bundle?: string;
      readonly replacesBundled?: true;
      readonly status: "loaded" | "invalid";
      readonly findings: number;
      readonly warnings: number;
      readonly description?: string;
      readonly activeActors: number;
    }

    export interface BlueprintsResponse {
      readonly repository: { readonly url: string; readonly branch: string };
      readonly commit?: string;
      readonly blueprints: readonly BlueprintItem[];
    }

    export interface BlueprintSourceResponse {
      readonly path: string;
      readonly source: "repository" | "bundled";
      readonly commit?: string;
      readonly bundle?: string;
      readonly text: string;
      readonly findings: readonly ApiFinding[];
      readonly warnings: readonly ApiFinding[];
      readonly graph?: BlueprintGraph;
    }

    export interface LintResponse {
      readonly findings: readonly ApiFinding[];
      readonly warnings: readonly ApiFinding[];
      readonly graph?: BlueprintGraph;
    }

    export interface SaveBlueprintRequest {
      readonly path: string;
      readonly base: string;
      readonly text: string;
      readonly message: string;
      readonly saveId: string;
    }

    export interface SaveBlueprintResponse {
      readonly outcome: "saved" | "already-saved" | "unchanged";
      readonly commit: string;
      readonly blueprint?: BlueprintItem;
    }

    export interface SaveConflictResponse {
      readonly error: "conflict";
      readonly message: string;
      readonly reason: "file-changed" | "branch-moved";
      readonly head: string;
      readonly text?: string;
    }

    export function isBlueprintsResponse(value: unknown): value is BlueprintsResponse;
    export function isBlueprintSourceResponse(value: unknown): value is BlueprintSourceResponse;
    export function isLintResponse(value: unknown): value is LintResponse;
    export function isSaveBlueprintResponse(value: unknown): value is SaveBlueprintResponse;
    export function isSaveConflictResponse(value: unknown): value is SaveConflictResponse;
    ```
  blueprints-module-layout: >-
    In `packages/service/src/blueprints-api/`, `index.ts` re-exports the
    public names and nothing else, `listener.ts` holds the routing and
    request checks, `answers.ts` the pure functions from a load, a lint, or
    a save result to an answer, and `request-checks.ts` the pure
    cross-site, type, and shape checks. In `packages/console`,
    `src/screens/blueprints/` holds `BlueprintsList.tsx`,
    `BlueprintEditor.tsx`, `SourcePane.tsx`, `GraphPane.tsx`,
    `ProblemsStrip.tsx`, `PublishDialog.tsx`, `DiscardDialog.tsx`,
    `ConflictAlert.tsx`, `StateNode.tsx`, and the pure modules `draft.ts`,
    `graph-layout.ts` (graph to elkjs input, elkjs output to ReactFlow
    nodes and edges), and `problems.ts` (findings to states and badges).
    `src/screens/BlueprintsContent.tsx` switches between the list and the
    editor. The service's `start.ts` calls `mountBlueprintsApi` in step 11
    with the parts it already holds.
  serving: >-
    The console listener serves `packages/console/dist` with `sirv`. It
    takes the request's path, which the HTTP host passes unchanged,
    removes `/console` from its start, and serves the rest from the
    directory. A `GET` or `HEAD`
    of a file answers it. A Blueprints editor path under
    `/console/blueprints/blueprints/` ending in `.yml` or `.yaml` answers
    `index.html` when no file exists, for GET and HEAD. A path with no file extension and no file
    answers `index.html`, so a client route loads the application; a path
    with an extension and no file answers `404`. Files under `assets/` are
    served with `Cache-Control: public, max-age=31536000, immutable`, since
    their names carry their content hash, and `index.html` with
    `Cache-Control: no-cache`. Every answer carries
    `Content-Security-Policy: default-src 'self'; style-src 'self'
    'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'`,
    `X-Content-Type-Options: nosniff`, and `Referrer-Policy: no-referrer`,
    so that the page runs only the console's own scripts. The Blueprints
    screen lints on the service, so the page evaluates no generated code
    and the policy holds no `'unsafe-eval'`. Other methods
    answer `405`. A path that leaves the
    directory answers `404`. `/console` without the slash redirects to
    `/console/`.
  actors-endpoint: >-
    The actors listener implements `actors-api`. A pure function,
    `actorSummaries(snapshots)`, turns the store's active snapshots into
    the summaries in the order the specification states: it parses
    `machine` with `parseBlueprintVersionKey`, collects the leaf state
    paths from the state value, and reads the string fields of
    `context.manifold`. The listener calls `store.activeSnapshots()` and
    `actorSummaries` for each request and writes the JSON. It holds no
    cache, so each request reads the store as it is.
  public-interface: |-
    `packages/service/src/console/index.ts` exports exactly these names.

    ```ts
    import type { HttpHost } from "../http-host/index.ts";
    import type { Store } from "../store/index.ts";

    export type { HttpListener as RequestListener } from "../http-host/index.ts";

    export interface ConsoleOptions {
      readonly store: Pick<Store, "activeSnapshots">;
      /** Directory of the built console. Defaults to the console package's `dist`. */
      readonly root?: string;
      /** Receives read failures; service assembly supplies ServiceParts.log. */
      readonly log?: (entry: { level: "error"; path: string; error: string }) => void;
    }

    /** Mounts the console's files at `/console` and the actors endpoint at `/api/actors`. */
    export function mountConsole(host: HttpHost, options: ConsoleOptions): void;
    ```

    `@wyrd-company/manifold-shared` adds the subpath export
    `./actors-api`, which exports the response types and the path.

    ```ts
    export const actorsApiPath = "/api/actors";

    export interface ActorsResponse {
      readonly actors: readonly ActorSummary[];
    }

    export interface ActorSummary {
      readonly actorId: string;
      readonly machine: string;
      readonly blueprint?: { readonly path: string; readonly commit: string };
      readonly states: readonly string[];
      readonly environment?: string;
      readonly project?: string;
      readonly issue?: string;
      readonly portfolioItem?: string;
      readonly savedAt: string;
    }

    export function isActorsResponse(value: unknown): value is ActorsResponse;
    ```
  module-layout: >-
    `packages/service/src/console/` holds `index.ts`, `static-files.ts`
    (the console listener), `actors-api.ts` (the actors listener and
    `actorSummaries`), and the tests. `HttpHost` is the service's
    production HTTP host type. The service's entry point calls `mountConsole(host, { store, log
    })` after the store opens and before the host listens. The service
    package depends on `@wyrd-company/manifold-console` and on `sirv`.
    `root` defaults to the directory of
    `import.meta.resolve("@wyrd-company/manifold-console/dist/index.html")`.
    `mountConsole` throws when `index.html` is not in `root`, so a
    service built without its console fails at start with the path it
    looked in.
  build-and-test-order: >-
    The service depends on the console package, so `pnpm -r run build`
    builds the shared package, then the console, then the service. The
    service's `test` script builds the console before it runs, as it
    already builds the shared package. The browser test uses Playwright's
    Chromium. `task install` installs it after the packages, so a
    developer machine has it after one install. CI installs it with its
    system dependencies before `task check`.
  convergence: >-
    A save is the one write of the API, and converges as
    `process-repository` and `service-assembly` state: a retry with the
    same `saveId` answers `already-saved` or pushes the change once. The
    list, source, and lint endpoints only read. A draft is the operator's
    latest text for a path, written whole on each change, so a reload or a
    crash of the browser leaves the last written text. The actors
    endpoint and the console listener only read, so a request that
    runs twice answers twice from the current store and files. A console
    build that runs twice empties `dist/` and writes the same files; a
    build that stopped halfway leaves a `dist/` that the next build
    replaces whole, and a service started on a `dist/` with no
    `index.html` refuses to start. The browser's writes are `localStorage`
    keys for theme and sidebar mode, each set to the operator's latest
    choice, so a repeated save leaves one value.
  errors: >-
    `store.activeSnapshots()` throwing answers `500` with no body detail,
    and the error goes to the service's log with the request path. A
    snapshot whose `context` or `context.manifold` is not an object gives a
    summary with no identity fields; it is not an error. The console shows
    every failed read as an alert on the screen that made it, and the shell
    keeps working.
  tests: >-
    Each behavior is red before green, and tests go through public
    interfaces. The blueprints endpoints are tested as `blueprints-api`'s
    validation criteria state; `blueprintGraph` and `findingRanges` are
    tested in `packages/shared` on fixture texts, including a pointer to a
    missing key, a flow-style mapping, and a multi-byte character before
    the finding. In `packages/console`, unit tests cover the blueprints
    result mapping, the draft functions (write, base text equality removes,
    malformed removed, `saveId` kept across a reload and removed by a
    change, a `200` sets `saved` and keeps the draft, and a draft with
    `saved` is removed by a source read of its text, and becomes an
    ordinary draft based on the source when a save answer with `blueprint`
    is followed by a source read of other text), `problems.ts`, and `graph-layout.ts` on a nested and a
    parallel graph. `packages/service/src/blueprints-api/blueprints.browser.test.ts`
    starts the service on a fixture process repository served over smart
    HTTP with push enabled, launches headless Chromium, opens Blueprints,
    and sees every fixture blueprint with its version and lint, a bundled
    blueprint with its "Bundled" badge, and a repository blueprint that
    replaces a bundled one with "Replaces the bundled blueprint"; opens one
    and sees its states in the graph; types a transition target that names
    no state and, once the lint answers, sees an error diagnostic on that
    line, the "!" badge on the state, and Publish disabled; fixes it and
    sees the marks clear; publishes with a message; sees the success toast;
    returns to the list and sees the new commit as the version; and finds
    one new commit on the fixture remote with that message. A second case
    commits a change to the same file on the remote while the editor holds
    a draft, publishes, sees the conflict alert, reloads, and still holds
    the draft's text. A third case has the fixture server accept the push
    and refuse the next fetch once, so the save answers `saved` with no
    `blueprint`: the editor shows the toast and the pending alert with the
    saved text, a reload shows the same, and "Load saved version", with
    the server healthy, answers `already-saved`, clears the alert and the
    draft, and the list shows the saved commit as the version, with one
    new commit on the remote. A fourth case runs the third until the
    pending alert, then commits a change to the same file on top of the
    save on the remote, and, with the server healthy, "Load saved
    version" answers `already-saved`; the editor is editable and shows the
    saved text as a draft based on the later commit with the "changed this
    file since" alert, Compare shows both texts, and "Discard draft" leaves
    the later commit's text and no draft. In `packages/service/src/console/`, `mountConsole` uses the
    production HTTP host on a loopback port with no credentials: the actors
    endpoint behaviors in `actors-api`'s validation criteria; a client
    route under `/console/` answers `index.html`; a hashed asset answers
    with the immutable header; a missing asset answers `404`; a path
    with `..` segments answers `404`; and `mountConsole` throws for a root
    with no `index.html`. In `packages/console`, unit tests cover the API
    result mapping, requests without browser storage or authorization,
    and `navigation.ts` (every route unique, every `DESIGN.md` sidebar
    screen present). The browser test,
    `packages/service/src/console/console.browser.test.ts`, starts the
    production HTTP host with the built console and a store holding fixture
    actors, launches headless Chromium with Playwright, and checks that
    Overview shows the shell with every navigation entry; the theme toggle
    sets the dark class and a reload keeps it; the Actors screen lists
    every fixture actor with its blueprint, current state, and environment
    without credential entry; a reload of `/console/actors` shows the same;
    and unbuilt screens, including Settings, General, show their empty
    states. Fixture values are generic and never drawn from Manifold's
    own domain.
  dependencies: >-
    The console adds `react` and `react-dom` 19, `@tanstack/react-router`,
    `@tanstack/react-query`, `@base-ui/react`, `class-variance-authority`,
    `tailwind-merge`, `lucide-react`, `tailwindcss` 4 with
    `@tailwindcss/vite`, and `@vitejs/plugin-react`, the versions T3 Code's
    web client uses where it uses them. TanStack Query is the one library
    T3 Code does not use; it is the most adopted React data-fetching
    library and holds every API read the later screens make. The service
    adds `sirv`, the static file listener Vite's preview server uses, and
    `playwright` as a development dependency for the browser test. The
    Blueprints screen adds `@xyflow/react`, the graph library `DESIGN.md`
    names; `elkjs`, the Eclipse Layout Kernel compiled to JavaScript, whose
    layered algorithm lays out nested graphs, chosen as the one automatic
    layout engine `DESIGN.md` asks the Epics graph to share; and CodeMirror
    6: `@codemirror/state`, `@codemirror/view`, `@codemirror/commands`,
    `@codemirror/language`, `@codemirror/lang-yaml`, `@codemirror/lint`,
    and `@codemirror/merge`. None of them evaluates generated code, so the
    console's Content Security Policy holds. Renovate keeps them current
    with the rest.
