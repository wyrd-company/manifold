$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - store
    - escalations
    - service-configuration
    - github-event-source
    - t3code-environment-source
    - gate-runtime
    - portfolio-ledger
  # GAP-EDGE: the technical-design schema declares no edge to a
  # specification; `references` is the best fit.
  references:
    - actors-api
    - blueprints-api
    - blueprint
    - blueprint-version
    - tasks-api
    - epics-api
    - escalation-contract
    - lint-console-edits-on-the-service
    - declarations-api
    - bindings-declaration
    - task-metadata-declaration
    - portfolio-api
    - accounts-declaration
    - portfolio-declaration
objective: >-
  Give the operator console one package that builds into static files, one
  place in the service that serves them and the API the console reads, and a
  shell in T3 Code's visual language that every later screen fills, so that
  an operator opens the console from the service's own HTTP host, moves
  between every screen `DESIGN.md` lists, sees every active actor with
  its blueprint, current state, and environment, sees where every task
  of each bound Project is, and reads and answers a task's escalations,
  state, threads, and usage on its Task page. It sees an epic's shape and
  next work on the Epics screen: the tasks under one root task as a
  dependency graph read from GitHub, with the chain that holds the most
  open work. It changes a process
  from the Blueprints screen: edits each blueprint on a canvas of its
  states and transitions, with an inspector for every node and edge, or as
  YAML in a view the operator toggles to, with the service's own lint
  marking each finding as the draft changes, and publishes it as a commit
  pushed to the process repository, which the service then runs with no
  redeploy. It
  keeps GitHub in step from GitHub Projects: sees each bound Project with
  its configuration state and card counts, reviews what an Apply would
  change, applies it, and binds a GitHub Project or a T3code project; and
  from Settings, Task fields: edits the task fields as a draft with the
  service's lint, sees each bound Project's impact, and publishes them as
  a commit the service then holds in force.
  It reads the budget from the Portfolio screen: each account's capacity and
  window, and each portfolio item's allocation, usage, and what it can
  reserve, every amount in its account's unit, and edits allocations and
  items as a draft of `portfolio.yml`, linted as it changes with the
  service's own lint and saved as a commit.
background:
  current-design: >-
    `packages/console` holds a `package.json` and a README, and no framework.
    `DESIGN.md` is the console's visual design. The service has one HTTP host
    on which a module mounts request listeners under a path prefix with
    `mount(pathPrefix, listener)`. Access control belongs to the deployment. The
    store lists the active snapshots with `activeSnapshots()`, and the
    engine keeps an actor's identity at `context.manifold` in its snapshot.
  problems:
    - >-
      No package builds a user interface, so no screen can be built and no
      operator can see what Manifold runs.
    - >-
      The service has no listener that serves the console's files, and no
      endpoint that answers which actors are running.
    - >-
      A blueprint changes only by a push to the process repository from a
      host with a clone, and its author sees the lint's findings only after
      running `manifold-host blueprint lint` or after the service loads it.
    - >-
      A graph that only shows the text is hard to read and cannot be
      edited: its colors are faint, its layout lets nodes and labels
      overlap, and selecting a state leads to the YAML rather than to
      controls for it, so what an invoke's `src` names is not visible.
design-challenges:
  client-routes: >-
    The console's routes exist only in the browser. A reload or a pasted
    link to any screen must load the application, while a missing asset
    must answer `404`, not the application's page.
  build-order: >-
    The service serves files that the console package builds, and the
    service's tests drive the built console. The build and test order must
    follow from the package graph, with no step a person remembers.
  shell-before-screens: >-
    Most screens are built in later tasks. The shell must give
    each its route, its navigation entry, and its title now, so that a later
    task replaces one component and touches nothing else.
  lint-parity: >-
    The editor must mark the same findings, at the same places, as the
    service reports when it loads the text and as `manifold-host blueprint
    lint` prints, token findings included, while the operator types.
  graph-from-text: >-
    The canvas is drawn from the text. It must follow the text as it
    changes, resolve every target as XState resolves it, show a canvas edit
    at once rather than after the lint's wait and request, and hold its
    place while the text is mid-edit and does not parse.
  edits-keep-the-text: >-
    A blueprint is the operator's text, written by hand and by agents. A
    canvas or inspector edit must change only the YAML it touches:
    comments, key order, quoting, scalar styles, blank lines, and
    formatting elsewhere in the file must stay byte for byte, and an edit
    that cannot keep that must not be made.
  every-property: >-
    Every property XState and Manifold read from a state or a transition
    must be settable without the YAML view: a state's type, initial child,
    entry and exit actions, invokes, gate, tags, meta, and output, and a
    transition's event, target, guard, and actions, with each
    implementation's parameters and each expression.
  readable-layout: >-
    Each node and edge type must be told apart at a glance, and automatic
    layout must place nested and parallel states and every transition
    label with no overlap.
  positions: >-
    A position the operator gives a state must survive a reload, another
    browser, and a publish, and must not change what the blueprint runs.
  declaration-edits: >-
    A bind dialog changes one binding in `bindings.yml`, a file the
    operator may also edit by hand with comments. The edit must keep every
    other byte, give the findings the service and the host CLI give, and
    keep the dialog's values when the file changed under it.
  reviewed-apply: >-
    An Apply writes to GitHub, and Manifold does not undo a removal there.
    The operator must see every change before it runs, an Apply must run
    only the plan the operator saw, and a removal must run only by the
    operator's explicit choice.
  visual-edits: >-
    The Task fields table edits a YAML file that the operator may also
    edit by hand. A change from a control must keep the file's comments
    and other fields, follow the field shape the declaration specifies,
    and show the same findings as an edit typed in the YAML.
  edit-durability: >-
    An edit must survive a reload, a failed save, a service restart, and a
    branch that moved under it, and must reach the branch at most once
    however many times its save is retried.
  form-to-text: >-
    The Portfolio screen edits numbers and names in forms, while the
    declaration is a YAML file a person also edits by hand. An edit must
    change only the values it names, keep the file's comments and order,
    and still apply when the file changed on the branch under the draft.
  epic-from-github: >-
    An epic's shape is GitHub's: its sub-issues and its dependencies, which
    reach issues outside the tree and on no bound Project, and which may
    form cycles GitHub's data allows. The Epics screen must show that
    shape as GitHub holds it, keep no relationship of its own, and still
    give one deterministic critical path.
  browser-proof: >-
    The console is proved only when a browser renders it from the service.
    The test must run inside `task check` on a developer machine and in CI.
proposed-design:
  high-level-overview: >-
    `packages/console` is a React 19 single-page application built with
    Vite+ into `packages/console/dist`, on the stack chosen in
    `build-the-console-on-t3-codes-web-stack`. The service's console module,
    `packages/service/src/console/`, exports `mountConsole(host, options)`.
    It mounts two listeners on the HTTP host: the console's files under
    `/console` with `mount`, and the actors read endpoint, specified in
    `actors-api`, under `/api/actors` with `mount`. The shell is
    `AppShell` with the header, the sidebar, and the content region from
    `DESIGN.md`. Every sidebar screen has a route. The Actors screen reads
    `GET /api/actors`. The Board reads `GET /api/tasks` and shows the tasks
    of each bound Project in lanes by lifecycle status, and a card opens
    the Task page, which reads `GET /api/tasks/{actorId}` and answers the
    task's open escalations through `POST /api/escalations/{id}/answer`.
    The Epics screen reads `GET /api/epics` and `GET
    /api/epics/{issueNodeId}`, specified in `epics-api`, which the epics
    read model, `packages/service/src/epics/`, serves from the GitHub
    mirror and the tasks read model, mounted under `/api/epics` with
    `mount`, and draws the epic as a graph whose critical path a pure
    function computes in the browser.
    The tasks read model, `packages/service/src/tasks/`, specified in
    `tasks-api`, is mounted by service assembly under `/api/tasks` with
    `mount`. The Portfolio screen reads and writes through the endpoints
    of `portfolio-api`, which `packages/service/src/portfolio-api/`
    mounts under `/api/portfolio` with `mount` from its service wiring
    part. The Blueprints screen reads and writes through the
    blueprints endpoints of `blueprints-api`. The service module
    `packages/service/src/blueprints-api/` exports
    `mountBlueprintsApi(host, options)` and mounts those endpoints under
    `/api/blueprints` with `mount`. It lints with `lintBlueprint` and
    saves through the revision follower. GitHub Projects reads the
    Project configuration API at `/api/projects`, which the task-metadata
    module serves, and the tasks list for card counts. GitHub Projects and
    Settings, Task fields, read and write the process repository's
    `bindings.yml` and `task-metadata.yml` through the declarations
    endpoints of `declarations-api`, which the service module
    `packages/service/src/declarations-api/` mounts under
    `/api/declarations` with `mount`. Every other screen shows its title
    row and an empty state. The console and API are served without
    authentication; access control belongs to the deployment.
  console-package: >-
    `packages/console` holds `index.html`, `vite.config.ts`, `src/`, and
    `public/`. Its scripts are `build` (`vp build`, after building
    `@wyrd-company/manifold-shared`), `typecheck` (`tsc --noEmit`), and
    `test` (`vp test run`), each after building the shared package so that
    its exported types and runtime modules exist on a fresh checkout. Its
    TypeScript configuration extends the base
    with the DOM library, `jsx: react-jsx`, and bundler module resolution.
    `vite.config.ts` sets `base: "/console/"` and adds the React and
    Tailwind CSS plugins. The build writes hashed files under
    `dist/assets/` and `dist/index.html`, and empties `dist/` first. The
    package exports `"./dist/*"`, so that the service resolves the built
    files through the package graph. The root lint configuration adds the
    `react` plugin, so that `.tsx` files are linted with the rest.
  console-source: >-
    `src/main.tsx` mounts the router and the query client. `src/router.tsx`
    declares the routes in code, with TanStack Router's `basepath`
    `/console`. `src/shell/` holds `AppShell`, `Header`, `Sidebar`,
    `CommandSearch`, `ThemeToggle`, and `navigation.ts`, the one list of
    screens. `src/screens/` holds one `<Name>Content` component per sidebar
    screen, with the names `DESIGN.md` gives. `src/ui/` holds the
    primitives vendored from T3 Code's `apps/web/src/components/ui`
    (button, badge, table, dialog, sidebar, kbd, empty), each with T3
    Code's MIT notice in its header and its imports pointed at the
    console's own `cn`. `src/styles.css` sets every color token from
    `DESIGN.md` as a CSS custom property on `:root` and on `:root.dark`,
    and maps them into Tailwind's `@theme`. `src/api/` holds the API client.
  navigation: >-
    `navigation.ts` lists every sidebar screen once: its route, its label,
    its Lucide icon, its group, and its one-line description. The sidebar,
    the breadcrumb, the command search, and each screen's title row read
    this list. The groups and order are those of `DESIGN.md`: Overview,
    Board, Epics, Actors with no label; Portfolio under Plan; Blueprints,
    GitHub Projects, Environments under Configure; Settings at the bottom.
    The routes are `/console/` for Overview, then `board`, `epics`,
    `actors`, `portfolio`, `blueprints`, `projects`, `environments`, and
    `settings` under `/console/`. Settings has the routes
    `settings/task-fields`, `settings/accounts`, and `settings/general`
    for its tabs, and `settings` opens Task fields. A path under
    `/console/` that matches no route shows a "Page not found" empty state
    with a link to Overview.
  shell: >-
    `AppShell` lays out the header, the sidebar, and the content region as
    `DESIGN.md` states. The header holds the sidebar toggle, the Manifold
    mark and name, the breadcrumb (the current screen's label, and the
    Settings tab under Settings), the command search button with its `⌘K`
    hint, and the theme toggle. The sidebar shows the navigation list, with
    the current route selected. The toggle switches the sidebar between
    256px and the 48px icon rail; the mode is kept in `localStorage` under
    `manifold.sidebar`. The command search is a dialog, opened by its
    button and by `⌘K` or `Ctrl+K`, with a filter field over the navigation
    list; Enter opens the selected screen. Each screen starts with the
    title row: its label and its description from `navigation.ts`.
  theme: >-
    The theme toggle cycles System, Light, and Dark, and is a ghost button
    whose icon and `aria-label` name the current choice. System follows
    `prefers-color-scheme` and changes with it. The choice is kept in
    `localStorage` under `manifold.theme`, and the theme is the `dark`
    class on the root element. `public/theme.js`, loaded before the
    stylesheet, sets the class from the kept choice before the first paint,
    so that a reload in dark theme does not flash light.
  empty-screens: >-
    Overview, Environments, and the Settings tabs
    Accounts and budget sources and General show
    their title row and the empty state from `DESIGN.md`: a dashed border,
    the screen's icon, the title "Nothing here yet", and the line "This
    screen is not built in this version of Manifold." A later task
    replaces the screen's `<Name>Content` component and changes nothing in
    the shell.
  settings-general: >-
    The General tab of Settings shows its heading and the shared empty
    state: "Nothing here yet", "This screen is not built in this version
    of Manifold."
  api-client: >-
    `src/api/client.ts` exports `fetchActors()`. It sends `GET /api/actors`
    without authentication headers. It turns the answer into `ok` with the
    actors for `200`, or `failed` with a message for any other status, a
    network error, or a body that is not an actors response. The mapping
    from a status and a body to a result is a pure function. The body is
    checked at this boundary against the shape exported by
    `@wyrd-company/manifold-shared/actors-api`, and the rest of the console
    trusts it. Reads go through TanStack Query, which reads again when the
    window regains focus and when the screen opens. No timer reads on a
    schedule.
  actors-screen: >-
    `ActorsContent` reads `fetchActors()`. Its title row is "Actors" with
    its description, and it has no primary action. Under it, one row holds
    the actor count, right-aligned, and a ghost "Refresh" icon button that
    reads again. The table columns are the Actors list's columns in
    `DESIGN.md` that the endpoint answers, in its order: Task, Portfolio
    item, Blueprint, Current state, and Environment. Usage, Time, and
    Timeline join when the store holds what they show. Task is the issue
    reference in mono when the summary has `issue`, else the actor id in
    mono, with the actor id muted under a reference. Portfolio item is its
    value, or a muted dash when absent. Blueprint is the path in mono with
    the commit's first seven characters muted under it, or the `machine`
    value in mono when the summary has no `blueprint`. Current state is a
    success status dot and each state path in mono, one line each.
    Environment is its value in mono, or a muted dash when absent. The
    actor's status, the thread link, and the Active / Completed control
    and filters join with the screens that give them data.
    Rows follow the API's order and do not open a page. With no
    actor, the table is replaced by the empty state "No active actors",
    "Actors appear here while a blueprint runs." For `failed`, an error
    alert shows the message with "Try again".
  tasks-api-client: >-
    `src/api/tasks.ts` exports `fetchTasks()`, `fetchTask(actorId)`, and
    `answerEscalation(id, answer)`. `fetchTasks` sends `GET /api/tasks`
    and `fetchTask` sends `GET /api/tasks/{actorId}` with the id
    percent-encoded; each turns the answer into `ok` with the body, or
    `failed` with a message, as `fetchActors` does, and `fetchTask` turns
    `404` into `missing`. `answerEscalation` sends `POST
    /api/escalations/{id}/answer` with `{ choice }` or `{ text }` and
    turns the answer into `answered` or `closed` with the escalation for
    `200`, `invalid` with the service's `error` for `400`, `missing` for
    `404`, and `failed` with a message for any other status, a network
    error, or a body that does not validate. Each mapping from a status
    and a body to a result is a pure function. Bodies are checked at this
    boundary with the guards exported by
    `@wyrd-company/manifold-shared/tasks-api` and
    `@wyrd-company/manifold-shared/escalations-api`. Reads go through
    TanStack Query under the keys `["tasks"]` and `["task", actorId]`, as
    the Actors screen reads. An answer is a TanStack Query mutation; when
    it settles, it marks both keys stale, so the Board and the Task page
    read again. No timer reads on a schedule.
  board-screen: >-
    `BoardContent` reads `fetchTasks()`. Its title row is "Board" with its
    description, and it has no primary action. The filter row holds a
    Project select when more than one bound Project is listed, a Portfolio
    item select over the portfolio items the shown Project's tasks name,
    "Clear filters" when the Portfolio item filter is set, and,
    right-aligned, the shown task count and a ghost "Refresh" icon button.
    The selected Project and portfolio item are the route's search
    parameters `project`, as `<owner>/<number>`, and `item`, so a reload
    or a pasted link shows the same board; with no `project`, or one that
    names no listed Project, the board shows the first listed Project. The
    board has one lane per declared lifecycle option, in declared order,
    named by the option. A task whose status is `null` or names no
    declared option is in a "No status" lane before the declared lanes,
    shown only while it holds a task. A Project with no lifecycle
    declaration shows its tasks in the "No status" lane and, above the
    lanes, an info alert "This Project declares no lifecycle field." Lanes
    and cards are laid out as `DESIGN.md` states. Cards follow the API's
    order within a lane. A lane collapses and expands with its header's
    ghost button; collapsed lanes are kept in `localStorage` under
    `manifold.board.collapsed`, a JSON object from `<owner>/<number>` to
    the list of collapsed lane names, and every lane starts expanded. A
    card is a link that opens the task's page. With no bound Project, the
    board is replaced by the empty state "No bound Projects", "Bind a
    GitHub Project in the process repository to see its tasks here." For
    `failed`, an error alert shows the message with "Try again".
  task-card: >-
    `TaskCard` shows, from top to bottom: the issue reference,
    `<repository>#<number>`, in mono, with "Closed" and a check when the
    issue is closed; the title, or the reference again in muted text while
    the mirror has no title; the portfolio item in 12px muted text when the
    summary has one; and, when the summary has `actor`, the actor row: a
    status dot, the first state path in mono, the actor status, and an
    "Escalated" warning badge when `openEscalations` is above 0 or a
    "Failed" error badge when the actor is held. The dot is success for
    `active`, muted for `done` and `stopped`, and error for `held`. A task
    with no actor shows "Waiting for intake" in muted text in place of the
    actor row.
  task-route: >-
    The Task page is the route `board/task/$actorId` under `/console/`,
    with the actor id percent-encoded in its segment. It is a route of its
    own beside the Board's, so the Task page replaces the Board's content
    and the sidebar keeps Board selected. The breadcrumb shows "Board",
    linked to the Board with the search parameters the operator came from,
    and the issue reference. The page's back link "Board" returns there.
    A screen that opens a task later, such as Epics, adds its own
    `<screen>/task/$actorId` route with the same content.
  task-page: >-
    `TaskContent` reads `fetchTask(actorId)`. The header holds the issue
    reference in muted mono, the title, a lifecycle badge for each Project
    the task is on (a dot and the status name, or "No status"), and a meta
    line with the portfolio item and the blueprint path. On the right are
    "Open on GitHub" (outline, opening `issue.url` in a new tab, shown when
    the issue has a URL) and, as the one primary action, "Open thread",
    which opens the URL of the last thread in the list that has one. The
    main column holds, from top to bottom: the escalation panel; Current
    actor, with the actor status badge, each state path in mono, the
    blueprint path with the commit's first seven characters, the
    environment in mono, and when the actor was last saved, or "Waiting
    for intake" when the task has no actor; Threads, a table with each
    thread's title (or its id in mono), its latest turn state as a status
    dot and label, "Archived" when archived, and an "Open in T3 Code" link
    icon when it has a URL; and Escalations, the recent escalations, each
    with its title, its status, its answer as the choice's label or the
    text, the channel it came through, and when it closed. The right
    column holds Fields, with each Project's lifecycle field name and
    status and a lock icon, since Manifold sets it, and Usage, a table
    with one row per account: Account, Estimate, Actual, Variance, and
    Reserved, each amount formatted in the account's unit as `amounts`
    states, the variance signed, right-aligned in tabular figures, a
    positive variance in warning text, and a caption "Settled" or "Open" from
    `usage.settled`. With no account, Usage shows "No usage recorded."
    For `missing`, the page shows the empty state "Task not found", "This
    issue is not on a bound Project.", with a link to the Board. For
    `failed`, an error alert shows the message with "Try again".
  escalation-panel: >-
    `EscalationPanel` lists the task's open escalations, oldest first,
    each on a warning surface with its title, its question as plain text
    with line breaks kept, and its controls: one outline button per
    choice, labelled with the choice's label, and, when it takes free
    text, a one-line answer field with an "Answer" button. Under the
    controls a muted line says "The first answer from any channel is
    recorded." With no open escalation, the panel is absent. Choosing or
    answering sends `answerEscalation` and disables every control of that
    escalation while it is in flight. On `answered`, the escalation shows
    "Answered: <label or text>" on a success surface. On `closed`, it
    shows how the escalation ended, from the escalation the service
    returned: "Already answered: <label or text> (<channel>)" for an
    answer from another channel, or "Withdrawn" for a withdrawal, on a
    neutral surface. On `invalid`, the service's error shows under the
    controls and they enable again. On `missing` or `failed`, an error
    shows under the controls and they enable again. A shown outcome stays
    until the task is read again, after which the escalation is in Recent.
  tasks-endpoint: >-
    The tasks read model is `packages/service/src/tasks/`. `openTasks`
    takes its reads as functions and structural parts, holds no state,
    and computes each answer per request from what they return, so each
    request reads the mirror, the store, the ledger, and the escalations
    as they are. Pure functions in `tasks.ts` build the answers:
    `boardProjects(projects, trackedIssues, snapshots, openEscalations)`
    and `taskDetail(...)`. `escalationsOfTask(escalations, task,
    tokenHolder)` picks a task's escalations by the rule in `tasks-api`;
    the module reads `escalations.list({})` once per request and filters
    it in memory. Leaf state paths and blueprint version keys use the same
    functions as the actors endpoint. `requestListener` implements
    `tasks-api` and writes the JSON. A read that throws answers `500` and
    the error goes to `log` with the request path.
  tasks-public-interface: |-
    `packages/service/src/tasks/index.ts` exports exactly these names.

    ```ts
    import type { RequestListener } from "node:http";
    import type { Store } from "../store/index.ts";
    import type { TaskResponse, TasksResponse } from "@wyrd-company/manifold-shared/tasks-api";

    export function openTasks(options: TasksOptions): Tasks;

    export interface TasksOptions {
      readonly store: Pick<Store, "loadSnapshot">;
      /** The router's `held`: whether the router holds the actor now. */
      held(actorId: string): boolean;
      /** The GitHub Project bindings in force that are not archived, in declaration order. */
      boundProjects(): readonly TasksBoundProject[];
      /** The GitHub source's `trackedIssueIds` and `trackedIssue`. */
      readonly github: TasksGitHub;
      /** The usage intake module's `actorUsage`. */
      actorUsage(actorId: string): TasksActorUsage;
      /** The unit of an account in the accounts declaration in force; undefined when it declares none. */
      accountUnit(account: string): "usd" | undefined;
      /** The escalations module's `list`. */
      listEscalations(filter: { readonly status?: "open" | "answered" | "withdrawn" }): readonly TasksEscalation[];
      /** The T3 Code source's `thread`. */
      thread(environment: string, threadId: string): TasksThreadView | undefined;
      /** The gates module's `tokenHolder`. */
      tokenHolder(tokenId: string): string | undefined;
      readonly log?: (entry: { level: "error"; path: string; error: string }) => void;
    }

    export interface TasksBoundProject {
      readonly binding: string;
      readonly owner: string;
      readonly number: number;
      readonly item: string;
      /** The declared lifecycle field; absent when the Project declares none. */
      readonly lifecycle?: { readonly field: string; readonly options: readonly string[] };
    }

    export interface Tasks {
      list(): TasksResponse;
      get(actorId: string): TaskResponse | undefined;
      /** Mounted with `mount("/api/tasks", ...)`. */
      readonly requestListener: RequestListener;
    }
    ```

    `TasksGitHub`, `TasksActorUsage`, `TasksEscalation`, and
    `TasksThreadView` are declared structurally in the module as the
    members it reads of the GitHub source's `TrackedIssue`, the ledger's
    `LedgerActorUsage`, the escalations module's `Escalation`, and the T3
    Code source's `ThreadView`, so each part satisfies them and a test
    passes fixtures of the same shape.

    `@wyrd-company/manifold-shared` adds the subpath export `./tasks-api`,
    which exports `tasksApiPath` (`/api/tasks`), the response types of
    `tasks-api`, `isTasksResponse`, and `isTaskResponse`, and the subpath
    export `./escalations-api`, which exports `escalationsApiPath`
    (`/api/escalations`), the `Escalation` and answer types of
    `escalation-contract`, `isEscalation`, and
    `isEscalationAnswerResponse`. Both are dependency-free type guards, as
    `./actors-api` is, so the console bundles no schema compiler; a shared
    test checks each guard against the OpenAPI and JSON Schema definitions
    with fixtures that pass and fail.
  tasks-wiring: >-
    Service assembly opens the tasks read model after the sources start
    and before the host listens, and mounts its `requestListener` at
    `/api/tasks` with `mount`. `boundProjects` reads the GitHub Project
    bindings of `portfolio.current()` that are not archived, each with the
    lifecycle field the process repository revision in force declares for
    it, as the lifecycle field declaration specifies. `github` is the
    GitHub source, `actorUsage` is the usage intake module's `actorUsage`,
    `listEscalations` is the escalations module's `list`, `thread` is the
    T3 Code source's `thread`, `tokenHolder` is the gates module's
    `tokenHolder`, `accountUnit` reads the account's `unit` from usage
    intake's `accounts()`, and `held` is whether the router's `held` answers for
    the actor. The part gives the tasks read model as its member `tasks`.
  board-and-task-convergence: >-
    The tasks endpoints only read, so a request that runs twice answers
    twice from the current state. An answer from the escalation panel is
    the escalations module's `answer`: a second answer, from the panel or
    any channel, finds the escalation closed and returns the first answer,
    which the panel shows; a crash after the answer commits and before the
    browser reads the response leaves the escalation answered, and the
    next read of the task shows it in Recent. The browser's one write is
    `manifold.board.collapsed`, set to the operator's latest choice.
  board-and-task-tests: >-
    Each behavior is red before green, and tests go through public
    interfaces. In `packages/service/src/tasks/`, the endpoint test in
    `tasks-api`'s validation criteria, with a real router for the held
    state: one actor whose restore the host refuses, which is `held` with
    no errored snapshot, and one actor whose delivery errored and whose
    `release` then restored it, which is `active` while the store keeps
    its errored snapshot. In `packages/console`, unit tests
    cover the three result mappings, the lane grouping of a Project's
    tasks, including the "No status" lane, and the reading and writing of
    collapsed lanes. The browser test,
    `packages/service/src/console/board.browser.test.ts`, starts the
    production HTTP host with the built console, the console and tasks
    mounts, and the escalations API, on a store with a ledger and an
    escalations module on one database file. Fixture tasks come from
    GitHub mirror and T3 Code thread fixtures over two declared lanes; one
    task's actor is saved with a settled ledger, with a reservation and
    actuals on one account, and an open escalation raised for it with two
    choices and free text. The test opens the Board, checks the lanes and
    each card, opens the escalated task's page, checks its state,
    blueprint, thread link, and estimate, actual, variance, and reserved
    in dollars,
    answers the escalation with a choice from the panel, and checks the
    panel's answered outcome, the escalation in Recent after the page
    reads again, and the escalation answered once through channel `api`
    in the escalations module. It then raises a second escalation,
    answers it through `POST /api/escalations/{id}/answer` with text, and
    answers it from the panel with a choice; the panel shows the text
    answer as the one recorded, and the module holds that answer only.
  epics-routes: >-
    The Epics screen is the route `epics` under `/console/`, with two
    search parameters: `root`, the node id of the epic's root task, and
    `selected`, the node id of the selected issue. A reload or a pasted
    link shows the same epic with the same selection, and the Task page's
    back link returns to it. `epicsSearch` in `src/screens/EpicsContent.tsx`
    validates them: each is kept when it is a non-empty string, and
    dropped otherwise. The Task page opened from Epics is the route
    `epics/task/$actorId`, with the actor id percent-encoded in its
    segment and the same search parameters, beside the Board's
    `board/task/$actorId`. Both render `TaskContent` with the screen it
    came from, `board` or `epics`, which names the breadcrumb's first
    entry, its link, and the page's back link: "Epics" links to `epics`
    with the search parameters the operator came from. The header's
    breadcrumb reads the screen from the route in the same way. The
    sidebar keeps Epics selected on the Task page opened from it.
  epics-api-client: >-
    `src/api/epics.ts` exports `fetchEpicRoots()` and `fetchEpic(nodeId)`.
    `fetchEpicRoots` sends `GET /api/epics` and `fetchEpic` sends `GET
    /api/epics/{issueNodeId}` with the id percent-encoded. Each turns the
    answer into `ok` with the body, or `failed` with a message for any
    other status, a network error, or a body that does not validate, as
    `fetchActors` does; `fetchEpic` turns `404` into `missing`. Each
    mapping from a status and a body to a result is a pure function.
    Bodies are checked at this boundary with the guards exported by
    `@wyrd-company/manifold-shared/epics-api`. Reads go through TanStack
    Query under the keys `["epics"]` and `["epic", nodeId]`, read when the
    screen opens and when the window regains focus. No timer reads on a
    schedule.
  epics-screen: >-
    `EpicsContent` reads `fetchEpicRoots()` and, for the shown root,
    `fetchEpic(root)`. Under the title row is the toolbar, then the graph
    card, then the selection bar, as `DESIGN.md` states. The toolbar
    holds the Root task select, the summary, a ghost "Refresh" icon
    button that reads both again, and, right-aligned, the "Critical path"
    and "Fade completed" switches. The select lists the roots in the
    API's order, each as its reference in mono and its title, with
    "Closed" muted after a closed root. The shown root is the `root`
    search parameter when it is set, else the first root; a `root` that
    names a tracked issue the list does not hold is shown first in the
    select, so a link to a sub-tree opens it. Choosing a root sets `root`
    and removes `selected`. The summary counts the issues of the tree
    other than the root: "N tasks · N done · N open", done being closed.
    Each switch is on by default and is kept in `localStorage` under
    `manifold.epics.criticalPath` and `manifold.epics.fadeCompleted`, set
    to the operator's latest choice. With no root, the screen shows the
    empty state "No epics", "An epic appears here when a tracked issue has
    sub-issues on GitHub." For `missing`, the graph card shows the empty
    state "Root task not found", "This issue is not on a bound Project.",
    with a link to Epics with no search parameters. A root whose tree
    holds no other issue shows the empty state "No sub-issues" in the
    card. For `failed`, an error alert shows the message with "Try
    again". When the epic has cyclic dependencies, a warning alert above
    the graph says "N dependencies on GitHub form a cycle. The critical
    path leaves them out."
  epics-graph: |-
    `src/screens/epics/epic-graph.ts` holds the graph's pure functions.
    Each takes the epic as the API answers it and returns plain values,
    so the critical path, focus, and fading are tested without a browser.

    ```ts
    import type { Epic } from "@wyrd-company/manifold-shared/epics-api";

    /** The issues drawn and their dependencies, with each cyclic dependency marked. */
    export function epicGraph(epic: Epic): EpicGraph;
    /** The chain with the most open issues, through `through` when it is given. */
    export function criticalPath(graph: EpicGraph, through?: string): Chain;
    /** The issue, the issues it waits on, and the issues that wait on it. */
    export function neighborhood(graph: EpicGraph, nodeId: string): Focus;
    /** Each node's and edge's opacity, and the edges drawn critical. */
    export function epicEmphasis(graph: EpicGraph, state: EmphasisState): Emphasis;

    export interface EmphasisState {
      readonly hovered?: string;
      readonly selected?: string;
      readonly criticalPath: boolean;
      readonly fadeCompleted: boolean;
    }
    export interface Emphasis {
      /** Node id to opacity, 0 to 1. */
      readonly nodes: ReadonlyMap<string, number>;
      /** Edge id to opacity, 0 to 1. */
      readonly edges: ReadonlyMap<string, number>;
      readonly critical: ReadonlySet<string>;
    }

    export interface EpicGraph {
      /** Node ids in the API's order. */
      readonly nodes: readonly string[];
      readonly edges: readonly GraphEdge[];
      /** Whether the issue is open; a closed issue is done. */
      open(nodeId: string): boolean;
    }
    export interface GraphEdge {
      /** `${blocking}->${blocked}` */
      readonly id: string;
      readonly blocking: string;
      readonly blocked: string;
      /** Both ends lie in one strongly connected component. */
      readonly cyclic: boolean;
    }
    export interface Chain {
      /** Node ids from the first issue waited on to the last issue waiting. */
      readonly nodes: readonly string[];
      /** Edge ids between consecutive nodes. */
      readonly edges: readonly string[];
      readonly open: number;
    }
    export interface Focus {
      readonly nodes: ReadonlySet<string>;
      readonly edges: ReadonlySet<string>;
    }
    ```

    `epicGraph` draws every issue of the answer except the root, and the
    root too when a dependency names it. Each dependency is an edge from
    `blocking` to `blocked`. Tarjan's algorithm finds the strongly
    connected components over the edges, visiting nodes and edges in the
    API's order; an edge whose two ends are in one component is cyclic.
    The edges that are not cyclic form an acyclic graph, since every cycle
    lies inside one component.

    `criticalPath` works on that acyclic graph. A chain is a path in it,
    and its weight is the number of open issues on it. Chains compare by,
    in turn: the most open issues; the fewest issues; and the sequence of
    their nodes' indexes in the API's order, compared element by element,
    the lower first. The best chain ending at an issue is the issue alone
    or the best chain ending at one of the issues it waits on followed by
    the issue, whichever compares first; the best chain starting at an
    issue is defined the same way over the issues that wait on it. Both
    are computed once per graph in topological order. Through an issue,
    the critical path is the best chain ending at it joined to the best
    chain starting at it, the issue counted once. With no `through`, it is
    the chain through any issue that compares first; when no issue is
    open, it is empty. A cyclic edge is never on a chain.

    `neighborhood` is the issue, the ends of every edge, cyclic or not,
    that names it, and those edges.
  epics-canvas: >-
    `EpicGraphView`, under `src/screens/epics/`, draws the graph with
    ReactFlow in a card on a dotted grid, with ReactFlow's zoom controls at
    the bottom left and the legend at the bottom right, as `DESIGN.md`
    states. The graph is read only: nodes do not drag and edges do not
    connect. `layoutEpic(graph, measure)` in `epic-layout.ts` is a pure
    async function from the graph to positioned nodes and edges with
    elkjs's `layered` algorithm, the engine the blueprint canvas uses, left
    to right, with orthogonal edge routing, each node 152×84, 40px between
    nodes, 64px between layers, and each edge from its `blocking` node's
    right side to its `blocked` node's left side, so a task sits to the
    right of every task it waits on. elkjs breaks the graph's cycles
    itself; cyclic edges are laid out with the rest. Layout runs again
    when the set of nodes or edges changes, and the first drawing of an
    epic fits the view. Each edge is drawn as a polyline through its
    section's points with 6px rounded corners and an arrow at its blocked
    end, as the blueprint canvas draws its edges.
  epics-nodes: >-
    Each issue is a `TaskNode`, the ReactFlow custom node `DESIGN.md`
    names, 152×84 in the node style the blueprint canvas's `StateNode`
    uses. From top to bottom: the status mark and the reference in mono,
    with an "Escalated" warning badge when `openEscalations` is above 0 or
    a "Failed" error badge when the actor is `held`; the title in at most
    two lines, or the reference again in muted text when the mirror has
    no title; and the lifecycle line, the status on the task's first
    Project, or "No status", then the actor's first state path in mono.
    The status mark is a check for a closed issue, whose title is muted; a
    status dot in the actor's color, as on a Board card, for an open task
    with an actor; and a hollow dot for an open issue with no actor. An
    issue that is no task shows "Not on a bound Project" in its lifecycle
    line. An outside issue has a dashed border, and its lifecycle line
    starts with "Outside this epic". Edges are 1.5px in the `edge` color;
    a critical edge is 2px primary; a cyclic edge is 1.5px dashed in the
    error color and is never critical. The legend shows the done, actor,
    and no-actor marks, the outside border, and the edge, critical, and
    cyclic strokes.
  epics-focus: >-
    `epicEmphasis(graph, state)` gives every node and edge its opacity and
    names the edges drawn critical, from the hovered or keyboard-focused
    node, the selection, and the two switches; `TaskNode` and the edges
    apply it with a 150ms opacity transition. The critical edges are
    those of the critical path through the selected node when there is a
    selection, else those of `criticalPath(graph)` when "Critical path" is
    on, else none. Focus is the hovered node's `neighborhood` when a node
    is hovered or focused, else the selected node's critical path when
    there is a selection, else everything. Out of focus, nodes are at 30%
    and edges at 10%. In focus, with no hover and no selection, "Fade
    completed" puts closed nodes at 55% and the edges whose `blocking`
    end is closed at 25%; every other node and edge in focus is at 100%.
    The selected node has the 2px primary border and ring. Clicking a
    node, or Enter on a focused node, sets `selected` to it; clicking the
    selected node, "Clear", or Escape removes `selected`. Nodes are
    focusable in the API's order with Tab. A `selected` that names no
    drawn node is ignored.
  epics-selection-bar: >-
    The selection bar is 56px under the graph card. With no selection it
    shows, muted, "Select a task to see the chain through it." With a
    selection it shows the chain's references in mono joined by arrows,
    the selected one in primary text, cut with an ellipsis from the left
    when it does not fit, then "N open", then "Clear" (ghost) and the one
    action: "Open task" (primary) for an issue with a task, linking to
    `epics/task/$actorId` with the screen's search parameters, or "Open on
    GitHub" (outline) opening the issue's URL in a new tab for an issue
    with no task.
  epics-endpoint: >-
    The epics read model is `packages/service/src/epics/`. `openEpics`
    takes its reads as functions and structural parts, holds no state, and
    computes each answer per request from what they return, so each
    request reads the mirror and the tasks list as they are. It reads
    every tracked issue once per request, `trackedIssueIds` then
    `trackedIssue` for each, and the tasks list once. Pure functions in
    `epics.ts` build the answers: `epicRoots(tracked)` and `epicOf(nodeId,
    tracked, tasks)`, which walks the tree, collects the outside issues
    and dependencies, and joins each issue to its task entries by node id,
    as `epics-api` states. `requestListener` implements `epics-api` and
    writes the JSON. A read that throws answers `500` and the error goes
    to `log` with the request path.
  epics-public-interface: |-
    `packages/service/src/epics/index.ts` exports exactly these names.

    ```ts
    import type { RequestListener } from "node:http";
    import type { EpicResponse, EpicRootsResponse } from "@wyrd-company/manifold-shared/epics-api";
    import type { TasksResponse } from "@wyrd-company/manifold-shared/tasks-api";

    export function openEpics(options: EpicsOptions): Epics;

    export interface EpicsOptions {
      /** The GitHub source's `trackedIssueIds` and `trackedIssue`. */
      readonly github: EpicsGitHub;
      /** The tasks read model's `list`. */
      readonly tasks: { list(): TasksResponse };
      readonly log?: (entry: { level: "error"; path: string; error: string }) => void;
    }

    export interface Epics {
      roots(): EpicRootsResponse;
      get(issueNodeId: string): EpicResponse | undefined;
      /** Mounted with `mount("/api/epics", ...)`. */
      readonly requestListener: RequestListener;
    }
    ```

    `EpicsGitHub` is declared structurally in the module as the members
    it reads of the GitHub source: `trackedIssueIds()` and
    `trackedIssue(nodeId)` with the `issue`, `blockedBy`, `blocking`,
    `subIssues`, and `parent` of `TrackedIssue`, so the source satisfies
    it and a test passes fixtures of the same shape.

    `@wyrd-company/manifold-shared` adds the subpath export `./epics-api`,
    which exports `epicsApiPath` (`/api/epics`), the response types of
    `epics-api`, `isEpicRootsResponse`, and `isEpicResponse`,
    dependency-free type guards as `./tasks-api` exports; a shared test
    checks each guard against the OpenAPI definitions with fixtures that
    pass and fail.
  epics-wiring: >-
    The `epics` wiring part, `epics/wiring.ts`, opens the epics read model
    after the `tasks` part, with the GitHub source as `github` and the
    `tasks` member as `tasks`, logging `epics-read-failed`, and mounts its
    `requestListener` at `/api/epics` with `mount`. The `tasks` part gives
    the tasks read model as its member `tasks`, so the epics answers carry
    each task's status, actor, and escalations exactly as the Board shows
    them.
  epics-convergence: >-
    The epics endpoints only read, so a request that runs twice answers
    twice from the current mirror and store. The Epics screen writes only
    its two `localStorage` keys, each set to the operator's latest choice,
    and its search parameters; a crash leaves the last choice written or
    the one before it.
  epics-tests: >-
    Each behavior is red before green, and tests go through public
    interfaces. In `packages/service/src/epics/`, the endpoint test in
    `epics-api`'s validation criteria, with the real tasks read model over
    the same fixtures. In `packages/console`, unit tests cover the two
    result mappings, `epicsSearch`, and `epic-graph.ts`: `criticalPath`
    over a fixture with two chains of equal open count and different
    lengths, two of equal open count and length, a three-dependency cycle
    beside an acyclic chain, a cycle that two acyclic chains enter and
    leave, closed issues at the start, middle, and end of a chain, a
    graph with no open issue, an outside issue on the best chain, and a
    selection through a closed issue and through an issue on no chain;
    `neighborhood` with a cyclic edge; `epicEmphasis` for hover, a
    selection, both switches on and off, and a hover over a selection;
    and `epicGraph` drawing the root only when a dependency names it.
    `epic-layout.ts` is tested on the same fixtures: every acyclic edge's
    `blocked` node lies right of its `blocking` node, and no two nodes
    overlap. The browser test,
    `packages/service/src/epics/epics.browser.test.ts`, starts the
    production HTTP host with the built console and the console, tasks,
    and epics mounts, on a store with GitHub mirror fixtures over two
    bound Projects: a root with a tree three levels deep, dependencies
    across levels and branches, a tree issue blocked by an issue of
    another tree, a closed task, a task with an escalated actor, and an
    issue on no bound Project. It opens Epics and checks the root select,
    the summary, each node's reference, mark, badge, and lifecycle line,
    the outside node's dashed border, and the critical edges; turns
    "Critical path" off and sees no critical edge, and "Fade completed"
    off and sees the closed node opaque, and both stay off after a
    reload; hovers a node and sees its neighbors opaque and another node
    at 30%; selects a node and sees the selection bar's chain and open
    count; opens the task and sees the Task page with "Epics" in the
    breadcrumb; returns with the back link and sees the same selection;
    and chooses the other root and sees its graph. Fixture values are
    generic and never drawn from Manifold's own domain.
  blueprints-routes: >-
    The Blueprints screen has two routes: `blueprints`, the list, and
    `blueprints/$`, the editor, whose splat is the blueprint's path as the
    API names it, such as `/console/blueprints/blueprints/review.yml`. Both
    render `BlueprintsContent`, which shows the list or the editor by
    route, as `DESIGN.md` states. The breadcrumb shows "Blueprints / <path>"
    on the editor. The navigation entry, its label, and its description
    are unchanged.
  blueprints-list: >-
    `BlueprintsContent` on `blueprints` reads `GET /api/blueprints`. Its
    title row is "Blueprints" with its description, and it has no primary
    action. Under it, one row holds the blueprint count, right-aligned, and
    a ghost "Refresh" icon button. The table columns, in percent widths as
    `DESIGN.md` states for tables, are Name, Version, Lint, Active actors,
    and an Edit button. Name is the path in mono with the description
    muted under it, and a "Draft" badge on its own line when the browser
    holds a draft for the path. A path lists once, as the blueprint that
    runs there. Version is the version's commit, first seven characters,
    in mono, for a repository blueprint; for a bundled blueprint it is a
    "Bundled" badge with the bundle digest's first seven characters muted
    in mono under it. A repository blueprint that replaces a bundled one
    has the muted line "Replaces the bundled blueprint" under its
    description, and its Version is its commit. Lint is a success dot and "Loaded" with no
    finding or warning, an error dot and "N errors" for an invalid
    blueprint, and a warning dot and "N warnings" for a loaded one with
    warnings. Active actors is the count, or a muted dash for zero; at a
    replaced path it counts actors still running a bundled version too.
    Edit, or the name, opens the editor. With no blueprint, the table is replaced by the empty
    state "No blueprints", "Blueprints appear here when the process
    repository holds files under blueprints/." Before the first applied
    revision the list shows the bundled blueprints and the info alert
    "The process repository has not been read yet." A failed read shows an
    error alert with the message and "Try again".
  blueprint-editor: >-
    `BlueprintEditor`, under `src/screens/blueprints/`, is the editor
    route's content. It reads `GET /api/blueprints/source?path=` and opens
    the browser's draft for the path when one exists, or the source's text
    when none does. The header (56px) holds the path in mono, "Based on
    <short commit>" in muted mono, a "Draft · N changes" warning badge when
    the text differs from the base text, where N is the count of changed
    lines, the view toggle, then "Discard draft" (ghost) and "Publish"
    (primary). A bundled
    blueprint shows "Bundled <short digest>" in place of "Based on", and
    is edited as any blueprint is: publishing it adds the file at its path
    to the process repository, which replaces the bundled blueprint from
    that commit on. Its Publish dialog shows the file with `A` and the
    line "This file replaces the bundled blueprint." Under the header and
    its alerts is one view at a time, at every width: the canvas view,
    which is the canvas toolbar, the canvas, and the inspector, or the
    YAML view. The Problems strip runs under the view. Both views edit the
    one draft text, so the draft, lint, save, conflict, and pending-save
    behavior below is the same whichever view made a change.
  view-toggle: >-
    The view toggle is a segmented control of two options, "Canvas" and
    "YAML", with `aria-pressed` on the shown one. The shown view is the
    editor route's search parameter `view`: absent for the canvas, `yaml`
    for the YAML view, so a reload or a pasted link opens the same view.
    `Ctrl+Shift+Y` or `⌘⇧Y` switches views. Switching keeps the draft, the
    latest lint answer, and the selection. Switching to YAML puts the
    cursor at the start of the selected node's or edge's range and
    scrolls it into view; switching to the canvas selects the deepest
    transition, or else the deepest state, whose range holds the cursor,
    opens its inspector, and pans to it when it is outside the viewport.
  yaml-view: >-
    The YAML view is a CodeMirror 6 editor over the text, full width, with
    line numbers, `@codemirror/lang-yaml`, the console's theme built from
    the `DESIGN.md` code colors, and the findings as `@codemirror/lint`
    diagnostics: each finding with a `range` is an error diagnostic and
    each warning with a `range` a warning diagnostic, over that range. A
    line that differs from the base text has the 3px warning bar in the
    gutter and the faint warning background `DESIGN.md` gives the YAML
    view, computed with `@codemirror/merge`'s diff of the base text and the
    text. A toolbar (48px) shows the file path, the legend for changed
    lines, and "Copy". CodeMirror's own undo history serves the view while
    it is shown.
  lint-as-you-type: >-
    Each change to the text starts a 300 ms wait; a change during the wait
    starts it again. When the wait ends, the editor sends `POST
    /api/blueprints/lint` with the path and the text, and aborts the lint
    request still in flight, if any, with its `AbortController`. An answer
    is applied only when the text is still the text it was sent for, so
    the marks always belong to the text on screen. The source's own
    findings mark the text on open with no request. While a lint is
    pending, the Problems header shows "Checking…" in muted text and the
    previous marks stay. A lint request that fails shows "Cannot check
    this text. Try again." in the Problems header with a "Try again"
    button, and Publish stays disabled. A canvas or inspector edit changes
    the text, so it is linted by the same wait and request as typing.
  canvas: >-
    `BlueprintCanvas` is a ReactFlow canvas on the dotted grid. It draws
    the graph that `blueprintGraph` computes in the browser from the
    draft's text, recomputed on each change of the text, with the
    document's `layout`, so a canvas edit shows at once. The service's
    graph in a lint answer serves only the Problems strip and the list.
    Findings mark the canvas from the latest lint answer, applied only to
    the text it was sent for; while a lint is pending, the previous marks
    stay on the nodes and edges they named. When the text has no graph,
    because it does not parse, fails the shape, or its machine does not
    resolve, the canvas keeps the last graph, dimmed and read only, with
    the info line "The canvas cannot draw this text. Fix it in the YAML
    view." and "Open YAML". While the draft is a pending save, the canvas
    is read only. Read only, the canvas keeps select, move, zoom, and fit;
    every other toolbar button and every inspector field is disabled. A
    click on the canvas background selects the blueprint itself.
  canvas-toolbar: >-
    `CanvasToolbar` floats 12px inside the canvas's top-left corner. Its
    buttons are ghost icon buttons, each with an `aria-label` and a
    tooltip naming it and its key, in groups: Select (`V`) and Move (`H`),
    one of which is the active tool; Add state (`S`), a menu of State,
    Compound state, Parallel state, Final state, and History state, and
    Add transition (`T`); Undo (`⌘Z` or `Ctrl+Z`) and Redo (`⌘⇧Z` or
    `Ctrl+Shift+Z`); Zoom out (`-`), Zoom in (`+`), and Fit (`Shift+1`);
    and Automatic layout (`Shift+L`). Keys act while focus is on the
    canvas, never in an inspector field or the YAML view. With Select, a
    click selects a node or an edge, a drag of a node moves it, a drag from
    a node's handle starts a transition, and a drag of the background
    pans. With Move, every drag pans and nothing moves or connects; holding
    Space gives Move until it is released. Choosing a state type arms
    placement: a ghost of the node follows the pointer, a click places the
    state, and Escape disarms. Add transition arms connection: a click on
    the source state and a click on the target state, the source again for
    a transition to itself, open the event picker; Escape disarms. Zoom
    runs from 25% to 200%. Fit frames every node with 48px of margin.
    Automatic layout is disabled, with the tooltip "Layout is automatic",
    while the blueprint has no `layout`. `Delete` and `Backspace` remove
    the selected state or transition.
  canvas-nodes: >-
    Each node type has its own component and look, as `DESIGN.md` states.
    An atomic state is a `StateNode`; a final state is a `StateNode` with a
    double border; a compound state is a `GroupNode` holding its children
    under a title bar; a parallel state is a `GroupNode` marked "Parallel"
    whose regions, its child states, have dashed borders; a history state
    is a `HistoryNode`, a circle marked `H` for shallow or `H*` for deep;
    and each compound level, the machine's root included, has an
    `InitialNode`, a small filled dot joined to the initial child by an
    unlabeled edge. A state names the source of its first invoke, with
    "+N" for more, and a "Gate" badge when it declares a gate. A state
    whose range holds a line that differs from the base text has the
    6px warning dot. A state with a finding or warning whose location is
    the state's location or under it, and not under a child state's or a
    transition's location, has the 16px "!" badge, error colored when any
    is a finding. A selected node has the 2px primary border and ring.
    Every node has a target handle on its top edge and a source handle on
    its bottom edge, shown on hover with Select; a connection dropped
    anywhere on a node connects to that node.
  canvas-edges: >-
    Each transition is a `TransitionEdge` whose stroke and label pill tell
    its trigger apart, as `DESIGN.md` states: an event transition is solid
    with the event type; `always` is dashed with "always"; `after` is
    dotted with a clock icon, the delay as written, and, for a delay in
    milliseconds, its duration after a middle dot, such as
    "3600000 · 1h"; `onDone` is solid with a done icon, "done", and the
    invoke id or the state; `onError` is solid with an error icon,
    "error", and the invoke id. A guarded transition has the guard icon
    first in its pill. A targetless transition is a short loop on its
    source. A transition with several targets is one edge per target. The
    edges into and out of the selected node, and the selected edge, are
    drawn in primary. A transition with a finding or warning whose
    location is the transition's location or under it has its pill
    bordered in error or warning color with a 12px "!" icon.
  automatic-layout: >-
    `layoutCanvas(graph, layout, measure)` in `canvas-layout.ts` is a pure
    async function from the graph, the document's `layout`, and a function
    that measures a label's width to the positioned nodes, edges, and
    labels. A blueprint with no `layout` is laid out automatically, every
    time the set of states, transitions, or labels changes, with elkjs's
    `layered` algorithm, top to bottom, `hierarchyHandling`
    `INCLUDE_CHILDREN`, orthogonal edge routing, and each edge's label
    pill given to the layout as a label of its measured size, placed at
    the edge's center, so that elkjs keeps nodes and labels apart. Spacing
    is 48px between nodes, 64px between layers, 24px between an edge and a
    node, 16px between edges, and 8px around a label. A group's padding is
    48px on top, for its title bar, and 24px on the other sides. A history
    node is 40×40 and an initial node 10×10, laid out in its group's first
    layer. Edge sections and label positions are read in root
    coordinates, and each edge is drawn as a polyline through its
    section's points with 6px rounded corners, its pill at elkjs's label
    position. The browser measures a label with the canvas 2D context in
    the mono font of `DESIGN.md`; tests pass a fixed width per character.
    The viewport keeps its pan and zoom across layouts, and the first
    drawing of a blueprint fits the view. Layout runs on the main thread
    with `elk.bundled.js`.
  pinned-layout: >-
    A blueprint with `layout` is pinned. Each state with an entry in
    `layout.states` is drawn at its point, relative to its parent group.
    A state with no entry is placed to the right of its positioned
    siblings' bounding box, 48px from it, top-aligned with it, one column
    in document order; with no positioned sibling it is placed at its
    group's padding. A group's size is its children's bounding box plus
    its padding, at least 200×56. An initial node sits 32px above and to
    the left of the initial child. Edges are ReactFlow smooth-step paths
    between the node borders, with the pill at the path's midpoint; a
    pinned drawing does not keep labels apart, and Automatic layout gives
    a drawing that does. A drag with Select moves a node, with its
    children, within its parent group. When the drag ends somewhere other
    than where it started, the canvas writes every drawn state's point,
    snapped to the 8px grid, as the whole `layout.states` mapping in
    document order, so the first drag of an automatic blueprint pins the
    drawing as it was shown, and an entry whose path names no state is
    dropped. Moving a state to another parent is a change of the machine
    and is made in the YAML view. Automatic layout removes `layout` and
    the comments inside it, and the blueprint is automatic again.
  adding: >-
    Placing a state adds it to the deepest compound or parallel state
    whose group holds the click point, or to the machine's root. Its key is
    the first of `<base>`, `<base>-2`, `<base>-3`, and so on that no
    sibling holds, where the base is `state`, `compound`, `parallel`,
    `final`, or `history` by its type. It is written as the smallest text
    that lints for its type: `{}` for a state, `{ type: final }`,
    `{ type: history }`, a compound state with `initial` naming one child
    state, and a parallel state with two child states, `region-1` and
    `region-2`. A parent with no `initial` that needs one gets the new
    state as `initial`. In a pinned blueprint the new state's point is
    written with it. The new state is selected and its inspector opens with
    its key field focused, so the operator names it next.
  event-picker: >-
    A connection opens `EventPicker`, a 280px popover at the drop point
    titled "New transition" with the source and target paths in mono. A
    filter field over a list offers each event type the blueprint declares
    under `schemas.events`, in mono; "always"; "after", which asks for a
    delay in milliseconds or a delay name; "done", when the source invokes
    or has child states; and "error", when the source invokes, for its
    first invoke, or a chosen one when it invokes more than one. A typed
    name that the list does not hold is offered as "Use <name>". Enter or
    a choice writes the transition; Escape or a click outside writes
    nothing. A source that already has a transition on the chosen trigger
    gets the new one as a further candidate after the existing ones. The
    new edge is then selected and its inspector opens.
  blueprint-edits: >-
    `blueprint-edits.ts` is a pure module. `applyBlueprintEdit(text, edit,
    graph)` takes the draft's text, one edit, and the graph of that text,
    and returns `{ ok: true, text, select? }` with the new text and the
    node or edge to select, or `{ ok: false, reason, message }` with the
    text unchanged. The edits are `add-state`, `rename-state`,
    `remove-state`, `set-initial`, `add-transition`, `remove-transition`,
    `move-candidate`, `set`, `remove`, `rename-key`, `set-layout`, and
    `clear-layout`; `set`, `remove`, and `rename-key` take a JSON Pointer
    into the document and are what an inspector field writes. The module
    parses the text with the `yaml` package's document model, finds each
    node it changes by its pointer, and changes the text by splices
    inside those nodes' source ranges: a replaced value is its node's range
    rewritten, a renamed key its key scalar's range, a removed entry the
    lines from its key to the end of its value, and an added entry new
    lines after the last entry of its mapping, at that mapping's
    indentation, or a new item at the end of a flow collection. A new
    value is rendered by the `yaml` package's `stringify` in block style at
    the place it goes; a replaced scalar keeps its style, plain, quoted,
    literal, or folded, when the new value can be written in it. Every
    character outside the splices is kept. The result is then checked: it
    must parse with no error, and its value must equal the old document's
    value with the edit applied as data. An edit that fails the check, or
    that touches an anchor, an alias, or a node an alias refers to, returns
    `unsafe`, and the editor shows "This edit cannot be made on the
    canvas. Make it in the YAML view." An edit whose pointer, state, or
    transition the text no longer holds returns `missing` and changes
    nothing. A key that is empty, holds `.` or `#`, or that a sibling holds
    returns `invalid` with the message the field shows.
  edit-basis: >-
    Each edit carries its basis, the draft text the operator made it on:
    the text the canvas or inspector showed when the click, drop, or field
    change happened. `commitEdit(draft, basis, edit, graph)` applies the
    edit only when the draft's text is still its basis, and otherwise
    returns `stale` and changes nothing. The pair of basis and edit is the
    edit's identity, so a replay of one edit applies at most once: after
    it applied, the draft's text is its result and no longer its basis.
    Two clicks are two edits, each made on the text the previous one left,
    so each applies once. A gesture whose basis became stale while it ran,
    because a lint answer, a source read, or another edit changed the
    text first, is dropped and the canvas shows the current text; the
    operator makes it again on what is shown.
  edit-references: >-
    A target is written in the shortest form that resolves to it from its
    source: the sibling's key path, such as `routing` or
    `routing.checking`, for a state under a sibling of the source or the
    source itself; `.<path>` for a state under the source; and
    `#<machine id>.<path>` otherwise. A target that is the only property
    of its transition is written as a string. `rename-state` renames the
    key and rewrites, in the form each was written, every reference that
    resolves to the state or under it: transition targets, by the
    locations the graph gives; the parent's `initial`; a history state's
    `target`; each `in` guard's `states`; a gate's `return.state` and
    `dependencies`; and the keys of `layout.states`. `remove-state` removes
    the state, every transition target that resolves to it or under it,
    and the transition when no target is left, its `layout.states`
    entries, and its parent's `initial` when it named the state, which
    then names the first remaining child, or is removed when no child is
    left. An `in` guard or a gate that names a removed state stays, and the
    lint marks it. `move-candidate` moves a transition earlier or later
    among the candidates of its trigger.
  inspector: >-
    `Inspector` is a 320px panel at the canvas view's right edge that
    shows the selected node or edge, or the blueprint when nothing is
    selected. Under 1024px of content width it is an overlay sheet from the
    right, closed with Escape. Its header names the kind, such as
    "Compound state" or "Delayed transition", and the state path or label
    in mono, and a node or edge inspector ends with "Remove" in destructive
    outline. Its fields are grouped as `DESIGN.md` states, and each writes
    through `applyBlueprintEdit`. A field whose value is a name, a state
    key, an event type, a delay, or an invoke id, writes on Enter or when
    it loses focus, and Escape restores it; every other field writes on
    each change. A field whose pointer holds a finding or warning, at it
    or under it, is bordered in the finding's color with the message
    under it. Several kinds of field recur: a reference field, a combobox
    of implementation names of one kind from the implementation catalog,
    grouped and each with its description, plus the blueprint paths of the
    list for an invoke `src`, and any typed name; an action list, with
    rows of an action, its parameters, and remove, and "Add action"; an
    expression field; and a YAML field, a CodeMirror YAML editor over one
    value that writes when its text parses and otherwise shows the parse
    error under it and writes nothing. Parameters are a YAML field over
    `params`.
  inspector-fields: >-
    Every state node has an inspector, the machine's root included, and
    each inspector has a control for every property `blueprint.schema.yml`
    allows on that node, so no declaration needs the YAML view. A state
    node's properties are those of `state-node-properties`, in these
    groups: Basics, with the key (absent for the root), `id`,
    `description`, `type`, `initial`, and, for a history state, `history`
    and `target`; Transitions, with `on`, `always`, `after`, and `onDone`;
    Entry actions, `entry`; Exit actions, `exit`; Invoke, `invoke`; Gate,
    `meta.gate`; Meta, the other `meta` keys as a YAML field; Tags, `tags`;
    and Output, `output`. `states` is the node's children on the canvas.
    The root's inspector is the blueprint inspector, which adds the
    document's `description`, the machine's `context` as a YAML field, the
    input, output, and context schemas, each event schema, and each actor
    schema as YAML fields with "Add event schema" and "Add actor schema",
    and the layout, "Automatic" or "Pinned" with Automatic layout; its
    Basics hold the machine `id` and its `type`, compound or parallel, and
    it has no key and no Gate group, since a gate on the root is a lint
    finding. A group whose property has no meaning for the node's type in
    XState, such as Invoke on a history state or `initial` on an atomic
    one, is shown only while the node holds a value for it, so a value
    written by hand stays editable; "More properties", a menu at the end
    of the inspector, lists each allowed property the inspector does not
    show and adds its group. The type is a select of State, Compound
    state, Parallel state, Final state, and History state, where a state
    with child states can only be compound or parallel. The `id` field
    writes on Enter or loss of focus, and a change of a state's `id`
    rewrites each `#<id>` target that names it, as `rename-state` rewrites
    keys. The Transitions group lists each transition the node declares,
    each with its trigger's icon, its label, and its target or "not
    connected" in warning text, each opening that transition's inspector,
    and "Add transition", which asks for the target and then opens the
    event picker. A transition the canvas does not draw, one declared on
    the root or an invoke's `onSnapshot`, is edited from these lists in the
    same transition inspector. An invoke is a card with `src`, `id`,
    `systemId`, `input` as a static YAML field or a mapping expression,
    `onDone` and `onError` targets, and its `onSnapshot` transitions,
    with "Add invoke". The gate holds "Add gate", or the comparator path,
    the return point, exit or a state, the reservation switch, the token
    event type, the dependencies region, and "Remove gate". Output is a
    static YAML field or a mapping expression. The initial marker's
    inspector holds its level's `initial`. A transition inspector holds
    every property of `transition`: what its trigger names, the event
    type, the delay, or the invoke it belongs to; its targets, each a
    select of state paths or "No target"; its guard, none, an expression,
    `in` with a multi-select of state paths, or a named guard with its
    parameters; its actions; `reenter`; its description; its `meta` as a
    YAML field; and, when it is one of several candidates, "N of M" with
    "Earlier" and "Later". `inspector-model.ts` is a pure function from a
    node's or edge's kind and value to the groups and fields the inspector
    renders, each field with the JSON Pointer it writes.
  invoke-contract: >-
    An invoke shows what its `src` names: for a Manifold implementation,
    its description from the implementation catalog; for a child
    blueprint, the description the list gives for that path, or "Not in
    the process repository" in warning text; for any other name, "Unknown
    implementation" in warning text. Under it, Contract shows
    `schemas.actors.<src>` of the blueprint: its input and its output,
    each as a table of property, type, and required, read from the
    schema's `properties` and `required`, or the schema as YAML when it is
    not an object schema. With no declaration it shows "Not declared" in
    muted text and, when the catalog gives the implementation's input and
    output schemas, "Declare contract", which writes them under
    `schemas.actors.<src>`. "Edit" opens the actor schema in the blueprint
    inspector.
  expression-field: >-
    An expression field edits the `params.expression` of an
    `expression.assign` or `expression.guard` reference, or of an
    `expression.map` `input` or `output`. It is a CodeMirror 6 editor in
    mono that grows from one line to eight, with a "JSONata" label and no
    language package. Its diagnostics are the latest lint answer's
    findings and warnings located at the expression or at its reference:
    a finding with a `position` marks one character at that position in the
    expression, and any other marks the whole expression. It writes on
    each change, so it is linted with the same wait, request, and rules as
    the YAML view. A one-line expression keeps the scalar style it had,
    and a new or multi-line expression is written as a literal block
    scalar.
  canvas-undo: >-
    `canvas-history.ts` holds the canvas's undo and redo as a pure stack
    of pairs, the text before and after each canvas or inspector edit, up
    to 100. Undo restores the text before the latest edit only when the
    draft's text is still the text after it; a text changed elsewhere, by
    the YAML view or a source read, empties both stacks. The stacks live in
    memory and are emptied by a reload, a discard, and a source read that
    replaces the text.
  problems-strip: >-
    The Problems strip is `DESIGN.md`'s: a 36px header with the error count
    in error color and the warning count in warning color, collapsible,
    and the list of findings then warnings, each with its kind in mono,
    its message, its state path when it falls in a state, and its line.
    Choosing one in the canvas view selects the transition, the state, or
    the blueprint it falls in, opens its inspector, and scrolls to the
    field it marks; in the YAML view it moves the cursor to its range. A
    finding with no range lists with its location in mono.
  canvas-problems: >-
    `problems.ts` maps each finding to what it marks: the deepest
    transition whose location is the finding's location or a prefix of
    it, else the deepest such state, else the blueprint; and, within the
    inspector, the deepest field whose pointer is the finding's location or
    a prefix of it. The canvas, the inspector, the Problems strip, and the
    YAML view read the same latest lint answer, so each finding marks all
    four.
  blueprint-drafts: >-
    A draft is the edited text of one blueprint, with the commit it is
    based on, kept in the browser. It lives in `localStorage` under
    `manifold.blueprint-draft.<path>` as JSON `{ base, baseText, text,
    saveId?, message?, saved? }`. The editor writes the draft on each change
    to the text, and removes it when the text equals `baseText` and the
    draft has no `saved`, and when "Discard draft" is confirmed. A save
    that answers `200` does not remove the draft: it sets `saved` to the
    answer's commit and keeps `message`, so the text stays in the browser
    until the service has loaded the saved commit. A draft with `saved` is
    settled by a source read: one that answers the draft's text removes
    the draft. When a save answer carries `blueprint`, the service holds
    the saved commit, and the source read that follows it is the file as
    the branch now holds it; when that text differs from the draft's, a
    later commit changed the file after the save, and the draft becomes an
    ordinary draft based on that source: `base` and `baseText` become the
    source's commit and text, `text` stays the saved text, and `saved`,
    `saveId`, and `message` are removed. The editor is then editable, the
    header shows "Draft · N changes", and the info alert reads "Saved as
    <short saved commit>. <branch> changed this file since, at <short
    commit>. Your saved text is kept as a draft." with "Compare", the
    conflict alert's dialog against the branch's text. The operator
    discards the draft to accept the newer file, or publishes it to put
    the saved text back. A draft whose `base` is
    older than the source's commit keeps its base, and the header shows
    the info line "A newer version exists. Publishing keeps changes made
    since, unless they changed this file." "Discard draft" asks first, in
    the 400px alert dialog `DESIGN.md` gives, naming the number of changed
    lines and the version that stays. `src/screens/blueprints/draft.ts`
    holds the pure functions that read, write, and change a draft, and a
    draft that does not parse as that shape is removed and ignored.
  publish: >-
    "Publish" is enabled when the text differs from the base text, the
    latest lint answer is for the text on screen, and it has no finding;
    warnings do not block it. It opens `PublishDialog`, the 480px dialog of
    `DESIGN.md`: the file with its git status letter, `A` when the base has
    no file at the path and `M` otherwise, and its path in mono; a commit
    message field, prefilled with "Update <path>", or "Add <path>" for
    `A`; and the repository URL and branch from the list endpoint. "Commit
    and push" sends `POST /api/blueprints/save` with the path, the base,
    the text, the message, and the draft's `saveId`. When the draft has no
    `saveId`, the editor first sets one: 16 bytes from
    `crypto.getRandomValues` as 32 lower-case hexadecimal characters,
    written to the draft before the request, so a retry of the same text
    after a reload sends the same `saveId`. Any change to the text removes
    the `saveId`. The button shows a spinner and the dialog cannot close
    while the request runs. For `200`, the editor sets the draft's
    `saved` and shows "Saved as <short commit>" in a success toast for
    `saved`, "Already saved as <short commit>" for `already-saved`, and "No
    change to save" for `unchanged`. When the answer carries `blueprint`,
    the editor reads the list and the source again, and the source read
    settles the draft as blueprint-drafts states: the editor shows the new
    source with its base at the new commit, or the saved text as a draft
    based on a later commit that changed the file. When the answer has no `blueprint`, or the source
    read fails, the pending alert opens. For `422`,
    the dialog closes and the findings mark the text. For `409`, the
    dialog closes and the conflict alert opens. For `502`, `503`, a
    network failure, or a request whose answer never arrives, the dialog
    shows the message in an error alert with "Try again", which sends the
    same request.
  pending-save: >-
    A draft with `saved` is a pending save: the commit is on the branch,
    and the service has not yet answered a source read for it. The pending
    alert sits under the editor header in the info tint: "Saved as <short
    commit>. The service has not loaded it yet. Your text is kept." with
    "Load saved version". The editor shows the draft's text, read only;
    Publish is hidden and "Discard draft" stays, since the saved commit is
    on the branch whatever the browser keeps. "Load saved version" sends
    the save request again, with the draft's base, text, message, and
    `saveId`; the service's follower pulls before it saves and finds the
    saved commit by its trailer even under later commits, so the answer is
    `already-saved` with `blueprint` once the service holds the commit,
    and the editor then reads the source, which settles the draft. A
    failed request shows its message in the alert and keeps the draft. A
    reload reopens the draft with `saved` and the same alert, and a source
    read that already answers the draft's text removes it at once. A
    pending save therefore ends in one of three states: no draft, the
    saved text as a draft over a later commit, or the pending alert while
    the service cannot reach the branch.
  conflict: >-
    The conflict alert sits under the editor header in the error tint. For
    reason `file-changed` it reads "<path> changed on <branch> at <short
    head>. Your text is kept."; for reason `branch-moved` it reads
    "<branch> moved while saving, at <short head>. Your text is kept.
    Publish again." It has
    three buttons. "Compare" opens a 920px dialog with a `@codemirror/merge`
    `MergeView`: the branch's text on the left, read only, and the draft's
    text on the right, editable, so the operator can take changes across.
    "Use latest as base" sets the draft's base to the head and its base
    text to the branch's text, keeps the draft's text, and removes its
    `saveId`, so the next Publish replaces the branch's change with the
    draft's text by the operator's choice. "Discard draft" removes the
    draft after the alert dialog, and the editor reads the source again.
    The editor never discards the draft's text on its own.
  blueprints-client: >-
    `src/api/blueprints.ts` exports `fetchBlueprints()`,
    `fetchBlueprintSource(path)`, `lintBlueprintText(path, text, signal)`,
    and `saveBlueprint(request)`. Each sends its request without
    authentication headers, with `Content-Type: application/json` for a
    body, and turns the answer into a result: `ok` with the body, a typed
    `conflict`, `invalid`, or `failed` with the API's message, or `failed`
    with a generic message for a network error or a body that does not
    match. The mapping from a status and a body to a result is a pure
    function, and each body is checked at this boundary with the guards of
    `@wyrd-company/manifold-shared/blueprints-api`. Reads go through
    TanStack Query as the Actors screen's do; lint and save are mutations,
    never cached.
  blueprints-endpoints: >-
    `mountBlueprintsApi(host, options)` mounts one listener at
    `/api/blueprints` that implements `blueprints-api`, with the paths
    `""` (the list), `/source`, `/lint`, and `/save` under the prefix. The
    list reads `revisions.latest()` and the repository's files under
    `blueprints/` at its commit through `processRepository.revisionAt`. A
    path with a repository file is a `repository` item, with
    `replacesBundled` when the bundle holds the path too; a bundled path
    with no repository file is a `bundled` item with the bundle's digest.
    Each path that the load holds in `blueprints` is `loaded` with its
    warnings counted and its document's `description`, and each in
    `failures` is `invalid` with its findings and warnings counted apart; a
    bundled path the load does not hold takes its status and counts from
    the lint of its text. It counts active actors per path from
    `store.activeSnapshots()` with the blueprint version key parser, which
    reads both `<commit>:<path>` and `<commit>:<path>@<bundle-digest>`.
    Source reads the repository file at the latest commit, or the bundled
    text when the revision holds no file at the path, and lints it. Every lint, of source, lint, and save, calls
    `lintBlueprint(path, text, manifoldImplementationNames, {
    configurationBound })` with `blueprintLint.configurationBound`, then
    `findingRanges` and `blueprintGraph`, so the endpoint answers what the
    loader and the host CLI report. A save lints first, answers `422` for a
    finding, and otherwise awaits `revisions.save` and maps its result to
    the answer: `saved`, `already-saved`, and `unchanged` to `200` with the
    path's list item from the result's load, `conflict` to `409` with its reason,
    `ProcessRepositorySaveError` and `ProcessRepositoryPullError` to `502`
    with their kind (a pull error of kind `authentication` as
    `authentication`, `branch-missing` and `incomplete` as `remote`), a
    follower that is closed to `503`. Bodies are read up to 8 MiB, the
    usage endpoint's limit. The request checks of `blueprints-api` run
    before a body is read: method, `Content-Type`, then `Origin` and
    `Sec-Fetch-Site`. Any other error answers `500`, and goes to `log`
    with the path.
  blueprint-graph: >-
    `blueprintGraph(text)` in `packages/shared` returns the graph of
    `blueprints-api`, or `undefined` when the text does not parse as a
    blueprint document or its machine does not resolve. It parses the text
    as `lintBlueprint` does, validates the shape, builds the machine with
    XState's `createMachine` over a stub for every referenced name, as the
    lint does, and walks the state nodes depth first in document order.
    It reads each transition's targets from XState's resolved transition,
    so a sibling key, a `.child`, and a `#id` target resolve as they run.
    `after` transitions are labelled with their delay as written, and
    `onDone` and `onError` of an invoke with the invoke's id. It is pure.
    It validates the shape with a validator generated from the blueprint
    schema assets at build time by Ajv's standalone code generation, so it
    compiles no code at run time, and the subpath export `./blueprint-graph`
    serves it to the console with `findingRanges`, holding no lint, under
    the console's Content Security Policy. The service and the console run
    the same function. This is the one part of the blueprint check the
    browser runs, as `lint-console-edits-on-the-service` records: the lint
    stays on the service, and the console's bundle carries XState and the
    `yaml` package for the graph, and no lint and no schema compiler.
  finding-ranges: >-
    `findingRanges(text, findings)` in `packages/shared` returns each
    finding with the `range` of `blueprints-api`. It parses the text once
    with the `yaml` package's document model and a `LineCounter`, walks
    each JSON Pointer through the document's nodes, and reads the node's
    `range`; for a `yaml` finding it converts its line and column. It is
    pure, and `blueprintGraph` uses it for each state's range.
  bundled-blueprints: >-
    Manifold's bundle is the set of blueprints compiled into the service
    as a generated module, with one digest, as the default process design
    specifies. Each bundled blueprint has an ordinary blueprint path, such
    as `blueprints/task.yml`, and a repository file at that path replaces
    it, even when the file fails lint. Its version key is
    `<commit>:<path>@<bundle-digest>`. `BlueprintsApiOptions.bundle` is the
    bundle's digest and its blueprints by path and text, and the service
    passes the bundle module's export. A bundled
    blueprint is listed, read, and linted as a repository blueprint is,
    and a save of its path adds the repository file that replaces it.
  blueprints-public-interface: |-
    `packages/service/src/blueprints-api/index.ts` exports exactly these
    names.

    ```ts
    import type { HttpHost } from "../http-host/index.ts";
    import type { Store } from "../store/index.ts";
    import type { ProcessRepository } from "../process-repository/index.ts";
    import type { Revisions } from "../service/index.ts";

    export interface BlueprintsApiOptions {
      readonly revisions: Pick<Revisions, "latest" | "save">;
      readonly processRepository: Pick<ProcessRepository, "revisionAt">;
      readonly store: Pick<Store, "activeSnapshots">;
      /** The followed repository, for the list and the publish dialog. */
      readonly repository: { readonly url: string; readonly branch: string };
      /** `blueprintLint.configurationBound`. */
      readonly configurationBound: number;
      /** The blueprints Manifold bundles. */
      readonly bundle: BlueprintBundle;
      readonly log: (entry: { level: "error"; path: string; error: string }) => void;
    }

    export interface BlueprintBundle {
      /** The digest a bundled version key carries after `@`. */
      readonly digest: string;
      /** Each bundled blueprint's text by its path. */
      readonly blueprints: ReadonlyMap<string, string>;
    }

    /** Mounts the blueprints endpoints at `/api/blueprints`. */
    export function mountBlueprintsApi(host: HttpHost, options: BlueprintsApiOptions): void;
    ```

    `@wyrd-company/manifold-shared` exports `blueprintGraph`,
    `findingRanges`, and their types from its root, and adds the subpath
    export `./blueprints-api`, which holds no lint and no YAML parser so
    the console's bundle stays small: the paths, the request and response
    types of `blueprints-api`, and a guard for each response.

    ```ts
    export const blueprintsApiPath = "/api/blueprints";

    export interface FindingRange {
      readonly from: number;
      readonly to: number;
      readonly line: number;
      readonly column: number;
    }

    export interface ApiFinding {
      readonly kind: string;
      readonly location: string;
      readonly message: string;
      readonly range?: FindingRange;
      readonly [detail: string]: unknown;
    }

    export interface BlueprintGraph {
      readonly states: readonly GraphState[];
      readonly transitions: readonly GraphTransition[];
    }

    export interface GraphState {
      readonly path: string;
      readonly key: string;
      readonly parent?: string;
      readonly type: "atomic" | "compound" | "parallel" | "final" | "history";
      readonly initial: boolean;
      readonly invokes: readonly string[];
      readonly gated: boolean;
      readonly location: string;
      readonly range?: FindingRange;
    }

    export interface GraphTransition {
      readonly source: string;
      readonly target?: string;
      readonly trigger: "event" | "always" | "after" | "done" | "error";
      readonly label: string;
      readonly guarded: boolean;
      readonly location: string;
    }

    export interface BlueprintItem {
      readonly path: string;
      readonly source: "repository" | "bundled";
      readonly commit?: string;
      readonly bundle?: string;
      readonly replacesBundled?: true;
      readonly status: "loaded" | "invalid";
      readonly findings: number;
      readonly warnings: number;
      readonly description?: string;
      readonly activeActors: number;
    }

    export interface BlueprintsResponse {
      readonly repository: { readonly url: string; readonly branch: string };
      readonly commit?: string;
      readonly blueprints: readonly BlueprintItem[];
    }

    export interface BlueprintSourceResponse {
      readonly path: string;
      readonly source: "repository" | "bundled";
      readonly commit?: string;
      readonly bundle?: string;
      readonly text: string;
      readonly findings: readonly ApiFinding[];
      readonly warnings: readonly ApiFinding[];
      readonly graph?: BlueprintGraph;
    }

    export interface LintResponse {
      readonly findings: readonly ApiFinding[];
      readonly warnings: readonly ApiFinding[];
      readonly graph?: BlueprintGraph;
    }

    export interface SaveBlueprintRequest {
      readonly path: string;
      readonly base: string;
      readonly text: string;
      readonly message: string;
      readonly saveId: string;
    }

    export interface SaveBlueprintResponse {
      readonly outcome: "saved" | "already-saved" | "unchanged";
      readonly commit: string;
      readonly blueprint?: BlueprintItem;
    }

    export interface SaveConflictResponse {
      readonly error: "conflict";
      readonly message: string;
      readonly reason: "file-changed" | "branch-moved";
      readonly head: string;
      readonly text?: string;
    }

    export function isBlueprintsResponse(value: unknown): value is BlueprintsResponse;
    export function isBlueprintSourceResponse(value: unknown): value is BlueprintSourceResponse;
    export function isLintResponse(value: unknown): value is LintResponse;
    export function isSaveBlueprintResponse(value: unknown): value is SaveBlueprintResponse;
    export function isSaveConflictResponse(value: unknown): value is SaveConflictResponse;
    ```
  blueprints-module-layout: >-
    In `packages/service/src/blueprints-api/`, `index.ts` re-exports the
    public names and nothing else, `listener.ts` holds the routing and
    request checks, `answers.ts` the pure functions from a load, a lint, or
    a save result to an answer, and `request-checks.ts` the pure
    cross-site, type, and shape checks. In `packages/console`,
    `src/screens/blueprints/` holds `BlueprintsList.tsx`,
    `BlueprintEditor.tsx`, `YamlView.tsx`, `ProblemsStrip.tsx`,
    `PublishDialog.tsx`, `DiscardDialog.tsx`, `ConflictAlert.tsx`, and the
    pure modules `draft.ts`, `blueprint-edits.ts`, `canvas-history.ts`,
    `inspector-model.ts`, and
    `problems.ts`; `canvas/` holds `BlueprintCanvas.tsx`,
    `CanvasToolbar.tsx`, `StateNode.tsx`, `GroupNode.tsx`,
    `HistoryNode.tsx`, `InitialNode.tsx`, `TransitionEdge.tsx`,
    `EventPicker.tsx`, and the pure `canvas-layout.ts`; and `inspector/`
    holds `Inspector.tsx`, one component per inspector kind, and the field
    components. `src/screens/BlueprintsContent.tsx` switches between the
    list and the
    editor. The `blueprints-api` wiring part calls `mountBlueprintsApi`
    before the host listens, as `service-assembly` states.
    The canvas changes no service code: the blueprints endpoints and the HTTP
    host's request checks they use are unchanged. The editor calls the
    draft functions and `PublishDialog` with their blueprint defaults, the
    draft key prefix `manifold.blueprint-draft.` and the dialog's title,
    width, and file list, so drafts written before the canvas open as
    they are.
  implementation-catalog: |-
    `packages/shared/src/implementation-catalog.ts` is the one list of the
    implementations Manifold's service registers, and the subpath export
    `./implementation-catalog` serves it with no schema compiler. Each
    entry holds the name, its kind, a group for the inspector, a
    one-sentence description, the event types an action raises, and,
    where a specification defines them, the JSON Schemas of an actor's
    input and output or of an action's or guard's parameters, taken from
    that specification's schema asset. `manifoldImplementationNames` is
    derived from the catalog and the agent tool event types, with its
    export and shape unchanged, so a name added to the service is added
    once, as a catalog entry. The console reads the catalog from the build
    it is served by, so it names what the service registers.

    ```ts
    export type ImplementationKind = "actor" | "action" | "guard" | "delay";

    export interface ImplementationEntry {
      readonly name: string;
      readonly kind: ImplementationKind;
      /** The inspector's group, such as "Thread", "Task", or "People". */
      readonly group: string;
      /** One sentence. */
      readonly description: string;
      /** Event types an action raises. */
      readonly raises?: readonly string[];
      /** An actor's input and output schemas. */
      readonly input?: object;
      readonly output?: object;
      /** An action's or guard's `params` schema. */
      readonly params?: object;
    }

    export const manifoldImplementationCatalog: readonly ImplementationEntry[];
    ```
  projects-routes: >-
    GitHub Projects has two routes: `projects`, the list, and
    `projects/$binding`, a Project's page, whose segment is the binding
    name. Both render `ProjectsContent`, which shows the list or the page
    by route, and the sidebar keeps GitHub Projects selected. The
    breadcrumb shows "GitHub Projects / <binding>" on a Project's page.
    Settings, Task fields keeps its route `settings/task-fields`, now
    rendering the Task fields editor. The navigation entries, labels, and
    descriptions are unchanged.
  projects-client: >-
    `src/api/projects.ts` exports `fetchProjects()`,
    `fetchProjectPlan(binding)`, and `applyProject(binding,
    removeUndeclared, digest)`, which send `GET /api/projects`, `GET
    /api/projects/{binding}/plan`, and `POST /api/projects/{binding}/apply`
    with `{ removeUndeclared, digest }`, the binding percent-encoded and
    `digest` the reviewed plan's digest, as `projects-api` specifies them.
    Each turns the answer into a result: `ok` with the body; `missing` for
    `404` of kind `unknown-binding`; `unresolved` for `409` of kind
    `unresolved-project`; for an Apply, `stale` for `409` of kind
    `plan-stale`, `invalid` for `409` of kind `declaration-invalid`,
    `pending` with the error's optional `commit` for `409` of kind
    `declaration-pending`, and `failed` with the error's kind and message,
    its `writes`, and each change's outcome for `502`, of kind
    `declaration-unsaved` or a GitHub write's kind; and `failed` with the
    error's `message` for any other error, or a generic message for a network
    error or a body that does not validate. Each mapping is a pure
    function, and each body is checked at this boundary with
    dependency-free guards in the same module, which a console test checks
    against `projects-api.openapi.yml` with fixtures that pass and fail.
    The console reads these members, with the types and optionality of
    `projects-api.openapi.yml`: a list entry's `binding`, `owner`,
    `number`, `portfolioItem`, `environment`, `configuration` (`state`,
    `in-sync` or `not-applied` alone, or `drift` or `pending` with
    `count`), and `lastApplied`, `null` or `{ at, commit }`; a plan's
    `configuration`, `observation` (`{ status: "fresh" }` or `{ status:
    "stale", message }`), `observedAt`, an integer or `null`, `digest`,
    and `changes`, each change with its `id`, `storage`, `description`,
    `target` (`field` and `lifecycle`, with `option` and `taskField` when
    present), `action`, `side`, `drift`, and `requiresRemoval`; an
    Apply's `outcome`, `writes`, `configuration`, and each change's
    `outcome`; and an error's `kind`, `message`, and, for
    `declaration-pending`, `commit` when present. Reads go through TanStack Query under the keys
    `["projects"]` and `["project-plan", binding]`. An Apply is a mutation;
    when it settles it marks both keys and `["tasks"]` stale. No timer
    reads on a schedule.
  declarations-client: >-
    `src/api/declarations.ts` exports
    `fetchDeclarationSource(path)`, `lintDeclarationText(path, text,
    signal)`, `saveDeclaration(request)`, `editTaskFields(request)`,
    `fetchBindings()`, and `saveBinding(request)`, for the endpoints of
    `declarations-api`. Each
    sends its request without authentication headers, with `Content-Type:
    application/json` for a body, and turns the answer into a result as
    the blueprints client does: `ok` with the body, a typed `conflict` or
    `invalid`, or `failed` with the API's message or a generic message.
    Each mapping is a pure function, and each body is checked at this
    boundary with the guards of
    `@wyrd-company/manifold-shared/declarations-api`. Reads go through
    TanStack Query under `["declaration", path]` and `["bindings"]`; lint,
    field edits, and saves are mutations, never cached. A settled binding save marks
    `["bindings"]`, `["projects"]`, and `["tasks"]` stale, and a settled
    declaration save marks its path's key and `["projects"]` stale.
  projects-list: >-
    `ProjectsContent` on `projects` reads `fetchProjects()`,
    `fetchTasks()`, and `fetchBindings()`. Its title row is "GitHub
    Projects" with its description, "Task fields" (ghost, a link to
    `settings/task-fields`), and "Bind a Project" (primary). Under it, one
    row holds the Project count, right-aligned, and a ghost "Refresh" icon
    button that reads all three again. The table's columns, in percent
    widths, are Project (26), Portfolio item (16), Active cards (10),
    Completed cards (10), Environment (14), Configuration (12), and an
    action (12). Project is `<owner>/<number>` in mono. Portfolio item is
    the title of the entry's `portfolioItem` from the bindings read, or
    its id. Active cards and
    Completed cards count the tasks of the binding in the tasks list whose
    issue is open and closed, or show a muted dash when the tasks read
    failed or does not list the binding. Environment is in mono.
    Configuration is the badge `DESIGN.md` gives: "In sync" (success),
    "Drift · N" (warning), "Pending · N" (info), or "Not applied" (info). The action is "View"
    (outline) for `in-sync` and "Review changes" (outline) otherwise, and
    opens the Project's page. Rows follow the API's order. With no bound
    Project, the table is replaced by the empty state "No bound Projects",
    "Bind a GitHub Project to keep its fields in step with the task
    fields." A failed read of the list shows an error alert with the
    message and "Try again". The pure function `projectRows(projects,
    tasks, bindings)` in `src/screens/projects/rows.ts` builds the rows.
  t3code-projects-table: >-
    Under the Projects table, the heading "T3code projects" has "Bind a
    T3code project" (outline) on its right. The table lists each T3code
    project binding that is not archived, then each T3code project id
    that a GitHub Project binding that is not archived associates, ordered
    by environment, then by title, then by id. Columns, in percent widths:
    T3code project (34), Environment (16), Portfolio item (30), Active
    threads (12), and an Edit icon button (8). T3code project is the
    title over the workspace root, both in mono, from the environment's
    projects in the bindings read; the id in mono when that environment's
    projects are not known; and the id with the muted line "Not found on
    <environment>" when they are known and do not hold it. Portfolio item
    is the binding's item; for an associated project it is the GitHub
    Project binding's item with "Associated with `<owner>/<number>`" muted
    under it, and the row has no Edit button. Active threads is the count,
    or a muted dash when not known. With no row, the table is replaced by
    the empty state "No T3code projects bound", "Bind a T3code project, or
    associate one with a bound Project." The pure function
    `t3codeRows(bindings)` in `rows.ts` builds the rows.
  bind-project: >-
    "Bind a Project" opens `BindProjectDialog`, 480px, over the bindings
    read. Its fields, in order: Project, a text field that takes
    `<owner>/<number>` or the Project's URL on GitHub,
    `https://github.com/orgs/<owner>/projects/<number>` or
    `https://github.com/users/<owner>/projects/<number>` with any further
    path, query, or fragment, read by the pure `parseProjectReference`;
    Name, the binding name, prefilled by the pure `bindingName(owner,
    number)` until the operator edits it: the lower-case owner with each
    run of other characters than `a`–`z` and `0`–`9` as one `-`, then
    `-<number>`, with `project-` before it when it does not start with a
    letter, cut to 64 characters; Environment, a select of the
    environments, the first one chosen; Portfolio item, a select of the
    items by title with the id muted; and "Associate existing T3code
    projects", one checkbox per T3code project of the chosen environment
    that no binding holds, its title and workspace root in mono, or the
    muted line "Manifold has not read the projects of <environment> yet."
    when they are not known. Under the fields, the warning note: "Manifold
    takes control of the fields of this Project that the task fields
    declare, and of their options.
    Nothing changes on GitHub until you apply." and the checkbox "I
    understand". The dialog associates existing T3code projects and
    creates none. "Bind and review changes"
    (primary) is enabled when "I understand" is checked and Project
    parses. It sends `saveBinding` with a `github-project` edit in mode
    `add`, the bindings read's commit as `base`, the message "Bind
    <owner>/<number> as <name>", and a `saveId` from `createSaveId`, set
    when the values are first sent and kept while the values and the base
    stay the same, so a retry of the same request pushes once. The button
    shows a spinner and the dialog cannot close while the request runs.
    For `200` with `loaded`, the dialog closes and the Project's page
    opens, where the Project is "Not applied" and its first Apply waits
    for the operator. For `200` without `loaded`, the dialog shows the
    info alert "Saved as <short commit>. The service has not loaded it
    yet." with "Close". For `422`, each finding shows under the field its
    location names, by the member after `/githubProjects/<name>`: `owner`
    and `number` under Project, `environment`, `item`, and
    `t3codeProjects` under theirs, and the binding's entry, `name-taken`
    included, under Name; any other finding shows in an error alert at the
    top of the dialog. For `409`, the error alert reads "bindings.yml
    changed on <branch> at <short head>. Your values are kept.", the
    dialog reads the bindings again, and the next send uses the new commit
    as its base. For `502`, `503`, or a network failure, the error alert
    shows the message and "Try again" sends the same request. Every value
    stays in the dialog through every failure.
  bind-t3code-project: >-
    "Bind a T3code project" and a row's Edit open
    `BindT3codeProjectDialog`, 440px. Its fields: Environment, a select;
    T3code project, a select of the environment's T3code projects that no
    other binding holds, each its title over its workspace root in mono,
    disabled with the muted line of the bind dialog when they are not
    known, and keeping the edited binding's id as a choice; Name,
    prefilled from the project's title as `bindingName` slugs an owner,
    without the number, and read only on Edit; and Portfolio item. The
    primary button is "Bind", or "Save" on Edit. It sends a
    `t3code-project` edit, mode `add` from Bind and `replace` from Edit,
    with the message "Bind T3code project <title> as <name>" or "Update
    T3code project binding <name>", and handles each answer as the bind
    dialog does, closing on `200`.
  associate: >-
    A Project's page's "Associate existing" opens `AssociateDialog`, 440px:
    one checkbox per T3code project of the binding's environment that no
    other binding holds, with the binding's associated ids checked, and
    "Save" (primary). It sends a `github-project` edit in mode `replace`
    with the binding's members from the bindings read and the checked ids
    as `t3codeProjects`, and the message "Associate T3code projects with
    <name>", and handles each answer as the bind dialog does.
  project-page: >-
    `ProjectPage`, under `src/screens/projects/`, is the content of
    `projects/$binding`. It reads `fetchProjects()` for the Project's
    entry, `fetchProjectPlan(binding)`, `fetchBindings()`, and
    `fetchDeclarationSource("task-metadata.yml")` for the task fields
    version. The header holds the "All Projects" back link;
    `<owner>/<number>` in mono; the Configuration badge; and a meta line
    with the portfolio item, the environment in mono, "Task fields <short
    commit>" in mono, and "Applied <time>" from `lastApplied.at`, or
    "Never applied" when it is `null`. On the right are "Task
    fields" (ghost) and the one primary action, "Apply N changes", or
    "Nothing to apply", disabled, when the plan counts no change. Under
    the header, the "T3code projects" card has the count and "Associate
    existing" (outline) in its header and one row per associated T3code
    project, its title and workspace root in mono and its active threads;
    with none, it says "No T3code projects are associated with this
    Project." Then the plan card. A binding the list does not hold, and a
    plan that answers `missing`, show the empty state "Project not bound",
    "No bound Project has the name <binding>.", with a link to All
    Projects. A plan that answers `unresolved` shows the info alert
    "Manifold has not found this Project on GitHub yet." with "Try again"
    in place of the plan card. A plan whose `observation.status` is
    `stale` shows the warning alert "Cannot read this Project from GitHub:
    <observation.message>." above the groups, followed by "The plan uses
    what Manifold read <time of observedAt>." when `observedAt` is not
    `null`. A failed read shows an error alert with the message and "Try
    again".
  plan-card: >-
    The plan card is "What Apply will change", with the switch "Also
    remove what the task fields do not define" in its header, off each
    time the page opens. Its one group is Project fields, the storage kind
    `project-field` of every change; the group's header names where its
    changes apply, "On <owner>/<number>", and sums them: "2 to create · 1
    to change · 1 to remove". A change row has the 18px mark (`+` create
    in success, `~` change in warning, `−` remove in error), the target in
    mono, `field` or `field / option`, with a lock icon for the lifecycle
    field, and the change's `description`; a "Drift" badge when `drift`
    is true; and a "Into task fields" badge when `side` is `declaration`,
    a change Apply makes to `task-metadata.yml`. With the switch off, a
    row whose `requiresRemoval` is true is dimmed with a "Kept" badge and
    does not count. With no change, the card says "Nothing to apply. The
    Project matches the task fields." The pure function
    `planGroups(changes, removeUndeclared)` in
    `src/screens/projects/plan.ts` gives the groups by `storage`, their
    rows and sums, and the count the Apply button names.
  apply: >-
    "Apply N changes" sends `applyProject(binding, removeUndeclared,
    digest)` with the switch's value and the digest of the plan on screen,
    so the service applies only the plan the operator reviewed. With the
    switch on and a change whose `requiresRemoval` is true counted, it
    first opens a 400px alert dialog,
    "Remove from GitHub?": "This Apply also removes N things the task
    fields do not define: <up to five targets>, and M more. Manifold does
    not restore them." with "Cancel" and "Apply and remove" (solid error),
    naming the targets of those changes in the plan on screen. While the request runs, the
    button shows a spinner and the button and the switch are disabled.
    For `ok`, a success toast says "Applied N changes", N being the
    changes whose `outcome` is `applied`, when the answer's `outcome` is
    `applied`, or "Already in sync" when it is `in-sync`; the header's
    badge shows the answer's `configuration` at once, and the list, the
    plan, and the tasks read again. For `stale`, the plan changed after
    the operator reviewed it: the list and the plan read again, the badge
    shows the list's state, and an info alert above the groups reads
    "The plan changed since you reviewed it. Review the changes, then
    apply again." When the new plan counts no change and the state is
    `in-sync`, another channel finished the changes first, and the alert
    reads "Another Apply finished these changes first." with the button at
    "Nothing to apply". The next Apply sends the new plan's digest, and
    asks again before removing, naming the new plan's removals. For
    `missing`, the page shows "Project not bound". For `invalid`, the
    changes into the task fields would give a declaration with a finding,
    and nothing was written: an error alert in the plan card shows the
    message and "Nothing was written. Fix the task fields, or set the
    field to Revert." with a "Task fields" link and no "Try again", since
    the same Apply answers the same. For `pending`, the changes on GitHub
    are made and the change into the task fields is pushed as the commit
    the answer names but is not yet in force: an info alert reads
    "Applied on GitHub. The task fields change is saved as <short commit>
    and not yet in force.", or "…is saved and not yet in force." when the
    error has no `commit`, with "Try again"; the list and the plan read
    again, and "Try again" sends the Apply with the plan read again and
    its digest, which pushes nothing new and completes once the commit is
    in force. For `failed`, an error alert in the plan card shows the
    message, and for a `502` the count of writes made and the change that
    failed, when one did; for `declaration-unsaved` it adds "The change
    into the task fields was not saved." Its "Try again" sends the same
    request with the same digest; the list and the plan read again; an
    Apply converges on the service, so a second send writes only what is
    still to change, and answers `stale` when the plan changed meanwhile.
  task-fields-editor: >-
    `TaskFieldsContent` is the Task fields tab of Settings, its editor
    under `src/screens/task-fields/`. It reads
    `fetchDeclarationSource("task-metadata.yml")`, `fetchProjects()` for
    each binding's `<owner>/<number>`, and `fetchBindings()` for the
    repository, and opens the browser's draft when one exists, or the
    source's text. The section header holds "Task fields", a "Draft · N
    changes" warning badge when the text differs from the base text, the
    description "The fields Manifold keeps on each bound Project's
    tasks.", "Discard draft" (ghost), and "Publish" (primary). A line under
    it holds "Published <short commit>" in mono, `task-metadata.yml` in
    mono, and, when the latest answer has impact, "Changes N bound
    Projects" with "Review impact", which opens the Publish dialog. Under
    it, `SchemaEditor` in storage mode, with the tabs "Visual" and "YAML",
    Visual first, and the Problems strip under both. The YAML tab is the
    Blueprints editor's `SourcePane` over the draft's text, with the path
    `task-metadata.yml`. The Problems strip is the Blueprints
    editor's `ProblemsStrip` with no states, its header showing
    "Checking…" while a lint or an edit is pending. Lint follows the text
    as lint-as-you-type states, through `lintDeclarationText` with the
    same 300 ms wait, abort, and rule that an answer applies only to the
    text it was sent for.
  task-fields-visual: >-
    The Visual tab is the fields table and, on its right, the field panel
    (320px) for the selected field. The table lists the latest answer's
    `fields` grouped by Project, each group row holding the binding name
    and `<owner>/<number>` in mono and "Add field" (ghost) on its right;
    each group lists the lifecycle field first, then the task fields in
    document order. Columns, in percent widths: Field (40), Type (26),
    Stored as (26), and a remove icon button (8, `aria-label` "Remove
    field"). Field is the name, with the 20px lock icon after the
    lifecycle field's name (tooltip and label "Set by Manifold") and a
    red "!" on a row that a finding locates at or under it. Type is a
    select of the types the row's storage kind holds, from
    `storageKinds`, with the row's type kept as a choice; Stored as is a
    select of the storage kinds, Project field being the one. A finding
    at the field's type or storage gives both selects a red border. The
    lifecycle field's name, Type, and Stored as are disabled, and it has
    no remove button. Selecting a row selects it in the field panel and
    moves the YAML cursor to the start of its range; moving the YAML
    cursor into a field's range selects its row. The field panel shows
    the field's name, as a text field; "Stored as", with the line "Can
    hold <type>" in success text or "Cannot hold <type>" in error text;
    the storage kind's settings from `storageKinds`, each a text field:
    for a Project field, "Project field name", with the field's name as
    its placeholder; the options, for a single-select field, each a text
    field with a remove button and "Add option" under them; what exists
    on GitHub for it, from the row's `onGitHub`: "On GitHub", "Missing on
    GitHub", or "Differs on GitHub" with its detail, or "Not read from
    GitHub yet"; its scope, "On <owner>/<number>"; and, for a task field,
    "When changed on GitHub", a two-option segmented control, Revert or
    Accept, Revert when the row has no `whenChanged`. The lifecycle field
    has no "When changed on GitHub": its drift is always reverted. With no
    task field, a group holds its lifecycle field alone; with no Project,
    the table shows the empty state "No task fields", "Declare a bound
    Project in task-metadata.yml to add its fields." While the latest
    answer has no `fields`, because the text does not parse, the tab
    keeps the last fields, dimmed and disabled, with the muted line "Fix
    the YAML to edit fields here."
  task-field-edits: >-
    A change in the Visual tab is a field edit of the draft's text, made
    on the service. A select, the segmented control, "Add field", "Add
    option", and a remove button send at once; a text field
    sends when it loses focus or on Enter, when its value changed. Each
    sends `editTaskFields({ text, edit })` with the draft's text and one
    edit of `declarations-api`: `add-field` with the binding, `set-field`
    with the field's location and the changed values, or `remove-field`
    with the location. While it runs, the table and the panel are
    disabled. A `200` answer whose request text is still the draft's text
    becomes the draft's text, as a change in the YAML tab does, and its
    findings, fields, and impact are the latest answer; the row at the
    answer's `location` is selected, so "Add field" selects the new
    field. An answer for another text is dropped and the control shows
    the latest answer's value. A `422` shows its findings in the Problems
    strip and the control returns to the latest answer's value. A failed
    request shows "Cannot apply this change. Try again." in the Problems
    header with "Try again", which sends the same request. The pure
    functions `fieldGroups(fields, projects)`, `fieldAtCursor(cursor,
    fields)`, `rowFindings(fields, findings)`, and `fieldScope(field,
    project)` in `src/screens/task-fields/fields.ts` give the groups, the
    row at a cursor, the "!" rows and red selects, and the scope line.
  task-fields-drafts: >-
    A Task fields draft is a draft as blueprint-drafts states, kept under
    `manifold.declaration-draft.task-metadata.yml`, with the same pending
    save, settle, conflict, "Use latest as base", Compare, and discard
    rules; a save answer's `loaded` stands where the blueprint answer's
    `blueprint` stands. `readDraft` and `writeDraft` in
    `src/screens/blueprints/draft.ts` take the key prefix as an optional
    last argument whose default is the blueprint prefix, so the
    Blueprints editor's calls stay as they are. A revision that holds no
    `task-metadata.yml` gives the base text `""`, and its publish adds the
    file.
  task-fields-publish: >-
    "Publish" is enabled when the text differs from the base text, the
    latest lint answer is for the text on screen, and it has no finding.
    It opens the Blueprints editor's `PublishDialog`, which takes an
    optional `title`, `width`, and `children` shown between the file and
    the message, with defaults that keep the blueprint dialog as it is.
    Here the title is "Publish task fields"; the file is
    `task-metadata.yml` with `A` or `M`; the message is prefilled with
    "Update task fields", or "Add task fields" for `A`; and with bound
    Projects the dialog is 660px and holds the impact table: Project (the
    binding over `<owner>/<number>`), Creates, Changes, and Removes, right
    aligned in tabular figures, and After Publish: "Nothing to apply" when
    it counts no create or change, "Apply N changes on its page", N being
    its creates and changes, otherwise, and "Not read from GitHub yet"
    for an entry with no counts. A caption says "Publishing changes no
    Project. Removals happen only when an Apply asks for them." "Commit
    and push" sends `saveDeclaration` with the draft's `saveId` rule of
    publish, and each answer is handled as publish states for a
    blueprint, with `loaded` in place of `blueprint`: a toast, then the
    source read that settles the draft, so the published commit and the
    new fields show as the declaration in force.
  declarations-endpoints: >-
    `mountDeclarationsApi(host, options)` mounts one listener at
    `/api/declarations` that implements `declarations-api`, with the paths
    `/source`, `/lint`, `/save`, `/task-fields/edit`, `/bindings`, and
    `/bindings/save` under the prefix. Every read takes the commit of `revisions.latest()` and
    reads files at it through `processRepository.revisionAt`, and answers
    `503` before the first. `task-metadata.yml` lints with
    `lintTaskMetadataDeclaration` and `bindings.yml` at that commit;
    `bindings.yml` lints with `lintPortfolioDeclaration` and
    `portfolio.yml` at that commit, keeping the findings whose `file` is
    `bindings`; `portfolio.yml` lints with `lintPortfolioDeclaration` and
    `bindings.yml` at that commit, keeping the findings of both files with
    their `file`, and with `lintAllocatedAccounts` and `accounts.yml` at
    that commit for its warnings. `findingRanges` gives each finding of
    the edited file its range; its parameter takes any finding with
    `kind`, `location`, and `message`. A task metadata text that parses
    answers `fields` from the pure `taskFieldRows(text)`, which reads the
    rows from the document, and `storageKinds` from `taskFieldStorageKinds`;
    a clean one answers `impact` from `options.planDeclaration`, one entry
    per GitHub Project binding that is not archived, with the counts of
    its changes by `action` and no counts when it answers none for the
    binding, and each row's `onGitHub` from the entry's field status
    whose `taskField` is the row's name, or, for the lifecycle field's
    row, the status with `lifecycle` true and no `taskField`. A field edit applies `editTaskFields` and answers as a
    lint of the result. A save lints first and answers `422` for a
    finding, then awaits `revisions.save` and maps its result as the
    blueprints endpoint's `saveAnswer` does, with `loaded` true when the
    result carries the latest load. The bindings read parses
    `bindings.yml` and `portfolio.yml` at the commit through their lint,
    lists the items from the portfolio's declaration, and lists each name
    of `options.environments` with `options.t3codeProjects(name)`. A
    binding save reads `bindings.yml` at `base`, answering `400` when
    `revisionAt(base)` holds no revision, applies `editBindings`, and
    saves the result as a save of `bindings.yml`. `Revisions.save` takes
    any path, so the listener's path check is what keeps every save to the
    three declaration paths. The same-site and
    content-type checks are the blueprints endpoints'; they move from
    `blueprints-api/request-checks.ts` to
    `http-host/request-checks.ts`, which both listeners import, and the
    blueprint shape checks stay where they are. Bodies are read up to
    8 MiB. Any other error answers `500`, and goes to `log` with the
    path.
  binding-edit: >-
    `editBindings(text, edit)` in `declarations-api/binding-edit.ts` is
    pure. It parses the text with the `yaml` package's `parseDocument`,
    version 1.2, as the declaration lint does; an empty or absent text is
    an empty document. For `add`, it answers the `name-taken` finding when
    either section holds the name, and otherwise sets the binding at the
    end of its section, adding the section, after any other, when absent.
    For `replace`, it answers the `name-missing` finding when the edit's
    section does not hold the name, and otherwise sets each member the
    edit names on the binding's mapping, keeping its other members and
    its place. An empty `t3codeProjects` deletes the key. It writes the
    document with `toString({ lineWidth: 0 })`, so comments stay, and a
    file in the block style the `yaml` package writes keeps every other
    line unchanged. A text that does not parse gives its `syntax` finding
    and no edit.
  task-field-edit: >-
    `editTaskFields(text, edit)` in `declarations-api/task-field-edit.ts`
    is pure. It parses the text as `editBindings` does and writes the
    members `task-metadata-declaration` gives a task field. `add-field`
    adds, at the end of the binding's `fields`, a `text` field named
    `field-<n>`, the lowest `n` from 1 that no field of the binding uses,
    with no `storage`, so it is stored as the Project field of its name,
    adding the `fields` mapping when absent. `set-field` sets each value
    the edit names on the field at the location and keeps its other
    members and its place: `name` renames the field's key; `storage`
    writes the `storage` mapping, removing the settings the new kind does
    not take; `options` writes the option names in order, keeping the
    other members of each option whose name stays, and of the one option
    renamed in place; and a `type` other than `single-select` removes
    `options`. On the lifecycle field, `name` sets `lifecycle.field` and
    `options` sets `lifecycle.options`. `remove-field` deletes the field's
    entry. It refuses, with no change, a text that does not parse, a
    location that names no field (`field-missing`), and a change of the
    lifecycle field's type, storage, or `whenChanged`, or its removal
    (`field-locked`). It writes the document as `editBindings` does and
    answers the edited field's location.
  declarations-public-interface: |-
    `packages/service/src/declarations-api/index.ts` exports exactly these
    names.

    ```ts
    import type { HttpHost } from "../http-host/index.ts";
    import type { ProcessRepository } from "../process-repository/index.ts";
    import type { Revisions } from "../service/index.ts";
    import type { TaskMetadataDeclaration } from "@wyrd-company/manifold-shared";

    export interface DeclarationsApiOptions {
      readonly revisions: Pick<Revisions, "latest" | "save">;
      readonly processRepository: Pick<ProcessRepository, "revisionAt">;
      /** The followed repository, for the publish dialogs. */
      readonly repository: { readonly url: string; readonly branch: string };
      /** The environment names of service configuration, in its order. */
      readonly environments: readonly string[];
      /** The T3 Code source's `projects`. */
      t3codeProjects(environment: string): readonly DeclarationsT3codeProject[] | undefined;
      /** The task-metadata module's planner over a declaration that is not in force. */
      planDeclaration(declaration: TaskMetadataDeclaration): readonly DeclarationImpact[];
      readonly log: (entry: { level: "error"; path: string; error: string }) => void;
    }

    export interface DeclarationsT3codeProject {
      readonly id: string;
      readonly title: string;
      readonly workspaceRoot: string;
      readonly activeThreads: number;
    }

    /** The members read of the task-metadata module's `DeclarationImpact`; a Project not yet read from GitHub has no entry. */
    export interface DeclarationImpact {
      readonly binding: string;
      readonly changes: readonly { readonly action: "create" | "change" | "remove" }[];
      readonly fields: readonly {
        /** Absent for the lifecycle field. */
        readonly taskField?: string;
        readonly lifecycle: boolean;
        readonly github: "present" | "missing" | "differs";
        readonly detail: string;
      }[];
    }

    /** Mounts the declarations endpoints at `/api/declarations`. */
    export function mountDeclarationsApi(host: HttpHost, options: DeclarationsApiOptions): void;
    ```

    `DeclarationsT3codeProject` is the T3 Code source's `T3CodeProjectView`
    declared structurally, so the source satisfies it and a test passes
    fixtures. `@wyrd-company/manifold-shared` adds the subpath export
    `./declarations-api`, which holds no lint and no YAML parser:
    `declarationsApiPath` (`/api/declarations`), the request and response
    types of `declarations-api`, and a dependency-free guard for each
    response, which a shared test checks against the OpenAPI definition
    with fixtures that pass and fail.
  declarations-wiring: >-
    The declarations API joins the service through its wiring part,
    `packages/service/src/declarations-api/wiring.ts`, a service wiring
    part `{ name: "declarations-api", start(members, context) }` chained
    after the task-metadata module's part and not exported from the
    module's index. Its start calls `mountDeclarationsApi` on
    `members.http` with the revision follower, the process repository,
    the configured repository URL and branch, the environment names of
    service configuration, the T3 Code source's `projects`, and the
    task-metadata module's planner as `planDeclaration`. It registers no
    `context.onStop`, since it opens nothing that stop closes; the HTTP
    host closes its listeners in the `requests` stage.
  declarations-module-layout: >-
    In `packages/service/src/declarations-api/`, `index.ts` re-exports the
    public names and nothing else, `listener.ts` holds the routing and
    request checks, `answers.ts` the pure functions from a lint, a save,
    or a read to an answer, `binding-edit.ts` `editBindings`,
    `task-field-edit.ts` `editTaskFields`, `task-fields.ts`
    `taskFieldRows`, and `wiring.ts` the wiring part. In
    `packages/console`, `src/screens/projects/` holds `ProjectsList.tsx`,
    `T3codeProjectsTable.tsx`, `ProjectPage.tsx`, `PlanCard.tsx`,
    `RemoveDialog.tsx`, `BindProjectDialog.tsx`,
    `BindT3codeProjectDialog.tsx`, `AssociateDialog.tsx`, and the pure
    modules `rows.ts`, `plan.ts`, and `binding-names.ts`
    (`parseProjectReference` and `bindingName`); `src/screens/task-fields/`
    holds `TaskFieldsEditor.tsx`, `SchemaEditor.tsx`, `FieldsTable.tsx`,
    `FieldPanel.tsx`, `ImpactTable.tsx`, and the pure module `fields.ts`. `ProjectsContent.tsx` switches between
    the list and the page, and `TaskFieldsContent.tsx` renders the editor.
    The router adds `projects/$binding`.
  projects-convergence: >-
    A declaration save and a binding save converge as the blueprint save:
    a retry with the same `saveId` answers `already-saved` or pushes the
    change once, and a crash after the push and before the answer leaves
    the commit, which the retry finds by its trailer. A bind dialog keeps
    its `saveId` while its values and base stay, so a lost answer is
    retried as the same save; an operator who closes the dialog and binds
    the same name again gets `name-taken`, and the binding is in the list.
    A binding save that runs twice from two dialogs with other values
    commits the first; the second finds `bindings.yml` changed and answers
    `409`, or `name-taken` after it reads again. An Apply converges on the
    service as the Project configuration API states; a resend after a
    lost answer makes only the writes still to make and answers the
    state, or `stale` when the plan changed, so no Apply runs a plan the
    operator has not seen. A field edit only computes a text; the draft
    holds its result, written whole.
    Source, lint, and the bindings read only read. The browser's one new
    write is the Task fields draft, written whole on each change.
  projects-tests: >-
    Each behavior is red before green, and tests go through public
    interfaces. The declarations endpoints are tested as
    `declarations-api`'s validation criteria state, `editBindings`,
    `editTaskFields`, and `taskFieldRows` through them. In
    `packages/console`, unit tests cover the projects and declarations
    result mappings, the `plan-stale`, `declaration-invalid`,
    `declaration-pending`, and `declaration-unsaved` answers included; `projectRows` and
    `t3codeRows`, with an associated project, a project the environment
    does not hold, and an unknown environment; `planGroups` with the
    switch off and on, a drift change, a change that requires removal,
    and a declaration-side change;
    `parseProjectReference` and `bindingName`; `fieldGroups`,
    `fieldAtCursor`, `rowFindings`, and `fieldScope`; and `readDraft` and
    `writeDraft` with the Task fields prefix beside a blueprint draft of a
    like name. The browser test,
    `packages/service/src/declarations-api/projects.browser.test.ts`,
    starts the production HTTP host with the built console, the console,
    tasks, and declarations mounts, and the task-metadata module's Project
    configuration API over the GitHub fake its own tests use, on a fixture
    process repository served over smart HTTP with push enabled and a
    bound Project in drift. It opens GitHub Projects and reads "Drift · 2"
    and the card counts; opens "Review changes" and reads the groups with
    a "Drift" badge and a "Kept" removal; turns the switch on, and while
    the confirmation is open a change made on the GitHub fake adds a
    removal, so "Apply and remove" reads the stale-plan alert and the new
    removal, asks again naming it, and applies to "In sync" and "Nothing to
    apply". On a second Project in drift it reads the plan, applies
    through `POST /api/projects/{binding}/apply` with that plan's digest,
    then applies from the page and reads "Another Apply finished these
    changes first." with "In sync". It binds a third Project with a
    T3code project associated, first after committing a change to
    `bindings.yml` on the remote, and reads the conflict alert with every
    value kept, then "Bind and review changes" again opens the new
    Project's page with "Not applied", and the remote holds the binding
    with the earlier change and every comment. In Settings, Task fields,
    it adds a field in the Visual tab and reads it selected in the field
    panel; sets its type to single-select and reads the "!", the red
    selects, the `schema` finding for its missing options in the Problems
    strip, and Publish disabled; adds an option and reads the marks clear
    and the impact "Pending · 1" for the Project; switches to YAML and reads the new field in the
    text; publishes and reads the success toast, "Published <short
    commit>" at the new commit, and the field in the Visual tab; and `GET
    /api/declarations/source` answers the new text at that commit.
    Fixture values are generic and never drawn from Manifold's own domain.
  portfolio-route: >-
    The Portfolio screen is the route `portfolio` under `/console/`.
    `PortfolioContent`, in `src/screens/portfolio/`, replaces the empty
    screen; the navigation entry, its label, and its description are
    unchanged. The route's search parameter `account` names the account
    whose allocations the table shows and edits; with no `account`, or one
    that names no listed account, the table shows the first account the
    read lists. The screen reads `GET /api/portfolio` of `portfolio-api`
    under the key `["portfolio"]`, and the text of `portfolio.yml` with
    `fetchDeclarationSource("portfolio.yml")` of `declarations-api` under
    `["declaration", "portfolio.yml"]`. Both read again when the window
    regains focus, when the screen opens, and from the ghost "Refresh"
    icon button in the title row. No timer reads on a schedule. The
    screen lints and saves `portfolio.yml` through the `portfolio.yml`
    path of `declarations-api`, the one save path of process repository
    declarations: `lintDeclarationText` and `saveDeclaration` of
    `src/api/declarations.ts`.
  portfolio-screen: >-
    From top to bottom, as `DESIGN.md` lays out Portfolio: the title row,
    with "Edit allocations" (outline) and "Add item" (primary); the budget
    source cards; the account row; the status bar and the problems list
    while they have content; the Portfolio table; and "Show archived (N)"
    when an item is archived. The account row holds "Allocations for"
    and a select of the listed accounts, shown when more than one account
    is listed. With no account listed, the cards and the account row are
    replaced by the info alert "No accounts are declared. Declare them in
    accounts.yml." and the table shows its rows with every amount a muted
    dash. A failed read shows an error alert with the message and "Try
    again" in place of the screen's content under the title row.
  budget-source-cards: >-
    One card per account in the read's order, in a grid of cards 280px
    wide. A card shows the account name and, on the same line, its kind as
    a badge, "API" or "Subscription". Under it is one meter for the
    account's window: the fill is `used` over the window's `capacity`,
    warning at 85% or more; the value line is "<used> of <capacity>"; and
    the reset line "Resets in about <duration>", from the window's
    `closesAt`, truncates and never wraps. The window's length labels the
    meter: "Daily" for one day or 24 hours, "Weekly" for seven days,
    "Monthly" for one month, and otherwise "Every <n> <unit>". An account
    with no window shows the meter empty and "No window yet" in muted
    text, since the ledger holds a window from the first balance read,
    reservation, or actual that needs it. An undeclared account shows a
    "Not declared" warning badge in place of its kind and the muted line
    "Declare it in accounts.yml", and no meter. The duration is from the
    browser's clock: under an hour it is minutes, at least 1; under 48
    hours it is hours; otherwise days, each rounded to the nearest whole
    number.
  portfolio-table: >-
    `PortfolioTable` shows the read's items for the selected account. The
    columns are those of `DESIGN.md` that the read answers, in its order:
    Name, Allocation, Current usage, Lifetime cost, Active tasks, and an
    Edit icon button. Name is the title with a muted line of the attached
    projects: their binding names, GitHub Projects as `owner/number`, when
    they fit, and otherwise counts, "2 GitHub Projects, 1 T3code project".
    Allocation is the guarantee as a percentage with the guarantee amount
    muted under it, and "up to N%" after the percentage when the
    allocation declares a ceiling. Lifetime cost is the allocation's
    `lifetime`. Active tasks is `activeTasks`, or a muted dash for 0.
    Rows follow the read's order: each level's items, then its Other,
    then its "Unallocated" row (muted, no Edit button) with the level's
    `unallocated` percentage and amount for the account. A total row
    closes the table: 100% and the window's capacity, the account's
    `used`, and the sum of the top-level lifetimes. An item with sub-items
    has a chevron; its sub-items, Other, and "Unallocated" row show as
    indented rows on the `lane` surface; every chevron starts collapsed,
    and the expanded items are kept in `localStorage` under
    `manifold.portfolio.expanded` as a JSON list of item ids. Other items
    have no Edit button. Archived items are absent from the table.
  current-usage: >-
    The Current usage cell reads the item's allocations for every account.
    The first line names the account whose usage is the greatest share of
    the item's guarantee amount, with the window's label, as "acct-a ·
    Weekly", then its usage, `actual` plus `outstanding`, and the share as
    a percentage. Under it is the meter of that share, warning with "Near
    limit" at 85% or more, and "+N" for the other accounts with a
    guarantee amount above 0, whose names and shares show in a tooltip on
    hover and focus and in the cell's accessible description. The last
    line is "Can reserve" and the allocation's `reservable`. An allocation
    whose guarantee amount is 0 has no share: when every allocation of the
    item has none, the cell shows the selected account's usage and "Can
    reserve" with no meter.
  portfolio-not-shown: >-
    The screen shows only what the service holds. A granted reset, its
    expiry, and an early reset are observations of a subscription's
    provider, which Manifold does not read, so the cards show no
    granted-reset badge and no early-reset note, and a subscription's
    capacity is its declared capacity. The Completed tasks column is
    absent, since the store keeps the snapshots of active actors only and
    the ledger knows only actors that reserved or spent, so a count from
    either misses tasks. The archived list shows no archive date, since
    the declaration holds none.
  edit-allocations: >-
    "Edit allocations" opens the portfolio draft, or starts one from the
    source, and turns the guarantee and ceiling of every item row and
    Other row, sub-item rows included, into number inputs for the selected
    account, with the inputs' step 0.01, minimum 0, and maximum 100. The
    title row's buttons become "Cancel" and "Save allocations". Each input
    change is one edit of the draft. The status bar above the table (info)
    names each parent whose children's guarantees the draft changes, with
    its unallocated remainder for the account, computed from the draft's
    text; it is a display, and the lint's findings alone decide whether
    the draft saves. While a draft exists the screen stays in this mode,
    across a reload, and the row Edit buttons, "Add item", and "Restore"
    are hidden. "Cancel" with no change leaves the mode; with changes it
    asks first in the 400px alert dialog, "Discard changes to
    portfolio.yml?", naming the number of edits, and removes the draft.
  portfolio-findings: >-
    The latest lint answer marks the draft. A `guarantee-limit` finding
    gives an error border to the guarantee input of every child of the
    parent its details name, the top level for `null`, for the account
    its details name, makes the status bar error with the finding's
    message, which names the parent and its sum, and disables "Save
    allocations". An `invalid-portfolio` finding located at a guarantee,
    a ceiling, a weight, or a burst gives that input an error border and
    its message under it. Every finding and warning lists in the problems
    list under the status bar: its kind in mono, the file and location in
    mono, and the message, findings in error color and warnings in warning
    color. The source's own findings and warnings list the same way when
    no draft exists. When the source text has a `syntax` or `schema`
    finding, "Edit allocations" and "Add item" are disabled and an error
    alert reads "portfolio.yml at <short commit> cannot be edited here.
    Fix it in the process repository." Pure functions in `findings.ts`
    turn findings into input marks and status lines.
  edit-item: >-
    The row's Edit button opens `EditItemDialog`, the 480px dialog of
    `DESIGN.md`, for the selected account: Name, the item's title;
    Allocation and Ceiling, percentages; Weight, a positive integer,
    empty for the default 1; a "Pacing" switch, which shows a Burst
    percentage input while on; and Sub-items, one row per sub-item with
    its title, its guarantee amount, and allocation and ceiling inputs,
    with the sub-items' unallocated remainder next to the heading. "Add
    sub-item" appends a row with a name field. A row's remove button
    removes a row the dialog added, and archives an existing sub-item
    under the archive rule below. The item id never changes, so a renamed
    item keeps its history. The dialog's changes are edits of a candidate
    draft, linted as the draft is; findings mark its inputs as on the
    table, and "Save" is disabled while the latest answer has a finding.
    "Save" writes the draft and saves it with the message "Update
    portfolio item <id>". "Add item" opens the same dialog with only Name,
    adds a top-level item, and saves with "Add portfolio item <id>". A new
    item has no allocations, so it starts at 0% for every account. Its id
    is the name in lower case with each run of characters other than
    letters and digits replaced by `-`, leading and trailing `-` removed,
    and `item-` put before it when it does not start with a letter. The
    first candidate is that slug cut to 64 characters; while a candidate
    equals an id in the tree or `other`, the next is the slug cut to 64
    less the length of the suffix, with trailing `-` removed, followed by
    `-2`, `-3`, and so on, so every candidate is a declared name of at
    most 64 characters. The pure `itemId(name, ids)` in `edits.ts` makes
    it, and the dialog shows it under the name in muted mono.
  archive-and-restore: >-
    The dialog's footer has "Archive item" on the left (error text,
    outline) with the muted note "Its allocation returns to <parent>."
    When a binding that is not archived names the item or an item under
    it, the button is disabled and the note reads "Move its projects in
    GitHub Projects first.", linking to GitHub Projects, since a
    declaration in which a live binding names an archived item is refused
    and the bindings are saved from that screen. Otherwise it asks in the
    400px alert dialog, with a solid error confirm button, and saves the
    draft with `archived: true` on the item and the message "Archive
    portfolio item <id>". "Show archived (N)" lists each archived item
    whose parent is not archived, with its title, its lifetime cost for
    the selected account, and "Restore". "Restore" removes `archived` from
    the item and sets the guarantee of every allocation of the item and
    every item under it to 0, so the restored item comes back at 0% and
    never breaks the guarantee limit, and saves with "Restore portfolio
    item <id>".
  portfolio-edits: |-
    `src/screens/portfolio/edits.ts` holds the edits as data and one pure
    function that applies them to a text. It parses the text with the
    `yaml` library's document model, changes the nodes each edit names,
    and prints the document, so comments, key order, and the style of
    every untouched node stay as the document model round-trips them.

    ```ts
    export type PortfolioEdit =
      | {
          readonly kind: "allocation";
          readonly item: string; // an item id, `other`, or `<parent>/other`
          readonly account: string;
          readonly guarantee?: number;
          readonly ceiling?: number | null; // null removes it
          readonly weight?: number | null;
          readonly burst?: number | null; // null removes `pacing`
        }
      | { readonly kind: "title"; readonly item: string; readonly title: string }
      | { readonly kind: "add"; readonly parent: string | null; readonly id: string; readonly title: string }
      | { readonly kind: "archive"; readonly item: string }
      | { readonly kind: "restore"; readonly item: string };

    export function applyEdits(
      text: string,
      edits: readonly PortfolioEdit[],
    ):
      | { readonly ok: true; readonly text: string; readonly dropped: readonly PortfolioEdit[] }
      | { readonly ok: false };
    ```

    An item is found by its id anywhere under `items`, since ids are
    unique across the tree; an Other's allocations are under the key
    `other` of its parent's `items` mapping, or of the top-level `items`
    mapping for `other`. An allocation edit creates the `allocations`
    mapping and the account's entry when absent and sets or removes each
    field it carries. A title edit equal to the id removes `title`. An add
    creates the parent's `items` mapping when absent and appends `<id>: {
    title }`. Archive sets `archived: true`; restore removes it and sets
    each `guarantee` present under the item to 0. Edits apply in order. An
    edit whose item is not in the text, an add whose parent is not in it
    or whose id is, is dropped and returned in `dropped`. A text that
    does not parse as one YAML document whose root is a mapping or empty
    answers `ok: false`. The empty text with an add gives `items:` with
    the item.
  portfolio-drafts: >-
    The portfolio draft is the draft of `portfolio.yml`. It is kept with
    `readDraft` and `writeDraft` of `src/screens/blueprints/draft.ts`
    under the declarations prefix, as
    `manifold.declaration-draft.portfolio.yml`, with one more member,
    `edits`, the draft's list of `PortfolioEdit`, so its `text` is
    `applyEdits(baseText, edits)`. `src/screens/portfolio/draft.ts` holds
    the pure functions that check `edits`, append an edit, and apply the
    edits again to another base; a stored draft whose `edits` is not a
    list of edits is removed and ignored. An edit appends to `edits`,
    recomputes `text`, and removes `saveId`. A save, a pending save, and
    the settling of a draft by a source read follow `blueprint-drafts` and
    `pending-save` through `savedDraft`, `settleDraft`, and
    `createSaveId`, with the save answer's `loaded` where the blueprint
    answer's `blueprint` stands; when a source read after a `loaded`
    answer differs from the draft's text, the draft becomes an ordinary
    draft based on the source with its edits applied again to the
    source's text. A draft with `saved` before a `loaded` answer shows the
    pending alert "Saved as <short commit>. The service has not loaded it
    yet. Your changes are kept." with "Load saved version", which sends
    the save again with the same `saveId`.
  portfolio-save: >-
    "Save allocations" is enabled when the draft's text differs from its
    base text, the latest lint answer is for that text, and it has no
    finding; warnings do not block it. It opens the Blueprints editor's
    `PublishDialog` with the title "Save allocations", the file
    `portfolio.yml` with `A` or `M`, and the message prefilled with
    "Update portfolio allocations". "Commit and push" sends
    `saveDeclaration` with the path `portfolio.yml`, the draft's base,
    text, message, and `saveId`, set first when the draft has none, as
    `publish` states. The edit item dialog saves with its own message and
    no publish dialog. For `200` the screen shows "Saved as <short
    commit>", "Already saved as <short commit>", or "No change to save" in
    a success toast and reads the portfolio and the source again, so the
    saved commit shows as the declaration in force. For `422` the findings
    mark the draft. For `409` the conflict alert opens under the title row
    in the error tint: "portfolio.yml changed on <branch> at <short head>.
    Your changes are kept." for `file-changed`, and "<branch> moved while
    saving, at <short head>. Your changes are kept." for `branch-moved`,
    with "Apply my changes to the latest" and "Discard changes". "Apply my
    changes to the latest" sets the draft's base to the head and its base
    text to the conflict's text, the empty string when absent, applies its
    edits again, and removes `saveId`; when an edit drops, an info alert
    lists each dropped edit. For `502`, `503`, a network failure, or a
    request whose answer never arrives, an error alert shows the message
    with "Try again", which sends the same request. The screen never
    discards the draft on its own.
  portfolio-lint-as-you-change: >-
    Each change of the draft's text, from the table or the dialog, starts
    a 300 ms wait, the wait the Blueprints editor uses; a change during
    the wait starts it again. When it ends, the screen sends
    `lintDeclarationText("portfolio.yml", text, signal)` and aborts the
    lint request still in flight. An answer is applied only while the text
    is still the text it was sent for. While a lint is pending the status
    bar shows "Checking…" and the previous marks stay. A lint request that
    fails shows "Cannot check these changes. Try again." with "Try again",
    and saving stays disabled.
  portfolio-client: >-
    `src/api/portfolio.ts` exports `fetchPortfolio()`. It sends `GET
    /api/portfolio` without authentication headers and turns the answer
    into `ok` with the body, or `failed` with the API's message or a
    generic message for a network error or a body that does not match.
    The mapping from a status and a body to a result is a pure function,
    and the body is checked at this boundary with the guard of
    `@wyrd-company/manifold-shared/portfolio-api`. When a save of
    `portfolio.yml` settles, the screen marks `["portfolio"]` stale beside
    the key the declarations client marks.
  amounts: |-
    Every amount the console shows, on Portfolio and in the Task page's
    Usage panel, is formatted in its account's unit by one module,
    `@wyrd-company/manifold-shared/amounts`, a dependency-free subpath
    export of pure functions.

    ```ts
    /** An amount as a person reads it: `$1.00`, `$0.0177`, `−$2.50`. */
    export function formatAmount(
      amount: number, // a safe integer in the unit, as the ledger holds it
      unit: string | undefined,
      options?: { readonly signed?: boolean },
    ): string;
    /** The amount at full precision: `$0.017734`. */
    export function formatAmountExact(amount: number, unit: string | undefined): string;
    /** A percentage with at most two decimals: `33.33%`, `50%`. */
    export function formatPercent(percent: number): string;
    ```

    For `usd`, the amount is millionths of a dollar, and every step is
    integer arithmetic on the magnitude, so every safe integer formats
    exactly. A magnitude of at least 1,000,000 rounds half up to cents and
    shows two decimals. A smaller magnitude rounds half up to
    ten-thousandths and shows up to four decimals, trailing zeros removed
    down to two; one that rounds to 10,000 ten-thousandths shows `$1.00`,
    and one above 0 that rounds to 0 shows `<$0.0001`. Zero is `$0.00`.
    Whole dollars group by three digits with `,`. A negative amount starts
    with `−` (U+2212), and with `signed` a positive one starts with `+`.
    `formatAmountExact` shows six decimals. An amount whose unit is
    undefined, for an account the accounts declaration does not declare,
    is the integer grouped by three digits with the same signs. Every
    formatted amount carries `formatAmountExact` in its `title`. The Task
    page's Usage panel formats estimate, actual, reserved, and the
    variance, signed, with the entry's `unit` from `tasks-api`.
  portfolio-endpoints: >-
    `mountPortfolioApi(host, options)` mounts one listener at
    `/api/portfolio` that implements `portfolio-api`. A pure function,
    `portfolioRead(input)` in `read.ts`, builds the answer from the
    declaration in force, the accounts in force, each item's balance and
    the account's window and totals for each account, the warnings, and
    the active snapshots; the listener gathers them per request. It reads
    balances through the portfolio whose ledger is the capacity module's,
    so the first `balance` of a declared account credits its current
    window as a gate's read does; it then reads the window with
    `windowAt` and the totals with `totals`. The warnings join the two
    declarations in force, each of which changes on its own revision: the
    portfolio declaration, whose commit names its text, and the accounts
    declaration, `accounts()`, which usage intake keeps in its store and
    restores at start. For the portfolio side the listener reads
    `portfolio.yml` through `processRepository.revisionAt` at the commit
    of the portfolio declaration in force and runs `lintAllocatedAccounts`
    with `accounts` undefined, which warns on every allocation; it keeps
    that list for that one commit. For each read it keeps the warnings
    whose `details.account` is not a name of `accounts()`. A revision that
    adds or removes an account and leaves `portfolio.yml` unchanged
    changes `accounts()` and not the portfolio commit, so the next read
    drops or adds the warning with no cache to clear, and the same holds
    after a restart. A read that throws answers `500`, and the error goes
    to `log` with the path.
  portfolio-public-interface: |-
    `packages/service/src/portfolio-api/index.ts` exports exactly these
    names.

    ```ts
    import type { HttpHost } from "../http-host/index.ts";
    import type { Store } from "../store/index.ts";
    import type { Ledger } from "../ledger/index.ts";
    import type { PortfolioInForce } from "../portfolio/index.ts";
    import type { ProcessRepository } from "../process-repository/index.ts";
    import type { UsageAccount } from "@wyrd-company/manifold-shared";

    export interface PortfolioApiOptions {
      /** The portfolio whose ledger is the capacity module's. */
      readonly portfolio: {
        current(): PortfolioInForce;
        readonly ledger: Pick<Ledger, "balance" | "windowAt" | "totals">;
      };
      /** The accounts declaration in force: usage intake's `accounts`. */
      accounts(): Readonly<Record<string, UsageAccount>>;
      readonly processRepository: Pick<ProcessRepository, "revisionAt">;
      readonly store: Pick<Store, "activeSnapshots">;
      /** The service clock. Defaults to Date.now. */
      readonly now?: () => number;
      readonly log: (entry: { level: "error"; path: string; error: string }) => void;
    }

    /** Mounts the portfolio endpoint at `/api/portfolio`. */
    export function mountPortfolioApi(host: HttpHost, options: PortfolioApiOptions): void;
    ```

    The wiring part is not part of this surface: it lives in `wiring.ts`,
    which `service/start.ts` imports directly, as the service wiring part
    states for every module.

    `@wyrd-company/manifold-shared` adds the subpath export
    `./portfolio-api`, which holds no lint and no YAML parser: the path
    `portfolioApiPath` (`/api/portfolio`), the response types of
    `portfolio-api`, and a dependency-free guard for the response, which a
    shared test checks against the OpenAPI definition with fixtures that
    pass and fail. It adds the subpath export `./amounts` of `amounts`. In
    `packages/service/src/portfolio-api/`, `index.ts` re-exports the public
    names, `listener.ts` holds the routing and the warnings kept per
    commit, `read.ts` the pure read, and `wiring.ts` the part, which no
    index file exports. In
    `packages/console`, `src/screens/portfolio/` holds `PortfolioContent.tsx`,
    `BudgetSourceCards.tsx`, `PortfolioTable.tsx`, `CurrentUsageCell.tsx`,
    `StatusBar.tsx`, `ProblemsList.tsx`, `EditItemDialog.tsx`,
    `ArchivedList.tsx`, and the pure modules `edits.ts`, `draft.ts`,
    `rows.ts` (the read to table rows for an account, the current-usage
    choice, and the window labels), and `findings.ts`.
  portfolio-wiring: >-
    `portfolioApiPart` is the service wiring part `{ name: "portfolio-api",
    start(members, context) }` in
    `packages/service/src/portfolio-api/wiring.ts`, which `start.ts`
    imports directly and chains once after the declarations API's part. Its `start` calls
    `mountPortfolioApi(members.http, options)` with the portfolio member,
    whose ledger is the capacity module's that the portfolio part wires,
    usage intake's `accounts`, the process repository, the store, the
    service clock, and the service log; a member whose part starts after
    it is read through `context.later`. It registers no `onStop`, since it
    holds nothing to release and the host stops serving its mount.
  portfolio-convergence: >-
    The read's one write is the credit of an account's current window,
    which the capacity module writes once per account and window by its
    key, so a read that runs twice credits once and answers twice from the
    ledger as it is, and a read that crashes before the credit commits
    leaves nothing for the next read to repeat. A save of `portfolio.yml`
    converges as the declarations save does: a retry with the same
    `saveId` answers `already-saved` or pushes the change once, and a
    crash after the push and before the browser reads the answer leaves
    the draft with no `saved`, whose retry answers `already-saved`. A
    draft is written whole on each edit, so a reload or a crash of the
    browser leaves the last edit. Applying a draft's edits to the same text
    twice gives the same text, since each edit sets values rather than
    adding to them.
  portfolio-tests: >-
    Each behavior is red before green, and tests go through public
    interfaces. The endpoint is tested as `portfolio-api`'s validation
    criteria state. In `packages/shared`, tests of `amounts` show `$1.00`
    for 1,000,000, `$0.0177` for 17,700, `$0.50` for 500,000, `$0.0012`
    for 1,234, `<$0.0001` for 40, `$1.00` for 999,995, `$1,234.57` for
    1,234,567,890, `−$2.50` and `+$2.50` signed, `$0.00` for 0,
    `$0.017734` exact, and `17,734` with no unit; and the guards of
    `./portfolio-api` against the OpenAPI document with fixtures that pass
    and fail. In `packages/console`, unit tests cover the result mapping;
    `applyEdits` on a text with comments, which stay, for each edit kind,
    an Other's allocation, an add under a leaf, a restore setting
    guarantees to 0, an edit dropped for a missing item, and a text that
    does not parse; `itemId` for a name with punctuation, a digit-leading
    name, `other`, and a 70-character name given twice and three times,
    whose ids are its first 64 characters, then its first 62 followed by
    `-2`, then its first 62 followed by `-3`, each a declared name of 64
    characters and unique; the draft functions as `tests` states them for the
    blueprint draft, and a draft's edits applied again to a later text;
    `rows.ts` on a nested read with an archived item; and `findings.ts`
    for a `guarantee-limit` at the top level and under an item. The
    browser test, `packages/service/src/portfolio-api/portfolio.browser.test.ts`,
    starts the service with the built console on a fixture process
    repository served over smart HTTP with push enabled, with accounts
    `acct-a` and `acct-b` and items `alpha` and `beta` at 50% of each,
    and a ledger on which one actor reserved and posted actuals on `alpha`
    for `acct-a` and another on `beta` for `acct-b`, both settled. It opens
    Portfolio, reads both cards with their used and capacity in dollars,
    and `alpha`'s allocation, usage, and "Can reserve" in dollars; selects
    `acct-b` and reads `beta`'s; opens "Edit allocations", sets `alpha` to
    70% and `beta` to 40% for `acct-a`, and, once the lint answers, sees
    the error borders, the error status bar naming the top level and 110%,
    and "Save allocations" disabled; sets `beta` to 30%, sees the marks
    clear, saves through the publish dialog, and sees the toast; reloads
    and reads `alpha` at 70%
    with its new amount; and finds one new commit on the fixture remote
    whose `portfolio.yml` keeps the fixture's comment, and the read's
    `commit` equal to it. The Board and Task page browser test checks the
    estimate, actual, variance, and reserved of its settled task in
    dollars, such as `$0.0177`.
  serving: >-
    The console listener serves `packages/console/dist` with `sirv`. It
    takes the request's path, which the HTTP host passes unchanged,
    removes `/console` from its start, and serves the rest from the
    directory. A `GET` or `HEAD`
    of a file answers it. A Blueprints editor path under
    `/console/blueprints/blueprints/` ending in `.yml` or `.yaml` answers
    `index.html` when no file exists, for GET and HEAD. A path with no file extension and no file
    answers `index.html`, so a client route loads the application; a path
    with an extension and no file answers `404`. Files under `assets/` are
    served with `Cache-Control: public, max-age=31536000, immutable`, since
    their names carry their content hash, and `index.html` with
    `Cache-Control: no-cache`. Every answer carries
    `Content-Security-Policy: default-src 'self'; style-src 'self'
    'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'`,
    `X-Content-Type-Options: nosniff`, and `Referrer-Policy: no-referrer`,
    so that the page runs only the console's own scripts. The Blueprints
    screen lints on the service, so the page evaluates no generated code
    and the policy holds no `'unsafe-eval'`. Other methods
    answer `405`. A path that leaves the
    directory answers `404`. `/console` without the slash redirects to
    `/console/`.
  actors-endpoint: >-
    The actors listener implements `actors-api`. A pure function,
    `actorSummaries(snapshots)`, turns the store's active snapshots into
    the summaries in the order the specification states: it parses
    `machine` with `parseBlueprintVersionKey`, collects the leaf state
    paths from the state value, and reads the string fields of
    `context.manifold`. The listener calls `store.activeSnapshots()` and
    `actorSummaries` for each request and writes the JSON. It holds no
    cache, so each request reads the store as it is.
  public-interface: |-
    `packages/service/src/console/index.ts` exports exactly these names.

    ```ts
    import type { HttpHost } from "../http-host/index.ts";
    import type { Store } from "../store/index.ts";

    export type { HttpListener as RequestListener } from "../http-host/index.ts";

    export interface ConsoleOptions {
      readonly store: Pick<Store, "activeSnapshots">;
      /** Directory of the built console. Defaults to the console package's `dist`. */
      readonly root?: string;
      /** Receives read failures; service assembly supplies ServiceParts.log. */
      readonly log?: (entry: { level: "error"; path: string; error: string }) => void;
    }

    /** Mounts the console's files at `/console` and the actors endpoint at `/api/actors`. */
    export function mountConsole(host: HttpHost, options: ConsoleOptions): void;
    ```

    `@wyrd-company/manifold-shared` adds the subpath export
    `./actors-api`, which exports the response types and the path.

    ```ts
    export const actorsApiPath = "/api/actors";

    export interface ActorsResponse {
      readonly actors: readonly ActorSummary[];
    }

    export interface ActorSummary {
      readonly actorId: string;
      readonly machine: string;
      readonly blueprint?: { readonly path: string; readonly commit: string };
      readonly states: readonly string[];
      readonly environment?: string;
      readonly project?: string;
      readonly issue?: string;
      readonly portfolioItem?: string;
      readonly savedAt: string;
    }

    export function isActorsResponse(value: unknown): value is ActorsResponse;
    ```
  module-layout: >-
    `packages/service/src/console/` holds `index.ts`, `static-files.ts`
    (the console listener), `actors-api.ts` (the actors listener and
    `actorSummaries`), and the tests. `HttpHost` is the service's
    production HTTP host type. The service's entry point calls `mountConsole(host, { store, log
    })` after the store opens and before the host listens. The service
    package depends on `@wyrd-company/manifold-console` and on `sirv`.
    `root` defaults to the directory of
    `import.meta.resolve("@wyrd-company/manifold-console/dist/index.html")`.
    `mountConsole` throws when `index.html` is not in `root`, so a
    service built without its console fails at start with the path it
    looked in.
  build-and-test-order: >-
    The service depends on the console package, so `pnpm -r run build`
    builds the shared package, then the console, then the service. The
    service's `test` script builds the console before it runs, as it
    already builds the shared package. The browser test uses Playwright's
    Chromium. `task install` installs it after the packages, so a
    developer machine has it after one install. CI installs it with its
    system dependencies before `task check`.
  convergence: >-
    A save is the one write of the API, and converges as
    `process-repository` and `service-assembly` state: a retry with the
    same `saveId` answers `already-saved` or pushes the change once. The
    list, source, and lint endpoints only read. A draft is the operator's
    latest text for a path, written whole on each change, so a reload or a
    crash of the browser leaves the last written text. The actors
    endpoint and the console listener only read, so a request that
    runs twice answers twice from the current store and files. A console
    build that runs twice empties `dist/` and writes the same files; a
    build that stopped halfway leaves a `dist/` that the next build
    replaces whole, and a service started on a `dist/` with no
    `index.html` refuses to start. The browser's writes are `localStorage`
    keys for theme and sidebar mode, each set to the operator's latest
    choice, so a repeated save leaves one value. A canvas or inspector edit
    is a pure function of the draft's text that writes the whole new text
    to the draft in one `localStorage` write, so a crash leaves the text
    before or after the edit, never part of it. Every edit, `add-state`,
    `rename-state`, `remove-state`, `set-initial`, `add-transition`,
    `remove-transition`, `move-candidate`, `set`, `remove`, `rename-key`,
    `set-layout`, and `clear-layout`, commits through `commitEdit` with
    its basis, so an edit run twice applies once: the second run finds the
    draft's text changed from its basis and returns `stale`. After a crash
    before the write, the draft holds the basis, the edit is not applied,
    and the reopened editor shows the text without it; after the write,
    the draft holds the result, and a replay is `stale`. Undo and redo
    commit the same way, with the text after and before an edit as their
    basis.
  errors: >-
    `store.activeSnapshots()` throwing answers `500` with no body detail,
    and the error goes to the service's log with the request path. A
    snapshot whose `context` or `context.manifold` is not an object gives a
    summary with no identity fields; it is not an error. The console shows
    every failed read as an alert on the screen that made it, and the shell
    keeps working.
  tests: >-
    Each behavior is red before green, and tests go through public
    interfaces. The blueprints endpoints are tested as `blueprints-api`'s
    validation criteria state; `blueprintGraph` and `findingRanges` are
    tested in `packages/shared` on fixture texts, including a pointer to a
    missing key, a flow-style mapping, and a multi-byte character before
    the finding. In `packages/console`, unit tests cover the blueprints
    result mapping, the draft functions (write, base text equality removes,
    malformed removed, `saveId` kept across a reload and removed by a
    change, a `200` sets `saved` and keeps the draft, and a draft with
    `saved` is removed by a source read of its text, and becomes an
    ordinary draft based on the source when a save answer with `blueprint`
    is followed by a source read of other text), and `problems.ts`.
    In `packages/console`, `blueprint-edits.ts` is tested on a fixture
    blueprint with comments before, between, and after entries, a flow
    mapping, single- and double-quoted scalars, literal and folded block
    expressions, blank lines, and an anchor: for each edit, the text before
    the first changed character and after the last is byte for byte the
    old text's, the changed span lies inside the lines of the nodes the
    edit touches, and the result parses to the expected value; a rename
    rewrites a sibling, a `.child`, and a `#id` target, an `in` guard, a
    gate's return and dependencies, and layout keys; a remove drops the
    targets into the state and moves the parent's `initial`; an edit under
    an alias returns `unsafe`; `commitEdit` applies each edit kind once on
    its basis and returns `stale` for a replay after it applied, two
    `add-state` edits each on the previous result add two states, a draft
    left at the basis by a crash before the write takes the edit once, and
    a draft left at the result by a crash after the write returns `stale`.
    `inspector-model.ts` is tested against `blueprint.schema.yml`: for the
    root and for each node kind, atomic, compound, parallel, final, and
    history, with every property of `state-node-properties` set, and for
    each transition and invoke property, the model holds a field whose
    pointer is that property, and a field write through
    `applyBlueprintEdit` changes that property and nothing else.
    `canvas-layout.ts` is tested on the bundled task blueprint and on a
    fixture with nested and parallel states, every trigger, a history
    state, and a targetless transition: in automatic layout no two nodes
    overlap unless one holds the other, no label overlaps a node or
    another label, and every node lies inside its group; in a pinned
    layout each positioned state is at its point and an unpositioned state
    lies beside its siblings. `canvas-history.ts`, `problems.ts`, and the
    inspector's mapping from a finding to a field are unit tested, and a
    shared test checks that every name of `manifoldImplementationNames`
    has one catalog entry with a description and that each catalog schema
    equals its specification's definition.
    `packages/service/src/blueprints-api/blueprints.browser.test.ts`
    starts the service on a fixture process repository served over smart
    HTTP with push enabled, launches headless Chromium, opens Blueprints,
    and sees every fixture blueprint with its version and lint, a bundled
    blueprint with its "Bundled" badge, and a repository blueprint that
    replaces a bundled one with "Replaces the bundled blueprint"; opens one
    and sees its states on the canvas; toggles to the YAML view, types a
    transition target that names no state and, once the lint answers, sees
    an error diagnostic on that line, the "!" badge on the state when it
    toggles back, and Publish disabled; fixes it and
    sees the marks clear; publishes with a message; sees the success toast;
    returns to the list and sees the new commit as the version; and finds
    one new commit on the fixture remote with that message. A second case
    commits a change to the same file on the remote while the editor holds
    a draft, publishes, sees the conflict alert, reloads, and still holds
    the draft's text. A third case has the fixture server accept the push
    and refuse the next fetch once, so the save answers `saved` with no
    `blueprint`: the editor shows the toast and the pending alert with the
    saved text, a reload shows the same, and "Load saved version", with
    the server healthy, answers `already-saved`, clears the alert and the
    draft, and the list shows the saved commit as the version, with one
    new commit on the remote. A fourth case runs the third until the
    pending alert, then commits a change to the same file on top of the
    save on the remote, and, with the server healthy, "Load saved
    version" answers `already-saved`; the editor is editable and shows the
    saved text as a draft based on the later commit with the "changed this
    file since" alert, Compare shows both texts, and "Discard draft" leaves
    the later commit's text and no draft. A fifth case,
    `canvas.browser.test.ts` beside it, drives the canvas: it adds a state
    from the toolbar's Add state menu and names it in the inspector, drags
    a transition from an existing state to the new one, picks its event in
    the event picker, sets an expression guard in the transition
    inspector with a syntax error, sees the
    finding on the guard field, on the edge's pill, and in the Problems
    strip, fixes the expression and sees the marks clear, toggles to the
    YAML view and sees the new state and transition with the fixture's
    comments in place, toggles back, drags a node, runs Automatic layout
    and sees `layout` absent from the YAML, publishes, and sees the new
    commit as the version in the list. In `packages/service/src/console/`, `mountConsole` uses the
    production HTTP host on a loopback port with no credentials: the actors
    endpoint behaviors in `actors-api`'s validation criteria; a client
    route under `/console/` answers `index.html`; a hashed asset answers
    with the immutable header; a missing asset answers `404`; a path
    with `..` segments answers `404`; and `mountConsole` throws for a root
    with no `index.html`. In `packages/console`, unit tests cover the API
    result mapping, requests without browser storage or authorization,
    and `navigation.ts` (every route unique, every `DESIGN.md` sidebar
    screen present). The browser test,
    `packages/service/src/console/console.browser.test.ts`, starts the
    production HTTP host with the built console and a store holding fixture
    actors, launches headless Chromium with Playwright, and checks that
    Overview shows the shell with every navigation entry; the theme toggle
    sets the dark class and a reload keeps it; the Actors screen lists
    every fixture actor with its blueprint, current state, and environment
    without credential entry; a reload of `/console/actors` shows the same;
    and unbuilt screens, including Settings, General, show their empty
    states. Fixture values are generic and never drawn from Manifold's
    own domain.
  dependencies: >-
    The console adds `react` and `react-dom` 19, `@tanstack/react-router`,
    `@tanstack/react-query`, `@base-ui/react`, `class-variance-authority`,
    `tailwind-merge`, `lucide-react`, `tailwindcss` 4 with
    `@tailwindcss/vite`, and `@vitejs/plugin-react`, the versions T3 Code's
    web client uses where it uses them. TanStack Query is the one library
    T3 Code does not use; it is the most adopted React data-fetching
    library and holds every API read the later screens make. The service
    adds `sirv`, the static file listener Vite's preview server uses, and
    `playwright` as a development dependency for the browser test. The
    Blueprints screen adds `@xyflow/react`, the graph library `DESIGN.md`
    names; `elkjs`, the Eclipse Layout Kernel compiled to JavaScript, whose
    layered algorithm lays out nested graphs, chosen as the one automatic
    layout engine `DESIGN.md` asks the Epics graph to share; and CodeMirror
    6: `@codemirror/state`, `@codemirror/view`, `@codemirror/commands`,
    `@codemirror/language`, `@codemirror/lang-yaml`, `@codemirror/lint`,
    and `@codemirror/merge`. The Portfolio screen adds `yaml` (eemeli/yaml),
    the YAML library the service and the host CLI already use, whose
    document model edits a text and keeps its comments. The canvas builds
    its graph through the shared package's `./blueprint-graph` export,
    whose validator is generated at build time. None of them
    evaluates generated code, so the console's Content Security Policy
    holds. Renovate keeps them current
    with the rest.
