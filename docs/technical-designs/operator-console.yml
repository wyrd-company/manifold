$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - store
    - escalations
    - service-configuration
    - github-event-source
    - t3code-environment-source
    - gate-runtime
    - portfolio-ledger
  # GAP-EDGE: the technical-design schema declares no edge to a
  # specification; `references` is the best fit.
  references:
    - actors-api
    - blueprint-version
    - tasks-api
    - escalation-contract
objective: >-
  Give the operator console one package that builds into static files, one
  place in the service that serves them and the API the console reads, and a
  shell in T3 Code's visual language that every later screen fills, so that
  an operator opens the console from the service's own HTTP host, moves
  between every screen `DESIGN.md` lists, sees every active actor with
  its blueprint, current state, and environment, sees where every task
  of each bound Project is, and reads and answers a task's escalations,
  state, threads, and usage on its Task page.
background:
  current-design: >-
    `packages/console` holds a `package.json` and a README, and no framework.
    `DESIGN.md` is the console's visual design. The service has one HTTP host
    on which a module mounts request listeners under a path prefix with
    `mount(pathPrefix, listener)`. Access control belongs to the deployment. The
    store lists the active snapshots with `activeSnapshots()`, and the
    engine keeps an actor's identity at `context.manifold` in its snapshot.
  problems:
    - >-
      No package builds a user interface, so no screen can be built and no
      operator can see what Manifold runs.
    - >-
      The service has no listener that serves the console's files, and no
      endpoint that answers which actors are running.
design-challenges:
  client-routes: >-
    The console's routes exist only in the browser. A reload or a pasted
    link to any screen must load the application, while a missing asset
    must answer `404`, not the application's page.
  build-order: >-
    The service serves files that the console package builds, and the
    service's tests drive the built console. The build and test order must
    follow from the package graph, with no step a person remembers.
  shell-before-screens: >-
    Most screens are built in later tasks. The shell must give
    each its route, its navigation entry, and its title now, so that a later
    task replaces one component and touches nothing else.
  browser-proof: >-
    The console is proved only when a browser renders it from the service.
    The test must run inside `task check` on a developer machine and in CI.
proposed-design:
  high-level-overview: >-
    `packages/console` is a React 19 single-page application built with
    Vite+ into `packages/console/dist`, on the stack chosen in
    `build-the-console-on-t3-codes-web-stack`. The service's console module,
    `packages/service/src/console/`, exports `mountConsole(host, options)`.
    It mounts two listeners on the HTTP host: the console's files under
    `/console` with `mount`, and the actors read endpoint, specified in
    `actors-api`, under `/api/actors` with `mount`. The shell is
    `AppShell` with the header, the sidebar, and the content region from
    `DESIGN.md`. Every sidebar screen has a route. The Actors screen reads
    `GET /api/actors`. The Board reads `GET /api/tasks` and shows the tasks
    of each bound Project in lanes by lifecycle status, and a card opens
    the Task page, which reads `GET /api/tasks/{actorId}` and answers the
    task's open escalations through `POST /api/escalations/{id}/answer`.
    The tasks read model, `packages/service/src/tasks/`, specified in
    `tasks-api`, is mounted by service assembly under `/api/tasks` with
    `mount`. Every other screen shows its title row and an empty state.
    The console and API are served without authentication; access control
    belongs to the deployment.
  console-package: >-
    `packages/console` holds `index.html`, `vite.config.ts`, `src/`, and
    `public/`. Its scripts are `build` (`vp build`, after building
    `@wyrd-company/manifold-shared`), `typecheck` (`tsc --noEmit`), and
    `test` (`vp test run`), each after building the shared package so that
    its exported types and runtime modules exist on a fresh checkout. Its
    TypeScript configuration extends the base
    with the DOM library, `jsx: react-jsx`, and bundler module resolution.
    `vite.config.ts` sets `base: "/console/"` and adds the React and
    Tailwind CSS plugins. The build writes hashed files under
    `dist/assets/` and `dist/index.html`, and empties `dist/` first. The
    package exports `"./dist/*"`, so that the service resolves the built
    files through the package graph. The root lint configuration adds the
    `react` plugin, so that `.tsx` files are linted with the rest.
  console-source: >-
    `src/main.tsx` mounts the router and the query client. `src/router.tsx`
    declares the routes in code, with TanStack Router's `basepath`
    `/console`. `src/shell/` holds `AppShell`, `Header`, `Sidebar`,
    `CommandSearch`, `ThemeToggle`, and `navigation.ts`, the one list of
    screens. `src/screens/` holds one `<Name>Content` component per sidebar
    screen, with the names `DESIGN.md` gives. `src/ui/` holds the
    primitives vendored from T3 Code's `apps/web/src/components/ui`
    (button, badge, table, dialog, sidebar, kbd, empty), each with T3
    Code's MIT notice in its header and its imports pointed at the
    console's own `cn`. `src/styles.css` sets every color token from
    `DESIGN.md` as a CSS custom property on `:root` and on `:root.dark`,
    and maps them into Tailwind's `@theme`. `src/api/` holds the API client.
  navigation: >-
    `navigation.ts` lists every sidebar screen once: its route, its label,
    its Lucide icon, its group, and its one-line description. The sidebar,
    the breadcrumb, the command search, and each screen's title row read
    this list. The groups and order are those of `DESIGN.md`: Overview,
    Board, Epics, Actors with no label; Portfolio under Plan; Blueprints,
    GitHub Projects, Environments under Configure; Settings at the bottom.
    The routes are `/console/` for Overview, then `board`, `epics`,
    `actors`, `portfolio`, `blueprints`, `projects`, `environments`, and
    `settings` under `/console/`. Settings has the routes
    `settings/task-fields`, `settings/accounts`, and `settings/general`
    for its tabs, and `settings` opens Task fields. A path under
    `/console/` that matches no route shows a "Page not found" empty state
    with a link to Overview.
  shell: >-
    `AppShell` lays out the header, the sidebar, and the content region as
    `DESIGN.md` states. The header holds the sidebar toggle, the Manifold
    mark and name, the breadcrumb (the current screen's label, and the
    Settings tab under Settings), the command search button with its `⌘K`
    hint, and the theme toggle. The sidebar shows the navigation list, with
    the current route selected. The toggle switches the sidebar between
    256px and the 48px icon rail; the mode is kept in `localStorage` under
    `manifold.sidebar`. The command search is a dialog, opened by its
    button and by `⌘K` or `Ctrl+K`, with a filter field over the navigation
    list; Enter opens the selected screen. Each screen starts with the
    title row: its label and its description from `navigation.ts`.
  theme: >-
    The theme toggle cycles System, Light, and Dark, and is a ghost button
    whose icon and `aria-label` name the current choice. System follows
    `prefers-color-scheme` and changes with it. The choice is kept in
    `localStorage` under `manifold.theme`, and the theme is the `dark`
    class on the root element. `public/theme.js`, loaded before the
    stylesheet, sets the class from the kept choice before the first paint,
    so that a reload in dark theme does not flash light.
  empty-screens: >-
    Overview, Epics, Portfolio, Blueprints, GitHub Projects,
    Environments, and every Settings tab show
    their title row and the empty state from `DESIGN.md`: a dashed border,
    the screen's icon, the title "Nothing here yet", and the line "This
    screen is not built in this version of Manifold." A later task
    replaces the screen's `<Name>Content` component and changes nothing in
    the shell.
  settings-general: >-
    The General tab of Settings shows its heading and the shared empty
    state: "Nothing here yet", "This screen is not built in this version
    of Manifold."
  api-client: >-
    `src/api/client.ts` exports `fetchActors()`. It sends `GET /api/actors`
    without authentication headers. It turns the answer into `ok` with the
    actors for `200`, or `failed` with a message for any other status, a
    network error, or a body that is not an actors response. The mapping
    from a status and a body to a result is a pure function. The body is
    checked at this boundary against the shape exported by
    `@wyrd-company/manifold-shared/actors-api`, and the rest of the console
    trusts it. Reads go through TanStack Query, which reads again when the
    window regains focus and when the screen opens. No timer reads on a
    schedule.
  actors-screen: >-
    `ActorsContent` reads `fetchActors()`. Its title row is "Actors" with
    its description, and it has no primary action. Under it, one row holds
    the actor count, right-aligned, and a ghost "Refresh" icon button that
    reads again. The table columns are the Actors list's columns in
    `DESIGN.md` that the endpoint answers, in its order: Task, Portfolio
    item, Blueprint, Current state, and Environment. Usage, Time, and
    Timeline join when the store holds what they show. Task is the issue
    reference in mono when the summary has `issue`, else the actor id in
    mono, with the actor id muted under a reference. Portfolio item is its
    value, or a muted dash when absent. Blueprint is the path in mono with
    the commit's first seven characters muted under it, or the `machine`
    value in mono when the summary has no `blueprint`. Current state is a
    success status dot and each state path in mono, one line each.
    Environment is its value in mono, or a muted dash when absent. The
    actor's status, the thread link, and the Active / Completed control
    and filters join with the screens that give them data.
    Rows follow the API's order and do not open a page. With no
    actor, the table is replaced by the empty state "No active actors",
    "Actors appear here while a blueprint runs." For `failed`, an error
    alert shows the message with "Try again".
  tasks-api-client: >-
    `src/api/tasks.ts` exports `fetchTasks()`, `fetchTask(actorId)`, and
    `answerEscalation(id, answer)`. `fetchTasks` sends `GET /api/tasks`
    and `fetchTask` sends `GET /api/tasks/{actorId}` with the id
    percent-encoded; each turns the answer into `ok` with the body, or
    `failed` with a message, as `fetchActors` does, and `fetchTask` turns
    `404` into `missing`. `answerEscalation` sends `POST
    /api/escalations/{id}/answer` with `{ choice }` or `{ text }` and
    turns the answer into `answered` or `closed` with the escalation for
    `200`, `invalid` with the service's `error` for `400`, `missing` for
    `404`, and `failed` with a message for any other status, a network
    error, or a body that does not validate. Each mapping from a status
    and a body to a result is a pure function. Bodies are checked at this
    boundary with the guards exported by
    `@wyrd-company/manifold-shared/tasks-api` and
    `@wyrd-company/manifold-shared/escalations-api`. Reads go through
    TanStack Query under the keys `["tasks"]` and `["task", actorId]`, as
    the Actors screen reads. An answer is a TanStack Query mutation; when
    it settles, it marks both keys stale, so the Board and the Task page
    read again. No timer reads on a schedule.
  board-screen: >-
    `BoardContent` reads `fetchTasks()`. Its title row is "Board" with its
    description, and it has no primary action. The filter row holds a
    Project select when more than one bound Project is listed, a Portfolio
    item select over the portfolio items the shown Project's tasks name,
    "Clear filters" when the Portfolio item filter is set, and,
    right-aligned, the shown task count and a ghost "Refresh" icon button.
    The selected Project and portfolio item are the route's search
    parameters `project`, as `<owner>/<number>`, and `item`, so a reload
    or a pasted link shows the same board; with no `project`, or one that
    names no listed Project, the board shows the first listed Project. The
    board has one lane per declared lifecycle option, in declared order,
    named by the option. A task whose status is `null` or names no
    declared option is in a "No status" lane before the declared lanes,
    shown only while it holds a task. A Project with no lifecycle
    declaration shows its tasks in the "No status" lane and, above the
    lanes, an info alert "This Project declares no lifecycle field." Lanes
    and cards are laid out as `DESIGN.md` states. Cards follow the API's
    order within a lane. A lane collapses and expands with its header's
    ghost button; collapsed lanes are kept in `localStorage` under
    `manifold.board.collapsed`, a JSON object from `<owner>/<number>` to
    the list of collapsed lane names, and every lane starts expanded. A
    card is a link that opens the task's page. With no bound Project, the
    board is replaced by the empty state "No bound Projects", "Bind a
    GitHub Project in the process repository to see its tasks here." For
    `failed`, an error alert shows the message with "Try again".
  task-card: >-
    `TaskCard` shows, from top to bottom: the issue reference,
    `<repository>#<number>`, in mono, with "Closed" and a check when the
    issue is closed; the title, or the reference again in muted text while
    the mirror has no title; the portfolio item in 12px muted text when the
    summary has one; and, when the summary has `actor`, the actor row: a
    status dot, the first state path in mono, the actor status, and an
    "Escalated" warning badge when `openEscalations` is above 0 or a
    "Failed" error badge when the actor is held. The dot is success for
    `active`, muted for `done` and `stopped`, and error for `held`. A task
    with no actor shows "Waiting for intake" in muted text in place of the
    actor row.
  task-route: >-
    The Task page is the route `board/task/$actorId` under `/console/`,
    with the actor id percent-encoded in its segment. It is a route of its
    own beside the Board's, so the Task page replaces the Board's content
    and the sidebar keeps Board selected. The breadcrumb shows "Board",
    linked to the Board with the search parameters the operator came from,
    and the issue reference. The page's back link "Board" returns there.
    A screen that opens a task later, such as Epics, adds its own
    `<screen>/task/$actorId` route with the same content.
  task-page: >-
    `TaskContent` reads `fetchTask(actorId)`. The header holds the issue
    reference in muted mono, the title, a lifecycle badge for each Project
    the task is on (a dot and the status name, or "No status"), and a meta
    line with the portfolio item and the blueprint path. On the right are
    "Open on GitHub" (outline, opening `issue.url` in a new tab, shown when
    the issue has a URL) and, as the one primary action, "Open thread",
    which opens the URL of the last thread in the list that has one. The
    main column holds, from top to bottom: the escalation panel; Current
    actor, with the actor status badge, each state path in mono, the
    blueprint path with the commit's first seven characters, the
    environment in mono, and when the actor was last saved, or "Waiting
    for intake" when the task has no actor; Threads, a table with each
    thread's title (or its id in mono), its latest turn state as a status
    dot and label, "Archived" when archived, and an "Open in T3 Code" link
    icon when it has a URL; and Escalations, the recent escalations, each
    with its title, its status, its answer as the choice's label or the
    text, the channel it came through, and when it closed. The right
    column holds Fields, with each Project's lifecycle field name and
    status and a lock icon, since Manifold sets it, and Usage, a table
    with one row per account: Account, Estimate, Actual, Variance, and
    Reserved, numbers right-aligned in tabular figures, a positive
    variance in warning text, and a caption "Settled" or "Open" from
    `usage.settled`. With no account, Usage shows "No usage recorded."
    For `missing`, the page shows the empty state "Task not found", "This
    issue is not on a bound Project.", with a link to the Board. For
    `failed`, an error alert shows the message with "Try again".
  escalation-panel: >-
    `EscalationPanel` lists the task's open escalations, oldest first,
    each on a warning surface with its title, its question as plain text
    with line breaks kept, and its controls: one outline button per
    choice, labelled with the choice's label, and, when it takes free
    text, a one-line answer field with an "Answer" button. Under the
    controls a muted line says "The first answer from any channel is
    recorded." With no open escalation, the panel is absent. Choosing or
    answering sends `answerEscalation` and disables every control of that
    escalation while it is in flight. On `answered`, the escalation shows
    "Answered: <label or text>" on a success surface. On `closed`, it
    shows how the escalation ended, from the escalation the service
    returned: "Already answered: <label or text> (<channel>)" for an
    answer from another channel, or "Withdrawn" for a withdrawal, on a
    neutral surface. On `invalid`, the service's error shows under the
    controls and they enable again. On `missing` or `failed`, an error
    shows under the controls and they enable again. A shown outcome stays
    until the task is read again, after which the escalation is in Recent.
  tasks-endpoint: >-
    The tasks read model is `packages/service/src/tasks/`. `openTasks`
    takes its reads as functions and structural parts, holds no state,
    and computes each answer per request from what they return, so each
    request reads the mirror, the store, the ledger, and the escalations
    as they are. Pure functions in `tasks.ts` build the answers:
    `boardProjects(projects, trackedIssues, snapshots, openEscalations)`
    and `taskDetail(...)`. `escalationsOfTask(escalations, task,
    tokenHolder)` picks a task's escalations by the rule in `tasks-api`;
    the module reads `escalations.list({})` once per request and filters
    it in memory. Leaf state paths and blueprint version keys use the same
    functions as the actors endpoint. `requestListener` implements
    `tasks-api` and writes the JSON. A read that throws answers `500` and
    the error goes to `log` with the request path.
  tasks-public-interface: |-
    `packages/service/src/tasks/index.ts` exports exactly these names.

    ```ts
    import type { RequestListener } from "node:http";
    import type { Store } from "../store/index.ts";
    import type { TaskResponse, TasksResponse } from "@wyrd-company/manifold-shared/tasks-api";

    export function openTasks(options: TasksOptions): Tasks;

    export interface TasksOptions {
      readonly store: Pick<Store, "loadSnapshot">;
      /** The router's `held`: whether the router holds the actor now. */
      held(actorId: string): boolean;
      /** The GitHub Project bindings in force that are not archived, in declaration order. */
      boundProjects(): readonly TasksBoundProject[];
      /** The GitHub source's `trackedIssueIds` and `trackedIssue`. */
      readonly github: TasksGitHub;
      /** The ledger's `actorUsage`. */
      actorUsage(actorId: string): TasksActorUsage;
      /** The escalations module's `list`. */
      listEscalations(filter: { readonly status?: "open" | "answered" | "withdrawn" }): readonly TasksEscalation[];
      /** The T3 Code source's `thread`. */
      thread(environment: string, threadId: string): TasksThreadView | undefined;
      /** The gates module's `tokenHolder`. */
      tokenHolder(tokenId: string): string | undefined;
      readonly log?: (entry: { level: "error"; path: string; error: string }) => void;
    }

    export interface TasksBoundProject {
      readonly binding: string;
      readonly owner: string;
      readonly number: number;
      readonly item: string;
      /** The declared lifecycle field; absent when the Project declares none. */
      readonly lifecycle?: { readonly field: string; readonly options: readonly string[] };
    }

    export interface Tasks {
      list(): TasksResponse;
      get(actorId: string): TaskResponse | undefined;
      /** Mounted with `mount("/api/tasks", ...)`. */
      readonly requestListener: RequestListener;
    }
    ```

    `TasksGitHub`, `TasksActorUsage`, `TasksEscalation`, and
    `TasksThreadView` are declared structurally in the module as the
    members it reads of the GitHub source's `TrackedIssue`, the ledger's
    `LedgerActorUsage`, the escalations module's `Escalation`, and the T3
    Code source's `ThreadView`, so each part satisfies them and a test
    passes fixtures of the same shape.

    `@wyrd-company/manifold-shared` adds the subpath export `./tasks-api`,
    which exports `tasksApiPath` (`/api/tasks`), the response types of
    `tasks-api`, `isTasksResponse`, and `isTaskResponse`, and the subpath
    export `./escalations-api`, which exports `escalationsApiPath`
    (`/api/escalations`), the `Escalation` and answer types of
    `escalation-contract`, `isEscalation`, and
    `isEscalationAnswerResponse`. Both are dependency-free type guards, as
    `./actors-api` is, so the console bundles no schema compiler; a shared
    test checks each guard against the OpenAPI and JSON Schema definitions
    with fixtures that pass and fail.
  tasks-wiring: >-
    Service assembly opens the tasks read model after the sources start
    and before the host listens, and mounts its `requestListener` at
    `/api/tasks` with `mount`. `boundProjects` reads the GitHub Project
    bindings of `portfolio.current()` that are not archived, each with the
    lifecycle field the process repository revision in force declares for
    it, as the lifecycle field declaration specifies. `github` is the
    GitHub source, `actorUsage` is `portfolio.ledger.actorUsage`,
    `listEscalations` is the escalations module's `list`, `thread` is the
    T3 Code source's `thread`, `tokenHolder` is the gates module's
    `tokenHolder`, and `held` is whether the router's `held` answers for
    the actor.
  board-and-task-convergence: >-
    The tasks endpoints only read, so a request that runs twice answers
    twice from the current state. An answer from the escalation panel is
    the escalations module's `answer`: a second answer, from the panel or
    any channel, finds the escalation closed and returns the first answer,
    which the panel shows; a crash after the answer commits and before the
    browser reads the response leaves the escalation answered, and the
    next read of the task shows it in Recent. The browser's one write is
    `manifold.board.collapsed`, set to the operator's latest choice.
  board-and-task-tests: >-
    Each behavior is red before green, and tests go through public
    interfaces. In `packages/service/src/tasks/`, the endpoint test in
    `tasks-api`'s validation criteria, with a real router for the held
    state: one actor whose restore the host refuses, which is `held` with
    no errored snapshot, and one actor whose delivery errored and whose
    `release` then restored it, which is `active` while the store keeps
    its errored snapshot. In `packages/console`, unit tests
    cover the three result mappings, the lane grouping of a Project's
    tasks, including the "No status" lane, and the reading and writing of
    collapsed lanes. The browser test,
    `packages/service/src/console/board.browser.test.ts`, starts the
    production HTTP host with the built console, the console and tasks
    mounts, and the escalations API, on a store with a ledger and an
    escalations module on one database file. Fixture tasks come from
    GitHub mirror and T3 Code thread fixtures over two declared lanes; one
    task's actor is saved with a settled ledger, with a reservation and
    actuals on one account, and an open escalation raised for it with two
    choices and free text. The test opens the Board, checks the lanes and
    each card, opens the escalated task's page, checks its state,
    blueprint, thread link, and estimate, actual, variance, and reserved,
    answers the escalation with a choice from the panel, and checks the
    panel's answered outcome, the escalation in Recent after the page
    reads again, and the escalation answered once through channel `api`
    in the escalations module. It then raises a second escalation,
    answers it through `POST /api/escalations/{id}/answer` with text, and
    answers it from the panel with a choice; the panel shows the text
    answer as the one recorded, and the module holds that answer only.
  serving: >-
    The console listener serves `packages/console/dist` with `sirv`. It
    takes the request's path, which the HTTP host passes unchanged,
    removes `/console` from its start, and serves the rest from the
    directory. A `GET` or `HEAD`
    of a file answers it. A path with no file extension and no file
    answers `index.html`, so a client route loads the application; a path
    with an extension and no file answers `404`. Files under `assets/` are
    served with `Cache-Control: public, max-age=31536000, immutable`, since
    their names carry their content hash, and `index.html` with
    `Cache-Control: no-cache`. Every answer carries
    `Content-Security-Policy: default-src 'self'; style-src 'self'
    'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'`,
    `X-Content-Type-Options: nosniff`, and `Referrer-Policy: no-referrer`,
    so that the page runs only the console's own scripts. Other methods
    answer `405`. A path that leaves the
    directory answers `404`. `/console` without the slash redirects to
    `/console/`.
  actors-endpoint: >-
    The actors listener implements `actors-api`. A pure function,
    `actorSummaries(snapshots)`, turns the store's active snapshots into
    the summaries in the order the specification states: it parses
    `machine` with `parseBlueprintVersionKey`, collects the leaf state
    paths from the state value, and reads the string fields of
    `context.manifold`. The listener calls `store.activeSnapshots()` and
    `actorSummaries` for each request and writes the JSON. It holds no
    cache, so each request reads the store as it is.
  public-interface: |-
    `packages/service/src/console/index.ts` exports exactly these names.

    ```ts
    import type { HttpHost } from "../http-host/index.ts";
    import type { Store } from "../store/index.ts";

    export type { HttpListener as RequestListener } from "../http-host/index.ts";

    export interface ConsoleOptions {
      readonly store: Pick<Store, "activeSnapshots">;
      /** Directory of the built console. Defaults to the console package's `dist`. */
      readonly root?: string;
      /** Receives read failures; service assembly supplies ServiceParts.log. */
      readonly log?: (entry: { level: "error"; path: string; error: string }) => void;
    }

    /** Mounts the console's files at `/console` and the actors endpoint at `/api/actors`. */
    export function mountConsole(host: HttpHost, options: ConsoleOptions): void;
    ```

    `@wyrd-company/manifold-shared` adds the subpath export
    `./actors-api`, which exports the response types and the path.

    ```ts
    export const actorsApiPath = "/api/actors";

    export interface ActorsResponse {
      readonly actors: readonly ActorSummary[];
    }

    export interface ActorSummary {
      readonly actorId: string;
      readonly machine: string;
      readonly blueprint?: { readonly path: string; readonly commit: string };
      readonly states: readonly string[];
      readonly environment?: string;
      readonly project?: string;
      readonly issue?: string;
      readonly portfolioItem?: string;
      readonly savedAt: string;
    }

    export function isActorsResponse(value: unknown): value is ActorsResponse;
    ```
  module-layout: >-
    `packages/service/src/console/` holds `index.ts`, `static-files.ts`
    (the console listener), `actors-api.ts` (the actors listener and
    `actorSummaries`), and the tests. `HttpHost` is the service's
    production HTTP host type. The service's entry point calls `mountConsole(host, { store, log
    })` after the store opens and before the host listens. The service
    package depends on `@wyrd-company/manifold-console` and on `sirv`.
    `root` defaults to the directory of
    `import.meta.resolve("@wyrd-company/manifold-console/dist/index.html")`.
    `mountConsole` throws when `index.html` is not in `root`, so a
    service built without its console fails at start with the path it
    looked in.
  build-and-test-order: >-
    The service depends on the console package, so `pnpm -r run build`
    builds the shared package, then the console, then the service. The
    service's `test` script builds the console before it runs, as it
    already builds the shared package. The browser test uses Playwright's
    Chromium. `task install` installs it after the packages, so a
    developer machine has it after one install. CI installs it with its
    system dependencies before `task check`.
  convergence: >-
    The endpoint and the console listener only read, so a request that
    runs twice answers twice from the current store and files. A console
    build that runs twice empties `dist/` and writes the same files; a
    build that stopped halfway leaves a `dist/` that the next build
    replaces whole, and a service started on a `dist/` with no
    `index.html` refuses to start. The browser's writes are `localStorage`
    keys for theme and sidebar mode, each set to the operator's latest
    choice, so a repeated save leaves one value.
  errors: >-
    `store.activeSnapshots()` throwing answers `500` with no body detail,
    and the error goes to the service's log with the request path. A
    snapshot whose `context` or `context.manifold` is not an object gives a
    summary with no identity fields; it is not an error. The console shows
    every failed read as an alert on the screen that made it, and the shell
    keeps working.
  tests: >-
    Each behavior is red before green, and tests go through public
    interfaces. In `packages/service/src/console/`, `mountConsole` uses the
    production HTTP host on a loopback port with no credentials: the actors
    endpoint behaviors in `actors-api`'s validation criteria; a client
    route under `/console/` answers `index.html`; a hashed asset answers
    with the immutable header; a missing asset answers `404`; a path
    with `..` segments answers `404`; and `mountConsole` throws for a root
    with no `index.html`. In `packages/console`, unit tests cover the API
    result mapping, requests without browser storage or authorization,
    and `navigation.ts` (every route unique, every `DESIGN.md` sidebar
    screen present). The browser test,
    `packages/service/src/console/console.browser.test.ts`, starts the
    production HTTP host with the built console and a store holding fixture
    actors, launches headless Chromium with Playwright, and checks that
    Overview shows the shell with every navigation entry; the theme toggle
    sets the dark class and a reload keeps it; the Actors screen lists
    every fixture actor with its blueprint, current state, and environment
    without credential entry; a reload of `/console/actors` shows the same;
    and unbuilt screens, including Settings, General, show their empty
    states. Fixture values are generic and never drawn from Manifold's
    own domain.
  dependencies: >-
    The console adds `react` and `react-dom` 19, `@tanstack/react-router`,
    `@tanstack/react-query`, `@base-ui/react`, `class-variance-authority`,
    `tailwind-merge`, `lucide-react`, `tailwindcss` 4 with
    `@tailwindcss/vite`, and `@vitejs/plugin-react`, the versions T3 Code's
    web client uses where it uses them. TanStack Query is the one library
    T3 Code does not use; it is the most adopted React data-fetching
    library and holds every API read the later screens make. The service
    adds `sirv`, the static file listener Vite's preview server uses, and
    `playwright` as a development dependency for the browser test. Renovate
    keeps them current with the rest.
