$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - t3code-environment-source
    - durable-event-delivery
    - blueprint-loader
    - process-repository
  mitigates:
    - t3code-command-receipts-undocumented
  # GAP-EDGE: the technical-design schema declares no edge to the
  # specifications a design builds on; `references` is the best fit.
  references:
    - agent-threads
    - t3code-thread-events
    - t3code-environments-configuration
    - bindings-declaration
objective: >-
  Let a blueprint create agent threads on T3 Code and start turns in them
  from templates in the process repository, so that a thread is created
  once and a turn is started once for each entry of the state that asks for
  it, across a crash at any point between sending the command and saving
  its result, and so that the actor takes the changes of the turn it
  started and of no other.
background:
  problems:
    - >-
      A turn sent twice is an agent doing the work twice. An invoked promise
      that was running at a crash starts again with its actor, so whatever
      it sent before the crash, it sends again.
    - >-
      A crash after the server accepts a command and before the actor saves
      the result leaves Manifold with no record that the command was sent.
    - >-
      T3 Code 0.0.45 exposes no link from a turn to the user message that
      requested it. The server's own projection records the requesting
      message on each turn, and its read model gives the turn's
      `requestedAt` from the server-normalized command's `createdAt`, the same time it gives
      the user message.
    - >-
      Thread changes of a followed thread reach the actor whatever state it
      is in: a change of an earlier turn delivered late, a change of another
      followed thread, and a change of the actor's own turn taken before the
      command's result, live or when resume drains the inbox.
    - >-
      The environment source publishes no change at or before an
      environment's origin, which it takes asynchronously on its first
      connection, so a turn that starts and settles before the origin is
      baseline and never published.
design-challenges:
  exactly-once: >-
    A command re-sent after a crash must leave the server as if it was sent
    once: one thread, one user message, one turn.
  identity: >-
    The id of a command must be fixed before it is sent, the same each time
    the same state entry sends it, and different for every other entry.
  correlation: >-
    The actor must tell the changes of the turn it requested from every
    other change it receives, with an identity it holds durably before the
    request is sent, so that a change taken before the command's result or
    after a restart is judged the same way.
  readiness: >-
    No command may be sent on an environment before the environment source
    has committed the origin from which it publishes that environment's
    changes.
  templates: >-
    A thread name and a prompt are rendered from Nunjucks templates in the
    process repository, and a template error must reach the blueprint as an
    error it can handle.
proposed-design:
  high-level-overview: >-
    The agent threads module, `packages/service/src/agent-threads/`, gives
    the implementation registry three promise implementations,
    `thread-create`, `turn-prepare`, and `turn-start`, and one action,
    `follow-thread`. `thread-create` and `turn-prepare` derive their ids
    from the invocation, the actor id, invoke id, and entry id that the
    actor host's `invocationOf(args)` reads. `turn-start` derives its
    command id from the message id `turn-prepare` gave, which the actor
    holds in its context. Each command waits until the environment source
    is ready on the actor's environment, renders its template from the
    process repository at the commit of the actor's blueprint version, and
    is sent through a `T3Client` the module holds for the environment. The
    T3 Code server records a receipt for every command id in the
    transaction that stores the command's events, and answers a command id
    it holds a receipt for with that receipt and nothing else, so a re-sent
    command does nothing a second time. The environment source publishes
    each turn's change with the id of the user message that requested the
    turn, so a blueprint guards a turn's changes on the message id it holds.
    The inputs, outputs, errors, and id derivation are specified in
    `agent-threads`.
  command-ids: >-
    Every id a command carries is derived before the command is sent. An id
    is a UUID made from the SHA-256 digest of the namespace
    `manifold.agent-threads`, the id's kind, and the parts it is derived
    from, as `agent-threads` defines. `thread-create` derives its command id
    and thread id from the actor id, the invoke id, and the entry id.
    `turn-prepare` derives a message id the same way. `turn-start` derives
    its command id from the message id it is given, so one message id is
    sent as one command. The same state entry gives the same ids at every
    attempt, before and after a restart. A new entry of the state, such as a
    blueprint that leaves a state and enters it again, gives new ids, so it
    creates a new thread or prepares a new turn. The invoke id is in the
    derivation so that two invokes in one state entry never share an id.
  server-receipts: >-
    T3 Code 0.0.45 keeps one receipt per command id in its database, with
    the aggregate the command targeted, its status, and the sequence of its
    last event, written in the transaction that appends the command's
    events. Before it decides a command, the server reads the receipt for
    its id. An accepted receipt for the same aggregate answers with the
    receipt's sequence and appends nothing. A rejected receipt answers with
    a rejection that names the first rejection. A receipt for another
    aggregate answers with a rejection that refuses to replay it. Receipts
    are never deleted. Evidence status, measured against `t3` 0.0.45
    started on a loopback port with its own data directory: `thread.create`
    sent twice with one command id answered the same sequence both times,
    and the thread kept the first title; `thread.turn.start` sent three
    times with one command id answered the same sequence each time, and the
    thread held one user message and one turn; a turn start with a command
    id already used for another thread was rejected; a rejected command
    sent again was rejected as previously rejected; both commands sent
    again after the server was killed with `SIGKILL` and restarted on the
    same data directory answered their first sequences, and the thread held
    one user message. Reading the 0.0.45 source agrees: the orchestration
    engine checks the receipt before the decider runs, and no statement
    deletes a receipt. The live test repeats the measurement against the
    server release the environment source targets.
  thread-create: >-
    `thread-create` takes a T3code project id, a title template, the values
    the templates render against, a model selection, and optionally a
    runtime mode, an interaction mode, a branch, and a worktree path. It reads
    the invoking actor through `actorOf`, refuses an actor with no
    environment, or whose binding is archived, renders the title, waits for
    the source, and sends `thread.create` with the derived command id and
    thread id. It resolves with `{ threadId }`. The blueprint takes the
    output in the invoke's `onDone`: the `follow-thread` action appends the
    id to `context.manifold.threads`, so the actor's subscription follows
    the thread's topic from that save, and an `expression.assign` may store
    it at any other path the blueprint names. The actor host derives the
    topic of each id in `context.manifold.threads` as
    `threadTopic(context.manifold.environment, threadId)`, so the thread is
    created on that environment and on no environment an input names. The
    runtime mode is optional and defaults to `full-access`; an explicit
    mode sets the permission the thread's agent runs with.
  turn-prepare: >-
    `turn-prepare` takes no input, sends nothing, and resolves at once with
    `{ messageId }`, the message id derived from its invocation. Its
    purpose is the order of saves: the blueprint assigns the message id to
    its context in the invoke's `onDone`, and the actor's save of that
    context commits before `turn-start` is invoked, so the actor holds the
    identity of its turn before any command that could start the turn
    exists. A restart before that save runs `turn-prepare` again, which
    gives the same message id.
  turn-start: >-
    `turn-start` takes a thread id, the message id from `turn-prepare`, a
    prompt template path, the values the template renders against, and
    optionally a model selection, a runtime mode, and an interaction mode.
    A mode it is not given is the thread's current mode, read from the
    server's shell before the command. It renders the prompt, waits for the
    source, and sends `thread.turn.start` whose user message carries the
    given message id and the rendered text, with no attachments, under the
    command id derived from the message id. It resolves with
    `{ threadId, messageId }`. The thread is one the actor follows, so the
    turn's changes reach the actor through routing by the thread's topic.
  correlation: >-
    The environment source gives each turn the id of the user message that
    requested it, `messageId` on `t3.turn.started` and `t3.turn.settled`,
    as `t3code-environment-source` describes, and `null` for a turn with no
    such message. A turn started by `turn-start` carries the message id the
    actor assigned from `turn-prepare`. A blueprint takes a turn's changes
    on a state that encloses the invoking states, guarded on the thread id
    and the message id it holds:
    `event.threadId = context.thread and event.messageId = context.turn`.
    The guard holds for every change of the actor's own turn whenever it is
    taken: while `turn-start` is still sending, after it resolves, and when
    resume drains the inbox before the restarted promise resolves; a change
    taken while the promise runs exits the invoking state, which stops the
    promise, and the command it sent is already accepted. The guard fails
    for a change of an earlier turn delivered late, for a change of any
    other followed thread, and for a turn an operator started from T3 Code,
    since each carries another message id or thread id, and the actor takes
    such a change with no transition. A message T3 Code steers into a turn
    that was already running when it arrived requests no turn of its own,
    so its message id is on no turn: a blueprint sends a turn when its
    thread has no running turn, and gives its waiting state a deadline or
    an escalation for a turn that never settles. The source publishes
    `null` where it cannot tell which message requested a turn, such as two
    user messages with the same time in a snapshot, so the guard never
    takes a change it cannot attribute, and the same deadline or
    escalation covers it.
  readiness: >-
    Every command waits until the environment source reports the actor's
    environment ready: its row is committed with an origin, and its
    current connection has confirmed the server's `environmentId` against
    it. A command never waits on another environment. A restart before the
    source's first transaction for the environment commits leaves no row,
    so commands wait again until the next origin commits. While the source
    resets an environment whose `environmentId` changed, the environment is
    not ready. Each send enters the source's `write` boundary after any
    thread shell read, so it checks readiness again immediately before
    dispatch. An identity change blocks new sends and waits for admitted
    sends to finish or fail before reading the replacement origin.
    An environment the source stops fails the waiting command
    with `environment`. Every turn and thread a command makes is therefore
    created after the origin, so the source publishes its changes: a thread
    the shell lists with no row is subscribed with no cursor and compared
    with the empty state, and a running or settled turn in it is published.
  child-blueprints: >-
    A child state machine gets no routed events and no engine-owned
    identity. `thread-create` and `follow-thread` are for top-level task
    blueprints. In a child, `actorOf` has no environment, so
    `thread-create` fails with `environment`, and `follow-thread` changes
    only the child's context, and its thread is not followed. A child that
    needs a thread takes its id from the parent's input, and the parent
    takes the thread's changes.
  templates: >-
    Templates are Nunjucks. The title is an inline template in the input.
    The prompt is the repository-relative path of a template file. Both are
    rendered against the input's `values`, which the blueprint maps from
    the actor's context. Templates are read from the process repository at
    the commit of the actor's blueprint version, through `revisionAt`, so a
    restored actor renders the templates its blueprint was written with.
    Each render uses a Nunjucks environment whose loader reads only that
    revision, so an `include`, `import`, or `extends` resolves to another
    repository-relative path at the same commit. Autoescape is off, since
    the output is a prompt, not HTML, and an undefined value throws. A
    template that is missing, does not parse, reads an undefined value, or
    renders to text that is empty after trimming fails the invoke with a
    `template` error. The rendered text is trimmed. Templates are trusted as
    the process repository is: they render in the service process, and a
    template can run whatever Nunjucks lets a template run.
  clients: >-
    The module holds one `T3Client` per environment, created on the first
    command for the environment, with the environment's `url`, `reconnect`
    backoff, `heartbeat`, and `openTimeoutMs`, and a credential store that
    reads the token file of the environment's `t3code-token` credential
    each time it is asked and refuses every write, as the environment
    source does. Commands go through the client's
    `threads.dispatcher.dispatch`, which validates the command, sends it
    over the socket, and falls back to `POST /api/orchestration/dispatch`
    when the socket cannot open. The module adds no client release:
    `dispatch` takes a command with the ids the module derived.
  credentials: >-
    The token of an environment's `t3code-token` credential needs the
    `orchestration:operate` scope for `thread.create` and
    `thread.turn.start`, and the `orchestration:read` scope the environment
    source and the mode read use. One credential per environment serves
    both modules.
  validation: >-
    Each input is validated at the boundary against its definition in
    `agent-threads`, whose fields hold to the command schema of the client
    release: a provider instance id is a slug of letters, digits, `-`, and
    `_` that starts with a letter, at most 64 characters; a model, a
    branch, and a worktree path are strings that are not empty after
    trimming; option values are strings or booleans. The module trims the
    strings it passes, so the client's own trimming changes nothing. An
    input that fails fails the invoke with `input`. The client validates
    every command again before it sends it, and a command it refuses with
    `T3PreconditionError` fails with `input` too, carrying the client's
    message, so a difference between the two schemas surfaces as the same
    kind and never as `rejected`.
  failures: >-
    A failure that leaves the command's fate unknown is retried, and every
    other failure fails the invoke. A connection that is lost or cannot
    open is retried with the same command and the same ids after the next
    delay of the environment's `reconnect` backoff, with no limit, until
    the server answers or the invoke is stopped; the receipt makes a retry
    of a command the server already accepted answer its first result.
    Otherwise the promise rejects with an agent thread error, a plain
    object so that it survives a snapshot save and expression evaluation,
    whose `kind` is one of: `input`, an input that fails its schema or a
    command the client refuses before sending; `environment`, an actor with
    no environment, one service configuration does not declare, or one the
    source has stopped; `archived`, a `thread-create` through an archived
    binding; `template`, a template error; `rejected`, a command the server
    rejects, with the server's message, including a command rejected before
    and sent again; and `unauthorized`, a token the server or the client
    refuses, or one without the scope the command needs. A rejected command
    stays rejected for its message id or state entry, since its ids are the
    same, so a blueprint that retries prepares a new turn or enters the
    state again.
  public-interface: |-
    `packages/service/src/agent-threads/index.ts` exports exactly these
    names.

    ```ts
    import type { Logger } from "@wyrd-company/t3code-client";
    import type { ProcessRepositoryRevision } from "@wyrd-company/manifold-shared";
    import type { fromPromise } from "xstate";
    import type { Invocation, ActorHost } from "../actor-host/index.ts";
    import type { ImplementationRegistry } from "../blueprint-loader/index.ts";
    import type { EnvironmentsConfiguration } from "../t3code-source/index.ts";

    export function openAgentThreads(options: AgentThreadsOptions): AgentThreads;

    export interface AgentThreadsOptions {
      /** The loaded `environments` section, defaults applied. */
      readonly environments: EnvironmentsConfiguration;
      /** Resolves a `t3code-token` credential name to its token file path. */
      readonly tokenFile: (credential: string) => string;
      /** The actor host's `actorOf`; undefined for an actor it does not hold. */
      readonly actorOf: ActorHost["actorOf"];
      /** The actor host's invocation reader receives the full creator args. */
      readonly invocationOf: (args: Parameters<Parameters<typeof fromPromise>[0]>[0]) => Invocation;
      /** Whether the binding of a GitHub Project binding name is archived, at the current revision. */
      readonly bindingArchived: (project: string) => boolean;
      /** The environment source's `ready`. */
      readonly sourceReady: (environment: string, signal?: AbortSignal) => Promise<void>;
      /** The environment source's write admission boundary. */
      readonly sourceWrite: <T>(environment: string, signal: AbortSignal, send: () => Promise<T>) => Promise<T>;
      readonly revisionAt: (commit: string) => Promise<ProcessRepositoryRevision | undefined>;
      /** Called after the server answers a command and before the promise resolves. */
      readonly probe?: (accepted: AcceptedCommand) => void;
      readonly logger?: Logger;
    }

    export interface AcceptedCommand {
      readonly implementation: "thread-create" | "turn-start";
      readonly commandId: string;
      readonly sequence: number;
    }

    export interface AgentThreads {
      /** `thread-create`, `turn-prepare`, `turn-start`, and `follow-thread`. */
      readonly implementations: ImplementationRegistry;
      /** Stops waits and retries, closes every client; resolves when they are closed. */
      stop(): Promise<void>;
    }

    export type { AgentThreadError, AgentThreadErrorKind } from "./types.ts";
    ```

    The actor host answers `actorOf` from `start`'s input or the restored
    snapshot and blueprint version, before it starts or restores the actor,
    so an invoke in an initial state reads the same answer as any other.
    `bindingArchived` is answered by the service wiring from the portfolio
    module's bindings at the current revision, for the binding named by
    `manifold.project`; an actor with no `project` is not archived.
  module-layout: >-
    `index.ts` re-exports the public names. `ids.ts` holds the pure id
    derivation. `inputs.ts` validates each input against its schema at the
    boundary. `templates.ts` renders a title and a prompt from a revision.
    `commands.ts` builds each command from the ids, the input, and the
    rendered text, and maps a client error to a kind. `clients.ts` holds
    the client per environment. `dispatch.ts` waits for the source, sends a
    command, and retries a connection failure. `implementations.ts` builds
    the registry part. Tests import only `index.ts`.
  convergence: >-
    `thread-create` run twice for one state entry sends one command id with
    one thread id, so the server creates one thread and answers both with
    the first sequence. `turn-prepare` run twice gives one message id.
    `turn-start` run twice for one message id sends one command id, so the
    server holds one user message and one turn. A crash before the server
    records a command leaves nothing on the server, and the restarted
    promise sends it as the first time. A crash after the server records it
    and before the actor saves the result restarts the promise, which sends
    it again and is answered with the first receipt. `follow-thread` twice
    follows the thread once. A command the server rejected is rejected
    again with the same kind. A stop during a wait or a retry sends nothing
    more. A promise stopped by a state exit while its command is in flight
    leaves the command's fate to the server; a later entry sends new ids.
  dependencies: >-
    `@wyrd-company/t3code-client` 0.5.0, the release the environment source
    uses: `T3Client`, `threads.dispatcher.dispatch`, `threads.get`,
    `T3PreconditionError`, `commandId`, `threadId`, and `messageId`.
    `nunjucks` for templates, with its own type declarations from
    `@types/nunjucks`; its releases are infrequent. The module reads the
    process repository through the `revisionAt` its options give it, and
    waits on the environment source's `ready`.
  tests: >-
    Tests run against the fake T3 Code server of the environment source's
    test suite, which also answers `orchestration.dispatchCommand` and
    `POST /api/orchestration/dispatch` with receipts that behave as the
    server receipts measured above: the same command id for the same
    aggregate answers the first sequence and appends nothing, a rejected id
    is rejected again, and an id used for another aggregate is rejected.
    Behaviours proved, each red before green, through a real router, store,
    actor host, and environment source: a blueprint that invokes
    `thread-create`, `turn-prepare`, and `turn-start` creates one thread
    with the rendered title, starts one turn with the rendered prompt and
    the prepared message id, and takes that turn's `t3.turn.started` and
    `t3.turn.settled`; ids are the same for one entry and differ for a
    second entry of the same state; a settlement of an earlier turn of the
    same thread delivered after the next turn is prepared, and a settlement
    of a turn in a second followed thread, and a settlement the source
    publishes with a `null` message id because two user messages in a
    snapshot share the turn's `requestedAt`, each leave the actor waiting,
    and the actor then takes its own turn's settlement; a turn the fake
    server settles before `turn-start` resolves is taken from the
    enclosing state; with the source's first connection held back, a
    command waits, the fake server's turn starts and settles at once after
    the command, and the actor takes both changes; a restart before the
    source's first transaction commits leaves the command waiting until
    the next origin; `thread-create` through an archived binding, for an
    actor with no environment, and in a child blueprint each fail with
    their kind; inputs with a provider instance id that is not a slug, an
    empty or blank branch or worktree path, and a blank model each fail
    with `input` before anything is sent, and a command the client refuses
    fails with `input`; a missing template, a template that does not
    parse, an undefined value, an `include` of a missing path, and an empty
    render each fail with `template`; a command the server rejects fails
    with `rejected` and the server's message, and fails the same way when
    sent again with the same ids; a token without `orchestration:operate`
    fails with `unauthorized`; a connection that drops after the server
    accepts and before it answers is retried and the server holds one
    turn; and `follow-thread` taken twice follows once. The fault tests run
    the service in a child Node process, which kills itself with `SIGKILL`
    from the `probe` after the server answers and before the result is
    saved, and the test asserts the signal, starts it again on the same
    file, and checks the fake server: after a kill in `turn-start`, the
    thread holds exactly one user message and one turn, and the actor
    reaches the state its blueprint enters on that turn's
    `t3.turn.settled`; after a kill in `thread-create`, the project holds
    one thread, and the actor follows it. The live test, run by the service
    package's `test:live` script and not by `task check`, starts the `t3`
    release the environment source targets, pinned as a devDependency, on a
    loopback port with its own data directory and a provider instance that
    is not configured, so no agent runs, and repeats the receipt
    measurement: `thread.create` and `thread.turn.start` each sent twice
    with one command id, and again after the server is killed with
    `SIGKILL` and restarted, give one thread and one user message. With a
    configured provider, and only when the run asks for agent turns, it
    also shows that a thread snapshot's latest turn has the `requestedAt`
    of the user message that requested it, which the source's attribution
    from a snapshot rests on and which the 0.0.45 projection source shows:
    both are the server-normalized command's `createdAt`. Values are generic and never drawn from Manifold's
    own domain.
