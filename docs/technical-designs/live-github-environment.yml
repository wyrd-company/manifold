$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - github-event-source
    - service-assembly
    - service-configuration
    - intake
    - escalations
  mitigates:
    - github-fakes-diverge-from-github
  # GAP-EDGE: the technical-design schema declares no edge to the
  # specifications a design builds on; `references` is the best fit.
  # `service-configuration` under `related-to` is the technical design of
  # that name; the specification of the same name is referenced here.
  references:
    - service-configuration
    - github-source-configuration
    - escalations-configuration
    - escalation-contract
    - actors-api
    - github-source-database-schema
objective: >-
  Give Manifold a live GitHub test environment in the `mmenm` organization,
  so that checks and acceptance runs reach real GitHub through the Manifold
  GitHub App and a signed organization webhook, and a difference between
  GitHub and the fakes of the integration tests shows before user
  acceptance.
background:
  current-design: >-
    Every module that talks to GitHub runs only against fakes: signed
    webhook deliveries, GraphQL reads, the sweep, the redelivery scan, and
    the App installation token. The service listens on loopback, serves its
    API without authentication, mounts the GitHub source at
    `githubWebhookPath`, `/webhooks/github`, and the escalation answer page
    at `/escalations`. GitHub hooks do not get their URL from the service:
    an account owner creates each hook with its URL, and service
    configuration holds only the hook's id and secret file. The agent
    threads module has one live check, `test:live`, run outside
    `task check`. Pinggy's documented forwarding sends every path of the
    public URL to one local address; it has no setting that forwards some
    paths and refuses others.
  problems:
    - >-
      A difference between GitHub and the fakes, such as a payload shape, a
      permission the installation token lacks, or a delivery GitHub does not
      send, is found only at user acceptance.
    - >-
      GitHub can reach a service on loopback only through a tunnel, and a
      tunnel that forwards every path exposes the unauthenticated API.
    - >-
      Test resources made by hand in a shared organization drift, and
      cleaning them up by hand can remove a resource no test made.
design-challenges:
  convergence: >-
    Provisioning and teardown make many GitHub calls, and a run can stop
    after any of them. Each run, from any start state, must end in the same
    state, and must touch only resources the tooling made.
  exposure: >-
    The tunnel must pass GitHub's deliveries and, when a test needs them,
    escalation answers, and nothing else, including paths that the
    service's prefix match would take, such as `/webhooks/github/x`.
  moving-url: >-
    A tunnel can get a new public URL on each start and on each reconnect,
    and the organization hook and `escalations.publicUrl` must follow it.
  evidence: >-
    The smoke check must show that GitHub sent a delivery and the service
    accepted it, and that the sweep, not a delivery, found a change.
  secrets: >-
    The tooling reads four credentials and generates one, and no value may
    reach its output, a generated file other than the secret's own file,
    the worktree, or a conversation.
proposed-design:
  high-level-overview: >-
    The tooling is a private workspace package at `testing/live-github/`,
    outside `packages/`, that no service or host CLI code imports. Five
    Taskfile targets call its entry points. `live:provision` makes, in the
    organization, a test repository with seed issues, a test process
    repository with its content committed, an organization-owned test
    Project holding the seed issues, and an inactive organization webhook;
    it writes the hook's secret and a service configuration to a state
    directory outside the worktree. `live:start` runs a supervisor in the
    foreground: it starts a local forwarder that passes only the allowed
    paths, a Pinggy tunnel to the forwarder through OpenSSH, and the built
    service on loopback, and then points the hook at the tunnel and makes
    it active. `live:smoke` runs the live smoke check against the started
    environment and scans its output and the generated files for credential
    values. `live:stop` stops the supervisor. `live:teardown` removes every
    resource provisioning made, and only those. Every GitHub resource
    carries an ownership marker, and the tooling finds, adopts, and removes
    only resources that carry it. The service gets no new configuration
    setting.
  location: >-
    `testing/live-github/` holds `package.json` (private,
    `@wyrd-company/manifold-live-github`), `README.md`, `settings.yml`,
    `src/`, and `content/`. `pnpm-workspace.yaml` adds `testing/*`, so the
    package's tests, lint, and typecheck run in `task check`. Its entry
    points are TypeScript files that Node runs directly, as the agent
    threads live check runs: `src/provision.ts`, `src/start.ts`,
    `src/stop.ts`, `src/smoke.ts`, and `src/teardown.ts`. Each takes no
    argument other than the flags below and exits non-zero on failure. The
    package depends on `@octokit/request`, `@octokit/graphql`, and
    `@octokit/auth-app`, which the service already uses, and on `yaml`.
    Nothing in `packages/` imports it.
  targets: |-
    `Taskfile.yml` gains these targets. None is a dependency of `check`.

    | Target | Runs | Does |
    |---|---|---|
    | `live:provision` | `src/provision.ts` | Converges the GitHub resources, the hook secret, and the service configuration. `CONTENT=<directory>` takes the process repository content from another directory. |
    | `live:start` | `task build`, then `src/start.ts` | Runs the supervisor in the foreground until `live:stop`, `SIGINT`, or `SIGTERM`. `ANSWERS=1` also passes escalation answers. `OVERLAY=<file>` merges a configuration overlay. |
    | `live:stop` | `src/stop.ts` | Asks the supervisor to stop through its control socket and waits for it to end, then stops any child a dead supervisor left. |
    | `live:smoke` | `src/smoke.ts` | Runs the live smoke check against the started environment, then the secret scan. |
    | `live:teardown` | `src/teardown.ts` | Converges to no resource. Refuses while a supervisor runs. |
  settings: |-
    `settings.yml` is committed and holds no credential value. The tooling
    reads it at each run. Environment variables of the same name in upper
    snake case override the credential file paths.

    ```yaml
    organization: mmenm
    marker: live-env-owned
    repository: fixture-app
    processRepository: fixture-settings
    project: Fixture board
    seedIssues: 2
    credentials:
      patFile: ~/gh_manifold_pat
      pinggyTokenFile: ~/pinggy_access_token
      appEnvFile: ~/manifold-app.env
      appPrivateKeyFile: ~/manifold-app.pem
    pinggyHost: pro.pinggy.io
    sweepIntervalMs: 60000
    ```

    The names are generic and are not drawn from Manifold's domain. The
    state directory is `$XDG_STATE_HOME/manifold-live-github/`, or
    `~/.local/state/manifold-live-github/` when `XDG_STATE_HOME` is unset.
    It is created with mode `0700`, and every file in it with mode `0600`.
  state-directory: |-
    | File | Written by | Holds |
    |---|---|---|
    | `resources.json` | provision, teardown | The id, node id, name, and number of each resource the tooling made, and the head commit it wrote to the process repository. |
    | `hook.secret` | provision | The organization hook's secret, 32 random bytes in hex, that the hook holds. A credential file. |
    | `hook.secret.pending` | provision | A new secret not yet known to be on the hook. Present only between its generation and the hook update that applies it. A credential file. |
    | `service.yml` | provision, start | The service configuration. |
    | `service/` | the service | The store database, the process repository clone, and the service's log. |
    | `tunnel/` | start | The OpenSSH configuration that holds the Pinggy token, a credential file removed when the tunnel stops, and the tunnel's known hosts and log. |
    | `control.sock` | start | The supervisor's control socket, a Unix domain socket. Bound only while a supervisor runs. |
    | `children.json` | start, stop, teardown | One entry for each child process the supervisor started and has not yet seen end: its role, process id, and process start time. |
    | `smoke/<run-id>.log` | smoke | The smoke check's output, as it also printed it. |
  credentials: >-
    The tooling reads each credential from its file when a step needs it,
    holds it in memory, and passes it to the one client or process that
    needs it, never through a command line argument, a log line, or a file
    other than its own. The PAT goes only to the Octokit clients of
    provisioning, teardown, and the smoke check's GitHub calls. The Pinggy
    token goes only into the tunnel's OpenSSH configuration file, as the
    `User`, so that no process listing shows it. The App's private key file
    is named by its path in `service.yml`, and the tooling reads it only to
    mint an installation token for the preflight. `~/manifold-app.env` is
    parsed as `KEY=VALUE` lines; the tooling uses `APP_ID` and
    `INSTALLATION_ID` and ignores the rest, since the `github-app`
    credential kind takes the numeric app ID and installation ID. The app
    ID and the installation ID are identifiers, not credentials: they are
    written into `service.yml` and are never printed. The credential values
    are the PAT, the Pinggy token, the hook secret, and the App's private
    key. The service is started with an environment that holds only
    `PATH`, `HOME`, `NODE_ENV`, and the variables Node needs, so no
    variable passes the PAT or the Pinggy token to it.
  ownership: >-
    Each GitHub resource the tooling makes carries the marker from
    `settings.yml` in a field of the request that creates it, so that no
    resource exists, even for a moment, without it: each repository's
    description is `Test fixture (<marker>)`; the Project's title is
    `<project> (<marker>)`, since `createProjectV2` takes no description;
    each seed issue's body ends with an HTML comment holding it; and the
    organization hook's URL carries it as the query parameter
    `owner-marker`. No later write adds or changes a marker. A resource is
    the tooling's own only when it carries the marker. Provisioning finds each resource by its
    name and marker, adopts one it finds, and makes one it does not.
    When a resource has the name and no marker, provisioning stops with
    an error that names it, and never changes or adopts it. Teardown
    removes only resources that carry the marker. `resources.json` is a
    record of what the tooling made, not the source of ownership, so a
    lost or stale file never makes the tooling touch another resource. The
    marker in a hook URL does not reach the service: the forwarder sends
    the path alone.
  preflight: >-
    Provisioning, start, smoke, and teardown first check what they need,
    and stop with a message that names the missing piece and no value:
    each credential file they read exists and is not empty; the PAT
    authenticates; with a classic PAT, its `X-OAuth-Scopes` header names
    `repo`, `project`, and `admin:org_hook`, and also `delete_repo` for
    teardown; the organization exists; and, for start and smoke, the App's
    installation token lists the test repository and the test process
    repository among `GET /installation/repositories`. A fine-grained PAT
    has no scope header, so its missing permission shows as the `403` of
    the first call that needs it, named by the operation. The tooling
    reports a missing scope or installation access; it does not work
    around it.
  provision: |-
    Provisioning converges each resource in this order. Each step reads
    first, writes only on a difference, and reports the resource as
    `present`, `created`, or `updated`. A second run reports every resource
    `present` and makes no write to GitHub or to a file.

    1. The hook secret. When neither `hook.secret` nor
       `hook.secret.pending` exists, a new secret is written to
       `hook.secret.pending`. Step 7 applies it.
    2. The test repository: private, initialized with a README, with the
       marker in its description, all in the one create request.
    3. The seed issues `Sample item 1` to `Sample item <seedIssues>` in the
       test repository, each with the marker in its body.
    4. The test Project, owned by the organization, with the marker in its
       title. Its lifecycle field is the built-in single-select `Status` field with
       the options `Todo`, `In Progress`, and `Done`; provisioning checks
       that it exists with those options and stops with an error when it
       does not.
    5. Each seed issue as an item of the Project.
    6. The test process repository: private, initialized, with the marker
       in its description, in one create request. Its default branch holds the content directory's files, with
       each GitHub Project binding in `bindings.yml` set to the
       organization and the test Project's number. Provisioning builds the
       tree through the Git Data API and compares its tree SHA with the
       branch head's; it commits and moves the branch only when they
       differ.
    7. The organization hook: `application/json`, SSL verification on,
       and the events `github-event-source` lists for an organization
       hook: `issues`, `issue_dependencies`, `sub_issues`,
       `projects_v2_item`, `projects_v2`, and `push`. A new hook is made
       inactive, with the URL
       `https://hook.invalid/webhooks/github?owner-marker=<marker>`,
       because no tunnel exists yet. An existing hook keeps its URL and its
       `active` value, and gets the events set when they differ. The
       secret follows the rule below.
    8. `resources.json`, then `service.yml` (see Service configuration).

    The hook secret converges through `hook.secret.pending`, a secret the
    hook may not hold yet. When the pending file exists, step 7 sends its
    secret in the hook's create or update request, and after GitHub
    answers it renames the pending file over `hook.secret`, which is
    atomic. When only `hook.secret` exists, the hook holds it: the file is
    renamed into place only after the hook took it, and a hook is made
    only with a secret from one of the two files. A run stopped after the
    pending file is written and before the rename leaves the pending file,
    so the next run sends it again, whether or not the hook took it the
    first time. A lost `hook.secret` with no pending file gives a new
    pending secret at step 1, which step 7 sets on the existing hook.
    `service.yml` names `hook.secret`, so the service reads only a secret
    the hook holds.

    A run stopped after any write leaves resources that carry the marker,
    since each create request carries it, and a record that may lack them.
    The next run finds them by name and marker and continues from the
    first step whose resource differs. A seed issue whose creation was
    answered but not recorded is found by title and marker, so no second
    copy is made.
  service-configuration: |-
    Provisioning writes `service.yml`, and start rewrites it when the
    tunnel URL or the overlay changes it:

    ```yaml
    processRepository:
      url: https://github.com/mmenm/fixture-settings.git
      credential: live-app
      directory: service/clone
    store:
      file: service/manifold.sqlite
    http:
      host: 127.0.0.1
      port: 0
    credentials:
      live-app:
        kind: github-app
        appId: <APP_ID>
        installationId: <INSTALLATION_ID>
        privateKeyFile: /home/<user>/manifold-app.pem
    github:
      owners:
        mmenm:
          credential: live-app
          hooks:
            - id: <hook id>
              secretFile: hook.secret
      sweepIntervalMs: 60000
    ```

    `sweepIntervalMs` is shorter than the default so that the sweep step
    of the smoke check ends in a few minutes. With `ANSWERS=1`, start adds
    `escalations.publicUrl` as the tunnel URL. `OVERLAY=<file>` names a
    YAML file whose sections are merged over the generated ones, so that a
    later check can add `environments`, `escalations.destinations`, and
    their credentials; the generated `processRepository`, `store`,
    `http`, `github`, and `live-app` credential win over the overlay. No
    value in `service.yml` is the PAT, and no path in it names the PAT
    file.
  forwarder: |-
    The forwarder is a Node HTTP server in the supervisor, bound to
    `127.0.0.1` on a free port. It is the tunnel's only target. It decides
    on the raw request target, before any decoding, and passes a request
    to the service only when one rule matches:

    | Method | Path, the request target before `?` | Passed when | Sent to the service as |
    |---|---|---|---|
    | `POST` | exactly `/webhooks/github` | always | `/webhooks/github`, the query dropped |
    | `GET` | matches `^/escalations/[A-Za-z0-9_-]{22}$` | `ANSWERS=1` | the same path and query, unchanged, since the query holds the answer key |
    | `POST` | matches `^/escalations/[A-Za-z0-9_-]{22}/answer$` | `ANSWERS=1` | the same path, the query dropped |

    The two escalation rows are the answer page that an ntfy notification
    opens and the answer that its buttons and the page's form send; the
    escalation's key authorizes both. Every other request, including
    another method on an allowed path, a path with a trailing `/`, an extra
    segment, a percent-encoded or dot segment, `/api/` and everything under
    it, `/escalations` itself, and `/`, and both escalation rows when
    answers do not pass, is answered by the forwarder with `404`, the
    header `x-live-forwarder: refused`, and an empty body, and never
    reaches the service. A passed request keeps its method, body, and
    headers, without hop-by-hop headers, and the service's answer goes
    back unchanged. The service never sends `x-live-forwarder`, so the
    header tells a refusal from a service answer. Until the service is
    listening, the forwarder answers a passed path with `503`. The
    forwarder logs each decision, with the method, the path without its
    query, and the outcome, to the supervisor's log, so that no answer key
    is logged.
  tunnel: >-
    The supervisor starts OpenSSH as `ssh -F <tunnel config> -T -N live`,
    with the config holding `HostName` from `settings.yml`, `Port 443`,
    `User` the Pinggy token, `RemoteForward 0 127.0.0.1:<forwarder port>`,
    `LocalForward 127.0.0.1:<free port> localhost:4300`,
    `ServerAliveInterval 30`, `ExitOnForwardFailure yes`,
    `StrictHostKeyChecking accept-new`, and `UserKnownHostsFile` in
    `tunnel/`. The tunnel is a child process, started and stopped as
    Children states. The supervisor reads the public HTTPS URL from Pinggy's
    web debugger at `/urls` through the local forward, and fails start when
    no HTTPS URL is read within 30 seconds. When the tunnel process ends
    while the supervisor runs, the supervisor starts it again after 5
    seconds, with no limit, and on a new URL points the hook at it, and,
    with `ANSWERS=1`, rewrites `escalations.publicUrl` and restarts the
    service. The tunnel configuration file is removed when the tunnel
    process ends and rewritten at its next start.
  control: >-
    The supervisor binds `control.sock` in the state directory, which only
    its user can reach, before it does anything else, and serves two
    requests, each one JSON line answered by one JSON line. `status`
    answers the environment's instance id, the tunnel URL, the service's
    loopback address, the service's process id and start time, and whether
    answers pass. `stop` answers `stopping`, runs the shutdown below, and
    closes the socket when the shutdown ends. Stop, smoke, and teardown
    reach the supervisor of this state directory only through the socket,
    so that none of them signals a process found by its id. A socket file
    that no supervisor answers is stale; the next start or stop removes
    it.
  children: >-
    The supervisor starts each child, the tunnel and the service, through
    a gate, so that no child runs a program unless it is recorded first.
    It spawns `sh -c 'read -r go && exec "$0" "$@"'` with the program and
    its arguments, and with standard input a pipe from the supervisor. It
    then reads the child's start time, field 22 of `/proc/<pid>/stat`;
    writes the child's role, process id, and start time to
    `children.json` through a temporary file and a rename; and only then
    writes `go` to the pipe and closes it. `exec` keeps the process id and
    the start time, so the record names the program's own process. When
    the supervisor dies before `go`, the pipe closes, `read` fails, and
    the shell exits without running the program. When a child ends while
    the supervisor runs, its entry is removed. Recovery stops what a dead
    supervisor left: for each entry, when `/proc/<pid>/stat` exists and
    holds the recorded start time, it sends `SIGTERM`, waits up to 60
    seconds for the process to end, and sends `SIGKILL` when it has not;
    an entry whose process is gone or holds another start time is a
    reused process id, and is removed with no signal. Start, stop, and
    teardown run recovery when no supervisor answers the socket. The
    process identity check reads `/proc`, so the supervisor runs on Linux,
    as the devcontainer does.
  start: |-
    The supervisor runs these steps, then waits:

    1. Binds `control.sock`. When a supervisor answers on it, start
       refuses. When none answers, start removes the stale socket file,
       binds it, and runs recovery.
    2. Runs the preflight, and reads `resources.json`; stops when
       provisioning has not run.
    3. Starts the forwarder.
    4. Starts the tunnel and reads its URL.
    5. Writes `service.yml` with the tunnel URL and the overlay.
    6. Starts the service as
       `node packages/service/dist/main.js <state>/service.yml` from the
       worktree it runs in, through the gate, with the environment the
       Credentials section states, and stdout and stderr to
       `service/service.log`. It reads the bound address from the
       service's `started` log line, and fails start when the line does
       not appear within 120 seconds.
    7. Sets the organization hook's URL to the tunnel URL plus
       `/webhooks/github?owner-marker=<marker>` and `active` to true, each
       only when it differs. A start with the same URL changes nothing.
    8. Answers `status`, and prints the tunnel URL and the loopback
       address of the service.

    The shutdown runs on `SIGINT`, `SIGTERM`, or a `stop` request, and
    after a failed step, in reverse order of what started: it sets the
    hook inactive, so that no delivery goes to a URL another Pinggy user
    may later hold; stops the service with `SIGTERM` and waits up to 60
    seconds for it to end, then `SIGKILL`; stops the tunnel the same way;
    stops the forwarder; removes each stopped child's entry; and closes
    and removes the socket. A supervisor killed at any step, including
    before the service starts, leaves only gated children recorded in
    `children.json`, an active or inactive hook, and a stale socket file.
    The next start, stop, or teardown stops the recorded children through
    recovery before it starts anything, and start's step 7 corrects the
    hook.
  stop: >-
    `live:stop` sends `stop` on `control.sock` and waits up to 60 seconds
    for the socket to close. When no supervisor answers, it removes the
    stale socket file. In both cases it then runs recovery, and reports the
    environment stopped. It signals no process other than the recorded
    children whose start time matches.
  smoke: |-
    `live:smoke` asks the supervisor for `status` on `control.sock`, fails
    when no supervisor answers, and runs the steps in order. It prints
    each step as `PASS` or `FAIL` with the reason, writes the same lines to
    `smoke/<run-id>.log`, runs every step even after a failure where the
    step does not need an earlier step's result, and exits non-zero on any
    failure. Each wait polls every 2 seconds up to its limit.

    0. **Configuration.** `service.yml` holds no PAT value and names no
       PAT file, and the service process's environment, read from
       `/proc/<service pid>/environ` after its start time is checked
       against the one `status` reports, holds no PAT value.
    1. **Delivery.** It creates an issue `Sample item <run-id>` in the test
       repository and adds it to the Project. Within 60 seconds, the
       organization hook's delivery log, read with the PAT, holds a
       `projects_v2_item` delivery whose payload's `content_node_id` is the
       issue's node id and whose status code is `202`, and the service's
       store, opened read-only, holds a `github_delivery` row with that
       delivery's GUID.
    2. **Intake.** Within 60 seconds of step 1, `GET /api/actors` on the
       service's loopback address lists the actor `task:<issueNodeId>`.
    3. **Sweep.** It sets the hook inactive and reads it back inactive,
       creates a second issue, and adds it to the Project. Within
       `2 × sweepIntervalMs + 60` seconds, `GET /api/actors` lists the
       actor of that issue, and the hook's delivery log holds no delivery
       that names it. The hook is set active again in every outcome of
       the step, including a failure and an interrupt.
    4. **Tunnel paths.** Through the tunnel URL: `POST /webhooks/github`
       with an unsigned body gets the service's rejection, `400`, `401`,
       or `404`, with no `x-live-forwarder`; `GET /webhooks/github`,
       `POST /webhooks/github/x`, `GET /api/actors`, `GET /escalations`,
       `GET /escalations/<22 characters>/answer`, and `GET /` each get the
       forwarder's refusal. When the supervisor reports that answers
       pass, `GET /escalations/<22 characters>?key=<random>` and
       `POST /escalations/<22 characters>/answer`, with a form body holding
       a key and a choice, each get the service's `404` for an unknown
       escalation, with no `x-live-forwarder`; when answers do not pass,
       each gets the forwarder's refusal.
    5. **Secret scan.** The scan below over the smoke log and the
       generated files.

    The issues the smoke check makes stay in the test repository and on
    the Project, and teardown removes them with the repository.
  secret-scan: >-
    The scan reads the four credential values from their files and looks
    for each, as written and in its base64, URL-encoded, and JSON-escaped
    forms, and for each 64-character base64 line of the private key's body,
    in: the smoke log of this run; every file under the state directory
    except `hook.secret` and the tunnel configuration file, which are the
    credentials' own files; and every file `git ls-files --cached --others
    --exclude-standard` lists in the worktree. A match fails the scan with
    the file's path and the credential's name, never the value or its
    context, and the scan's own output holds no value. Tests in
    `task check` prove the scan with synthetic credential files. A
    generated file holding one value in each form fails it, and the same
    files without it pass. A smoke run whose step list holds one extra
    step that prints a synthetic value through the smoke check's reporter,
    the one path by which every step writes to standard output and to the
    smoke log, exits non-zero; its scan names the smoke log's path and the
    credential's name, and its scan report holds no value. The same run
    without that step passes the scan.
  teardown: |-
    Teardown refuses while a supervisor answers on `control.sock`, and
    otherwise runs recovery first. It converges to no resource, in this order, and reports each resource `absent` or
    `removed`. A second run reports every resource `absent`.

    1. The organization hook carrying the marker in its URL.
    2. The Project carrying the marker.
    3. The test repository and the test process repository carrying the
       marker in their description, which removes their issues.
    4. The state directory's `hook.secret`, `hook.secret.pending`,
       `service.yml`, `service/`, `tunnel/`, `children.json`, and
       `resources.json`. The smoke logs stay.

    A resource with a test name and no marker is reported `foreign` and
    left. A run stopped after any step leaves fewer marked resources, and
    the next run removes the rest.
  public-url-seam: >-
    The GitHub event source needs no public base URL in service
    configuration. A hook's URL lives in GitHub, set by whoever owns the
    hook, here the supervisor through the PAT, and the service only
    verifies deliveries against the hook's id and secret file. The
    tunnel URL reaches GitHub as the organization hook's URL, the tunnel
    URL plus `githubWebhookPath`, set at each start and each new tunnel
    URL. It reaches the service only as `escalations.publicUrl`, written
    into `service.yml` when answers pass, so that an ntfy notification's
    link opens `{publicUrl}/escalations/{id}?key={key}` and its buttons
    post to `{publicUrl}/escalations/{id}/answer` through the tunnel. The README
    states both.
  readme: >-
    `testing/live-github/README.md` states: what the environment is for;
    the prerequisites, which are the four credential files by path, the
    PAT's scopes, the App installed on the organization with access to the
    two test repositories, and OpenSSH; each target with its flags; the
    state directory and its files; how the hook URL and
    `escalations.publicUrl` follow the tunnel; which paths the tunnel
    passes; that one environment exists per organization at a time; and
    that no credential value is ever printed.
  tests: >-
    Each behaviour is written red before green, and runs in `task check`
    with no credential and no network. A stateful fake of the GitHub REST
    and GraphQL calls the tooling makes, which records each call, backs
    the convergence tests: provisioning from nothing makes every resource;
    a second run reports every resource `present` and records no write;
    for each write in a clean run, to GitHub or to a file, the fake or
    the file layer fails the run right after that write takes effect, and
    the run made again ends in the clean run's state with no duplicate and
    with no unmarked resource; a run that loses `hook.secret` and then
    stops after the pending secret is written, and another that stops
    after GitHub takes the secret and before the rename, each end with the
    hook holding the secret `hook.secret` holds; a resource
    with a test name and no marker stops provisioning and survives
    teardown; teardown removes every marked resource, a second teardown
    records no write, and a teardown stopped after each removal converges
    on its next run. Forwarder tests send each row of the forwarder table
    and each refused form to a forwarder in front of an echo server, with
    and without answers, and check the status, the header, and what the
    echo server received, and that a passed answer page keeps its query
    while the log line holds none. Supervisor tests use child programs
    that only sleep, in place of OpenSSH and the service: a supervisor
    killed with `SIGKILL` before a child's `go`, after it, and after
    every child started leaves no child running a program that
    `children.json` does not record, and the next start and the next stop
    each end every recorded child; a `children.json` that names a running
    process, also a `src/start.ts` process, under another start time is
    removed and the process is left running; a second start refuses while
    a supervisor answers, and starts after a supervisor was killed and
    left a stale socket file. The secret scan tests are stated above. A test
    lints `content/` with the host CLI's manifest, blueprint, and
    portfolio lints. The live steps of start and smoke, which need
    GitHub and Pinggy, have no test in `task check`; the recorded live run
    on the task is their proof.
  content: >-
    `content/` is the default process repository content: `manifold.yml`
    naming `decision-models/intake.yml`; an intake decision model that
    gives every issue the blueprint `blueprints/hold.yml` and the
    portfolio item `sample`; `blueprints/hold.yml`, whose initial state
    `waiting` has no transition, so that a task actor stays active and
    `GET /api/actors` lists it; `portfolio.yml` with the one item
    `sample`; and `bindings.yml` with one GitHub Project binding, `board`,
    to item `sample` and environment `local`, whose owner and number
    provisioning sets. No thread is started, so no environment needs to be
    configured. A later check provisions its own content with
    `CONTENT=<directory>`, such as the starter process repository, and
    provisioning sets that content's GitHub Project bindings to the test
    Project in the same way.
  limits: >-
    One environment exists per organization at a time. Two machines that
    provision the same organization adopt the same resources, and the
    second to generate a hook secret replaces the first's. The smoke check
    needs the supervisor running on the same machine, since it reads the
    service's store and process environment. GitHub keeps the issues and
    Project items the smoke check makes until teardown.
  timing: >-
    Each wait polls every 2 seconds and accounts for webhook delivery, the
    sweep, and intake, so that no step fails sooner than the system can
    act. Start waits up to 30 seconds for the tunnel URL and up to 120
    seconds for the service's `started` line; stop waits up to 60 seconds
    for the supervisor to end. The tunnel restarts 5 seconds after it ends,
    with no limit. The smoke check waits up to 60 seconds for the delivery,
    up to 60 seconds for intake, and up to `2 × sweepIntervalMs + 60`
    seconds for the sweep.
  access: >-
    The environment uses only the App permissions the service already
    holds: contents read on the process repository, issues and metadata
    read, organization Projects read, and organization hooks read and
    write for the redelivery scan. It asks no change to the App's
    permissions or webhook events, and makes the organization hook with
    the PAT, not the App's own webhook. It needs the App's installation on
    the organization to reach every repository in it, so that the test
    repositories reach the service each time provisioning makes them. It
    needs the PAT to hold `repo`, `project`, `admin:org_hook`, and
    `delete_repo`, or the same permissions on a fine-grained PAT, so that
    teardown removes the repositories it made.
