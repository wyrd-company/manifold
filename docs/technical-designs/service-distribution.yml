$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - service-assembly
    - default-process
    - agent-tools
    - service-configuration
    - github-event-source
    - t3code-environment-source
    - escalations
    - usage-intake
    - store
  mitigates:
    - api-reachable-without-authentication
    - t3code-token-expires
  # GAP-EDGE: the technical-design schema declares no edge to the
  # specifications that define its contracts; `references` is the best fit.
  references:
    - service-configuration
    - host-cli-usage
    - host-cli-manifest-lint
    - bindings-declaration
    - accounts-declaration
    - task-metadata-declaration
    - host-cli-mcp
    - host-cli-hook
    - agent-tools-configuration
    - t3code-environments-configuration
  # GAP-EDGE: the decision record is context, not a contract; the schema
  # declares no edge for it, and `contextualized-by` is its inverse.
  contextualized-by:
    - serve-the-api-without-authentication
objective: >-
  Let an operator go from nothing to a running Manifold service that has
  taken in an issue on a GitHub Project of their own: a service archive
  they start with one command from one service configuration file on Linux
  x64 or arm64, a configuration example that is valid against the service
  configuration schema, and an operator setup guide that walks every step
  outside Manifold, so that acceptance runs on the operator's machine and
  not only inside the test suite.
background:
  current-design: >-
    The service archive contains the built Node entry point, its runtime
    dependencies, native binaries for its Linux target, workers, bundled
    blueprints, and console files. The host CLI is a Bun binary per
    supported target. The operator setup guide and the complete service
    configuration example describe the deployment. The upgrade script
    prepares, swaps, and rolls back complete install directories while
    keeping configuration, credentials, process repository, and store in
    the separate deployment directory.
design-challenges:
  native-binaries: >-
    The decision engine ships one optional package per platform. An archive
    for a platform must hold that platform's binary whatever machine built
    it, and must hold no workspace source.
  one-command: >-
    Start must be one command an operator can type and a service manager
    can run, with no build step and no package manager on the operator's
    machine, while every credential stays in a file the configuration
    names.
  example-drift: >-
    Sections join the configuration root as modules land. The example must
    fail a test, not go stale, when a section joins or a value changes
    shape.
  exposure: >-
    GitHub must reach the webhook path and a person's phone must reach the
    answer page, while the API, the console, and the usage push stay off
    the public network, as `api-reachable-without-authentication` states.
  guide-truth: >-
    A guide is prose. It is true only while someone follows it against
    real services, and the external steps (GitHub settings pages, T3 Code
    commands) change outside Manifold's releases.
  interrupted-recovery: >-
    Upgrade and rollback rename and remove whole install directories while
    the operator, a power cut, or a lost session can stop them at any
    point, and the operator recovers by running a command again without
    knowing where it stopped. The directory state alone must tell each
    command what is done, so that a rerun neither removes the install that
    works nor the only copy a rollback returns to, and a recursive removal
    stopped halfway must never leave a partial tree under a name a command
    trusts.
proposed-design:
  high-level-overview: >-
    `task package:service` builds the workspace and writes one service
    archive for one Linux architecture,
    `dist/packages/manifold-service-<version>-linux-<arch>.tar.gz`, whose
    single top-level directory `manifold-service/` holds the service's
    compiled `dist/`, its `package.json`, and a production `node_modules`
    that holds the console's static files, the shared package, and the
    decision engine binary for that architecture. The operator extracts it
    into an install directory of their choice and runs `node manifold-service/dist/main.js <configuration-file>`,
    the entry point `service-assembly` specifies, on Node 24.11 or later.
    The build writes `dist/packages/manifold-upgrade.sh` beside the archive,
    the POSIX shell script that upgrades and rolls back an install, as
    `install-and-upgrade` states.
    `task package:smoke` proves an archive outside the workspace, and the
    script's recovery from an interruption at every rename and removal. A `package`
    job in CI runs both on an x64 and an arm64 runner. The configuration
    example is `docs/specifications/service-configuration.example.yml`, an
    asset of `service-configuration`, whose test loads it through
    `loadServiceConfiguration` and checks that it names every root section
    and comments every value. The operator setup guide is
    `docs/guides/operator-setup.md`, structured below, and `README.md`
    points to it. The archive and host CLI binaries are built from a checkout for UAT;
    nothing is published before UAT.
  service-archive: >-
    The archive's root directory is `manifold-service/` and holds exactly:
    `package.json`, the service package's manifest; `dist/`, the output of
    the service package's `build`, with `main.js` and the worker files; and
    `node_modules/`, the production dependency tree, in which
    `@wyrd-company/manifold-console` holds only its built `dist/` and
    `@wyrd-company/manifold-shared` only its built `dist/` and the files
    its exports name. It holds no `src/`, no test file, no fixture, no
    development dependency, and no credential. The decision engine's
    platform package in the tree is `linux-<arch>-gnu` for the archive's
    architecture, and no other platform's binary is present. Each
    workspace package states what it ships with a `files` field, so the
    archive's content is declared in the manifests and not chosen by the
    packaging script. The packaging script removes test directories and
    test files that external production dependencies include, and pnpm
    deployment metadata, from staging. The archive name carries the service package's
    `version` and the architecture, `x64` or `arm64`. Linux with glibc is
    the supported platform; musl, macOS, and Windows have no archive.
  build: >-
    `task package:service` takes `ARCH`, `x64` or `arm64`, defaulting to
    the build machine's architecture. It clears the workspace packages' compiled output directories, runs
    `pnpm run build`, then
    `pnpm deploy --prod` of `@wyrd-company/manifold-service` into a staging
    directory under `dist/packages/`, with pnpm's supported architectures
    set to `os: linux`, `cpu: <ARCH>`, `libc: glibc` for that install
    alone, in a private build workspace with workspace injection enabled
    for pnpm deploy, so the platform package of the target is fetched on any build
    machine. It removes the staging directory before it starts and writes
    the archive with `tar` from the staging directory's parent, so the
    archive's only top-level entry is `manifold-service/`. It copies
    `packages/service/scripts/manifold-upgrade.sh` to
    `dist/packages/manifold-upgrade.sh`, overwriting any earlier copy, so
    each archive has the script of the same commit beside it. The workspace's
    own `node_modules` and `pnpm-workspace.yaml` are unchanged by a
    package build. The commands live in `Taskfile.yml`, and any logic
    beyond a command line in `packages/service/scripts/`. These are build
    tools, so they may run `pnpm` and `tar`; no service code runs a
    process.
  start-command: >-
    `node manifold-service/dist/main.js <configuration-file>` is the one
    documented start command, run from the directory the archive was
    extracted into, or with absolute paths. Its exit codes, signals, and
    log are the entry point's in `service-assembly`. The archive adds no
    launcher script and no check of the Node version: a Node older than
    the package's `engines` range fails at the import of `node:sqlite` or
    of a module syntax it lacks, and the guide's prerequisites name the
    range. The guide shows one systemd unit that runs the same command,
    with `KillSignal=SIGTERM` and no stop timeout of its own beyond
    systemd's default, as an example of a service manager, not as a part
    Manifold ships.
  smoke: >-
    `task package:smoke` takes the archive of the build machine's
    architecture, extracts it into a new temporary directory outside the
    workspace, and, with no `NODE_PATH` and no workspace on any parent
    path, checks: the archive's only top-level entry is
    `manifold-service/`, and no path in it is under a `src/` directory of
    a workspace package, ends in `.test.ts` or `.test.js`, or is a
    `test-fixtures` directory; `node manifold-service/dist/main.js` with no
    argument exits 2; the decision engine's binding loads with a dynamic `import`
    from inside `manifold-service/`; and a configuration written by the
    smoke into the temporary directory (a process repository URL on a
    closed loopback port, a relative store file, `http.port` 0, no owners,
    no environments, no destinations) starts: the log has `pull-failed`
    and then `started` with the bound address, `GET /console/` on that
    address answers 200 with HTML, `POST /webhooks/github` with no
    signature answers a 4xx, and `SIGTERM` logs `stopped` and exits 0.
    The smoke then checks `manifold-upgrade.sh` from the build's
    `dist/packages/`, copied into the temporary install directory, against
    archives it derives from the one under test: `A`, the archive itself;
    `B`, `A` with one added file; `F`, `A` whose `dist/main.js` exits 1 at
    once; `M`, `A` with one regular file's permission bits changed from
    0644 to 0755 and its bytes unchanged; `K`, `A` with two added files of
    equal bytes and a symbolic link to the first; and `L`, `K` with the
    link to the second. Each case starts from a known install directory,
    runs the script with `sh`, and ends with these checks:
    `manifold-service/` and `manifold-service.previous/` each equal a fresh
    extraction of the archive the case expects, as `install-and-upgrade`
    defines equal, or are absent where it expects that; no scratch
    directory and no other entry is left beside them unless the case names
    it; the deployment directory's configuration and `state/` files are
    unchanged byte for byte, compared before the service starts; and the
    service starts on that configuration and store, logs `started`, and
    stops on `SIGTERM` with exit 0. The cases are: (1) upgrade: from an
    install of `A` that holds an added file and directory the archive does
    not hold, as an older install would, `prepare` and `swap` with `B` give
    current `B` and previous the old `A` tree, added file included, and
    the added file is absent from current; (2) repeated completion:
    `prepare` and `swap` with `B` again, and `swap` alone again, change
    nothing; (3) rollback: from current `F` and previous `A`, the start
    fails with exit 1, `rollback` gives current `A` and no previous, and
    `rollback` again changes nothing; (4) a difference only in modes: from
    current `A` and previous `B`, `prepare` and `swap` with `M` give
    current `M` and previous `A`; (5) a difference only in a link target:
    from current `K` and previous `A`, `prepare` and `swap` with `L` give
    current `L` and previous `K`; (6) interruption sweeps, below.

    The interruption sweeps cover every rename and removal that any run
    reaches, recovery runs included. A state of the install directory is
    named by which archive's tree, or none, each of `manifold-service/`,
    `manifold-service.previous/`, and `manifold-service.next/` holds, and
    whether each scratch directory is present. A sweep starts from an
    origin, a state with a recovery and an expected end: (a) current `A`,
    previous `B`, recovered by `prepare` and `swap` with `M`, ending at
    current `M` and previous `A`; (b) the end of case 2,
    current `B` and previous `A`, recovered by `prepare` and `swap` with
    `B`, ending unchanged, so the discard of an equal prepared tree is
    swept; (c) current `F` and previous `A`, recovered by `rollback`,
    ending at current `A` and no previous; and (d) every state that a stop
    inside `swap` of origin (a) leaves, recovered by `rollback`, ending at
    current `A`: where the swap had moved current aside, with no previous;
    where it had not, with current unchanged, `manifold-service.next/`
    holding `M`, and previous as the swap left it. For a state on the
    worklist, the smoke builds the state from fresh extractions, putting a
    partial tree in each present scratch directory, and runs its recovery
    once without a stop to count its operations. Then, for each operation,
    it rebuilds the state and runs the recovery stopped just after that
    operation, and, for each recursive removal and the extraction, during
    it. It names the state the stop left; a state not yet swept joins the
    worklist with the same recovery and expected end. It then runs the
    recovery again to completion from the stopped state and checks the
    expected end. The worklist starts with the origins and ends when no
    stop leaves a new state, which it reaches because the states are
    finite. The smoke records which script operation each stop hit, and
    fails unless the sweeps stopped each of these recovery-only operations
    at least once: the discard of a present `manifold-service.next/` in
    `prepare`, reached from a stop after `prepare` renamed the prepared
    tree in and from the states of origin (d); the discard of a prepared
    tree equal to current, reached from origin (b); the discard of
    `manifold-service.next/` in `rollback` with current absent, reached
    from a stop between the two renames of `swap`; and the removal of each
    present scratch directory at a command's start. The checks above apply to every completed
    recovery. The service starts once for each distinct expected end of
    each origin; another completed recovery with the same end has trees
    equal to the started ones and a deployment unchanged byte for byte. The
    smoke stops a run at an operation by putting a directory first on the
    script's `PATH` that holds a test wrapper for each command the script
    mutates the install directory with (`mv`, `rm`, `rmdir`, `mkdir`, and
    `tar`): each test wrapper counts its calls in a file the smoke names, runs
    the real command, and on the call the smoke selects sends `SIGKILL` to
    the script's shell; stopped during a recursive removal, it removes one
    entry of its target first, and during the extraction, it removes one
    extracted file after the real command. The smoke fails if a stopped
    run exits other than by `SIGKILL`. The smoke
    removes its temporary directory when it ends. It is a
    Node script in `packages/service/scripts/` and is not part of
    `task check`, so `task check` stays free of a package build.
  ci: >-
    `.github/workflows/check.yml` has a `package` job with a matrix of
    `ubuntu-24.04` and `ubuntu-24.04-arm`. Each runs `pnpm install
    --frozen-lockfile`, `task package:service`, and `task package:smoke`
    for the runner's architecture, so each archive is built and started
    on its own architecture at every push. The job uploads nothing: a
    workflow artifact of a public repository is downloadable by others,
    which is publishing.
  distribution: >-
    The operator builds the archive from a checkout of the repository at
    the commit under acceptance, on a machine with Node, pnpm, and Task,
    and copies the archive to the service host; the service host needs
    only Node. The host CLI is built the same way with
    `task build:targets`, and the guide copies
    `packages/host-cli/dist/linux-<arch>/manifold-host` (or the macOS
    or Windows target) onto each environment's `PATH`. For UAT, distribution
    is from the checkout. Nothing is published before UAT: no registry
    package, release asset, image, or workflow artifact. The guide's install
    steps name the archive file and host CLI binary built from the checkout.
  configuration-example: >-
    `docs/specifications/service-configuration.example.yml` is a complete
    service configuration for one organization, one environment, and one
    notification destination, with generic values: owner `example-org`,
    process repository `example-process`, environment `workstation`, and
    destination `default`, the name service escalations use. Every path in
    it is relative, so it resolves against the configuration file's
    directory and a whole deployment is one directory the operator
    chooses: the configuration file, a `credentials/` directory of files
    that hold one secret each, and a `state/` directory for the clone and
    the store. Every section the root schema names is a key of the
    example. A section the operator leaves at its defaults is `{}` with a
    comment naming the section's schema file, so no default is restated
    in a second place. Every value the operator sets carries a comment
    that says what it is and where the operator gets it. A section that
    joins the root schema also joins the example, and the example test
    verifies that every section is represented. Account capacity is declared in
    the process repository's `accounts.yml`, not here, so it adds no
    section. The `agentTools` section, which `agent-tools-configuration`
    specifies, is in the example at its defaults. The service configuration
    specification references this complete example asset.
  example-test: >-
    A test in `packages/service/src/service-configuration/` copies the
    example into a temporary directory, creates an empty placeholder file
    at each credential file path it names (every `privateKeyFile`, every
    `tokenFile`, and every hook `secretFile`, which the loader requires to
    be readable), and calls `loadServiceConfiguration`, which must
    resolve; so the example is valid
    against the schema and against the cross-checks the loader adds. The
    same test parses the example with the `yaml` package's document model
    and checks that the set of its top-level keys equals the set of the
    root schema's `properties`, read from `serviceConfigurationSchemas`,
    and that every pair whose value is a scalar has a comment on its own
    line before it or at the end of its line. A section added to the root
    without the example, a key renamed in a section, and a value left
    uncommented each fail it.
  guide: >-
    `docs/guides/operator-setup.md` is Markdown with a front-matter
    `relationships` block (`references` this design, the configuration
    example, and the specifications it names). It addresses the operator,
    states each step as an action and its check, and names every
    credential by the file that holds it, never a value. Its sections, in
    order: (1) What you will have: a service that has taken in an issue
    on a test Project, and the scope of the guide (one host, one
    organization, environments on that host or on its private network).
    (2) Prerequisites: a Linux x64 or arm64 host with glibc and Node 24.11
    or later; a build machine with Node, pnpm, Task, and a checkout; a
    GitHub organization the operator owns; a T3 Code server on each
    environment; optionally an ntfy account or server; and, for webhooks
    and phone answers, a reverse proxy or tunnel the operator runs.
    (3) Build and install: `task package:service`, copy, a fresh
    extraction into the install directory, and the deployment directory
    layout of the example, kept apart from the install directory. (4) The GitHub App: create
    it on the organization with its webhook inactive (Manifold reads
    deliveries from an organization hook, not the App's webhook); the
    full approved permission table, each grant with the access it allows; install it on the organization for the process repository and
    the task repositories; record the App id and the installation id, the
    two ids the `github-app` credential takes (the App's client id is not
    used); generate the private key into `credentials/` with mode 0600. (5) The process
    repository: copy `examples/starter/` from the checkout into a new
    repository on the organization; replace each placeholder its comments
    name: in `decision-models/intake.yml` the provider instance and model
    available through the environment's account; in `bindings.yml` the test
    Project's `owner` and `number`, the
    environment name, and the id of the T3code project the task threads
    run in, which intake reads from the binding; in `task-metadata.yml`
    the lifecycle field of the test Project, whose options must include
    `In Progress` and `Done`, the statuses the bundled default blueprint
    moves cards to (a new Project's `Status` field holds `Todo`,
    `In Progress`, and `Done`); in `accounts.yml` each account's `unit`,
    `kind`, and `capacity` (`amount`, `reset`, `every`), within the bounds
    `accounts-declaration` states, which the lint reports. The starter
    holds no blueprint: intake names `blueprints/task.yml`, which Manifold
    bundles, and a file committed at that path replaces it. Run the first
    lint from the repository's root with `manifold-host manifest lint`,
    `manifold-host portfolio lint`, `manifold-host usage lint`,
    `manifold-host task-metadata lint`, `manifold-host blueprint lint
    --repository .`, and `manifold-host comparator lint
    comparators/estimate.ts`, expect no finding, and push. On each
    environment, add the task repository's checkout as a T3code project
    with `t3 project add <path>` and record its id for `bindings.yml`.
    (6) Exposure: the proxy rule below, and the public base
    URL it gives. (7) The organization hook: payload URL
    `<public base URL>/webhooks/github`, content type `application/json`,
    a secret generated into `credentials/` and never typed, SSL
    verification on, and the events `issues`, `issue_dependencies`,
    `sub_issues`, `projects_v2_item`, `projects_v2`, and `push`, as
    `github-event-source` lists; record its id. (8) T3 Code: obtain a token
    for each environment as `t3code-token` below states, write it to
    `credentials/<environment>.token` without printing it, add the
    environment with the server's base URL (port 3773 unless the server
    was started with `--port`), and set a reminder to renew the token
    before it expires. (9) ntfy:
    the three postures, when to choose each, the token for `reserved` and
    `self-hosted`, and `escalations.publicUrl` set to the public base URL.
    (10) Configure and start: copy the example, set each commented value,
    start with the one command, and read the `started` line; the optional
    systemd unit. (11) The host CLI on each environment: install the
    binary and run `manifold-host usage push --service <url> --environment
    <name>` after agent work, from a scheduler the operator chooses, with
    one example: a systemd timer that runs it every 10 minutes. A late
    push only delays the actuals the ledger posts. (11a) The harness
    plugin on each environment: register `manifold-host mcp --service
    <url> --environment <name>` as the MCP server `manifold` in each
    provider's MCP configuration, as `host-cli-mcp` gives it per provider;
    the guide links that specification for each provider's file and
    snippet and restates none of them, and checks the registration by the
    provider listing the `handoff`, `escalate`, and `get-messages` tools,
    and registers the plugin's hook as `host-cli-hook` gives it per
    provider. (12) Check: add an issue to the test Project and
    find its `task:<issue node id>` actor in the console or through
    `GET /api/actors`. (13) When something is wrong: the log events an
    operator meets first (`start-failed` with its issues, `pull-failed`,
    `github-error`, a hook delivery answered 401 or 404 in GitHub's
    delivery log, `portfolio-rejected`, `blueprint-invalid`). (14) Stop,
    restart, upgrade, and rollback: `SIGTERM` to stop, the one command to
    start, and the upgrade and rollback of `install-and-upgrade`: the
    commands in order, what each leaves in the install directory, that an
    interrupted command is run again from its start, and what rollback
    cannot restore.
  install-and-upgrade: >-
    The install directory, which holds `manifold-service/`, and the
    deployment directory, which holds the configuration file,
    `credentials/`, and `state/`, are separate directories, so replacing
    the install never touches configuration or state. Install is a fresh
    extraction of the archive into an empty install directory. Upgrade
    replaces the whole `manifold-service/` directory and never extracts
    over it, since an extraction over an existing directory leaves every
    file the new archive does not hold.

    The install directory holds three install trees by role, each a
    complete extraction of one archive's `manifold-service/`:
    `manifold-service/`, the current install the service runs;
    `manifold-service.previous/`, the install the last swap replaced, kept
    until the next swap so that rollback can return to it; and
    `manifold-service.next/`, a prepared install that the next swap makes
    current. Two scratch directories hold partial trees and nothing else
    reads them: `manifold-service.staging/`, where an archive is
    extracted, and `manifold-service.discard/`, where a tree goes to be
    removed. A tree comes under a role name only by one `rename` of a
    complete tree, and leaves it only by one `rename`: to another role, or
    to `manifold-service.discard/` before its recursive removal. A rename
    on one filesystem is atomic, so a role name never holds a partial
    tree, and a removal stopped halfway leaves its remains only in
    scratch. `manifold-upgrade.sh` lives in the install directory beside
    the trees, works in its own directory whatever the caller's working
    directory, runs under `set -eu`, and starts every command by removing
    both scratch directories. It discards a tree by removing
    `manifold-service.discard/`, renaming the tree to it if the tree is
    present, and removing it again.

    The script has three commands, each guarded only by which role
    directories are present, so running a command again from its start
    after an interruption at any point, or after it completed, converges.
    `prepare <archive>`, run while the service runs: create
    `manifold-service.staging/`, extract the archive into it, discard
    `manifold-service.next/`, rename
    `manifold-service.staging/manifold-service/` to
    `manifold-service.next/`; then, if `manifold-service/` is present and
    equals `manifold-service.next/`, discard `manifold-service.next/` and
    report that the archive is already the current install; and last
    remove the staging directory. Two install trees are equal when they hold the same
    relative paths, and each path has the same kind (regular file,
    directory, or symbolic link), the same permission bits, the same
    target if it is a link, read without following it, and the same bytes
    if it is a regular file; owner, group, and timestamps are not
    compared, since an extraction sets them. The script compares in two
    parts, and both must agree: `find <tree> -printf '%P\t%y\t%m\t%l\n'`
    under `LC_ALL=C sort` lists every path with its kind, octal permission
    bits, and link target for each tree into a file in
    `manifold-service.staging/`, and `cmp -s` compares the two listings; then `diff -r -q --no-dereference` compares the bytes of
    every regular file and compares links as links. A plain `diff -r -q`
    is not enough: it ignores permission bits and follows links, so a
    prepared tree that differs only in an executable bit or a link target
    would be dropped as current. `swap`, run while the service is stopped: if
    `manifold-service.next/` is absent, change nothing and report that
    nothing is prepared; otherwise, if `manifold-service/` is present,
    discard `manifold-service.previous/` and rename `manifold-service/` to
    `manifold-service.previous/`; then rename `manifold-service.next/` to
    `manifold-service/`. `rollback`, run while the service is stopped: if
    `manifold-service/` and `manifold-service.next/` are both present, the
    swap has not replaced the current install, so change nothing and
    report it; otherwise, if `manifold-service.previous/` is present,
    discard `manifold-service.next/`, discard `manifold-service/`, and
    rename `manifold-service.previous/` to `manifold-service/`; otherwise
    change nothing and report that there is no previous install. A
    directory cannot be renamed onto a directory that is not empty, which
    is why each command discards the target of a rename first.

    Upgrade is: copy the new archive and the `manifold-upgrade.sh` built
    beside it to the service host, the script into the install directory;
    run `prepare` with the archive; stop the service; run `swap`; start
    the service and check the `started` line. Rollback, when the new
    install does not start or misbehaves, and at any time until the next
    upgrade, is: stop the service; run `rollback`; start the service and
    check `started`. An interrupted command is run again from its start;
    an interrupted upgrade is either run again from `prepare` or rolled
    back. Install stays a fresh extraction into an empty install
    directory, whose `manifold-service/` alone is a state the script
    accepts.

    The guards make each case converge. A `prepare` run again rebuilds
    `manifold-service.next/` from the archive, since a prepared tree is
    discarded before its replacement is renamed in. A `swap` stopped after
    discarding the previous install is run again with current and next
    present and moves current aside; one stopped between its two renames
    finds no `manifold-service/`, so it keeps `manifold-service.previous/`,
    which already holds the replaced install, and moves next in. An
    upgrade run again after its swap completed prepares a tree equal to
    the current install, which `prepare` discards, so the following `swap`
    changes nothing and the previous install is kept; without that guard,
    the second swap would discard the only copy rollback returns to. A
    `rollback` stopped after discarding `manifold-service/` is run again
    with only the previous install present and renames it; one run again
    after it completed finds no previous install and changes nothing, so
    it never removes the install it restored. A rollback after an
    interrupted swap returns to the replaced install when the swap had
    moved it aside, and otherwise leaves current in place. At every point
    at least one complete install is under a role name, and no role name
    holds a tree that mixes files of two archives. The previous install is
    replaced only by the next swap that changes the current install.

    The script touches no file of the deployment directory, and rollback
    returns only the install. A store that the newer install's start
    moved to a later schema step stays at that step: the previous install
    refuses it, as `store` states for a schema version beyond a build's
    steps, and the guide says so beside rollback. The script is a tool
    the operator runs, not service code, so it may run commands; it needs a POSIX shell, GNU `tar`, `find`, `sort`,
    `cmp`, and `diff`, and `mv`, `rm`, `rmdir`, and `mkdir`, which a glibc
    Linux host has from its base packages, and which the guide names where
    it states the upgrade.
  t3code-token: >-
    The scopes approved for Manifold 0.1.0's T3 Code token are
    `orchestration:read` and `orchestration:operate`, the whole set, and
    the guide gives the one way that issues exactly those. On each
    environment the operator runs `t3 auth pairing create --json`, which
    issues a one-time pairing token (default lifetime 5 minutes), and
    exchanges it at the server's `POST /oauth/token` with `grant_type`
    `urn:ietf:params:oauth:grant-type:token-exchange`, `subject_token` the
    pairing token, `subject_token_type`
    `urn:t3:params:oauth:token-type:environment-bootstrap`,
    `requested_token_type` `urn:ietf:params:oauth:token-type:access_token`,
    and `scope` `orchestration:read orchestration:operate`; the server
    issues a bearer token holding exactly the scopes requested and refuses
    a scope the pairing grant does not hold. The guide pipes the pairing
    token from the first command's JSON into the exchange, and the access
    token from the exchange's JSON into its file with mode 0600, so that
    neither is shown. The guide does not use `t3 auth session issue`,
    which takes no scope flag and issues the administrative scope set. The
    bearer token expires after 30 days by default, and the exchange takes
    no lifetime; the source rereads the file at each connection attempt,
    so renewing is running the same two commands into the same file. The
    server listens on port 3773 by default. These are the facts of the released T3 Code
    CLI and server; the guide uses the service's development dependency
    version, verified without issuing a token outside a test environment.
  github-app-permissions: >-
    The guide documents the full approved App permission set. Repository
    permissions are Metadata read and Contents, Issues, Pull requests, and
    Webhooks read and write. Organization permissions are Issue fields,
    Issue types, Projects, and Webhooks read and write. The table describes
    the access each grant allows; modules use the grants their operations
    need. Contents read supports the process repository's clone and pulls,
    and Contents write supports blueprint save from the console. The App's
    own webhook stays inactive, and the App subscribes to no event.
  exposure: >-
    The guide's exposure section states one rule: the public network
    reaches the service only through a proxy that forwards exactly three
    endpoints, and no prefix: `POST /webhooks/github`, the path GitHub's
    hook posts to; `GET /escalations/{id}`, the answer page a
    notification's link opens; and `POST /escalations/{id}/answer`, which
    the page's form and ntfy's buttons send, as `escalations` defines them.
    `{id}` is one path segment. The proxy answers every other path, and
    every other method on these paths, itself without forwarding it; the
    service listens on `127.0.0.1` for same-host environments or on a
    private LAN or VPN address for remote environments. Each proxy upstream
    uses the configured bind address. The webhook endpoint verifies each
    delivery by its hook's secret, and both escalation endpoints need the
    escalation's key, so these are the endpoints that are safe to expose;
    `/api/`, `/console/`, `/api/usage/push`, `/api/agent-tools/calls`, and
    `/api/agent-tools/notices` are not. The section gives
    the rule as a table of method, path, and reason, then one example in a
    widely used proxy (Caddy) that matches each endpoint by method and
    exact path pattern. A tunnel for testing follows the same rule and
    enables only the endpoints its test exercises. The host CLI on each
    environment calls three API endpoints: `usage push` posts to
    `/api/usage/push`, the harness plugin posts each tool call to
    `/api/agent-tools/calls`, and its hook posts each notice request to
    `/api/agent-tools/notices`. An environment on the service host reaches
    them over loopback. An environment on another machine reaches these
    paths and the console through the service host's private-network bind
    address. Neither API path nor the console goes through the public proxy.
  verification: >-
    The executor follows the guide on a clean machine or container, step
    by step, once against real GitHub through the test environment of the
    live-checks tooling (the test organization, its App installation, and
    its tunnel) and real T3 Code where an environment is available, and
    against the fakes of `foundation.integration.test.ts` for any step
    that has no real counterpart. The test environment runs one live
    environment per organization at a time, so the walkthrough does not
    run while another task's live check holds it, and its tunnel admits
    `GET /escalations/{id}` and `POST /escalations/{id}/answer` only when
    answers are enabled for the walkthrough. The execution log of the task records,
    per guide section, which ran against real services, which against
    fakes, what was corrected in the guide, and the final check: the
    `task:<issue node id>` actor read through the API. Credential values
    appear in no record.
  convergence: >-
    `task package:service` removes its staging directory first and
    overwrites the archive, so a second run, or a run after one killed
    halfway, gives the same archive content. `task package:smoke` works
    in a new temporary directory each run and removes it at the end; one
    killed halfway leaves only that directory, under the system temporary
    directory. Copying `manifold-upgrade.sh` beside the archive overwrites
    the earlier copy. Install, upgrade, and rollback converge as
    `install-and-upgrade` states, and touch no file of the deployment
    directory. Starting
    the service twice on the same configuration converges as
    `service-assembly` states.
  tests: >-
    The example test rejects a copy with one section removed or one
    comment removed. The smoke rejects an
    archive packed without `files` fields (it finds `src/` and test
    files), one built for the other architecture (the engine
    binding fails to load), and an upgrade that extracts over the
    old `manifold-service/` (the added file survives). The recovery
    cases detect a script without the guards: a `prepare` with
    no comparison makes a repeated upgrade discard the previous install
    (case 2); a comparison by `diff -r -q` alone drops the prepared tree
    as current in cases 4 and 5; a sweep of the origins' own operations
    alone never stops the discard of a present next in `prepare`, the
    discard of an equal prepared tree, or the discard of next in a
    `rollback` with current absent, which the smoke's check of the stopped operations reports; a `swap` that does
    not discard the previous install before the rename fails on a present
    previous (case 1); and a `rollback` with no guard for a present current
    and next removes the install that still works (origin (d)). `task check` runs the example test; CI's
    `package` job runs the build and the smoke on both architectures.
