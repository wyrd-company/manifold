$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - durable-event-delivery
    - service-assembly
    - service-configuration
    - process-repository
    - portfolio
    - task-metadata
  mitigates:
    - github-events-incomplete
    - github-reads-lag-deliveries
objective: >-
  Turn GitHub webhook deliveries, and the changes GitHub never delivers,
  into router events for the issues and Projects Manifold tracks, so that
  each change reaches its actors once, a blocked issue's actor hears its
  blocker close, and a push to the process repository pulls it; and set a
  task's lifecycle field on its Project for a card move, so that each move
  leaves GitHub holding one value and reaches the actor as its own.
background:
  current-design: >-
    The router publishes source events through the seam `router-events`
    defines, and `durable-event-delivery` names the GitHub topics. The
    `github-dependency-events` spike measured that every dependency,
    sub-issue, Project item, and Project change produces a delivery to the
    organization hook, that a repository hook repeats a repository event
    with the same GUID, that GitHub makes one attempt per delivery and keeps
    failed ones for redelivery through the hook deliveries API, that a
    blocking issue's close names only the blocker, and that an issue's
    `updatedAt` does not move when a dependency, sub-issue, or Project item
    changes. The process repository's `pull` takes the commit a push
    names. Bindings name each bound Project by owner and number.
  problems:
    - >-
      A delivery that fails is never retried by GitHub, and a delivery sent
      while the service is down is a failure, so an actor waiting on it waits
      forever unless the source recovers it.
    - >-
      A delivery describes a change at the moment GitHub sent it. A
      redelivered or late delivery describes a state that may since have
      changed back.
    - >-
      A blocker's close names no blocked issue, and Project item deliveries
      name no issue number and no Project number.
design-challenges:
  once: >-
    One change can arrive through two hooks, a redelivery, and a sweep, and
    must reach each actor once.
  recovery: >-
    A change whose delivery never arrived, including one made while the
    service was down for longer than GitHub keeps deliveries, must still be
    published.
  staleness: >-
    A delivery applied as a fact can publish a state that is no longer true.
  acknowledgement: >-
    GitHub marks a delivery failed when the answer takes longer than ten
    seconds, and reading GitHub's current state can take longer than that.
  attribution: >-
    GitHub reports a card move Manifold made the same way it reports a
    person's: a delivery that names the item, and a field value read from
    the API. An actor must tell its own move from a person's, by webhook or
    by sweep, after a crash, and when a read lags the write.
proposed-design:
  high-level-overview: >-
    The GitHub event source is `packages/service/src/github-source/`, whose
    only public file is `index.ts`. `startGitHubSource` migrates the
    source's tables, `github-source-database-schema`, and returns a source
    whose `receive` verifies a webhook delivery, records its GUID once, and
    records the entities it names as pending reconciles, in one
    transaction, before the HTTP answer. A delivery is a notice that an
    entity changed, never the change itself. One serial runner reads each
    pending entity's current state from the GitHub GraphQL API, compares it
    with the GitHub mirror, and in one transaction writes the mirror and
    publishes each difference to the router under the topics and event ids
    `github-events` defines. The same comparison runs for every bound
    Project and tracked issue on each sweep, and a redelivery scan asks
    GitHub to redeliver each failed delivery once. A webhook delivery, a
    redelivery, and a sweep that learn of one change all compare against
    the same mirror, so the first publishes it and the rest find no
    difference. The decision record
    `reconcile-github-deliveries-against-fetched-state` records the choice.
  public-interface: |-
    `packages/service/src/github-source/index.ts` exports exactly these
    names.

    ```ts
    import type { IncomingMessage, ServerResponse } from "node:http";
    import type { PullOutcome, PullRequest } from "../process-repository/index.ts";
    import type { Router, RouterClock } from "../router/index.ts";
    import type { Credentials } from "../service-configuration/index.ts";
    import type { Store } from "../store/index.ts";

    export function startGitHubSource(options: GitHubSourceOptions): GitHubSource;

    export interface GitHubSourceOptions {
      readonly configuration: GitHubConfiguration;
      readonly credentials: Credentials;
      readonly store: Store;
      readonly router: Router;
      /** The GitHub Project bindings of the current process repository revision. */
      readonly boundProjects: () => readonly ProjectReference[];
      readonly processRepository: ProcessRepositoryTrigger;
      /** Defaults to Date.now and setTimeout. */
      readonly clock?: RouterClock;
      /** Called for each failure the source recovers from by itself. */
      readonly onError?: (error: GitHubSourceError) => void;
      /** Called after each reconcile's read, before its transaction. */
      readonly probe?: () => void;
      /** Called after each transaction that publishes an item addition commits, with the content issues' node ids. */
      readonly onTracked?: (issueNodeIds: readonly string[]) => void;
      /** Called after each committed transaction that changed a mirror row. */
      readonly onMirrorChanged?: () => void;
      /** Called after a card move's write returns from GitHub, before its promise resolves. */
      readonly probeMove?: (move: CardMove) => void;
    }

    /** The `github` section of the service configuration, defaults applied. */
    export interface GitHubConfiguration {
      readonly apiUrl: string;
      readonly owners: Readonly<Record<string, GitHubOwnerConfiguration>>;
      readonly sweepIntervalMs: number;
      readonly redeliveryIntervalMs: number;
      readonly requestTimeoutMs: number;
    }

    export interface GitHubOwnerConfiguration {
      readonly credential: string;
      readonly hooks: readonly GitHubHookConfiguration[];
    }

    export interface GitHubHookConfiguration {
      readonly id: number;
      /** Absent for an organization hook. */
      readonly repository: string | undefined;
      /** Absolute; resolved against the configuration file's directory. */
      readonly secretFile: string;
    }

    export interface ProjectReference {
      readonly owner: string;
      readonly number: number;
    }

    export interface ProcessRepositoryTrigger {
      readonly url: string;
      readonly branch: string;
      pull(request?: PullRequest): Promise<PullOutcome>;
    }

    export interface GitHubSource {
      receive(delivery: WebhookDelivery): DeliveryOutcome;
      /** Reads the request body and answers from `receive`. */
      readonly requestListener: (request: IncomingMessage, response: ServerResponse) => void;
      /** Runs a sweep next, after the work running now. */
      requestSweep(): void;
      /** The mirror's view of a tracked issue, or undefined when it is not tracked. */
      trackedIssue(nodeId: string): TrackedIssue | undefined;
      /** The node id of every issue trackedIssue answers for, sorted by code point. */
      trackedIssueIds(): readonly string[];
      /** The mirror's Project of a node id, or undefined when the mirror holds none. */
      project(nodeId: string): GitHubProject | undefined;
      /** Sets a single-select field of an issue's item; resolves once GitHub holds the option. */
      moveCard(move: CardMove, signal?: AbortSignal): Promise<void>;
      stop(): Promise<void>;
    }

    export interface CardMove {
      /** The invocation of the `github-card-move` invoke that asks for the move. */
      readonly actorId: string;
      readonly invokeId: string;
      readonly entryId: string;
      readonly projectNodeId: string;
      readonly issueNodeId: string;
      /** The name of a single-select field of the Project. */
      readonly field: string;
      /** The name of an option of that field. */
      readonly option: string;
    }

    export class GitHubWriteError extends Error {
      readonly kind:
        | "field-missing"
        | "option-missing"
        | "item-missing"
        | "forbidden"
        | "transport"
        | "rejected";
      /** The HTTP status of the failed request, when there was one. */
      readonly status: number | undefined;
    }

    export interface WebhookDelivery {
      /** Header names in any case. */
      readonly headers: Readonly<Record<string, string | readonly string[] | undefined>>;
      readonly body: Uint8Array;
    }

    export type DeliveryOutcome =
      | { readonly status: "accepted"; readonly deliveryId: string; readonly duplicate: boolean }
      | { readonly status: "rejected"; readonly error: GitHubDeliveryError };

    export class GitHubDeliveryError extends Error {
      readonly kind: "malformed" | "unknown-hook" | "signature";
      /** The `X-GitHub-Delivery` header, when present. */
      readonly deliveryId: string | undefined;
    }

    export class GitHubSourceError extends Error {
      readonly kind: "api" | "unconfigured-owner" | "unresolved-project" | "secret-file" | "pull";
      /** The HTTP status of a failed API request, when there was one. */
      readonly status: number | undefined;
    }

    export interface GitHubIssue {
      readonly nodeId: string;
      readonly repository: string;
      readonly number: number;
      readonly state: "open" | "closed";
      readonly stateReason: "completed" | "not_planned" | "duplicate" | "reopened" | null;
    }

    export interface GitHubProject {
      readonly nodeId: string;
      readonly owner: string;
      readonly number: number;
    }

    export interface TrackedIssue {
      readonly issue: GitHubIssue;
      /** The issue's title and web URL as last read; absent until a read writes them. */
      readonly title: string | undefined;
      readonly url: string | undefined;
      readonly blockedBy: readonly GitHubIssue[];
      readonly blocking: readonly GitHubIssue[];
      readonly subIssues: readonly GitHubIssue[];
      readonly parent: GitHubIssue | undefined;
      readonly projects: readonly GitHubProject[];
      /** The issue's present items on bound Projects, in the order of `projects`. */
      readonly items: readonly TrackedItem[];
    }

    export interface TrackedItem {
      readonly project: GitHubProject;
      readonly nodeId: string;
      readonly archived: boolean;
      /** The item's field values in the mirror, keyed by field name. */
      readonly fields: Readonly<Record<string, GitHubFieldValue>>;
    }

    /** A field value of `github-events`, or null. */
    export type GitHubFieldValue =
      | { readonly kind: "text"; readonly text: string }
      | { readonly kind: "number"; readonly number: number }
      | { readonly kind: "date"; readonly date: string }
      | { readonly kind: "single-select"; readonly optionId: string; readonly name: string }
      | {
          readonly kind: "iteration";
          readonly iterationId: string;
          readonly title: string;
          readonly startDate: string;
          readonly duration: number;
        }
      | null;
    ```
  module-layout: >-
    `index.ts` re-exports the public names and nothing else. `verify.ts`
    holds the pure checks of a delivery's headers, signature, and body.
    `receive.ts` implements `receive` and `requestListener`. `reconcile.ts`
    holds the pure functions from a mirror view and an observed state to the
    mirror writes and the events to publish. `events.ts` holds the pure
    functions that build each event's topics and event id. `mirror.ts`
    holds every SQL read and write of the source's tables, the card move
    rows included. `attribution.ts` holds the pure function from a field
    change and the card move rows of its item and field to its `movedBy`
    and the rows to delete. `github-api.ts` holds the GraphQL queries, the
    card move mutation, and the REST calls, and nothing else talks to
    GitHub. `runner.ts` holds the serial runner, the card move queue, the
    sweep, the redelivery scan, and the timers. `migrations.ts` holds the migration steps.
    `test-fixtures/` holds the synthetic delivery payloads. Tests live beside the
    module and import only `index.ts`, the router's and the store's
    `index.ts`, and the service configuration's `index.ts`.
  library: >-
    GraphQL requests go through `@octokit/graphql`, and REST requests
    through `@octokit/request`, which service configuration adds for the
    `github-app` credential. Both are Octokit, GitHub's own maintained
    JavaScript client family. `@octokit/graphql` derives the GraphQL URL of
    GitHub Enterprise Server from the REST base URL and raises a
    `GraphqlResponseError` that carries the partial data and each error's
    path, which the source reads to tell a missing node from a failed
    request. Signatures are HMAC-SHA256 from `node:crypto` compared with
    `timingSafeEqual`, a few lines that need no dependency. Delivery bodies
    and published events are validated with Ajv against
    `github-events.schema.yml`, embedded as a constant in `packages/shared`
    as the other specification schemas are.
  configuration: >-
    The `github` section is specified by `github-source-configuration`.
    `GitHubConfiguration` is its type, exported here as the comparator
    sandbox exports its section's type, and service configuration's loader
    adds the section to `ServiceConfiguration` as `github`. Each owner's
    `credential` resolves through `credentials.resolve` to a `github-app`
    credential, whose `installationToken({ signal })` gives the token for
    every request about that owner's entities. The token goes to Octokit
    through `reveal()` and nowhere else.
  permissions: >-
    The installation token of each owner's `github-app` credential carries
    the App's permissions on that account. The source uses these, and no
    other: repository `Metadata: read`, which every App holds, for each
    issue's `repository { nameWithOwner }`; repository `Issues: read`, for
    each issue's state, `blockedBy`, `blocking`, `subIssues`, and `parent`;
    repository `Pull requests: read`, so that a pull request item on a
    Project shows its content node id instead of `REDACTED`; organization
    `Projects: read and write`, to resolve a Project by owner and number
    and read its `closed`, items, fields, and field values (read), and to
    set an item's single-select field value for a card move (write);
    organization `Webhooks: read and
    write`, on an account with an organization hook, to list the hook's
    deliveries (read) and ask for a redelivery (write); and repository
    `Webhooks: read and write`, on a repository with a repository hook, for
    the same. The source writes nothing to GitHub but an item's
    single-select field value for a card move, and the redelivery requests.
    It never writes to an issue or a repository, and needs no `Issues:
    write` and no `Contents` permission: a push reaches a hook
    without it, the process repository's own `contents: read` token fetches
    the pushed commit, and the source never links a repository to a
    Project.
  webhooks: >-
    Each configured hook delivers `application/json` with a secret and
    SSL verification on. An organization hook subscribes to `issues`,
    `issue_dependencies`, `sub_issues`, `projects_v2_item`, `projects_v2`,
    and `push`; it reaches every repository of the organization, and GitHub
    sends Project events to organization hooks only. A repository hook
    subscribes to `issues`, `issue_dependencies`, `sub_issues`, and `push`,
    and serves a repository whose account has no organization hook, such as
    a repository a user account owns. Both kinds may be configured for one
    repository; the second delivery of each GUID is a duplicate. A Project
    a user account owns has no Project deliveries, and the sweep alone
    reads it. An account owner creates each hook in GitHub and copies its
    id and secret into service configuration.
  receive: >-
    `receive(delivery)` runs synchronously. It verifies the delivery as
    `github-events` defines, reading the hook's `secretFile` with
    `readFileSync` at each call so a replaced secret applies at once. A
    failed check returns `rejected` with a `GitHubDeliveryError` of that
    kind, and writes and calls nothing. An unreadable secret file throws a
    `GitHubSourceError` of kind `secret-file`. A verified delivery opens
    one `store.connection.transaction`, inserts its `github_delivery` row,
    and, when the GUID was already there, returns `accepted` with
    `duplicate` true and writes nothing more. Otherwise it records the
    pending reconciles the delivery names and commits. After the commit it
    calls the process repository's `pull` for a matching push, sends a
    rejection of that promise to `onError` as kind `pull`, and wakes the
    runner. It returns `accepted` with `duplicate` false.
  pending: >-
    An issue a delivery names becomes a pending `issue` when it is tracked.
    When it is not, each tracked issue the mirror shows beside it, through a
    present dependency or sub-issue row in either direction, becomes a
    pending `issue` instead, so a blocker outside every bound Project still
    reaches the issues it blocks. An item becomes a pending `item`, with its Project node id stored on the pending row, and a
    Project a pending `project` only when the Project is bound. A new
    pending row has generation 1 and `requested_at` now. Recording a pending
    row that exists raises its generation by one and keeps its
    `requested_at`, so a request made during a read of the entity is told
    apart from the request the read serves, within one clock tick too.
  bound-projects: >-
    The runner keeps the bound Projects as a map from Project node id to
    Project reference, rebuilt at the start of each sweep from
    `boundProjects()`. A reference whose owner and number match a
    `github_project` row, without regard to the owner's case, takes that
    row's node id. Any other is resolved with the `GitHubProjectByNumber`
    query, and its row is written with the Project's `closed` as its
    baseline and revision 0. An owner that `owners` does not name is an
    `unconfigured-owner` error, and a Project the query does not find is
    `unresolved-project`; each is sent to `onError` and left out of the map
    until a later sweep resolves it. A delivery about a Project outside the
    map names nothing.
  runner: >-
    One runner does all of the source's GitHub work, one step at a time, so
    no two requests to GitHub overlap and no two reconciles write at once.
    It holds a queue of card moves and three flags: a redelivery scan is
    due, a sweep is due, and pending rows exist. On waking it runs every
    queued card move first, then a due scan, then a due sweep, then the
    pending reconciles, and sleeps when the queue is empty and all three
    flags are clear. The runner's mirror work is a series of observations.
    An observation is every request whose answers one transaction applies:
    a batch of pending issues or items, or one page of a Project's items,
    with every later page of each connection it reads and every content
    issue an item addition in it reads, from its first request to the
    commit or the abandonment of its transaction. The runner takes queued
    card moves again after each observation and before each request of a
    redelivery scan, and never inside an observation, so a move waits at
    most for the observation in hand. No observation holds an answer read
    before a move's write and an answer read after it, and every
    observation that starts after a move's write returns starts after
    GitHub took the write.
    `startGitHubSource` sets the scan and the sweep due and wakes it. After
    each scan it arms one timer for `redeliveryIntervalMs`, and after each
    sweep one for `sweepIntervalMs`, through the clock; a timer sets its
    flag and wakes the runner. `receive` and `requestSweep` wake it too.
    The intervals run from the end of the work, so a slow sweep never
    overlaps the next.
  reconcile-pending: >-
    The runner takes pending rows oldest `requested_at` first. Issues are
    read up to 50 at a time with the `GitHubIssues` query, grouped by the
    credential that reads them; items up to 50 at a time with `GitHubItems`;
    and a Project alone, as the sweep reconciles it. Before each read it
    notes each row's generation. After the read it opens one transaction
    that applies each entity's comparison in turn, publishes each resulting
    event with `router.publish` inside the transaction, and deletes each
    pending row whose generation still equals the noted one. A row whose
    generation rose during the read stays pending and is read again. A failed request,
    a request that runs past `requestTimeoutMs`, or a rate limit answer
    stops the runner's pending work for this wake, leaves every unread row
    pending, and sends a `GitHubSourceError` of kind `api` with the status
    to `onError`; the next timer wakes it to try again. The source adds no
    retry or backoff of its own. A failed reconcile preserves a due scan or
    sweep wake, so a timer that fired during the read still runs and re-arms;
    pending work alone is not retried immediately. A `publish` that returns `rejected` is a
    defect in the source and throws, which rolls the transaction back.
  card-moves: >-
    `moveCard(move, signal)` queues the move, wakes the runner, and returns
    a promise the runner settles. A `signal` that aborts while the move is
    queued removes it from the queue and rejects with the signal's reason;
    one that aborts while its request is in flight aborts the request, and
    the move's fate is GitHub's. `moveCard` after `stop` throws a
    `TypeError`. The runner runs one move in these steps. (1) The item: the
    present item on the Project whose content is the issue, read from the
    mirror; none is `item-missing`. (2) The field: the `GitHubProjectField`
    query with the Project's node id and the field name, with the
    credential of the Project's owner. No field of that name, a field that
    is not single-select, and a Project the query does not find are
    `field-missing`; the option is the field's option whose name equals the
    move's option exactly, and none is `option-missing`. (3) In one
    transaction, the move's `github_card_move` row is written, as
    `github-source-database-schema` states. (4) The `GitHubCardMove`
    mutation sets the item's field to the option. (5) When it returns, the
    item becomes a pending `item`, in one transaction, so the runner reads
    it next, calls `probeMove`, and resolves the move. The promise
    therefore resolves only once GitHub has taken the write and answered
    for it. Each request runs under `requestTimeoutMs`, as every request of
    the source does, and the source adds no retry of a write: a failure
    rejects the move with a `GitHubWriteError`. A `NOT_FOUND` error at the
    item is `item-missing`; a `FORBIDDEN` error, a `401` or `403` answer,
    and an owner that `owners` does not name are `forbidden`; a request
    that fails before GitHub answers, runs past `requestTimeoutMs`, or is
    answered with a `5xx` or a rate limit is `transport`; any other GraphQL
    error is `rejected`, with GitHub's message. Step 3 writes the row with
    state `sent` only when the invocation has no row; a repeated move of
    one invocation, such as the invoke a restored actor runs again, keeps
    the row it finds with its state and `sequence`, since that row may be
    evidence of an earlier write GitHub took. Step 5 sets the row
    `confirmed`, since a mutation that returns its item is GitHub's
    evidence that it took the write. A mutation that GitHub refuses deletes
    the row in its own transaction only when this attempt wrote it in step
    3; a refusal proves only that the repeated request set nothing, so a
    row an earlier attempt wrote keeps its state. A `transport` failure,
    and a crash between steps 3 and 5, leave the row as it is: GitHub may
    have taken the write or not. A move's failure is not sent to `onError`: its caller takes it.
  attribution: >-
    The card move rows decide `movedBy` on each
    `github.project-item.field-changed` a reconcile publishes, inside the
    reconcile's transaction, from the rows of the change's item and field.
    A row's state is `sent`, a write whose fate is unknown; `confirmed`, a
    write GitHub took; or `doubtful`, a write that a change no move made
    has since followed in the mirror, so GitHub's value may be that change
    or a later one. Take the row with the largest `sequence` whose option
    is the new value. When it is `confirmed`, `movedBy` is `{ actorId,
    confirmed: true }`. When it is `sent` or `doubtful`, `movedBy` is `{
    actorId, confirmed: false }`: the actor attempted this value and the
    source cannot show that its write, and not someone else's, set it.
    Either way that row and every row of the item and field with a smaller
    `sequence` are deleted, since GitHub applied those writes before the
    value read. When no row's option is the new value, `movedBy` is `null`,
    which is true whatever the timing, since no write Manifold recorded or
    attempted set that value; every row of the item and field becomes
    `doubtful`. A change of the item's other fields reads no row. Removing
    an item deletes its rows. Because no observation spans a move's write,
    every row an observation finds was written before the observation
    began, so a read that lags shows a value from before the row or after
    it, never a mix. A read that lags a move and shows the field's earlier
    value finds no difference and publishes nothing, and the delivery's
    read or the sweep that reads the move publishes it, attributed. A row
    whose value never shows as a change, such as a move to the option the
    card already held, stays until a later change deletes it or makes it
    `doubtful`; a `doubtful` row is never claimed as confirmed. A `null`
    `movedBy` is therefore never a Manifold write, and a `confirmed` one is
    the actor's write, with one exception: a person who changes the field
    away and back to the value a confirmed move set, both before the source
    reads it, is reported as that move, since the mirror sees one change to
    the value both chose. The cases the source cannot decide, a write whose
    fate is unknown and a write a change no move made has followed, are
    reported unconfirmed rather than as a person's or as Manifold's.
  credentials-per-entity: >-
    A Project, its fields, and its items are read, and a card move
    written, with the credential of the Project's owner. A tracked issue is read with the credential of its repository's
    owner when `owners` names that owner, and otherwise with the credential
    of the owner of a bound Project that holds it.
  queries: |-
    Every query is named, so the test's GitHub fake answers by operation
    name, and none filters by time.

    ```graphql
    query GitHubProjectByNumber($login: String!, $number: Int!) {
      repositoryOwner(login: $login) {
        ... on ProjectV2Owner {
          projectV2(number: $number) { id number closed owner { ... on Organization { login } ... on User { login } } }
        }
      }
    }

    query GitHubProject($id: ID!, $after: String) {
      node(id: $id) {
        ... on ProjectV2 {
          id number closed
          items(first: 100, after: $after) { pageInfo { hasNextPage endCursor } nodes { ...GitHubItem } }
        }
      }
    }

    query GitHubItems($ids: [ID!]!) {
      nodes(ids: $ids) { ...GitHubItem }
    }

    query GitHubIssues($ids: [ID!]!) {
      nodes(ids: $ids) {
        ... on Issue {
          ...GitHubIssueRef
          parent { ...GitHubIssueRef }
          blockedBy(first: 50) { pageInfo { hasNextPage endCursor } nodes { ...GitHubIssueRef } }
          blocking(first: 50) { pageInfo { hasNextPage endCursor } nodes { ...GitHubIssueRef } }
          subIssues(first: 50) { pageInfo { hasNextPage endCursor } nodes { ...GitHubIssueRef } }
        }
      }
    }

    fragment GitHubIssueRef on Issue {
      id number state stateReason title url repository { nameWithOwner }
    }

    fragment GitHubItem on ProjectV2Item {
      id type isArchived project { id }
      content {
        ... on Issue { ...GitHubIssueRef }
        ... on PullRequest { id }
        ... on DraftIssue { id }
      }
      fieldValues(first: 50) {
        pageInfo { hasNextPage endCursor }
        nodes {
          ... on ProjectV2ItemFieldTextValue { text field { ...GitHubField } }
          ... on ProjectV2ItemFieldNumberValue { number field { ...GitHubField } }
          ... on ProjectV2ItemFieldDateValue { date field { ...GitHubField } }
          ... on ProjectV2ItemFieldSingleSelectValue { optionId name field { ...GitHubField } }
          ... on ProjectV2ItemFieldIterationValue { iterationId title startDate duration field { ...GitHubField } }
        }
      }
    }

    fragment GitHubField on ProjectV2FieldConfiguration {
      ... on ProjectV2FieldCommon { id name dataType }
    }

    query GitHubProjectField($id: ID!, $name: String!) {
      node(id: $id) {
        ... on ProjectV2 {
          field(name: $name) {
            ... on ProjectV2SingleSelectField { id name options { id name } }
          }
        }
      }
    }

    mutation GitHubCardMove($project: ID!, $item: ID!, $field: ID!, $option: String!) {
      updateProjectV2ItemFieldValue(
        input: { projectId: $project, itemId: $item, fieldId: $field, value: { singleSelectOptionId: $option } }
      ) {
        projectV2Item { id }
      }
    }
    ```

    A connection whose `pageInfo.hasNextPage` is true is read to its end
    with a query on that one node's connection, `after` its `endCursor`,
    before the comparison runs, so every comparison sees whole lists. A node
    that `nodes(ids:)` answers with `null` and a `NOT_FOUND` error at its
    path is absent; any other GraphQL error fails the request. An item of
    type `REDACTED` is skipped. Field values whose field `dataType` is not
    `TEXT`, `NUMBER`, `DATE`, `SINGLE_SELECT`, or `ITERATION` are skipped.
    Enum values are lower-cased into the shapes `github-events` defines, and
    a node id outside the node id pattern fails the request. An absent issue
    is recorded with `present` 0, retains its pending row, and is skipped
    for the remainder of that wake; other issues in its batch still
    reconcile. A later wake reads it again. A complete read restores
    `present` 1.
  compare-issues: >-
    The comparison of a tracked issue `T` takes its observed state and
    lists, the mirror rows of `T`, of every issue in its lists, and of every
    dependency and sub-issue row that names `T`, and the set of tracked
    issues. (1) Each issue it observed, `T` and every issue in its lists,
    is written to `github_issue`; one whose row existed with another state
    is a state change. (2) Each dependency and sub-issue `T` takes part in
    that the lists show and the mirror holds absent is an addition, and
    each the mirror holds present that the lists do not show is a removal.
    A relationship difference is a change when either of its endpoints is a
    tracked issue that was baselined before this comparison; otherwise it
    is written without a change. A shared relationship is therefore
    published for the endpoint that already holds a baseline, whichever
    endpoint is read first, and the later read finds the row as it
    observes it. `T` is marked baselined at the end of its comparison. (3)
    Each change raises its row's revision by one and becomes one event:
    relationship changes first, in list order, then state changes, so a
    close's `blocks` and `parent` already reflect the relationships read
    with it. `blocks` and `parent` are read from the mirror after the
    writes. A batch applies its issues in turn, each against the mirror the
    previous left, so a neighbor two tracked issues share changes state
    once.
  compare-items: >-
    The comparison of an item takes its observed node, or absence, and its
    mirror rows. An item with no row, or with `present` 0, that is observed
    is an addition: its row and field values are written, and it publishes
    `github.project-item.added` with its field values and its content issue.
    When the content is an issue that is not yet baselined, the runner reads
    that issue with `GitHubIssues`, its lists read to their end, after the
    item read and before the transaction, and the transaction applies the
    issue's comparison right after the item addition. The added event and
    the issue's baseline commit together, so no consumer takes
    `github.project-item.added` before `trackedIssue` answers with the
    issue's complete dependencies, sub-issues, and parent; a failed read of
    the issue leaves the item pending with nothing written. After a
    transaction that publishes one or more `github.project-item.added`
    events whose content is an issue commits, the runner calls `onTracked`
    once with those issues' node ids, so intake takes each issue in as soon
    as `trackedIssue` answers for it. A throw from `onTracked` is sent to
    `onError` and changes nothing the transaction wrote. A present item observed absent is
    a removal. A change of `isArchived` is an archive or a restore. Each
    field whose value differs from its row, a field with no value read as
    `null`, is one `field-changed` event; a field with no row whose value is
    not `null` is one too. Each `field-changed` takes its `movedBy` from the
    card move rows, as described under attribution. Item changes publish
    before field changes. A field's latest name is written without a
    change.
  compare-projects: >-
    A Project's comparison reads its `closed` and every page of its items.
    A change of `closed` is `github.project.closed` or
    `github.project.reopened`. Each page's items compare as items, in one
    transaction per page, after the content issues the page adds are read
    as an item addition requires. After the last page, each item the mirror holds
    present on the Project that no page showed becomes a pending `item`, so
    its own read decides whether it was removed or is archived and outside
    the list. Every tracked issue of the Project then becomes a pending
    `issue`, and the Project's pending row is deleted under the same rule as
    any other.
  sweep: >-
    A sweep rebuilds the bound Projects, makes each bound Project a pending
    `project`, calls the process repository's `pull` with no commit and
    sends a rejection to `onError` as kind `pull`, and runs the pending
    reconciles. A sweep is therefore a full comparison of every bound
    Project's items and every tracked issue's relationships against the
    mirror, by list and never by an updated time, and it publishes any
    change no delivery brought, including one made while the service was
    down. `requestSweep()` sets the sweep due; the service calls it after a
    pull advances the process repository, so a newly bound Project is read
    without waiting for the interval.
  redelivery: >-
    A redelivery scan runs for each configured hook. A hook with no
    `github_hook_scan` row gets one whose `scanned_through` is now, and is
    scanned from the next scan on. Otherwise the scan lists the hook's
    deliveries, `GET /orgs/{owner}/hooks/{id}/deliveries` for an
    organization hook and `GET /repos/{owner}/{repository}/hooks/{id}/deliveries`
    for a repository hook, 100 per page, newest first. It follows the Link
    header's `next` cursor and stops when there is no next cursor or at the
    first page that reaches a `delivered_at` earlier than
    `scanned_through`. A cursor that repeats fails the scan as an API error.
    A GUID is failed when none of its listed attempts
    has a status code from 200 to 299, it has no `github_delivery` row, and
    it has no `github_redelivery` row. For each failed GUID the scan calls
    `POST .../deliveries/{attempt_id}/attempts` with its newest attempt and
    then writes its `github_redelivery` row, so the source asks once per
    GUID. When every page is read it sets `scanned_through` to the newest
    `delivered_at` it read. A redelivered delivery arrives at `receive` with
    its GUID as any delivery does. A delivery older than GitHub keeps is
    recovered by the sweep alone.
  push: >-
    A push that matches the process repository, as `github-events` defines,
    calls `processRepository.pull({ commit: after })` once per GUID. The
    process repository serializes pulls and returns `unchanged` for a
    commit it already holds, and every sweep calls `pull()`, so a push
    whose delivery never arrived is pulled at the next sweep.
  request-listener: >-
    `requestListener` answers `405` to any method but `POST`. It reads the
    body up to 26214400 bytes, GitHub's payload limit of 25 MB, and answers
    `413` and stops reading beyond it. It then calls `receive` and answers
    `202` for a new delivery, `200` for a duplicate, `400` for `malformed`,
    `404` for `unknown-hook`, and `401` for `signature`. A throw answers
    `500` and is sent to `onError`. Every answer is sent after `receive`
    returns, so a `2xx` answer means the delivery's GUID and pending rows are
    committed. The service mounts the listener on its HTTP host at
    `/webhooks/github`, as `service-assembly` states, so each hook's payload
    URL reaches the service at that path.
  tracked-issue: >-
    `trackedIssue(nodeId)` reads the mirror: the issue, the present
    dependencies in each direction, the present sub-issues and parent, and
    the bound Projects with a present item for it. It returns `undefined`
    for an issue that is not tracked, not yet baselined, or observed absent, so every answer
    it gives holds the issue's complete relationship lists. Intake and gates read the dependency
    graph through it. `items` lists the issue's present item on each bound
    Project, with its `archived` flag and every field value row the mirror
    holds for it, keyed by the field's latest name, a row with no value as
    `null`. `title` and `url` are the issue's as the mirror last read
    them. Each read of an issue writes its title and URL to its
    `github_issue` row without a change, as a field's latest name is
    written, so a title edit publishes no event and the next reconcile or
    sweep of the issue brings the mirror up to date. `trackedIssueIds()` reads the node id of every issue for which
    `trackedIssue` answers. `project(nodeId)` reads the mirror's Project
    row of a node id, so the service maps an actor's Project to its
    binding. They read the mirror synchronously, so a caller
    that reads them and acts in the same turn of the event loop sees no
    reconcile between. Intake reconciles against `trackedIssueIds`.
    After each transaction that commits a change to a mirror row, whether or not
    it publishes an event, the source calls `onMirrorChanged`. A transaction
    that writes no mirror change, and a rolled-back one, call nothing.
  stop: >-
    `stop()` clears both timers, aborts the request in flight, and resolves
    when the runner has returned; the aborted work stays pending. A queued
    card move, and one whose request it aborts, is left unsettled, so its
    actor saves no outcome for it and the invoke the restored actor runs
    sends it again. `receive`
    after `stop` throws a `TypeError`, and `stop` twice does nothing more.
  convergence: >-
    `receive` twice with one GUID writes one `github_delivery` row and one
    set of pending rows, and calls `pull` once. A crash before its commit
    leaves nothing and GitHub sees no `2xx`, so the redelivery scan asks for
    it again. A crash after the commit and before the answer leaves the GUID
    accepted; the redelivery is a duplicate and the pending rows do the
    work. A reconcile twice against the same GitHub state publishes the
    first time and finds no difference the second, since its mirror writes
    and its events commit in one transaction. A crash during a read or
    before that commit leaves the pending row, and the next wake reads
    again. A redelivery request that GitHub took before a crash, with no
    `github_redelivery` row yet, is asked again once, and the second
    arrival is a duplicate. A sweep twice publishes nothing the second time
    that the first published. A card move twice for one invocation writes
    one row and sets one option twice, which leaves GitHub holding one value
    and the mirror publishing one change. A crash before the row commits
    leaves nothing, and the restored actor's invoke sends the move as the
    first time. A crash after the row commits and before the write leaves a
    `sent` row; the restored invoke writes it again with the same key and
    confirms it. A crash after GitHub takes the write and
    before the pending row commits leaves the row; the restored invoke
    writes again and confirms the row, and the read that follows publishes
    one change, confirmed.
  errors: >-
    A delivery that fails verification is a `rejected` outcome, never a
    throw, since GitHub and anyone who can reach the endpoint send it.
    Failures of GitHub's API and of `pull` are `GitHubSourceError`s sent to
    `onError`, and the runner recovers from them on its next wake. SQLite
    errors and an unreadable secret file throw from `receive`; in the
    runner they stop the wake, are sent to `onError`, and leave the work
    pending. A card move's failure is a `GitHubWriteError` that rejects its
    promise, and leaves the runner's other work as it was. Misuse by
    service code throws a `TypeError`. Inputs from service code are trusted
    otherwise.
  tests: >-
    Tests run against a real store file in a temporary directory, with a
    router started on it and a recording actor host whose actors subscribe
    to issue and Project topics. A local `node:http` server stands in for
    GitHub: it mints installation tokens for a key generated by
    `node:crypto`, answers each named GraphQL operation from an in-memory
    model of issues, dependencies, sub-issues, Projects, items, and field
    values, lists hook deliveries from its own delivery log, and answers a
    redelivery request by signing and posting the logged delivery to the
    source's listener with its GUID. The fake refuses any query with a
    variable or argument that filters by time. Delivery fixtures are
    synthetic, with generic owners, repositories, and node ids, in the
    shapes the spike recorded. Nothing calls GitHub. A fake clock drives the
    timers. Behaviours proved, each written red before green: a valid
    delivery is accepted; a missing header, a non-JSON body, and a handled
    event missing a field it reads are `malformed`; an unknown hook id is
    `unknown-hook`; a body signed with the wrong secret, with another
    hook's secret, or changed by one byte is `signature`; and no rejected
    delivery writes a row, calls the fake, or publishes. One GUID from the
    organization hook and then a repository hook is accepted once and read
    once. A cross-repository dependency, whose two deliveries each carry
    one end, publishes `github.dependency.added` once. With a populated dependency graph, tracked issues A, B, and C
    blocked by an issue X outside every bound Project and D blocked by A,
    closing X publishes one `github.issue.closed` under the topics of X, A,
    B, and C, whose actors each take it once and D's none, and closing A
    reaches A and D. A dropped delivery: the model gains a dependency and
    no delivery is sent; the sweep publishes `github.dependency.added`
    once; the delivery then arrives and publishes nothing new. A failed
    delivery: the fake logs it as failed; the scan asks once, the
    redelivery publishes it, a second scan asks nothing, and the next sweep
    publishes nothing. An item added, edited, archived, restored, and
    removed publishes each event once with its field values; the first
    sweep of a newly bound Project publishes `added` for each item and no
    `field-changed`; an issue's first read publishes no relationship
    between it and an issue that is not baselined; with A tracked and
    baselined and B newly added to a bound Project and blocking A, reading
    A first and reading B first each publish `github.dependency.added`
    once; with the first relationship read of a newly added issue held
    open by the fake and the issue blocked by an open issue, neither
    `github.project-item.added` nor a defined `trackedIssue` answer is
    observable until the read completes, and then `trackedIssue` lists the
    blocker; a
    Project closed and reopened publishes both. With the fake clock held
    still, a request and its read in one tick clear the row and the runner
    goes idle, and a second request made during that read, in the same
    tick, leaves the row pending and is read again. A `502`, a
    rate limit answer, and a request that never answers, past
    `requestTimeoutMs` on the fake clock, each leave the work pending and
    report `api`, and the next wake completes it. Each transaction that
    publishes an item addition with issue content calls `onTracked` once,
    after its commit, with those issues' node ids; a field change, a
    removal, and a sweep that finds nothing new do not call it.
    `trackedIssue` lists an item's field values by name, and
    `trackedIssueIds` lists exactly the issues `trackedIssue` answers for. A matching push calls
    `pull` with its head once, a push to another branch or repository does
    not, and each sweep calls `pull()`. Every published event validates
    against `github-events.schema.yml`. `onMirrorChanged` is called once
    after a reconcile that removes an issue's last Project item, once after
    one that marks an issue absent with no event, and not after a reconcile
    that finds nothing changed. The source's tables match
    `github-source-database-schema`. Fault test, in a child Node process
    that sends itself `SIGKILL` from `probe`, between a reconcile's read
    and its commit, and whose kill signal the parent asserts: after a restart on the same
    file the change is published once.
    Card moves, through the fake, which also answers `GitHubProjectField`
    and `GitHubCardMove` from its model and logs each mutation: a move sets
    the item's field to the option and resolves; the item is read next and
    `field-changed` is published once with `movedBy` the move's actor; the
    delivery GitHub sends for the move then publishes nothing. With the
    fake's first read after the mutation answering the earlier value, the
    read publishes nothing and the delivery's read publishes the change,
    attributed; with no delivery, the next sweep publishes it, attributed.
    A person's change in the fake publishes `movedBy` `null`, and so does a
    change to another option after a move whose value never showed. Two
    moves of one actor whose first read shows only the first value publish
    two changes, each confirmed. A move to the option the card holds
    resolves and publishes nothing. With an item whose field values span
    two pages and the lifecycle field on the first, a person's change read
    on the first page and a move queued while the fake holds the second
    page's answer: the move waits until the observation commits, the
    person's change publishes with `movedBy` `null`, and the next read
    publishes the move confirmed. A mutation that fails with `transport`
    before the fake applies it, followed by a person selecting the same
    option, publishes `movedBy` unconfirmed for that actor, never
    confirmed. A person's change between two moves of one actor, read by a
    lagging read, publishes `null`, and the second move then publishes
    unconfirmed. A replayed move after its change was attributed, followed
    by a person's change away and back, publishes `null` and then
    unconfirmed. A move that GitHub takes, then a restart before the
    actor's save, with the first read after the restart lagging at the
    earlier value and the restored invoke's repeated mutation refused with
    `FORBIDDEN`: the invoke fails with `forbidden`, the row stays
    `confirmed`, and the next read publishes the original move with
    `movedBy` confirmed for the actor. While a sweep's observation is held open by the fake, a
    queued move waits, and is sent after that observation commits.
    A field the Project lacks, a text field of that name, an option the
    field lacks, an issue with no item on the Project, a `NOT_FOUND` at the
    item, a `FORBIDDEN` error, a `403`, a `502`, a rate limit answer, a
    mutation that never answers past `requestTimeoutMs` on the fake clock,
    and another GraphQL error each reject with their kind; the refused ones
    leave no row and the `transport` ones keep it. A move aborted while
    queued sends nothing. Every published `field-changed` validates against
    `github-events.schema.yml` with its `movedBy`.
