$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - gates
objective: >-
  Give the user two ways to put logic in the process repository, an
  expression for anything about one value and a function for anything over a
  set, so that every guard, mapping, decision, and comparator is a file
  Manifold can lint, run, and explain, with no third language.
background:
  problems:
    - >-
      Under XState every guard, action, and input mapping is an implementation
      referenced by name, which would make every condition a code change if
      nothing else were provided.
    - >-
      A decision model's cells are written in its engine's own expression
      language, which would be a third language beside the blueprint's
      expressions and the comparator's code.
    - >-
      Unconstrained user code in the service can reach the network, run
      forever, or grow into a process of its own.
design-challenges:
  synchronous-guards: >-
    XState v5 guards, assignments, and mappings return their result
    synchronously, and JSONata 2 returns every result as a promise.
  one-language-per-shape: >-
    A user should be able to say in one sentence why a piece of logic is
    written the way it is.
  sandbox-limits: >-
    A timeout and a memory limit must hold against a function that allocates
    in a loop, and the lint in the host CLI must check a function without
    running it.
  cell-semantics: >-
    A decision table cell in JSONata has no shorthand; `> 3` is a syntax
    error and a range literal parses but never matches. What a cell means
    must be written down and linted.
proposed-design:
  high-level-overview: >-
    JSONata is the expression language everywhere an expression appears:
    inline in a blueprint for guards, input and output mappings, and event
    matches, and inside decision models through three custom Zen nodes whose
    cells, expressions, and conditions are JSONata. TypeScript, run in a QuickJS wasm
    sandbox, is used only for the comparator, the one function whose input is
    a set. Decision models remain GoRules JDM files edited in the JDMEditor
    and evaluated by the Zen engine.
  blueprint-expressions: >-
    A guard is a JSONata expression over the actor's context and the event,
    yielding a boolean. A mapping is a JSONata expression at a schema
    boundary: the input of a child state machine or invoked implementation,
    the output of a final state, or the assignment of an event payload into
    context. An event match is a JSONata expression over the event, yielding
    a boolean. Each is carried in the YAML as the parameter of one generic
    implementation, `expression.guard`, `expression.match`,
    `expression.assign`, or `expression.map`, so the blueprint stays
    serializable. The specification `blueprint-expressions` defines each
    shape, what `$` is bound to at each site, and which schemas bound it.
  expression-lint: >-
    Every mapping sits between two declared schemas. The lint builds samples
    from the input schema, evaluates the expression, and validates the result
    against the output schema. Guards and matches are checked for a boolean
    result. The samples are each of the schema's `examples`, one generated
    value with every optional property, and one with required properties
    only, generated from a fixed seed. The lint binds JSONata's clock to a
    fixed instant and its random function to a seeded generator, so that a
    lint result is repeatable. The events a site sees are read from the
    transitions that reach it in the machine configuration.
    The lint is a pure function in `packages/shared` over a blueprint's
    machine and schemas, and the host CLI runs the same function.
  synchronous-evaluation: >-
    XState calls guards, assignments, and input and output mappings
    synchronously, and JSONata evaluates asynchronously. The service
    evaluates blueprint expressions in one worker thread and waits for each
    result on a shared buffer with `Atomics.wait`, so every implementation
    is an ordinary synchronous function and works the same in an initial
    transition, an eventless transition, a restored actor, and a child
    machine. The worker compiles each expression once and keeps the compiled
    form by its source text. The worker holds no state the service needs:
    a restarted service starts a new worker, and a replayed event evaluates
    again from the same snapshot.
  expression-errors: >-
    A failed expression yields an `ExpressionError` naming its kind (syntax,
    evaluation, result, or schema), the expression, its location in the
    blueprint as a JSON Pointer, and the JSONata error code and character
    position when JSONata supplies them. A guard or match that fails does not
    pass. An assignment that fails writes nothing to context and raises an
    `expression.error` event the blueprint may handle. An input or output
    mapping that fails throws, and the actor stops in error; the store keeps
    the last good snapshot. Every failure is also reported to the service
    through one callback, so it can be recorded.
  jsonata-primitive: >-
    `packages/shared` holds one JSONata primitive: compile an expression to
    a compiled form or a syntax error, and evaluate a compiled form over an
    input and bindings to a value or an evaluation error. The blueprint
    worker, the expression lint, and the decision model nodes use it, so
    JSONata has one version and one error shape in Manifold.
  decision-models: >-
    Manifold ships three custom Zen node types, a decision table, an
    expression node, and a switch, with JSONata cells, expressions, and
    conditions, built on the editor's exported table component and evaluated
    by a host handler beside the engine. Input, output, and graph stay stock;
    no decision model holds an expression in Zen's own language. The service
    routes a JSONata switch through a generated stock switch that reads one
    boolean per statement the handler computed. Hit policy, pass-through,
    input field, output path, and loop mode are controls on the node card. A
    setting that reads a value is JSONata; a setting that names a place is a
    dotted path. The service evaluates a set of models through one
    Zen engine whose custom handler runs the three kinds over JSONata compiled
    once at load, and the lint in `packages/shared` checks a model without
    evaluating it. The engine and editor versions are pinned; a contract test
    guards the engine's error envelope and a browser check guards the
    undocumented editor behaviour the table relies on. The specification
    `decision-models` defines the node configurations, the evaluation, the
    record, and the lint.
  cell-semantics: >-
    An input cell is a JSONata expression evaluated with the column's value
    bound as `$` and the whole input bound as `$input`; an empty cell matches
    anything; a cell matches when its result is true. An output cell is a
    JSONata expression evaluated against the input whose result is the
    column's value; a blank output cell or one with no result writes nothing.
    The lint rejects a cell that does not parse and warns on an input cell
    whose result is provably never boolean from the shape of its syntax tree;
    a cell it cannot classify is left to strict matching at run time.
  comparator-sandbox: >-
    A comparator is a TypeScript module exporting one function typed by a
    declaration file Manifold ships. The service transpiles it with the
    TypeScript compiler API in-process and runs it in a fresh QuickJS wasm
    instance per load with a capped memory and a per-evaluation timeout,
    both set in service configuration with shipped defaults. The
    function sees only its input; there is no import, no global, no network,
    no timer, no clock. A seeded random and the values age is derived from
    are inputs. A comparator that exceeds its limit fails the evaluation and
    the gate records the failure and waits for the next input change.
  comparator-lint: >-
    The host CLI typechecks a comparator against the declaration file with
    the TypeScript 6 compiler API in-process, rejecting a wrong signature and
    any use of an undeclared host global. Library files are embedded in the
    Bun binary. The CLI does not run the function.
  explainability: >-
    Each comparator evaluation is recorded with its input, output, and seed.
    Each decision model evaluation is recorded with its input and the trace
    the engine returns. The engine's trace names a failing node but not its
    rule or column, so the handler carries the failing cell's location
    through the engine's error, and the service writes it into the failing
    node's trace, so the record names the node, rule, and column of any
    failing cell.
