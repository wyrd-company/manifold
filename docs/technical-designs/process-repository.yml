$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - service-configuration
    - store
objective: >-
  Keep a clone of the user's process repository in the service, pulled in
  process on request, and give every loader the repository's declared files
  at one commit through one read-only seam, so that loaders never see a
  half-pulled tree, a file read at a commit reads the same text after any
  later pull, and a crash during a pull leaves the last complete commit
  current.
background:
  current-design: >-
    The concept's `process-repository` is a user-supplied git repository
    that holds everything the user declares; Manifold clones it and pulls on
    push. `service-configuration` holds its URL, branch, credential name, and
    clone directory. The blueprint loader and the portfolio loader read
    files through the seam this design defines, `ProcessRepositoryRevision`.
  problems:
    - >-
      Git operations run in process, through an adopted library, with no
      `git` subprocess.
    - >-
      isomorphic-git's fetch writes the tracking ref before it writes the
      pack file and its index, and writes each file in place. A crash
      between those writes leaves a ref naming objects the clone lacks, or a
      truncated index that fails every object read.
    - >-
      An actor started at one commit keeps reading that commit's files while
      later pulls advance the repository.
design-challenges:
  convergence: >-
    A pull that runs twice, or after a crashed pull, must end with the same
    current commit and a readable clone.
  crash-window: >-
    The current commit must change in one atomic step, after every object
    of the new commit is on disk and readable.
  seam: >-
    Loaders in the service, and tools that read a working tree, must read
    files through the same small interface, testable with an in-memory
    fixture.
proposed-design:
  high-level-overview: >-
    The process repository module is
    `packages/service/src/process-repository/`, whose only public file is
    `index.ts`. `openProcessRepository` opens or creates a bare git
    directory in the configured `directory`, recovers from a crashed pull,
    and reads the current commit from a pointer file. `pull()` fetches the
    configured branch with isomorphic-git, verifies every object of the
    fetched commit's tree, and replaces the pointer file atomically.
    `current()` and `revisionAt(commit)` return a `ProcessRepositoryRevision`
    that reads blobs and trees at that commit straight from the object
    database, with no working tree. The `ProcessRepositoryRevision`
    interface lives in `packages/shared` so that any reader of declared
    files implements it.
  revision-seam: |-
    `packages/shared/src/process-repository-revision.ts` defines the seam
    and an in-memory implementation, both exported from the shared
    package's `index.ts`.

    ```ts
    /** The process repository's declared files at one commit. Read-only. */
    export interface ProcessRepositoryRevision {
      /** The full 40-character hexadecimal commit id. */
      readonly commit: string;
      /** The file's text decoded as UTF-8, or undefined when no file is at the path. */
      read(path: string): Promise<string | undefined>;
      /** The paths of every file under the prefix, sorted by UTF-16 code unit. */
      list(prefix: string): Promise<readonly string[]>;
    }

    /** A revision over the given files, for tests and tools. */
    export function memoryRevision(
      commit: string,
      files: Readonly<Record<string, string>>,
    ): ProcessRepositoryRevision;
    ```

    A path is repository-relative and `/`-separated: one or more segments,
    none empty, `.`, or `..`, with no leading or trailing `/` and no `\`.
    `read` and `list` throw a `TypeError` naming the argument for any other
    path, since a malformed path is a defect in the caller. `list` also
    accepts `""`, meaning the whole repository. A file is a blob entry with
    mode `100644` or `100755`; a symbolic link or submodule entry is not a
    file, so `read` resolves to `undefined` for it and `list` omits it.
    `read` resolves to `undefined` for a path that is absent or names a
    directory. `list(prefix)` resolves to every file path that starts with
    `prefix` followed by `/`, or every file path for `""`, and to `[]` when
    the prefix names a file or nothing. Two calls with the same argument on
    the same revision resolve to equal results, because a commit's tree
    never changes. `memoryRevision` applies the same path rules to the keys
    of `files` and throws a `TypeError` for a malformed key or a commit
    that is not 40 lower-case hexadecimal characters.
  public-interface: |-
    `packages/service/src/process-repository/index.ts` exports exactly
    these names.

    ```ts
    import type { ProcessRepositoryRevision } from "@wyrd-company/manifold-shared";
    import type { Credentials, ProcessRepositoryConfiguration } from "../service-configuration/index.ts";

    export function openProcessRepository(options: ProcessRepositoryOptions): Promise<ProcessRepository>;

    export interface ProcessRepositoryOptions {
      readonly configuration: ProcessRepositoryConfiguration;
      readonly credentials: Credentials;
      /** Called at each step of a pull, after the step completes. */
      readonly probe?: PullProbe;
    }

    export interface ProcessRepository {
      /** The revision at the current commit, or undefined before the first pull completes. */
      current(): ProcessRepositoryRevision | undefined;
      /** The revision at any commit the repository holds, or undefined for any other commit. */
      revisionAt(commit: string): Promise<ProcessRepositoryRevision | undefined>;
      /** Moves the current commit to the remote branch's commit. */
      pull(request?: PullRequest): Promise<PullOutcome>;
    }

    export interface PullRequest {
      /** The branch commit the caller expects, such as a push event's head. */
      readonly commit?: string;
    }

    export type PullOutcome =
      | { readonly kind: "unchanged"; readonly commit: string }
      | { readonly kind: "advanced"; readonly commit: string; readonly previous: string | undefined };

    export type PullStep = "fetched" | "verified" | "published";
    export type PullProbe = (step: PullStep, commit: string) => void;

    export class ProcessRepositoryPullError extends Error {
      readonly kind: "authentication" | "remote" | "branch-missing" | "incomplete";
    }
    ```
  module-layout: >-
    `index.ts` re-exports the public names and nothing else. `layout.ts`
    holds the paths inside `directory` and the atomic pointer write.
    `recover.ts` holds the open-time recovery. `pull.ts` holds the fetch,
    verification, and publication. `revision.ts` implements
    `ProcessRepositoryRevision` over the object database. Tests import only
    `index.ts`. The module adds `isomorphic-git` as a service dependency, and
    passes it `node:fs`, `isomorphic-git/http/node`, and one object cache per
    open repository.
  library: >-
    Git runs in process through isomorphic-git, per
    `use-isomorphic-git-for-the-process-repository`. The module calls
    `init`, `fetch`, `readCommit`, `readTree`, `readBlob`, `resolveRef`, and
    `writeRef` with an explicit `gitdir`, so the clone is bare and has no
    working tree. isomorphic-git speaks git's smart HTTP protocol, so
    `processRepository.url` is an `http://` or `https://` URL.
  directory-layout: >-
    `directory` holds `git/`, the bare git directory, and `current`, the
    pointer file. `current` holds one line: the 40-character commit id of
    the current commit. The pointer is written by writing
    `current.<random>.tmp`, calling `fsync` on it, renaming it over
    `current`, and calling `fsync` on `directory`, so a reader finds the old
    pointer or the new one and never a partial one. Manifold writes nothing
    else inside `directory`; isomorphic-git writes inside `git/`.
  opening: >-
    `openProcessRepository` creates `directory` when absent and runs, in
    order: `init` with `bare: true` on `git/`, which leaves an existing
    repository unchanged; removal of every `current.*.tmp` file; removal of
    every incomplete pack pair; and the read of `current`. A pack pair is
    complete when `objects/pack/pack-<sha>.pack` ends with the SHA-1 of its
    preceding bytes and that SHA-1 is `<sha>`, and `pack-<sha>.idx` exists,
    ends with the SHA-1 of its preceding bytes, and names `<sha>` as its
    pack checksum. These are git's pack and index formats. Recovery deletes
    the `.pack` and `.idx` of every pair that is not complete. A deleted
    pair held only objects of a pull that never published, since a pull
    publishes after its pack and index are complete. When `current` is
    absent, `current()` returns `undefined` until a pull completes. When
    `current` names a commit whose tree fails verification,
    `openProcessRepository` deletes `current`, so the next pull fetches that
    commit again. Opening twice in a row recovers nothing the second time.
  pull: >-
    `pull(request)` runs in five steps. Pulls are serialized: a pull
    requested while one runs waits for it, and every request made while one
    runs shares the single pull that runs next. (1) When `request.commit`
    equals the current commit, it returns `unchanged` with no network
    request. (2) It deletes every ref under `git/refs/` and
    `git/packed-refs`, then writes `refs/remotes/origin/<branch>` as the
    current commit when there is one. isomorphic-git sends a `have` line for
    each local ref, so the only commit the fetch claims to hold is one this
    module verified. (3) It calls `fetch` with the configured `url`, `ref`
    set to the branch, `singleBranch: true`, `tags: false`, and `onAuth`
    and `onAuthFailure` as described under authentication, and calls the
    probe with `fetched` and `fetchHead`. A remote with no such branch fails
    with kind `branch-missing`; an authentication the remote refuses fails
    with kind `authentication`; any other transport or protocol failure
    fails with kind `remote`. (4) It reads the `fetchHead` commit and walks
    its tree, reading every tree and blob object, and calls the probe with
    `verified`. A missing or unreadable object fails with kind `incomplete`.
    (5) When `fetchHead` equals the current commit it returns `unchanged`.
    Otherwise it writes the pointer, calls the probe with `published`, and
    returns `advanced` with the previous commit. A pull that fails leaves
    the current commit and every revision unchanged. The commit follows
    the branch: after a force push, the next pull makes the remote's commit
    current whether or not it descends from the previous one.
  convergence: >-
    A second pull of the same commit fetches an empty pack, which
    isomorphic-git does not write, finds `fetchHead` equal to the current
    commit, and returns `unchanged`. A pull after a crash at any point
    before the pointer rename finds the previous pointer, resets the refs to
    it in step 2, and fetches every object the crashed pull may have left
    incomplete. A crash after the rename leaves the new commit current. A
    crash during `init` leaves a directory that `init` completes on the next
    open.
  authentication: >-
    When `configuration.credential` is absent, `fetch` gets no `onAuth`, and
    a remote that asks for authentication fails the pull with kind
    `authentication`. Otherwise the module resolves the name through
    `credentials.resolve` at open, so an undefined name fails
    `openProcessRepository` with `UnknownCredentialError`. `onAuth` runs
    only when the remote asks, so a public repository never mints a token.
    For a `github-app` credential, `onAuth` calls `installationToken` with
    `repositories` set to the repository name taken from the URL's last path
    segment without `.git`, and `permissions` set to `{ contents: "read" }`,
    and returns `{ username: "x-access-token", password: token.reveal() }`.
    `onAuthFailure` returns `{ cancel: true }`. The token reaches
    isomorphic-git and nothing else: the module writes no token to a file,
    the store, an error message, or a log line, and errors name the URL
    without user info, the branch, and the credential name.
  revisions: >-
    A revision holds its commit id, the git directory, and the repository's
    object cache. `read(path)` calls `readBlob` with the commit as `oid` and
    the path as `filepath`, after checking the entry's mode with `readTree`
    on the parent directory, and decodes the blob with a `TextDecoder` for
    UTF-8. `list(prefix)` walks the tree at the commit from the prefix's
    tree down. `current()` returns the revision for the pointer's commit,
    the same object until a pull publishes. `revisionAt(commit)` resolves to
    a revision when `readCommit` finds the commit in the clone, and to
    `undefined` for any other string, including one that is not a commit
    id. The blueprint loader reports `undefined` as a missing version.
    The clone keeps every object it fetches, since isomorphic-git never
    deletes objects, so a revision at an older commit reads the same text
    after any later pull and after a restart. `revisionAt` is how a loader
    rebuilds what it read at an older commit: the blueprint loader rebuilds
    an older blueprint version for an actor started at that commit.
  trigger: >-
    `pull` is the one function that moves the current commit. The service
    calls it once after `openProcessRepository`, and the GitHub event source
    calls it with the pushed head as `request.commit` when a push to the
    configured branch arrives. A caller that needs to act on a new commit
    reads the `advanced` outcome.
  tests: >-
    Tests serve fixture repositories over smart HTTP from an in-test
    `node:http` server that runs `git http-backend` as a CGI program on a
    bare repository in a temporary directory; the fixture commits are
    written with isomorphic-git. `git` runs only in the test fixture, never
    in the module. Tests cover: a first pull advances from `undefined`; a
    second pull with no new commit returns `unchanged` and writes no pack; a
    pull with `request.commit` equal to the current commit makes no request;
    a file read at an older commit returns the same text after a newer pull
    and after reopening; `read` of a directory, a symbolic link, and an
    absent path resolves to `undefined`; `list` with `""`, a directory, and
    a file prefix; malformed paths throw; an unknown branch, a refused
    credential, and a server that closes the connection during the pack
    each fail with their kind and leave the current commit readable. Crash
    tests: a probe that throws at `fetched` and at `verified`, then a new
    open and pull, ends at the remote commit with the old commit readable
    throughout; a truncated `.idx`, a truncated `.pack` with no `.idx`, a
    leftover `current.*.tmp`, and a tracking ref naming a missing commit,
    each placed in the git directory before open, recover and pull to the
    remote commit; and a child process killed during a pull of a large
    fixture leaves a directory that opens at the previous commit and pulls
    to the remote commit. A credential test serves a repository that
    requires basic authentication, mints from the in-test GitHub API, and
    asserts the token appears in no error, no file under `directory`, and
    no row of a store opened beside it.
