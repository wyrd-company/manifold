$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - service-configuration
    - store
    - durable-event-delivery
    - process-repository
    - blueprint-loader
    - portfolio
    - github-event-source
    - t3code-environment-source
    - task-metadata
objective: >-
  Run the service as one process from one service configuration file, with
  one HTTP host that every module mounts its endpoints on, a start order
  that resumes durable delivery before any source publishes, a stop order
  that leaves every module closed, and a path by which each new process
  repository commit reaches the blueprint loader and the portfolio, so that
  a pushed commit takes effect with no restart and a crash at any point
  converges on the next start.
background:
  current-design: >-
    Each module is built and tested alone. `loadServiceConfiguration` loads
    the file, `openStore` opens the database, `startRouter` resumes
    delivery, `openProcessRepository` and `pull` keep the clone,
    `createBlueprintLoader` builds machines from a revision, `openPortfolio`
    and `apply` keep the declaration in force, and `startGitHubSource` and
    `startT3CodeSource` publish events. The GitHub source exports a
    `requestListener` and calls a `ProcessRepositoryTrigger` on a push and
    at each sweep.
  problems:
    - >-
      No process starts the modules together, so a push reaches the
      process repository and no loader, and the GitHub source's listener is
      served by nothing.
    - >-
      A pull publishes the new commit before any loader reads it. A crash
      between the two leaves a current commit whose portfolio declaration
      is not in force.
    - >-
      Modules of later waves serve HTTP endpoints and start beside these
      ones, and each needs one place to join.
design-challenges:
  order: >-
    Every live event must reach an actor after its pending rows, so no
    source may hold the router before `startRouter` returns. Stop must run
    the reverse, so no source publishes into a stopped router or a closed
    store.
  convergence: >-
    The commit in force for the loaders must catch up with the current
    commit whatever ran before: a crash after publish, a failed read, a
    pull no one awaited.
  one-host: >-
    One listener serves signed webhooks and operator endpoints under
    prefixes owned by different modules. Access control belongs to the
    deployment.
proposed-design:
  high-level-overview: >-
    `packages/service/src/service/` is the assembly. `startService` loads
    the service configuration, opens the store, the portfolio, the process
    repository, and the blueprint loader, brings the loaders up to the
    current commit and pulls, opens the actor host, starts the router, starts the GitHub and T3
    Code sources, mounts the GitHub source's listener, and listens.
    `Service.stop` undoes the same steps in reverse. The revision follower
    sits between every pull and the loaders: after each pull it loads the
    current revision into the blueprint loader and applies it to the
    portfolio, one revision at a time. `packages/service/src/http-host/`
    is the HTTP host: one `node:http` server whose request handler
    dispatches by path prefix to the listeners mounted on it.
    `packages/service/src/main.ts` is the process entry point: it starts the service from the file named on its
    command line and stops it on `SIGTERM` and `SIGINT`.
  public-interface: |-
    `packages/service/src/service/index.ts` exports exactly these names.

    ```ts
    import type { DeliveryProbe, JsonValue, Store } from "../store/index.ts";
    import type { Router } from "../router/index.ts";
    import type { ActorHost } from "../actor-host/index.ts";
    import type { BlueprintLoader, RevisionLoad } from "../blueprint-loader/index.ts";
    import type { Portfolio } from "../portfolio/index.ts";
    import type {
      ProcessRepository,
      PullOutcome,
      PullProbe,
      PullRequest,
      SaveProbe,
      SaveRequest,
    } from "../process-repository/index.ts";
    import type { GitHubSource } from "../github-source/index.ts";
    import type { T3CodeSource } from "../t3code-source/index.ts";
    import type { HttpListener } from "../http-host/index.ts";
    import type { ServiceConfiguration } from "../service-configuration/index.ts";

    export function startService(options: StartServiceOptions): Promise<Service>;

    export interface StartServiceOptions {
      /** Path of the service configuration file. */
      readonly configurationFile: string;
      /** Aborting it stops the start at the next step boundary. */
      readonly signal?: AbortSignal;
      /** Builds the router's actor host from the parts started before the router. */
      readonly actorHost?: (parts: Omit<ServiceParts, "actorHost">) => ActorHost | Promise<ActorHost>;
      /** Receives every log entry. Defaults to one JSON line per entry on stderr. */
      readonly log?: (entry: ServiceLogEntry) => void;
      readonly probes?: ServiceProbes;
    }

    export interface ServiceProbes {
      /** Called after each start and stop step completes. */
      readonly step?: (step: ServiceStep) => void;
      /** Passed to the process repository. */
      readonly pull?: PullProbe;
      /** Passed to the store. */
      readonly delivery?: DeliveryProbe;
      /** Called after the revision follower applies a revision. */
      readonly applied?: (applied: AppliedRevision) => void;
      /** Passed to the process repository as its save probe. */
      readonly save?: SaveProbe;
    }

    export type ServiceStep =
      | "configuration-loaded"
      | "store-opened"
      | "portfolio-opened"
      | "process-repository-opened"
      | "revision-followed"
      | "pulled"
      | "actor-host-opened"
      | "router-started"
      | "github-started"
      | "t3code-started"
      | "listening"
      | "http-closed"
      | "sources-stopped"
      | "revisions-idle"
      | "router-stopped"
      | "store-closed";

    export interface ServiceParts {
      readonly actorHost: ActorHost;
      readonly configuration: ServiceConfiguration;
      readonly store: Store;
      readonly portfolio: Portfolio;
      readonly processRepository: ProcessRepository;
      readonly blueprints: BlueprintLoader;
      readonly revisions: Revisions;
      readonly log: (entry: ServiceLogEntry) => void;
    }

    export interface Service extends ServiceParts {
      readonly router: Router;
      readonly github: GitHubSource;
      readonly t3code: T3CodeSource;
      readonly http: ServiceHttp;
      /** Stops the service; every call returns the first call's promise. */
      stop(): Promise<void>;
    }

    export interface Revisions {
      /** The blueprint load of the latest revision the follower applied. */
      latest(): RevisionLoad | undefined;
      /** Queues a pull and the apply of its commit as one job; resolves after both. */
      pull(request?: PullRequest): Promise<PullOutcome>;
      /** Queues the apply of the current commit; resolves when it is applied. */
      follow(): Promise<void>;
      /** Queues a pull, a save, and the pull and apply of the saved commit as one job. */
      save(request: SaveRequest): Promise<SavedRevision>;
    }

    export type SavedRevision =
      | {
          readonly outcome: "saved" | "already-saved" | "unchanged";
          readonly commit: string;
          /** The blueprint load in which the commit is applied; undefined when it is not yet applied. */
          readonly blueprints: RevisionLoad | undefined;
        }
      | {
          readonly outcome: "conflict";
          /** `file-changed`: the branch changed the file; `branch-moved`: the branch moved under the retry. */
          readonly reason: "file-changed" | "branch-moved";
          readonly head: string;
          readonly text: string | undefined;
        };

    export interface AppliedRevision {
      readonly commit: string;
      readonly blueprints: RevisionLoad;
      readonly portfolio: "applied" | "unchanged" | "rejected";
    }

    export interface ServiceHttp {
      mount(pathPrefix: string, listener: HttpListener): void;
      /** The address the host listens on. */
      address(): { readonly host: string; readonly port: number };
    }

    export interface ServiceLogEntry {
      readonly level: "info" | "warn" | "error";
      /** A kebab-case name of what happened, such as `pull-failed`. */
      readonly event: string;
      readonly message: string;
      readonly detail?: Readonly<Record<string, JsonValue>>;
    }

    /** The path the GitHub source's listener is mounted at. */
    export const githubWebhookPath = "/webhooks/github";
    ```

    `packages/service/src/http-host/index.ts` exports exactly these names.

    ```ts
    import type { IncomingMessage, ServerResponse } from "node:http";
    import type { HttpHostConfiguration } from "../service-configuration/index.ts";

    export type HttpListener = (request: IncomingMessage, response: ServerResponse) => void;

    export function createHttpHost(options: HttpHostOptions): HttpHost;

    export interface HttpHostOptions {
      readonly configuration: HttpHostConfiguration;
      /** Called for a listener that throws. */
      readonly onError: (error: Error, request: { readonly method: string; readonly path: string }) => void;
    }

    export interface HttpHost {
      mount(pathPrefix: string, listener: HttpListener): void;
      /** Binds the configured address; resolves with the bound address. */
      listen(): Promise<{ readonly host: string; readonly port: number }>;
      /** The bound address; throws a TypeError before `listen` resolves. */
      address(): { readonly host: string; readonly port: number };
      /** Stops accepting, waits for requests in progress, and resolves; every call returns the first call's promise. */
      close(): Promise<void>;
    }
    ```
  module-layout: >-
    In `packages/service/src/service/`, `index.ts` re-exports the public
    names and nothing else. `start.ts` implements `startService` and
    `stop`: the start steps and their reverse, as one ordered list.
    `revisions.ts` implements the revision follower. `log.ts` holds the
    default log sink. In `packages/service/src/http-host/`, `index.ts`
    re-exports the public names, `routes.ts` holds the pure prefix
    validation and longest-prefix match over the mounts, and `host.ts`
    implements `createHttpHost` over `node:http`.
    `packages/service/src/main.ts` is the entry point and holds no logic
    beyond the argument, the signals, and the exit code. The service
    package's `build` emits it as `dist/main.js`, and the package's
    `start` script runs `node dist/main.js`. Tests import only each
    module's `index.ts`, and the entry point test runs the compiled file.
  start: >-
    `startService` runs these steps in order and calls the `step` probe
    after each. (1) `configuration-loaded`: `loadServiceConfiguration` with
    the file, then `configureBlueprintExpressions` with its `expressions`
    section. (2) `store-opened`: creates the directory of `store.file`
    when absent, calls `openStore` with the file and the `delivery` probe,
    and applies `ledgerMigrationSteps`, `portfolioMigrationSteps`, and
    `taskMetadataMigrationSteps` with the store's `migrate`; the router and each source migrate their own
    owners when they start. (3) `portfolio-opened`: `openPortfolio` with
    the store's connection. (4) `process-repository-opened`:
    `openProcessRepository` with the `processRepository` section, the
    credentials, the `pull` probe, and the `save` probe, then `openTaskMetadata` as
    `task-metadata` states, then `createBlueprintLoader` with
    `serviceImplementations()`, the repository's `revisionAt`,
    `onStateEntry: recordStateEntry`, and an
    `onExpressionError` that logs `expression-error`. (5)
    `revision-followed`: creates the revision follower and awaits
    `follow()`, so a commit published before a crash is in force before
    anything reads the portfolio or the blueprints. (6) `pulled`: awaits
    `revisions.pull()`; a pull that fails logs `pull-failed` and start
    continues on the current commit, or with no revision when there is
    none, since every sweep pulls again. (7) `actor-host-opened`: awaits
    the `actorHost` factory, defaulting to `createServiceActorHost`, with
    `Omit<ServiceParts, "actorHost">` from steps 1 to 6. (8)
    `router-started`: calls `startRouter` with the store, the opened actor
    host, and an `onHeld` that logs
    `actor-held`. `startRouter` restores and drains every stored actor and
    returns. (9) `github-started`: `startGitHubSource` with the `github`
    section, the credentials, the store, the router, `boundProjects` read
    from `portfolio.current()`, a `processRepository` trigger whose `url`
    and `branch` are the section's and whose `pull` is `revisions.pull`,
    and an `onError` that logs `github-error`. (10) `t3code-started`:
    `startT3CodeSource` with the store, the router, the `environments`
    section, a `tokenFile` that resolves the credential name to its
    `t3code-token` credential's file, and a `logger` that writes to the
    log. (11) `listening`: creates the HTTP host from the `http` section,
    mounts the GitHub source's `requestListener` at `githubWebhookPath`
    with `mount`, mounts the blueprints API with `mountBlueprintsApi`, as
    `operator-console` states, awaits `listen`, and logs `started` with the
    address.
    Sources start after the router returns, and the host listens after the
    sources start, so no source and no request holds the router before
    resume ends. After each step completes, `startService` checks
    `signal`: when it has aborted, start stops every step already started,
    in the stop order, and rejects with the signal's `reason`. A step in
    progress runs to its end first, since each step is bounded only by the
    work it does, such as a pull by `pullTimeoutMs`.
  start-failure: >-
    A step that throws or rejects stops every step already started, in the
    stop order, and `startService` rejects with the step's error. A
    configuration error is a `ServiceConfigurationError` with every issue;
    an address in use is the `listen` error with its system code. A failed
    start therefore leaves no timer, socket, or open database behind.
  joining: >-
    A module joins the service by adding its start to `start.ts` at the
    step its dependencies fix, its stop at the mirrored point of the stop
    order, its member to `Service` when other modules read it, and its
    endpoints with `mount` before step 11's `listen`. A
    module that publishes starts after step 8. A module whose state the
    actor host reads, such as the implementations a blueprint binds, is
    built before step 7 and reaches the host through `ServiceParts`.
  actor-host: >-
    The default factory opens the actor host described in `actor-host`,
    with the store, blueprint loader, log, and `serviceSaveHooks(parts)`.
    The `actorHost` option supplies an alternative factory with the same
    parts and may return a promise. Both are awaited before the router
    restores any actor. `ServiceParts.actorHost` exposes `start`, `actorOf`,
    and `release` to modules that start after the router.
  stop: >-
    `stop` runs these steps in order, each after the one before it
    resolves, and calls the `step` probe after each. (1) `http-closed`:
    closes the HTTP host, which stops accepting connections and waits for
    the requests in progress. (2) `sources-stopped`: awaits the GitHub
    source's and the T3 Code source's `stop` together. (3)
    `revisions-idle`: closes the revision follower and awaits its queue. A
    pull and its apply are one job, queued when `pull` is called, so the
    queue holds every pull a source started, including one the GitHub
    source called and did not await, and no pull or apply is running when
    the router stops and the store closes. (4) `router-stopped`: `router.stop()`.
    (5) `store-closed`: `store.close()`, and logs `stopped`. The first call
    starts the steps, and every later call returns the same promise, so a
    second stop does nothing more. A step that rejects is logged and the
    remaining steps still run, and the promise rejects with the first
    error once the store is closed.
  revision-follower: >-
    The follower is the only caller of the process repository's `pull`. It
    keeps one serial queue and one in-memory `followed` commit, unset at
    start. `pull(request)` and `follow()` each add one job to the queue
    when they are called and return the job's promise, so jobs run one at a
    time in call order. A pull job first runs the apply step, so a
    published commit whose apply failed is applied before a pull can move
    the current commit past it; when that apply step rejects, the job
    rejects with its error and does not pull. It then awaits
    `processRepository.pull(request)` and runs the apply step again; a
    pull that rejects still runs the apply step, then rejects with the
    pull's error, and otherwise the job resolves with the pull's outcome.
    The GitHub source reports a rejected job as kind `pull`. A follow job runs the apply step alone. The apply step reads
    `processRepository.current()`; when there is no revision, or its
    commit equals `followed`, it does nothing. Otherwise it awaits
    `blueprints.loadRevision(revision)`, keeps the result as `latest`,
    logs `blueprint-invalid` for each path in its `failures`, awaits
    `portfolio.apply(revision)`, logs `portfolio-rejected` with the
    findings of a rejected result, awaits `taskMetadata.apply(revision)`,
    logs `task-metadata-rejected` with the findings of a rejected result,
    sets `followed` to the commit, logs
    `revision-applied`, and calls the `applied` probe. A save job runs the
    apply step, then `processRepository.pull()` and the apply step, as a
    pull job does, and rejects with the pull's error when that pull
    rejects, so a save always builds on the branch as just fetched. It then
    awaits `processRepository.save(request)`. For `pushed`, it awaits
    `processRepository.pull({ commit })` and the apply step, and resolves
    `saved` with the commit and `latest` when that pull resolves, since the
    applied commit is then the saved commit or a commit the branch took
    after it, or with no load when that pull rejected, since the commit is
    on the branch and the next pull applies it. For `already-saved` and
    `unchanged`, the commit is the current commit or one of its first
    parents, found after the job's own pull and apply, so it resolves with
    that outcome, the commit, and `latest`, and for `conflict` with reason
    `file-changed`, the head, and its text. When the save rejects with
    `ProcessRepositorySaveError`, the job pulls and applies again; when the
    current commit is then the error's `head`, nothing else moved the
    branch and the job rejects with the error, so an authentication or a
    policy refusal keeps its kind; otherwise it calls `save` once more with
    the same request, which finds the first push by its trailer, takes the
    save on top of a branch that moved in other files, or answers
    `conflict`, and the job handles that second result as the first. When
    the second save also rejects with `ProcessRepositorySaveError`, the job
    pulls and applies once more, then calls `processRepository.findSave`
    with the request: a push the remote took whose reply was lost leaves
    the save's commit on the branch, and the job resolves `already-saved`
    with that commit and `latest`. Otherwise, when the current commit is
    not the second error's `head`, the branch moved again under the retry,
    and the job resolves `conflict` with reason `branch-moved`, the
    current commit, and the file's text at it; otherwise it rejects with
    the second error. No push follows the second one.
    A branch that moves under a save is therefore answered by what it
    changed, as a typed conflict and never as a remote error, and no save
    is retried more than once. No other pull runs
    between a pull and its apply step, and no pull starts while the current
    commit is unapplied, so at most one published commit is ever unapplied,
    and it is the current commit. Every commit a pull publishes is
    therefore applied, in pull order, before the next pull moves the
    current commit. `close()`, which stop calls,
    makes every later `pull` and `follow` reject with a `TypeError` and
    returns a promise that resolves when the queue is empty.
  convergence: >-
    An apply step that finds its commit already followed does nothing, and
    `portfolio.apply` of a declaration equal to the one in force writes
    nothing, so a follow twice applies once. An apply step whose read
    rejects leaves `followed` unchanged and rejects its job, and the next
    job of either kind retries the same commit before anything else,
    taking the blueprint load from the loader's cache. A crash after a pull publishes and before the
    portfolio applies leaves that commit current in the repository and the
    previous declaration in force in the store; the next start's step 5
    applies it once. A crash during a save job leaves the saved commit on
    the remote branch or nowhere, as `process-repository` states; the next
    start's pull takes it when it is there, and a retried save with the
    same `saveId` answers `already-saved` or pushes it once. A crash after the portfolio's row commits leaves the
    new declaration in force, and step 5 finds it equal and writes nothing.
    `startService` twice on the same files, with a stop or a crash between,
    resumes the same router, inbox, clone, and declaration, as each
    module's own convergence states.
  http-host: >-
    `createHttpHost` creates one `node:http` server with Node's defaults
    for `requestTimeout`, `headersTimeout`, and `keepAliveTimeout`.
    `listen` binds `http.host` and `http.port`; port `0` binds a free port,
    which `address` reports. `close` calls `server.close()`, which stops
    accepting and closes each connection when its request in progress
    ends, then `server.closeIdleConnections()`, and resolves when the
    server's `close` event fires. `mount` may be called
    before or after `listen`.
  mounts: >-
    A path prefix is `/` followed by one or more segments joined by `/`,
    each non-empty and holding no `?`, `#`, or `%`, with no trailing `/`.
    `mount` throws a `TypeError` naming the prefix for
    any other string, `/` included, and for a prefix already mounted. A
    request's path is the path of its request target, before the query, compared as sent with no decoding. A prefix matches a path that
    equals it or continues it with `/`, so `/webhooks/github` matches
    `/webhooks/github` and `/webhooks/github/1` and never
    `/webhooks/githubx`. The path `/` is under no prefix. The longest
    matching prefix takes the request. The listener receives the request
    and response unchanged, with `request.url` as sent. A request whose
    path no prefix matches answers `404` with an empty body. A listener
    that throws before it writes headers answers `500`; either way the
    error goes to `onError`, which the service logs as
    `http-listener-error`. A listener owns its method checks, body limits,
    and answers.
  api-access: >-
    The API is always served without authentication. Operator endpoints
    mount with `mount`. Access control belongs to the deployment:
    loopback by default, or a proxy in front.
  entry-point: >-
    `node dist/main.js <configuration-file>` starts the service. With no
    argument or more than one, it writes a usage line to stderr and exits
    with code 2. Before it starts the service, it installs one handler for
    `SIGTERM` and `SIGINT` and creates an `AbortController` whose signal it
    passes to `startService`. The first signal during start aborts that
    signal, so start stops what it has started at the next step boundary
    and rejects with the abort's reason, and the process exits with code
    0. The first signal after start calls `service.stop()`, and the
    process exits with code 0 when stop resolves and code 1 when it
    rejects. Every later signal does nothing more. A start that rejects for
    any other reason writes the error, and for a
    `ServiceConfigurationError` every issue, to stderr and exits with code
    1. Neither start nor stop is bounded by a time; `SIGKILL` ends a
    process whose stop does not finish.
  log: >-
    Modules log through `ServiceParts.log`. The assembly logs `start-step`
    and `stop-step` at `info`, naming the step, after each step. The
    default sink writes each
    entry to stderr as one JSON line holding `time`, an ISO 8601 string,
    and the entry's fields. A credential value reaches no entry: errors
    carry a `SecretValue` only as its credential name, as
    `service-configuration` states.
  configuration: >-
    Two sections join the service configuration root. `http`, specified
    by `http-host-configuration`, sets the listen address, default
    `127.0.0.1` port 7480. `store`, specified by `store-configuration`, sets the
    path of the store's database file and is required. `ServiceConfiguration`
    gains `http: HttpHostConfiguration` and `store: StoreConfiguration`,
    and `service-configuration`'s module exports both types.

    ```ts
    export interface HttpHostConfiguration {
      readonly host: string;
      readonly port: number;
    }

    export interface StoreConfiguration {
      /** Absolute; resolved against the configuration file's directory. */
      readonly file: string;
    }
    ```
  tests: >-
    Each behaviour is written red before green, through the modules'
    `index.ts` and the compiled entry point. Values are generic: a remote
    fixture repository, owner `example-org`, items `alpha` and `beta`,
    account `acct`, blueprint `blueprints/counter.yml`. HTTP host tests
    run a host on port 0 with listeners that echo their prefix: the
    longest prefix takes a request; `/a` does not take `/ab`; `/` answers
    404 while other prefixes are mounted; a path under no prefix answers
    404; `mount("/")`, a malformed prefix, and a repeated prefix throw; a listener that throws answers 500 and
    reaches `onError`; an API prefix reaches its listener with no
    authorization header, another scheme, or an arbitrary bearer token;
    `close` resolves after a request in progress is answered,
    refuses new connections, and returns the same promise twice. Service
    tests write a configuration file to a temporary directory naming a
    fixture repository served over smart HTTP by the process repository's
    test server, the GitHub API fake with one organization hook, extended
    to mint installation tokens for a key the test generates with
    `node:crypto`, no environments, and `http.port` 0. Start: the `step`
    probe sees the start steps in order; with a stored active actor and a
    pending row, a test actor host records the restore and the drain
    before `github-started`; the portfolio's commit and `latest()` equal
    the remote's commit. Push: the test commits a changed blueprint and a
    changed portfolio, POSTs a signed `push` delivery for that commit to
    `githubWebhookPath` on the bound address, receives 202, and on the
    `applied` probe for the new commit finds the new blueprint version's
    key in `latest()` and the new allocation in force in
    `portfolio.ledger`. Pull order: with the apply of commit A held by a
    blueprint read the test delays, the test pushes commit B and requests a
    pull, which queues; it releases A, waits for the `applied` probe for
    B, then pushes commit C and requests a pull; the `applied` probe sees
    A, B, and C once each, in that order. Retry before pull: the first
    blueprint read of commit A rejects once, so A's pull job rejects; the
    test pushes commit B and requests a pull; the `applied` probe sees A
    before B, and the pull of B starts after A is applied. Stop during a pull: with the
    fixture server holding the response of a pull a signed push started,
    `stop` stays pending after `sources-stopped`; when the server releases
    the response, the pulled commit's declaration is in force and then
    `stop` resolves with `store-closed`. Stop: the `step` probe sees the
    stop steps in order; a second `stop` returns the same promise; the port refuses
    connections; `github.receive` throws a `TypeError`. Start failure: a
    second service configured with the first's port rejects with
    `EADDRINUSE`, and its child process exits on its own. Crash: a child
    process runs `startService` with a `pull` probe that sends the process
    `SIGKILL` at `published` for the pushed commit; the parent asserts the
    kill signal, starts the service again on the same files without the
    probe, and finds that commit's declaration in force and exactly one
    `portfolio` declaration row for it. Save: with the fixture server
    accepting pushes, `revisions.save` of a changed blueprint resolves
    `saved`, and `latest()` holds the new blueprint version at the pushed
    commit; a signed `push` delivery for that commit then pulls
    `unchanged`. A save after another commit changed the same file resolves
    `conflict`; with the fixture server moving the branch in another file
    between the save's pull and its push, the job pulls, saves once more,
    and resolves `saved` on top of the moved branch; with the fixture
    server moving the branch before each of the two pushes, the job
    resolves `conflict` with reason `branch-moved` and the branch's last
    commit, and the remote holds the two other commits and no save
    commit; with the fixture server refusing every push for a policy
