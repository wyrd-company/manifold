    Sources start after the router returns, and the host listens after
    the sources start, so no source and no request holds the router before
    resume ends. A listener mounted before `listen` takes no request until
    then.
  binding-archived: >-
    The `agent-threads` part answers `bindingArchived(project)` from two
    reads, each at the time of the call. `project` is the Project node id
    that intake writes at `manifold.project`. The part finds that
    Project's row in the GitHub mirror, the row the GitHub source's
    `project` reads, so the answer holds before the source starts; it
    then passes the row's owner and number to the portfolio's
    `githubProject`, which answers the binding in force, the owner
    compared without regard to case. The binding is archived when that
    answer's `archived` is true. A Project with no mirror row, or a row no
    binding names, is not archived. The `task-metadata` part's
    `bindingOf` and the `gates` part's bound Projects use the same
    `githubProject`, so one read decides which binding a Project has.
  start-failure: >-
    An entry that throws or rejects runs `stop`, and start rejects with the
    entry's error once stop settles. Stop runs only the stops registered so
    far, so a failed start leaves no timer, socket, or open database
    behind. A configuration error is a `ServiceConfigurationError` with
    every issue; an address in use is the `listen` error with its system
    code. The assembly keeps no stored state of its own: each part's open
    converges as its module states, and a start that fails at any entry
    stops what it registered, so the next start on the same files begins
    from what the modules stored.
  joining: >-
    A task adds a module in two places: a `wiring.ts` in the module's
    directory that exports the module's part, made with `wiringPart`, and
    one `.part(...)` entry in the start list in `start.ts`, after the
    parts whose members it needs and before `listen`. It edits no other
    part. A module that publishes starts after `router`. A module that
    serves endpoints mounts them in its own part. A module whose
    implementations a blueprint binds adds them with `addImplementations`
    before `blueprint-loader`. A module whose stored tables it opens
    migrates them itself, as the router, the escalations module, and the
    sources do. A module with something to close registers it with
    `onStop` at the stage that fits what it stops: `requests` for what
    takes requests, `commands` for what sends commands out, `sources` for
    what publishes, `notifications` for what notifies people, `timers` for
    a timer, and `store` only for the store. A module whose members start
    at two points of the order gives one part for each point, as the
    escalations and agent tools modules give a part that opens them and a
    part that starts their delivery after the router. A module the actor
    host reads, such as one whose state a save hook writes, joins
    `ServiceParts`, which `actor-host` passes in full; a module other code
    reads from the running service joins `Service`, which `start.ts`
    returns.
  actor-host: >-
    The default factory opens the actor host described in `actor-host`,
    with the store, blueprint loader, log, and `serviceSaveHooks(parts)`.
    The `actorHost` option supplies an alternative factory with the same
    parts and may return a promise. Both are awaited before the router
    restores any actor. `ServiceParts.actorHost` exposes `start`, `actorOf`,
    and `release` to modules that start after the router.
  stop: |-
    `stop` runs the stop stages in this order. In a stage it runs each stop
    registered in it one at a time, the latest registered first, so a
    part stops before every part listed before it in the same stage. A
    stop that throws or rejects logs `stop-failed` with the message
    `Failed stop step: <name>`, where the name is the stage's step, or the
    part's name in a stage with no step, and the other stops still run.
    When every stop of a stage resolves and the stage has a step, stop
    logs `stop-step` and calls the `step` probe with it; a probe that
    throws counts as a failed stop. A stage with no registered stop logs
    nothing. After the `store` stage stop logs `stopped`, and rejects with
    the first error when any stop failed. The first call starts the
    stages, and every later call returns the same promise.

    | Stage | Step | Parts that stop in it | Why here |
    |---|---|---|---|
    | `requests` | `http-closed` | `listen` | The host stops accepting and waits for the requests in progress, so no request reaches a module that stops. |
    | `commands` | | `agent-tools`, `agent-threads` | Waits and retries on T3 Code end before the source they wait on stops. |
    | `sources` | `sources-stopped` | `t3code-source`, `github-source` | No source publishes into the router or calls intake or the follower after this. |
    | `notifications` | `escalations-stopped` | `escalations` | Delivery to ntfy ends. |
    | `pulls` | `revisions-idle` | `revisions` | The follower's queue holds every pull a source started, including one the GitHub source called and did not await; it drains before intake, the router, and the store stop. |
    | `intake` | `intake-stopped` | `intake` | Intake outlives every caller: the sources, the follower, and the escalations module. |
    | `delivery` | `router-stopped` | `migrations`, `router` | The migrations module's queue drains before the router stops; no module publishes after this. |
    | `timers` | | `retention`, `gates`, `portfolio` | The gates' and the capacity's timers stop once nothing they wake can deliver, and a running prune run stops between batches before the store closes. |
    | `store` | `store-closed` | `store` | Last. |
  revision-follower: >-
    The follower is the only caller of the process repository's `pull`. It
    keeps one serial queue and one in-memory `followed` commit, unset at
    start. `pull(request)` and `follow()` each add one job to the queue
    when they are called and return the job's promise, so jobs run one at a
    time in call order. A pull job first runs the apply step, so a
    published commit whose apply failed is applied before a pull can move
    the current commit past it; when that apply step rejects, the job
    rejects with its error and does not pull. It then awaits
    `processRepository.pull(request)` and runs the apply step again; a
    pull that rejects still runs the apply step, then rejects with the
    pull's error, and otherwise the job resolves with the pull's outcome.
    The GitHub source reports a rejected job as kind `pull`. A follow job runs the apply step alone. The apply step reads
    `processRepository.current()`; when there is no revision, or its
    commit equals `followed`, it does nothing. Otherwise it awaits
    `blueprints.loadRevision(revision)`, keeps the result as `latest`,
    logs `blueprint-invalid` for each path in its `failures`, awaits
    `portfolio.apply(revision)`, logs `portfolio-rejected` with the
    findings of a rejected result, logs `portfolio-warnings` with the
    commit and the warnings of a result that has any, whatever its status, awaits `taskMetadata.apply(revision)`,
    logs `task-metadata-rejected` with the findings of a rejected result,
    sets `followed` to the commit, logs
    `revision-applied`, and calls the `applied` probe. A save job runs the
    apply step, then `processRepository.pull()` and the apply step, as a
    pull job does, and rejects with the pull's error when that pull
    rejects, so a save always builds on the branch as just fetched. It then
    awaits `processRepository.save(request)`. For `pushed`, it awaits
    `processRepository.pull({ commit })` and the apply step, and resolves
    `saved` with the commit and `latest` when that pull resolves, since the
    applied commit is then the saved commit or a commit the branch took
    after it, or with no load when that pull rejected, since the commit is
    on the branch and the next pull applies it. For `already-saved` and
    `unchanged`, the commit is the current commit or one of its first
    parents, found after the job's own pull and apply, so it resolves with
    that outcome, the commit, and `latest`, and for `conflict` with reason
    `file-changed`, the head, and the text of each requested file at it. When the save rejects with
    `ProcessRepositorySaveError`, the job pulls and applies again; when the
    current commit is then the error's `head`, nothing else moved the
    branch and the job rejects with the error, so an authentication or a
    policy refusal keeps its kind; otherwise it calls `save` once more with
    the same request, which finds the first push by its trailer, takes the
    save on top of a branch that moved in other files, or answers
    `conflict`, and the job handles that second result as the first. When
    the second save also rejects with `ProcessRepositorySaveError`, the job
    pulls and applies once more, then calls `processRepository.findSave`
    with the request: a push the remote took whose reply was lost leaves
    the save's commit on the branch, and the job resolves `already-saved`
    with that commit and `latest`. Otherwise, when the current commit is
    not the second error's `head`, the branch moved again under the retry,
    and the job resolves `conflict` with reason `branch-moved`, the
    current commit, and the text of each requested file at it; otherwise it rejects with
    the second error. No push follows the second one.
    A branch that moves under a save is therefore answered by what it
    changed, as a typed conflict and never as a remote error, and no save
    is retried more than once. No other pull runs
    between a pull and its apply step, and no pull starts while the current
    commit is unapplied, so at most one published commit is ever unapplied,
    and it is the current commit. Every commit a pull publishes is
    therefore applied, in pull order, before the next pull moves the
    current commit. `close()`, which stop calls,
    makes every later `pull` and `follow` reject with a `TypeError` and
    returns a promise that resolves when the queue is empty.
  convergence: >-
    An apply step that finds its commit already followed does nothing, and
    `portfolio.apply` of a declaration equal to the one in force writes
    nothing, so a follow twice applies once. An apply step whose read
    rejects leaves `followed` unchanged and rejects its job, and the next
    job of either kind retries the same commit before anything else,
    taking the blueprint load from the loader's cache. A crash after a pull publishes and before the
    portfolio applies leaves that commit current in the repository and the
    previous declaration in force in the store; the next start's step 5
    applies it once. A crash during a save job leaves the saved commit on
    the remote branch or nowhere, as `process-repository` states; the next
    start's pull takes it when it is there, and a retried save with the
    same `saveId` answers `already-saved` or pushes it once. A crash after the portfolio's row commits leaves the
    new declaration in force, and step 5 finds it equal and writes nothing.
    `startService` twice on the same files, with a stop or a crash between,
    resumes the same router, inbox, clone, and declaration, as each
    module's own convergence states.
  http-host: >-
    `createHttpHost` creates one `node:http` server with Node's defaults
    for `requestTimeout`, `headersTimeout`, and `keepAliveTimeout`.
    `listen` binds `http.host` and `http.port`; port `0` binds a free port,
    which `address` reports. `close` calls `server.close()`, which stops
    accepting and closes each connection when its request in progress
    ends, then `server.closeIdleConnections()`, and resolves when the
    server's `close` event fires. `mount` may be called
    before or after `listen`.
  mounts: >-
    A path prefix is `/` followed by one or more segments joined by `/`,
    each non-empty and holding no `?`, `#`, or `%`, with no trailing `/`.
    `mount` throws a `TypeError` naming the prefix for
    any other string, `/` included, and for a prefix already mounted. A
    request's path is the path of its request target, before the query, compared as sent with no decoding. A prefix matches a path that
    equals it or continues it with `/`, so `/webhooks/github` matches
    `/webhooks/github` and `/webhooks/github/1` and never
    `/webhooks/githubx`. The path `/` is under no prefix. The longest
    matching prefix takes the request. The listener receives the request
    and response unchanged, with `request.url` as sent. A request whose
    path no prefix matches answers `404` with an empty body. A listener
    that throws before it writes headers answers `500`; either way the
    error goes to `onError`, which the service logs as
    `http-listener-error`. A listener owns its method checks, body limits,
    and answers.
  api-access: >-
    The API is always served without authentication. Operator endpoints
    mount with `mount`. Access control belongs to the deployment:
    loopback by default, or a proxy in front.
  entry-point: >-
    `node dist/main.js <configuration-file>` starts the service. With no
    argument or more than one, it writes a usage line to stderr and exits
    with code 2. Before it starts the service, it installs one handler for
    `SIGTERM` and `SIGINT` and creates an `AbortController` whose signal it
    passes to `startService`. The first signal during start aborts that
    signal, so start stops what it has started at the next step boundary
    and rejects with the abort's reason, and the process exits with code
    0. The first signal after start calls `service.stop()`, and the
    process exits with code 0 when stop resolves and code 1 when it
    rejects. Every later signal does nothing more. A start that rejects for
    any other reason writes the error, and for a
    `ServiceConfigurationError` every issue, to stderr and exits with code
    1. Neither start nor stop is bounded by a time; `SIGKILL` ends a
    process whose stop does not finish.
  log: >-
    Modules log through `ServiceParts.log`. The assembly logs `start-step`
    and `stop-step` at `info`, naming the step, after each step. The
    default sink writes each
    entry to stderr as one JSON line holding `time`, an ISO 8601 string,
    and the entry's fields. A credential value reaches no entry: errors
    carry a `SecretValue` only as its credential name, as
    `service-configuration` states.
  configuration: >-
    Two sections join the service configuration root. `http`, specified
    by `http-host-configuration`, sets the listen address, default
    `127.0.0.1` port 7480. `store`, specified by `store-configuration`, sets the
    path of the store's database file and is required. `ServiceConfiguration`
    carries `http: HttpHostConfiguration` and `store: StoreConfiguration`,
    and `service-configuration`'s module exports both types.

    ```ts
    export interface HttpHostConfiguration {
      readonly host: string;
      readonly port: number;
    }

    export interface StoreConfiguration {
      /** Absolute; resolved against the configuration file's directory. */
      readonly file: string;
    }
    ```
  tests: >-
    Each behaviour is written red before green, through the modules'
    `index.ts` and the compiled entry point. Values are generic: a remote
    fixture repository, owner `example-org`, items `alpha` and `beta`,
    account `acct`, blueprint `blueprints/counter.yml`. HTTP host tests
    run a host on port 0 with listeners that echo their prefix: the
    longest prefix takes a request; `/a` does not take `/ab`; `/` answers
    404 while other prefixes are mounted; a path under no prefix answers
    404; `mount("/")`, a malformed prefix, and a repeated prefix throw; a listener that throws answers 500 and
    reaches `onError`; an API prefix reaches its listener with no
    authorization header, another scheme, or an arbitrary bearer token;
    `close` resolves after a request in progress is answered,
    refuses new connections, and returns the same promise twice. Service
    tests write a configuration file to a temporary directory naming a
    fixture repository served over smart HTTP by the process repository's
    test server, the GitHub API fake with one organization hook, extended
    to mint installation tokens for a key the test generates with
    `node:crypto`, no environments, and `http.port` 0. Start: the `step`
    probe sees the start steps in order; with a stored active actor and a
    pending row, a test actor host records the restore and the drain
    before `github-started`; the portfolio's commit and `latest()` equal
    the remote's commit. Push: the test commits a changed blueprint and a
    changed portfolio, POSTs a signed `push` delivery for that commit to
    `githubWebhookPath` on the bound address, receives 202, and on the
    `applied` probe for the new commit finds the new blueprint version's
    key in `latest()` and the new allocation in force in
    `portfolio.ledger`. Pull order: with the apply of commit A held by a
    blueprint read the test delays, the test pushes commit B and requests a
    pull, which queues; it releases A, waits for the `applied` probe for
    B, then pushes commit C and requests a pull; the `applied` probe sees
    A, B, and C once each, in that order. Retry before pull: the first
    blueprint read of commit A rejects once, so A's pull job rejects; the
    test pushes commit B and requests a pull; the `applied` probe sees A
    before B, and the pull of B starts after A is applied. Stop during a pull: with the
    fixture server holding the response of a pull a signed push started,
    `stop` stays pending after `sources-stopped`; when the server releases
    the response, the pulled commit's declaration is in force and then
    `stop` resolves with `store-closed`. Stop: the `step` probe sees the
    stop steps in order; a second `stop` returns the same promise; the port refuses
    connections; `github.receive` throws a `TypeError`. Start failure: a
    second service configured with the first's port rejects with
    `EADDRINUSE`, and its child process exits on its own. Crash: a child
    process runs `startService` with a `pull` probe that sends the process
    `SIGKILL` at `published` for the pushed commit; the parent asserts the
    kill signal, starts the service again on the same files without the
    probe, and finds that commit's declaration in force and exactly one
    `portfolio` declaration row for it. Save: with the fixture server
    accepting pushes, `revisions.save` of a changed blueprint resolves
    `saved`, and `latest()` holds the new blueprint version at the pushed
    commit; a signed `push` delivery for that commit then pulls
    `unchanged`. A save after another commit changed the same file resolves
    `conflict`; with the fixture server moving the branch in another file
    between the save's pull and its push, the job pulls, saves once more,
    and resolves `saved` on top of the moved branch; with the fixture
    server moving the branch before each of the two pushes, the job
    resolves `conflict` with reason `branch-moved` and the branch's last
    commit, and the remote holds the two other commits and no save
    commit; with the fixture server refusing every push for a policy
    reason and the branch unmoved, the job rejects with kind `rejected`;
    with the fixture server moving the branch before the first push, then
    taking the retry push and closing the connection before its reply, the
    job resolves `already-saved` with the retry's commit and `latest`
    holding it, and the remote holds exactly one save commit; with the
    fixture server taking the push and refusing the fetch that follows,
    then committing a change to the same file on top of the save, a
    second `revisions.save` of the same request resolves `already-saved`
    with the save's commit and `latest` at the later commit. Save crash: a child
    process runs `startService` with a `save` probe that sends the process
    `SIGKILL` at `committed`, and in a second run at `pushed`; the parent
    starts the service again on the same files, saves the same request
    with the same `saveId`, and finds `saved` and `already-saved`
    respectively, exactly one new commit on the remote branch holding the
    change, and that commit's blueprint version in `latest()`. Entry point: the compiled
    `main.js` with no argument exits 2; with an invalid file exits 1 and
    prints each issue; with a valid file it logs `started`, and on
    `SIGTERM`, and in a second run on `SIGINT`, logs `stopped` once and
    exits 0; a second `SIGTERM` sent after the first logs nothing more.
    With the fixture server holding the response of the first pull, so
    start waits in step 6, `SIGTERM`, and in a second run `SIGINT`, sent
    after the `process-repository-opened` step entry ends the process with
    code 0 once the server releases the response, with the stop steps of the
    started steps logged, `revisions-idle` and `store-closed`, and no
    `started` entry; a second signal
    sent during that start logs nothing more.
    Wiring: through `assembleService` with fixture parts and no
    configuration part, a part `second` listed after a part `first` reads
    `first`'s member in its `start`, starts after it, and, with both
    registering a stop in one stage, stops before it; a stop registered in
    an earlier stage runs first whatever the list order; a part that
    registers a stop and then throws makes `start` reject with its error
    after that stop runs, and no later entry runs; a stop that rejects
    logs `stop-failed` with the part's name and the next stop still runs;
    `later` of a part the list does not hold throws a TypeError naming it;
    until the part starts, `current()` is undefined and `get()` throws a
    TypeError naming it; `ready()` resolves once it starts, and
    `ready(signal)` rejects with the reason of a signal aborted before it
    starts; `addImplementations` from a part listed after
    `blueprint-loader` throws a TypeError. Type tests hold
    `@ts-expect-error` lines for a part listed before a member it needs,
    for a part that repeats a member of an earlier part, and for a part
    that repeats the initial `log` member; a chain of parts with distinct
    members, one of them `{}`, compiles. The start, stop, abort, and
    crash tests above pass with no assertion changed.
    Binding archived: through `startService`, with one environment served
    by the T3 Code fake the agent threads tests use, a fixture repository
    whose `bindings.yml` binds Project `example-org` number 1 to item
    `alpha` at commit A, the GitHub API fake serving that Project so a
    sweep mirrors its row, and a test actor host whose `actorOf` answers an
    actor with that environment and the Project's node id at
    `manifold.project`. `thread-create` through
    `service.agentThreads.implementations` creates the thread at A. After a
    signed push of commit B, which archives the binding, and the `applied`
    probe for B, `thread-create` fails with kind `archived` and the T3 Code
    fake receives no command. An actor whose `manifold.project` is a node
    id with no mirror row creates the thread at B. The archived case is
    written first, and fails until the `agent-threads` part reads the
    mirror.
    `foundation.integration.test.ts` keeps every behaviour it proves. Its
    SIGKILL worker starts through `startService` with a configuration file,
    a test actor host built from `ServiceParts`, and the `delivery` probe,
    and reads the portfolio, router, and sources from the `Service`.
