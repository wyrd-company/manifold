    - gate-runtime
    - operator-console
objective: >-
  Run the service as one process from one service configuration file, with
  one HTTP host that every module mounts its endpoints on, a start order
  that resumes durable delivery before any source publishes, a stop order
  that leaves every module closed, a start list in which each module joins
  through its own wiring part, and a path by which each new process
  repository commit reaches the blueprint loader and the portfolio, so that
  a pushed commit takes effect with no restart, a task adds a module
  without editing another module's wiring, and a crash at any point
  converges on the next start.
background:
  current-design: >-
    `startService` opens modules through an ordered list of wiring parts.
    Each part mounts its endpoints and registers its stop stage. Revisions
    apply declarations and load blueprints before intake and migration
    use them. The router restores delivery from the store before sources
    publish live events. Stop closes registered modules in stage order.
design-challenges:
  order: >-
    Every live event must reach an actor after its pending rows, so no
    source may hold the router before `startRouter` returns. Stop must stop
    every source before the router and the store, so no source publishes
    into a stopped router or a closed store.
  convergence: >-
    The commit in force for the loaders must catch up with the current
    commit whatever ran before: a crash after publish, a failed read, a
    pull no one awaited.
  one-host: >-
    One listener serves signed webhooks and operator endpoints under
    prefixes owned by different modules. Access control belongs to the
    deployment.
  joining: >-
    A module joins by adding its own wiring and one entry to the start
    list, and never edits another module's wiring. A part listed before a
    member it reads, or one that gives a member name another part already
    gives, must fail to compile rather than at start.
  late-references: >-
    Modules call each other in both directions: the GitHub source calls
    intake, which starts after it; the escalations module answers through
    intake, the gates, and the actor host, which all open after it. A part
    must read such a module when it calls it, with one typed mechanism,
    and fail by name when the module has not started.
  stop-order: >-
    The stop order is not the reverse of any start order that keeps the
    start steps. Intake starts after the GitHub source and must stop after
    it and after the revision follower, which both call it; the follower
    must drain before the router stops; the escalations module starts its
    delivery before the GitHub source and must stop after it. Stop needs a
    rule that gives this order and still lets a new part stop before the
    part listed before it.
proposed-design:
  high-level-overview: >-
    `packages/service/src/service/` is the assembly. `startService` is a
    start list: one entry for each wiring part, in start order, with the
    start steps between them. A wiring part lives in its module's
    directory, opens that module from the members of the parts listed
    before it, mounts the module's endpoints, and registers what stop must
    close. The assembly runs the list, checks the start signal at each
    step, and on stop runs the registered stops by stop stage. The
    revision follower sits between every pull and the loaders: after each
    pull it loads the current revision into the blueprint loader and
    applies it to the portfolio, one revision at a time.
    `packages/service/src/http-host/` is the HTTP host: one `node:http`
    server whose request handler dispatches by path prefix to the
    listeners mounted on it. `packages/service/src/main.ts` is the process
    entry point: it starts the service from the file named on its command
    line and stops it on `SIGTERM` and `SIGINT`.
  public-interface: |-
    `packages/service/src/service/index.ts` exports exactly these names.

    ```ts
    import type { AgentTools } from "../agent-tools/index.ts";
    import type { AgentThreads } from "../agent-threads/index.ts";
    import type { Escalations, ServiceEscalationHandler } from "../escalations/index.ts";
    import type { Intake, IntakeRevision } from "../intake/index.ts";
    import type { DeliveryProbe, JsonValue, Store } from "../store/index.ts";
    import type { Router } from "../router/index.ts";
    import type { ActorHost } from "../actor-host/index.ts";
    import type {
      BlueprintLoader,
      ImplementationRegistry,
      RevisionLoad,
    } from "../blueprint-loader/index.ts";
    import type { CapacityCredit } from "../capacity/index.ts";
    import type { Usage } from "../usage/index.ts";
    import type { Gates } from "../gates/index.ts";
    import type { Portfolio } from "../portfolio/index.ts";
    import type {
      ProcessRepository,
      PullOutcome,
      PullProbe,
      PullRequest,
      SaveFileAt,
      SaveProbe,
      SaveRequest,
    } from "../process-repository/index.ts";
    import type { CardMove, GitHubSource } from "../github-source/index.ts";
    import type { T3CodeSource } from "../t3code-source/index.ts";
    import type { HttpListener } from "../http-host/index.ts";
    import type { ServiceConfiguration } from "../service-configuration/index.ts";

    export function startService(options: StartServiceOptions): Promise<Service>;

    /** An empty start list over `options`, whose first member is `log`. */
    export function assembleService(
      options: StartServiceOptions,
    ): ServiceAssembly<{ readonly log: (entry: ServiceLogEntry) => void }>;

    /** Returns `part`, so that its needs and members are inferred from `start`. */
    export function wiringPart<Needs extends object, Gives extends object>(
      part: ServiceWiringPart<Needs, Gives>,
    ): ServiceWiringPart<Needs, Gives>;

    export interface ServiceWiringPart<Needs extends object, Gives extends object> {
      /** Kebab-case and unique in a start list; names the part in errors and `stop-failed` entries. */
      readonly name: string;
      /** Opens the module from members of the parts listed before it; resolves with the members it adds. */
      readonly start: (members: Needs, context: ServiceWiringContext) => Gives | Promise<Gives>;
    }

    export interface ServiceWiringContext {
      /** The options the start list was assembled with: probes and test factories. */
      readonly options: StartServiceOptions;
      /** Runs `stop` in `stage` when the service stops, also when a later entry fails or aborts the start. */
      onStop(stage: ServiceStopStage, stop: () => void | Promise<void>): void;
      /** The members of a part in the same start list, for a read that runs after that part starts. */
      later<Gives extends object>(part: ServiceWiringPart<never, Gives>): Later<Gives>;
      /** Adds a module's implementations to the registry the `blueprint-loader` part binds. */
      addImplementations(registry: ImplementationRegistry): void;
    }

    export interface Later<Gives extends object> {
      /** The part's members; undefined until its `start` resolves. */
      current(): Gives | undefined;
      /** The part's members; throws a TypeError naming the part until its `start` resolves. */
      get(): Gives;
      /** Resolves with the part's members once its `start` resolves; rejects with the signal's reason when the signal has aborted or aborts first. */
      ready(signal?: AbortSignal): Promise<Gives>;
    }

    export interface ServiceAssembly<Members extends object> {
      /** Adds a part; its needs must be members of the entries before it, and its members new names. */
      part<Gives extends object>(
        part: ServiceWiringPart<Members, Gives> & DistinctMembers<Members, Gives>,
      ): ServiceAssembly<Members & Gives>;
      /** Adds a start step: logs `start-step`, calls the `step` probe, and checks the signal. */
      step(step: ServiceStep): ServiceAssembly<Members>;
      /** Runs the entries in order; resolves with every member and the service's `stop`. */
      start(): Promise<{ readonly members: Members; stop(): Promise<void> }>;
    }

    /** `unknown` when `Gives` repeats no member name of `Members`; otherwise a member no part has, so the part does not compile. */
    export type DistinctMembers<Members extends object, Gives extends object> = [
      Extract<keyof Gives, keyof Members>,
    ] extends [never]
      ? unknown
      : { readonly memberNameRepeated: Extract<keyof Gives, keyof Members> };

    /** In stop order. */
    export type ServiceStopStage =
      | "requests"
      | "commands"
      | "sources"
      | "notifications"
      | "pulls"
      | "intake"
      | "delivery"
      | "timers"
      | "store";

    export interface StartServiceOptions {
      /** Path of the service configuration file. */
      readonly configurationFile: string;
      /** Aborting it stops the start at the next step boundary. */
      readonly signal?: AbortSignal;
      /** Builds the router's actor host from the parts started before the router. */
      readonly actorHost?: (parts: Omit<ServiceParts, "actorHost">) => ActorHost | Promise<ActorHost>;
      /** Builds gates before revision following. Defaults to the service gate runtime. */
      readonly gates?: (
        parts: Pick<
          ServiceParts,
          "configuration" | "store" | "portfolio" | "processRepository" | "blueprints" | "log"
        >,
      ) => Gates | Promise<Gates>;
      /** Receives every log entry. Defaults to one JSON line per entry on stderr. */
      readonly log?: (entry: ServiceLogEntry) => void;
      readonly probes?: ServiceProbes;
      /** The gate runtime supplies the handler for returning stranded tokens. */
      readonly strandedTokenHandler?: ServiceEscalationHandler;
    }

    export interface ServiceProbes {
      readonly capacityCredited?: (credit: CapacityCredit) => void;
      /** Called after each start and stop step completes. */
      readonly step?: (step: ServiceStep) => void;
      readonly cardMove?: (move: CardMove) => void;
      /** Passed to the process repository. */
      readonly pull?: PullProbe;
      readonly save?: SaveProbe;
      /** Passed to the store. */
      readonly delivery?: DeliveryProbe;
      /** Called after the revision follower applies a revision. */
      readonly applied?: (applied: AppliedRevision) => void;
      /** Passed to the actor host: after a migration's save commits, before the old actor stops. */
      readonly migrated?: (actorId: string) => void;
    }

    export type ServiceStep =
      | "configuration-loaded"
      | "store-opened"
      | "portfolio-opened"
      | "process-repository-opened"
      | "revision-followed"
      | "pulled"
      | "actor-host-opened"
      | "escalations-opened"
      | "escalations-started"
      | "escalations-stopped"
      | "router-started"
      | "github-started"
      | "intake-started"
      | "t3code-started"
      | "listening"
      | "http-closed"
      | "sources-stopped"
      | "revisions-idle"
      | "intake-stopped"
      | "router-stopped"
      | "store-closed";

    export interface ServiceParts {
      readonly gates?: Gates;
      readonly escalations: Escalations;
      readonly actorHost: ActorHost;
      readonly agentThreads: AgentThreads;
      readonly agentTools?: AgentTools;
      readonly configuration: ServiceConfiguration;
      readonly store: Store;
      readonly portfolio: Portfolio;
      readonly usage: Usage;
      readonly processRepository: ProcessRepository;
      readonly blueprints: BlueprintLoader;
      readonly revisions: Revisions;
      readonly log: (entry: ServiceLogEntry) => void;
    }

    export interface Service extends ServiceParts {
      readonly intake: Intake;
      readonly router: Router;
      readonly github: GitHubSource;
      readonly t3code: T3CodeSource;
      readonly migrations: Migrations;
      readonly retention: Retention;
      readonly http: ServiceHttp;
      /** Stops the service; every call returns the first call's promise. */
      stop(): Promise<void>;
    }

    export interface Revisions {
      /** One publication after blueprint loading and portfolio application finish. */
      current(): IntakeRevision | undefined;
      /** The latest blueprint load, available before portfolio application finishes. */
      latest(): RevisionLoad | undefined;
      /** Queues a pull and the apply of its commit as one job; resolves after both. */
      pull(request?: PullRequest): Promise<PullOutcome>;
      /** Queues the apply of the current commit; resolves when it is applied. */
      follow(): Promise<void>;
      /** Queues a pull, a save, and the pull and apply of the saved commit as one job. */
      save(request: SaveRequest): Promise<SavedRevision>;
    }

    export type SavedRevision =
      | {
          readonly outcome: "saved" | "already-saved" | "unchanged";
          readonly commit: string;
          /** The blueprint load in which the commit is applied; undefined when it is not yet applied. */
          readonly blueprints: RevisionLoad | undefined;
        }
      | {
          readonly outcome: "conflict";
          /** `file-changed`: the branch changed the file; `branch-moved`: the branch moved under the retry. */
          readonly reason: "file-changed" | "branch-moved";
          readonly head: string;
          /** Each requested path's text at `head`, in the request's order. */
          readonly files: readonly SaveFileAt[];
        };

    export interface AppliedRevision {
      readonly commit: string;
      readonly blueprints: RevisionLoad;
      readonly portfolio: "applied" | "unchanged" | "rejected";
      readonly usage: "applied" | "unchanged" | "rejected";
    }

    export interface ServiceHttp {
      mount(pathPrefix: string, listener: HttpListener): void;
      /** The address the host listens on. */
      address(): { readonly host: string; readonly port: number };
    }

    export interface ServiceLogEntry {
      readonly level: "info" | "warn" | "error";
      /** A kebab-case name of what happened, such as `pull-failed`. */
      readonly event: string;
      readonly message: string;
      readonly detail?: Readonly<Record<string, JsonValue>>;
    }

    /** The path the GitHub source's listener is mounted at. */
    export const githubWebhookPath = "/webhooks/github";
    ```

    `packages/service/src/http-host/index.ts` exports exactly these names.

    ```ts
    import type { IncomingMessage, ServerResponse } from "node:http";
    import type { HttpHostConfiguration } from "../service-configuration/index.ts";

    export type HttpListener = (request: IncomingMessage, response: ServerResponse) => void;

    export function createHttpHost(options: HttpHostOptions): HttpHost;

    export interface HttpHostOptions {
      readonly configuration: HttpHostConfiguration;
      /** Called for a listener that throws. */
      readonly onError: (error: Error, request: { readonly method: string; readonly path: string }) => void;
    }

    export interface HttpHost {
      mount(pathPrefix: string, listener: HttpListener): void;
      /** Binds the configured address; resolves with the bound address. */
      listen(): Promise<{ readonly host: string; readonly port: number }>;
      /** The bound address; throws a TypeError before `listen` resolves. */
      address(): { readonly host: string; readonly port: number };
      /** Stops accepting, waits for requests in progress, and resolves; every call returns the first call's promise. */
      close(): Promise<void>;
    }
    ```
  module-layout: >-
    In `packages/service/src/service/`, `index.ts` re-exports the public
    names and nothing else. `start.ts` implements `startService`: the
    start list and the `Service` it returns, and nothing else. `wiring.ts`
    implements `assembleService`, `wiringPart`, the stop stages, and
    `Later`. `types.ts` holds the public types. `revisions.ts` implements
    the revision follower, and `revisions-wiring.ts` its two parts. `log.ts`
    holds the default log sink. Every other part is in `wiring.ts` in its
    module's directory, as the start list names it. A module's `index.ts`
    does not export its `wiring.ts`, so a module never imports the
    assembly through its barrel; `start.ts` and other wiring files import
    a wiring file by its path, and a wiring file imports
    `../service/wiring.ts` and `../service/types.ts`, never
    `../service/index.ts`. In `packages/service/src/http-host/`,
    `index.ts` re-exports the public names, `routes.ts` holds the pure
    prefix validation and longest-prefix match over the mounts, and
    `host.ts` implements `createHttpHost` over `node:http`.
    `packages/service/src/main.ts` is the entry point and holds no logic
    beyond the argument, the signals, and the exit code. The service
    package's `build` emits it as `dist/main.js`, and the package's
    `start` script runs `node dist/main.js`. Tests import only each
    module's `index.ts`, and the entry point test runs the compiled file.
  wiring-part: >-
    A wiring part is a `name` and a `start`. `start` receives the members
    it names from the parts listed before it, and the part's context, and
    resolves with the members it adds, or with `{}`. Its needs are the type
    of its first parameter, so `wiringPart` infers them and its members
    without annotations. `part` takes a part only when its needs are
    members of the entries before it and its members are new names:
    `DistinctMembers` turns a repeated name, the initial `log` included,
    into a member the part does not have, so the entry does not compile. A member is named for its module in camel case,
    such as `processRepository` or `githubMirror`; `ServiceParts` and
    `Service` name the members other modules read. A part's start opens
    its module, mounts the module's endpoints with `members.http.mount`,
    adds the module's implementations with `addImplementations` when a
    blueprint binds them, and calls `onStop` right after it opens each
    thing stop must close, so a later line of the same part that throws
    still leaves it closed. It reads a module that starts after it only
    through `later`. The part holds the glue a module's own options name:
    which members fill them, how errors become log entries, and which
    probe reaches the module. It holds no business logic.
  later: >-
    `later(part)` names a part by its object, so the members it answers are
    typed from that part, and no list of names is shared. It throws a
    TypeError naming the part when the start list does not hold that part.
    `current()` answers `undefined` until the part's `start` resolves, for
    a call that does nothing before then, such as `inputChanged` on the
    gates. `get()` throws a TypeError naming the part until then, for a
    call that cannot run before the part starts, such as the router in an
    agent tool. `ready(signal)` resolves when the part's `start` resolves,
    and rejects with the signal's reason when the signal has aborted or
    aborts first, for a wait such as the environment source a thread
    command needs. Without a signal it waits until the part starts.
  start: |-
    `startService` assembles this list, runs it, logs `started` with the
    host's address, and returns the members `Service` names with the
    assembly's `stop`. Before the first entry the assembly checks the
    signal. Each step entry logs `start-step`, calls the `step` probe, and
    then checks the signal: when it has aborted, start stops every part
    already started, as `stop` states, and rejects with the signal's
    `reason`. An entry in progress runs to its end first, since each is
    bounded only by the work it does, such as a pull by `pullTimeoutMs`.

    | Entry | Wiring | Start | Members | Stops in |
    |---|---|---|---|---|
    | `configuration` | `service-configuration/wiring.ts` | `loadServiceConfiguration` with the file, then `configureBlueprintExpressions` with its `expressions` section. | `configuration` | |
    | step `configuration-loaded` | | | | |
    | `http-host` | `http-host/wiring.ts` | `createHttpHost` with the `http` section and an `onError` that logs `http-listener-error`. It does not listen. | `http` | |
    | `store` | `store/wiring.ts` | Creates the directory of `store.file` when absent, `openStore` with the file and the `delivery` probe, and migrates `metadata`, `ledger`, `portfolio`, `usage`, `intake`, `gates`, and `bundle`. | `store` | `store` |
    | `bundles` | `bundle/wiring.ts` | `openBundles` with the store. | `bundles` | |
    | step `store-opened` | | | | |
    | `github-mirror` | `github-source/wiring.ts` | Migrates `github` and creates the GitHub mirror over the store. | `githubMirror` | |
    | `portfolio` | `portfolio/wiring.ts` | `openPortfolio`, then `openCapacity` over its ledger with the usage module's accounts, a `credited` that logs `capacity-credited` and calls its probe, and a follow-up that retries pending usage and tells the gates their input changed. The member is the portfolio with the capacity's ledger. | `portfolio`, `capacity` | `timers` |
    | step `portfolio-opened` | | | | |
    | `usage` | `usage/wiring.ts` | `openUsage` over the portfolio's ledger, telling the gates their input changed after each posting and settlement, with the T3 Code source's thread map and the configured environments; mounts its listener at `/api/usage`. | `usage` | |
    | `process-repository` | `process-repository/wiring.ts` | `openProcessRepository` with the `processRepository` section, the credentials, and the `pull` and `save` probes. | `processRepository` | |
    | `agent-threads` | `agent-threads/wiring.ts` | `openAgentThreads` with the environments, their `t3code-token` files, the actor host's `actorOf`, `bindingArchived` as `binding-archived` states, and the environment source's `ready` and `write`; adds its implementations. | `agentThreads` | `commands` |
