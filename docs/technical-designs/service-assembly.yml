$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - blueprint-migration
    - service-configuration
    - store
    - durable-event-delivery
    - process-repository
    - blueprint-loader
    - portfolio
    - github-event-source
    - t3code-environment-source
    - task-metadata
    - actor-host
    - agent-threads
    - agent-tools
    - escalations
