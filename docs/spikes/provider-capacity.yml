conclusion: >-
  The stable released T3 Code supports six providers. Claude CLI /usage and Codex non-secret
  rollout/native RPC sources are observed live through credential-owning installed CLIs. Claude
  exposes session, all-model weekly and Fable weekly readings; tiny Haiku and Sonnet calls
  produce no displayed movement in session or all-model weekly usage. The observed Codex Pro
  account has a weekly primary window, no secondary and three
  available reset credits. Its 7875 exact-reset paired historical intervals across four models
  do not establish an isolated quota/token ratio: concurrent account use, integer percentages
  and reporting lag confound thread-local tokens. No actual reset or controlled cold/warm
  transition is observed. Cursor and OpenCode quota remain unverified through installed
  callers; Grok and Antigravity are disabled locally. Direct HTTP candidates retain their
  source evidence without credential reads. Declared budgets, observed account quota, task
  actuals and ratio estimates remain separate values. The artifact preserves sanitized live
  readings, response fixtures, procedures, design boundaries and the full next implementation
  scope without requiring spike code.
next-steps:
  - Implement the full observed-capacity scope before 0.1.0 after ruling the observation and
    account seams and applying existing access approvals.
  - Verify direct HTTP production callers, Cursor/OpenCode quota and any isolated-account ratio
    through credential owners; retain unavailable and unverified states instead of fabricating
    windows.
  - Establish an Antigravity quota source and call coverage, preserve disabled/unavailable
    states, and reconcile independent Cursor transcript findings.
