        id: sample
        initial: choose
        states:
          choose:
            on:
              good: box
              bad:
                target: "#sample.box.trap"
          box:
            initial: safe
            states:
              safe:
                on:
                  leave: "#sample.queued"
                  back: "#sample.returned"
              trap:
                on:
                  leave: "#sample.queued"
                  again: trap
              memory:
                type: history
                history: deep
          queued:
            on:
              grant:
                target: working
                guard: allowed
          working:
            always: "#sample.box.memory"
          returned: {}
    notes: |-
      Measured: This complete YAML counterexample has two reachable queued configurations with identical active states and different remembered box states. The guarded transition is queued.on.grant, with allowed returning true in the replay. Return is box.safe. The good path remembers safe; the bad path remembers trap. On working's always transition to box.memory, those configurations have different successors. Removing history memory from graph identity retains the first encountered safe history and produces accept. Retaining history produces the cycle paths in configuration-lint-rejections. An ordinary XState actor taking bad, leave, grant, again remains active in box.trap without visiting box.safe after grant.

      The complete blueprint is recorded in this finding's measurements.

      Inferred: A sound finite graph needs history memory in node identity, or a sound union of every remembered successor at a merged active configuration. One snapshot per active-state set is insufficient. The gates token-lint description of configurations as sets of active states cannot serve as that complete identity without this additional semantics. This falsifies a literal active-set implementation; it does not falsify every possible history-expanding analysis.
