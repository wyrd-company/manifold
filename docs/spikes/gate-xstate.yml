conclusion: >-
  YAML XState v5 gates can hold independent tokens through later states,
  count pending and consumed tokens after SIGKILL, return every held token
  when an actor ends, and rebuild 2000 snapshot rows with zero loaded actors.
  Token rows keyed by gate and actor, idempotent inbox events, and reconciliation
  of returns from persisted snapshots are sufficient for the tested single-writer
  host. Lazy rebuild takes 3.425-4.228 ms in two observations. A QuickJS
  comparator produces the same grants as the stub and costs 2.797-2.884 ms per
  grant at 2000 actors under the stated benchmark conditions. Blueprint lint
  rejects dead ends and cycles in a flat flow graph, but that graph accepts a
  runnable parallel transition that strands a token. Configuration traversal
  catches the tested structural traps, but active-state-only identity falsely
  accepts a history trap. Remembered history and microstep return entry are
  essential. The three-region configuration graph has 65 nodes; independent
  region growth reaches seconds and substantial memory at seven to eight
  four-state regions. Opaque guards can falsely reject valid blueprints, and
  invocation, delays, named actions, wildcard events, and resource exhaustion
  remain undecided. A complete supported-shape token-return proof remains
  unproven; token-lint-completeness-unproven stays open. No supported shape is
  prohibited by these findings.

next-steps:
  - Implement gate holder queries from outstanding token rows and population queries from persisted snapshot state values, with lazy recipient loading.
  - Preserve grant-and-inbox atomicity and event-id deduplication; make return recording atomic with snapshot persistence or repairable before another event is delivered.
  - Resolve token-lint completeness with history-aware configuration identity, microstep return observation, feasible guard witnesses, and explicit semantics for invocation, delays, named actions, wildcard events, and incomplete exploration.
  - Present any proposed rejection of undecided shapes or conservative false positives to the user before enforcing it.
  - Measure production comparator payloads, worker messaging, evaluation frequency, and the chosen store synchronization on deployment storage.
