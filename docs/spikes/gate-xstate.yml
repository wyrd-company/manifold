  configuration-lint-undecided-shapes:
    verdict:
      guard abstraction is conservative and several supported shapes remain
      undecided; no capability restriction is selected
    measurements:
      guard-false-positive: "working.always = [{target: trap, guard: uncertain},
        {target: returned}]; uncertain returns false in the real actor"
      guard-false-positive-results:
        - abstract lint reject
        - ordinary actor enters returned after grant
      context-cycle-case:
        remaining starts at 2; tick self-transitions while more
        reads remaining > 0 and decrement assigns remaining - 1, then tick
        returns
      context-cycle-results:
        - abstract graph reports cycle
        - ordinary actor returns after three ticks
      invocation-case: "working.invoke = {src: worker, onDone: returned}"
      delay-case: "working.after = {100: returned}"
      named-action-case:
        working.entry = signal; working.on.signal = returned; the
        implementation may raise signal
      wildcard-case: "working.on = {'*': returned}"
      resource-case: nine independent four-state regions exceeds the 100000-node probe bound
    notes: |-
      Measured: The state-independent uncertain implementation returning false is a valid pure named guard. Abstract true/false branching includes a trap path that this implementation never takes. A concrete context counter also terminates while its abstraction has a cycle. The counter's named action makes the overall probe result unknown; its cycle diagnostic is still a potential abstract path. These diagnostics must not be described as runnable violations without a feasible guard witness. Exact stateIn guards are evaluated against the entire active configuration; transition ordering is delegated to XState. Arbitrary named guards do not have that exact treatment.

      Measured: The probe reports unknown for invocation and delay fixtures, named action bodies, wildcard descriptors, and resource exhaustion. It records no product rejection for them. Invocation is incomplete because the probe does not run worker or track its output and lifetime across exit/re-entry; treating onDone as an arbitrary external event alone cannot prove its availability or ordering. Delays are incomplete because enabling, cancellation, and delivery across state re-entry are not modeled. Named action bodies cannot be inferred from YAML; raised events, assign, spawn, send, and stop can change runtime behavior. Built-in or inline action objects are flagged outside the action model. Wildcard event types require symbolic event classes and payload abstraction; enumerating literal '*' is not the real event alphabet. Initial, transition, invoke, and final outputs dependent on context or event payload are not proved. Concurrent guard evaluations, guard correlations, and hidden implementation state have no decidability result in this probe.

      Inferred: A finite acyclic over-approximation can establish a structural sufficient condition, but a path in that approximation does not establish an actual defect. General unbounded context/actions require an abstraction or invariants; this spike supplies no general decision procedure. State-read-only guards may permit a tighter finite analysis if their implementations expose their reads, but the named false guard demonstrates that opaque branching alone cannot classify all valid blueprints exactly. The design's universal token-return guarantee remains unproved for every supported shape. Choosing to reject undecided shapes or valid conservative false positives would narrow a capability and remains a user decision. No timeout, permissions change, or production resource limit is introduced.
