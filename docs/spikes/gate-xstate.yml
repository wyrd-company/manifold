    notes: |-
      Measured: A synthetic YAML-compatible sample machine has open with N parallel regions r0 through rN-1. Each region starts at s0 and has four states s0, s1, s2, s3. Its nextN event advances s0 -> s1 -> s2 -> s3; s3 has no local transitions. Transitions s0 -> s1 in r0 and r1 are guarded by the named allowed implementation and are the two guarded transitions supplied to lint. open.on.finish targets the root final done, which is both declared returns. Thus every region combination is reachable, including every other region's configuration at either grant. Each run builds the whole pre-grant graph and traverses the first gate; separate measurements lint both gates and each passes with 65 total and 49 post-grant configurations. This benchmark measures state-graph size, not comparator evaluation or token persistence. The machine has two gated states identified through the lint argument; meta.gate adds no graph behavior.

