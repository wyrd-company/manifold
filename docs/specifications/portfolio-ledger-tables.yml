$schema: https://refinery.systems/ontology/specification
relationships:
  related-to:
    - portfolio-ledger
    - portfolio
  references:
    - ledger
description: >-
  Defines the tables the portfolio ledger holds in Manifold's store database.
  `docs/specifications/portfolio-ledger-tables.sql` is the machine-readable
  definition: the schema that the ledger's migration steps produce. The
  ledger's owner name is `ledger`, and every table, index, and trigger it
  creates is named `ledger_<name>`. The ledger owns these four tables and no
  other. Its steps are applied by the store's `migrate("ledger", steps)`,
  which records the ledger's version in the shared `schema_migration` table;
  the ledger never runs DDL itself. Step 1 is this file's script. Steps are
  append-only: a change to these tables is a new step, and this file is
  rewritten to the schema all steps produce.

  Append-only. No row of a ledger table is updated or deleted. A trigger on
  each table aborts every `UPDATE` and `DELETE`. Settlement and move are
  written as entries whose signed amounts cancel earlier entries.

  Operations. `ledger_operations` holds one row per idempotent write, keyed by
  the caller's idempotency key, with the kind of write and the canonical JSON
  of its request. Every entry a credit, reserve, actual, or move writes names
  its operation. A settle entry names none; settlement is keyed by actor in
  `ledger_settlements`.

  Windows. `ledger_windows` holds one row per account window with its open
  time and its expected close time, in epoch milliseconds. The current window
  of an account at a time `t` is its window with the greatest `opens_at` not
  after `t`. No two windows of one account open at the same time.

  Entries. `ledger_entries` holds signed integer amounts in the account's
  native unit. Credits and actuals carry the window they count in; credits
  carry no item and no actor. Reserve, settle, and move entries carry no
  window: an outstanding reservation counts against the account's current
  window, whichever window it was written in. The CHECK constraints tie each
  kind to its sign and to which of item, actor, window, and operation it
  carries.

  Derived quantities. For an actor, item, and account, the net reservation is
  the sum of its `reserve`, `settle`, and `move` amounts, and the posted usage
  is the sum of its `actual` amounts in every window. The outstanding
  reservation folds its entries in `seq` order from 0: a `reserve`, `move`,
  or `settle` entry sets it to the greater of 0 and itself plus the amount,
  and an `actual` entry sets it to the greater of 0 and itself less the
  amount. An actual consumes only the hold that exists when it is posted.
  The capacity of an account window is the sum of its `credit`
  amounts. The estimate of an actor for an account is the sum of its
  `reserve` amounts only; a move and a settlement leave it unchanged.
format: sql-ddl
validation-criteria: >-
  `docs/specifications/portfolio-ledger-tables.sql` runs without error on an
  empty SQLite database. A test applies the ledger's exported migration
  steps in order to an empty database and compares the `type`, `name`,
  `tbl_name`, and `sql` of every `sqlite_schema` row whose name starts with
  `ledger_` with the rows this file produces on a second empty database,
  with each run of whitespace in `sql` read as one space; they are equal.
  An `UPDATE` or `DELETE` on any of the four tables fails with the
  table's append-only message. An entry that breaks a kind's rule, such as a
  credit naming an actor, a reserve carrying a window, or a non-negative
  settle, fails its CHECK constraint. The ledger's tests open their own
  database file and run every operation through the ledger's public
  interface against these tables.
