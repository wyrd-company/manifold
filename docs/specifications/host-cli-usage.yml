$schema: https://refinery.systems/ontology/specification
relationships:
  # GAP-EDGE: the specification schema declares no edge to a technical
  # design or another specification; `references` is the best fit.
  references:
    - usage-decoder
    - usage-record
    - usage-intake
    - usage-push
    - accounts-declaration
    - portfolio-declaration
    - price-table
description: >-
  Defines the `usage` commands of the host CLI, `manifold-host`, the Bun
  binary installed on each environment.
  `docs/specifications/host-cli-usage.cli.yml` is the machine-readable
  command definition.

  `manifold-host usage decode` reads the provider session files on the
  environment and writes the usage records, one JSON object on each line of
  standard output, in the format of the `usage-record` specification. Each
  `--root <provider>=<path>` names a directory where a provider keeps its
  sessions, and the roots decode in the order given. A file that two roots
  reach decodes once, and a call that two roots hold yields one record.
  With no `--root`, the command decodes the default root of every
  provider, in the order `claude`, `codex`, `cursor`, `grok`, `opencode`,
  resolved from the environment variables and home directory as the
  `usage-decoder` design states. A root whose directory does not exist yields no records.

  A problem with one source is a source error record on standard output, and
  the decode continues. Standard error carries only messages about the
  command line and about a failure that ends the decode. The command reads
  files and changes none.

  `manifold-host usage push` runs one decode of the same roots and sends
  its records to the service at `--service`, as the environment named
  `--environment`, by the `usage-push` protocol, with the T3 Code thread of
  each provider session read from T3 Code's database under `--t3-home`. It
  sends no authentication credential. Deployment controls access to the
  service API. It first sends, in requests with no records, every
  session mapping T3 Code holds that the service has not acknowledged
  with the same thread and provider instance, so a session whose calls
  the service already holds is mapped even when its sources have not
  changed. It keeps the mappings and the stamps of the sources the
  service has acknowledged in its push state under `--state-dir`, and
  decodes only sources whose stamps changed. A
  source whose decode was `unreadable` or `decoder-failed` keeps no new
  stamp, so the next run decodes it again. It
  sends one request at a time and stops at the first that does not answer
  200. On standard output it writes one JSON object when it ends: the
  counts `batches`, `requests`, and `skippedSources`, and the sums of the
  service's `calls` and `threads` counts. Standard error carries messages
  about the command line and the failure that ends the run. The command
  writes only its push state.

  `manifold-host usage lint` lints the usage declarations of a process
  repository checkout on the host: `accounts.yml` in the
  `accounts-declaration` format and `prices.yml` in the `price-table`
  format, and the accounts `portfolio.yml` allocates against
  `accounts.yml`. It runs `lintUsageDeclaration` and
  `lintAllocatedAccounts` from `packages/shared`, the functions the
  service runs on every revision it applies, so it reports the same
  findings and warnings. The command takes one optional argument, the
  directory of a process repository checkout, default the current
  directory. It reads `accounts.yml`, `prices.yml`, and `portfolio.yml`
  from that directory. It passes the text of `accounts.yml` and
  `prices.yml` to `lintUsageDeclaration`, and the text of `portfolio.yml`
  and `accounts.yml` to `lintAllocatedAccounts`. An absent file is linted as an empty
  document, as the service reads it. A directory that cannot be read, or a
  file that exists but cannot be read, is reported on standard error as
  `<file>: <reason>` and ends the command with exit code 2 before anything
  is linted. Otherwise the command reports every finding on standard
  output as one line, `<file>:<location> <kind> <message>`, with the file
  as `accounts.yml` or `prices.yml`, the location the finding's RFC 6901
  JSON Pointer, and the kind and message the finding's. Findings of
  `accounts.yml` come first, then those of `prices.yml`, each in the
  lint's order. The `account-undeclared` and `account-archived` warnings
  come last, in the same
  form with the file `portfolio.yml`, each line ending with ` (warning)`,
  in the lint's order, so they equal the lines `manifold-host portfolio
  lint` prints for them. The command prints nothing and exits 0 when
  there is no finding and no warning, exits 0 when there are only
  warnings, and exits 1 when there is a finding.
format: cli
validation-criteria: >-
  The command surface conforms to
  `docs/specifications/host-cli-usage.cli.yml`. The binary test in
  `packages/host-cli` compiles the binary, runs `manifold-host usage decode`
  with a `--root` for each fixture provider, and checks that every line of
  standard output validates against
  `docs/specifications/usage-record.schema.yml` and equals the golden
  fixture output, and that the exit code is 0.
  The binary test also runs `manifold-host usage push` against a test HTTP
  server and a T3 Code database built from SQL, and checks that every
  request validates against `docs/specifications/usage-push.schema.yml`,
  that the summary on standard output is one JSON object, and that a run
  with no credential succeeds and sends no Authorization header. A
  second run with an unchanged source and a mapping T3 Code added since
  the first sends that mapping in a request with no records.
  The binary test runs `manifold-host usage lint` from a directory with no
  `node_modules`. It observes exit 0 and no output for a clean checkout
  and for an empty directory; exit 1 with an `invalid-capacity` line at
  `/accounts/acct/capacity/amount` for an amount of 0.0000001; exit 1 with
  a `schema` line for an account with no `capacity`; exit 1 with a
  `duplicate-model` line from `prices.yml`; exit 1 with a `syntax` line for
  an `accounts.yml` that does not parse as YAML; exit 0 with one
  `account-undeclared` line ending with ` (warning)` for a `portfolio.yml`
  that allocates an account `accounts.yml` does not declare, and for one
  that allocates an account in a checkout with no `accounts.yml`; and exit
  2 with no standard output for a missing directory, for an `accounts.yml`
  that is a directory, and for a `portfolio.yml` that is a directory. A
  service test lints the same files through `apply` and reads the same
  findings.
