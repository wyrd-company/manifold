# ---
# relationships:
#   # GAP-EDGE: no asset edge is declared; `asset-of` names the specification
#   # this native definition belongs to.
#   asset-of: task-metadata-declaration
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://manifold.wyrd.company/schemas/task-metadata-declaration
title: Task metadata declaration
description: >-
  The document in `task-metadata.yml` at the root of the process
  repository, the task metadata schema, and the finding its lint reports.
  An empty document declares no Project. The schema checks each storage
  kind's settings; the lint checks which types and option properties a
  kind holds, scopes, and ownership shared between bindings.
$defs:
  declaration:
    description: The task metadata declaration.
    type: object
    additionalProperties: false
    properties:
      projects:
        description: >-
          The metadata of each bound GitHub Project's tasks, keyed by GitHub
          Project binding name, a declared name.
        type: object
        propertyNames:
          $ref: https://manifold.wyrd.company/schemas/service-configuration#/$defs/declared-name
        additionalProperties:
          $ref: "#/$defs/project"
  project:
    description: The metadata of one bound GitHub Project's tasks.
    type: object
    additionalProperties: false
    required:
      - lifecycle
    properties:
      lifecycle:
        $ref: "#/$defs/lifecycle-field"
      repositories:
        description: >-
          The repositories whose labels and milestones the binding owns:
          each `owner/name`, or `owner/*` for every repository of the owner
          that holds an issue of the Project.
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/repository-scope"
      fields:
        description: >-
          The Project's task fields, keyed by field name, each stored in
          the storage kind its `storage` names.
        type: object
        propertyNames:
          $ref: "#/$defs/name"
        additionalProperties:
          $ref: "#/$defs/task-field"
  lifecycle-field:
    description: >-
      The Project's lifecycle field: the single-select field a card move
      sets, and the option names a blueprint may set.
    type: object
    additionalProperties: false
    required:
      - field
      - options
    properties:
      field:
        description: The name of a single-select field of the Project.
        $ref: "#/$defs/name"
      options:
        description: The names of the field's options a blueprint may set.
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/name"
  task-field:
    description: >-
      A task field: a value of one type that each task of the Project holds
      in one storage kind on GitHub.
    type: object
    required:
      - type
    properties:
      type:
        enum:
          - text
          - number
          - date
          - single-select
      whenChanged:
        description: >-
          What an Apply does with drift in this field's configuration:
          `revert` sets GitHub back to the declaration; `accept` writes
          GitHub's configuration into the declaration. A `front-matter`
          field has no configuration and takes no `whenChanged`.
        enum:
          - revert
          - accept
        default: revert
      storage:
        $ref: "#/$defs/storage"
    oneOf:
      - additionalProperties: false
        properties:
          type:
            enum:
              - text
              - number
              - date
          whenChanged: true
          storage: true
      - additionalProperties: false
        required:
          - options
        properties:
          type:
            const: single-select
          whenChanged: true
          storage: true
          options:
            description: The field's options in the order the Project shows them.
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/option"
  storage:
    description: >-
      Where GitHub stores a task field: a storage kind and its settings.
      Absent is `{ kind: project-field }`.
    oneOf:
      - type: object
        description: A custom field of the Project.
        additionalProperties: false
        required:
          - kind
        properties:
          kind:
            const: project-field
          name:
            description: The Project field's name; the task field's name when absent.
            $ref: "#/$defs/name"
      - type: object
        description: An issue field of an organization, shared by its repositories.
        additionalProperties: false
        required:
          - kind
        properties:
          kind:
            const: issue-field
          name:
            description: The issue field's name; the task field's name when absent.
            $ref: "#/$defs/name"
          organization:
            description: The organization's login; the Project's owner when absent.
            $ref: "#/$defs/login"
      - type: object
        description: >-
          The issue type of an issue, one of an organization's issue types,
          each option an issue type.
        additionalProperties: false
        required:
          - kind
        properties:
          kind:
            const: issue-type
          organization:
            description: The organization's login; the Project's owner when absent.
            $ref: "#/$defs/login"
      - type: object
        description: >-
          One label of each repository of the binding's `repositories`, each
          option a label named `prefix` followed by the option's name.
        additionalProperties: false
        required:
          - kind
        properties:
          kind:
            const: label
          prefix:
            description: The text before each option's name in its label's name; empty when absent.
            type: string
            pattern: "^(?:\\S[^\\n\\r]*)?$"
      - type: object
        description: >-
          The milestone of an issue, each option a milestone titled with the
          option's name in each repository of the binding's `repositories`.
        additionalProperties: false
        required:
          - kind
        properties:
          kind:
            const: milestone
      - type: object
        description: A key of the YAML front matter at the start of each issue's body.
        additionalProperties: false
        required:
          - kind
        properties:
          kind:
            const: front-matter
          key:
            description: The front matter key; the task field's name when absent.
            $ref: "#/$defs/name"
  option:
    description: >-
      An option of a single-select task field: its name, or its name with
      the properties Manifold owns.
    oneOf:
      - $ref: "#/$defs/name"
      - type: object
        additionalProperties: false
        required:
          - name
        properties:
          name:
            $ref: "#/$defs/name"
          color:
            description: >-
              A named color for a Project field, issue field, or issue type
              option; six lower-case hexadecimal digits for a label.
            oneOf:
              - $ref: "#/$defs/option-color"
              - $ref: "#/$defs/label-color"
          description:
            type: string
  option-color:
    description: A single-select option color, GitHub's color in lower case.
    enum:
      - gray
      - blue
      - green
      - yellow
      - orange
      - red
      - pink
      - purple
  label-color:
    description: A label color as GitHub's REST API writes it, without `#`.
    type: string
    pattern: "^[0-9a-f]{6}$"
  login:
    description: An organization's login, compared without regard to case.
    type: string
    pattern: "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$"
  repository-scope:
    description: >-
      A repository as `owner/name`, or `owner/*` for every repository of the
      owner that holds an issue of the Project; compared without regard to
      case.
    type: string
    pattern: "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?/(?:\\*|[A-Za-z0-9._-]+)$"
  name:
    description: >-
      A field or option name as GitHub shows it: not empty, with no leading
      or trailing white space.
    type: string
    pattern: "^\\S(?:.*\\S)?$"
  finding:
    description: One problem the task metadata lint reports.
    type: object
    required:
      - kind
      - location
      - message
    additionalProperties: false
    properties:
      kind:
        enum:
          - syntax
          - schema
          - unknown-binding
          - duplicate-field
          - duplicate-option
          - storage-mismatch
          - storage-scope
          - shared-conflict
      location:
        description: The RFC 6901 JSON Pointer of the failing value in the document.
        type: string
      message:
        type: string
