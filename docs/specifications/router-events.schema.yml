# ---
# relationships:
#   realizes: router-events
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://manifold.wyrd.company/schemas/router-events
title: Router Events
description: >-
  The shapes of the event-source seam: the source event a source publishes,
  the subscription an actor host derives, the publish outcome the router
  returns, and the event issue that names a broken rule.
$defs:
  source-name:
    description: >-
      The name of an event source. `deadline` belongs to the router's
      deadline loop.
    type: string
    pattern: "^[a-z][a-z0-9-]{0,62}$"
    not:
      const: deadline
  topic:
    description: >-
      One or more segments joined by `.`; a segment holds no `.`, no
      whitespace, and no control character.
    type: string
    pattern: "^[^.\\s\\u0000-\\u001F\\u007F]+(\\.[^.\\s\\u0000-\\u001F\\u007F]+)*$"
  event-type:
    description: The type of an event; the `xstate.` prefix belongs to XState.
    type: string
    minLength: 1
    not:
      pattern: "^xstate\\."
  routed-event:
    description: The event an actor takes, delivered unchanged as the inbox payload.
    type: object
    required:
      - type
    properties:
      type:
        $ref: "#/$defs/event-type"
  source-event:
    description: >-
      What a source passes to `publish`. Every topic's first segment is the
      `source`, which the router checks beyond this schema.
    type: object
    required:
      - source
      - eventId
      - topics
      - event
    additionalProperties: false
    properties:
      source:
        $ref: "#/$defs/source-name"
      eventId:
        type: string
        minLength: 1
      topics:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/topic"
      event:
        $ref: "#/$defs/routed-event"
  subscription:
    description: >-
      The topics an actor hears and the event types it takes. Without
      `events`, every event type is taken.
    type: object
    required:
      - topics
    additionalProperties: false
    properties:
      topics:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/topic"
      events:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/event-type"
  event-issue:
    type: object
    required:
      - path
      - message
    additionalProperties: false
    properties:
      path:
        description: RFC 6901 JSON Pointer of the failing value in the source event.
        type: string
      message:
        type: string
        minLength: 1
  inbox-row:
    type: object
    required:
      - sequence
      - eventId
      - actorId
      - topic
      - payload
      - receivedAt
    additionalProperties: false
    properties:
      sequence:
        type: integer
        minimum: 1
      eventId:
        description: "`<source>:<eventId>`."
        type: string
        pattern: "^[a-z][a-z0-9-]{0,62}:.+$"
      actorId:
        type: string
        minLength: 1
      topic:
        $ref: "#/$defs/topic"
      payload:
        $ref: "#/$defs/routed-event"
      receivedAt:
        type: integer
      consumedAt:
        type: integer
  publish-outcome:
    oneOf:
      - type: object
        required:
          - status
          - rows
        additionalProperties: false
        properties:
          status:
            const: accepted
          rows:
            type: array
            items:
              $ref: "#/$defs/inbox-row"
      - type: object
        required:
          - status
          - issues
        additionalProperties: false
        properties:
          status:
            const: rejected
          issues:
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/event-issue"
