$schema: https://refinery.systems/ontology/specification
relationships:
  # GAP-EDGE: the specification schema declares no edge to a technical
  # design; `realizes` is the best fit for the design whose tables these are.
  realizes:
    - actor-history
  references:
    - store-database-schema
    - retention
terms:
  - actor-history
  - state-visit
  - inbox
description: >-
  Defines the tables the history module holds in Manifold's store
  database. `docs/specifications/history-database-schema.sql` is the
  machine-readable definition: the schema that the module's migration
  steps produce. The module's owner name is `history`, and every table and
  index it creates is named `history_<name>`. Its steps are applied by the
  store's `migrate("history", steps)`; the module never runs DDL itself.
  At 0.1.0, step 1 creates the complete schema in this file.
  Schema changes edit that step in place and require a new store. After
  0.1.0, steps are append-only, as `store` (migrations) defines.

  Visits. `history_visit` holds one row per state visit of an actor,
  numbered from 1 in the order the visits were entered. It is the one
  record of an actor's visits: the usage module attributes each call to
  the number of the visit it was spent in, read through the history
  module. `machine` is the
  blueprint version key the visit's saves were made with, and
  `state_value` the canonical JSON of the snapshot's state value, keys
  sorted. `entered_at` and `exited_at` are milliseconds since the Unix
  epoch; `exited_at` is null for the visit an active actor is in.
  `exit_event_type` and `exit_event_id` are the save's `changedBy`, as
  `actor-host` defines it: the type of the event whose macrostep made the
  state change the save that left the visit saved, and the inbox event id
  of the routed event that change was made in the delivery of, null for a
  change no routed event's delivery made, whatever inbox row that save
  consumed. Both are null for a visit left by a save that holds no state change,
  such as a migration to a later blueprint version, and for the visit
  closed by the actor's end. Only `exited_at` and the exit event of an
  actor's latest visit are ever set after its insert, and each only from
  null.

  Events. `history_event` holds one row per inbox event an actor consumed,
  keyed by the actor id and event id of the store's `store_inbox` row,
  which keeps the event's topic, payload, and received and consumed times.
  `visit` is the visit the actor was in when it took the event, or null
  for an event taken before the actor's first recorded visit. A row is
  never changed.

  Commands. `history_command` holds one row per T3 Code command an
  actor's invoke sent, keyed by command id, written before the command is
  sent or, when that write fails, by the actor's next save. `kind` is
  `project-create` for a command `t3code-project-create` sent, and
  `thread-create` or `turn-start` for one the implementation of that
  name sent. `invoke_id` and `entry_id` are the invocation's, as
  `actor-host` defines them. `environment` is the T3 Code environment
  the command was sent to. `thread_id` is the thread a `thread-create`
  or `turn-start` names, and null for a `project-create`; `project_id`
  is the project a `project-create` creates, and null for the other
  kinds. `message_id` is the user message id a `turn-start` carries, and
  null for other kinds. `sent_at` is when the
  module recorded the command before sending it. `sequence` is the
  server's answer to the command, and `accepted_at` the time the module
  recorded it; both are null until the answer is recorded, and stay null
  for a command whose answer never arrived because its invoking state
  exited first. Only `sequence` and `accepted_at` are ever set after the
  insert, together and only from null.

  Retention. The `history_event` and `history_command` rows of an ended
  actor are deleted together when retention removes its events and
  commands, in the transaction in which the store marks the actor's
  snapshot pruned. `history_visit` rows are never deleted: the visits a
  usage posting names, and their entry times, stay for as long as the
  posting does, which is the life of the store file. The rows of an
  active actor are never deleted.
format: sql-ddl
validation-criteria: >-
  `docs/specifications/history-database-schema.sql` runs without error on
  an empty SQLite database with `foreign_keys = ON`. A test applies the
  module's exported migration steps in order to an empty database and
  compares the `type`, `name`, `tbl_name`, and `sql` of every
  `sqlite_schema` row whose name starts with `history_` with the rows this
  file produces on a second empty database, with each run of whitespace in
  `sql` read as one space; they are equal. A visit with an exit event and
  no `exited_at`, an exit event id with no exit event type, and an event
  link to a visit that does not exist, a command with a sequence and no
  `accepted_at`, a command of another kind, a `project-create` with a
  thread id or with no project id, and a `thread-create` or `turn-start`
  with a project id or with no thread id, each fail a constraint.
