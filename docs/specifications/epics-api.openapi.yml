# ---
# relationships:
#   # GAP-EDGE: no asset edge is declared; `asset-of` names the specification
#   # this native definition belongs to.
#   asset-of: epics-api
# ---
openapi: 3.1.0
info:
  title: Manifold epics API
  version: 0.1.0
  description: The epics read endpoints of Manifold's API.
security: []
paths:
  /api/epics:
    get:
      operationId: listEpicRoots
      summary: List the root tasks, open roots first.
      responses:
        "200":
          description: Every root task.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicRootsResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/epics/{issueNodeId}:
    get:
      operationId: getEpic
      summary: Read the epic under one tracked issue.
      parameters:
        - name: issueNodeId
          in: path
          required: true
          description: The GitHub node id of a tracked issue, percent-encoded or not.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The issue's sub-issue tree, its outside issues, and their dependencies.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicResponse"
        "404":
          description: The node id names no tracked issue.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  responses:
    MethodNotAllowed:
      description: A method other than GET.
      headers:
        Allow:
          schema:
            const: GET
  schemas:
    EpicRootsResponse:
      type: object
      additionalProperties: false
      required: [roots]
      properties:
        roots:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [issue]
            properties:
              issue:
                $ref: "#/components/schemas/Issue"
    EpicResponse:
      type: object
      additionalProperties: false
      required: [epic]
      properties:
        epic:
          $ref: "#/components/schemas/Epic"
    Epic:
      type: object
      additionalProperties: false
      required: [root, issues, dependencies]
      properties:
        root:
          type: string
          minLength: 1
          description: The node id asked for; the first entry of `issues`.
        issues:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EpicIssue"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"
    EpicIssue:
      type: object
      additionalProperties: false
      required: [issue, placement]
      properties:
        issue:
          $ref: "#/components/schemas/Issue"
        placement:
          enum: [root, tree, outside]
        parent:
          type: string
          minLength: 1
          description: The node id of the tree issue it was reached from; present only for `tree`.
        task:
          $ref: "#/components/schemas/EpicTask"
    EpicTask:
      type: object
      additionalProperties: false
      required: [actorId, projects, openEscalations]
      properties:
        actorId:
          type: string
          pattern: "^task:.+$"
        projects:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [binding, status]
            properties:
              binding:
                type: string
                minLength: 1
              status:
                description: The lifecycle option the item holds, or null.
                type: [string, "null"]
        actor:
          type: object
          additionalProperties: false
          required: [status, states]
          properties:
            status:
              enum: [active, done, stopped, held]
            states:
              type: array
              items:
                type: string
                minLength: 1
              description: Leaf state paths, keys from the root joined with `.`.
        openEscalations:
          type: integer
          minimum: 0
    Dependency:
      type: object
      additionalProperties: false
      required: [blocking, blocked]
      description: "`blocked` is blocked by `blocking`: it waits on it."
      properties:
        blocking:
          type: string
          minLength: 1
        blocked:
          type: string
          minLength: 1
    Issue:
      type: object
      additionalProperties: false
      required: [nodeId, repository, number, state]
      properties:
        nodeId:
          type: string
          minLength: 1
        repository:
          type: string
          pattern: "^[^/]+/[^/]+$"
        number:
          type: integer
          minimum: 1
        state:
          enum: [open, closed]
        title:
          type: string
        url:
          type: string
          format: uri
