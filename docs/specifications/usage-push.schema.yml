# ---
# relationships:
#   # GAP-EDGE: no schema declares an edge from an asset to its
#   # specification; `asset-of` names it.
#   asset-of: usage-push
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://manifold.wyrd.company/schemas/usage-push
title: Usage push request
description: >-
  The body of `POST /api/usage/push`: usage records from one environment
  and the T3 Code thread of each provider session they name.
type: object
additionalProperties: false
required:
  - environment
  - threads
  - records
properties:
  environment:
    description: The environment the host runs on, as service configuration names it.
    $ref: https://manifold.wyrd.company/schemas/service-configuration#/$defs/declared-name
  threads:
    type: array
    maxItems: 1000
    items:
      $ref: "#/$defs/mapping"
  records:
    type: array
    maxItems: 1000
    items:
      $ref: https://manifold.wyrd.company/schemas/usage-record
$defs:
  mapping:
    description: The T3 Code thread that runs one provider session.
    type: object
    additionalProperties: false
    required:
      - provider
      - providerSessionId
      - threadId
    properties:
      provider:
        $ref: https://manifold.wyrd.company/schemas/usage-record#/$defs/provider
      providerSessionId:
        type: string
        minLength: 1
      threadId:
        type: string
        minLength: 1
      providerInstance:
        description: The T3 Code provider instance that runs the session.
        type: string
        minLength: 1
  count:
    type: integer
    minimum: 0
  response:
    description: The body of a 200 answer.
    type: object
    additionalProperties: false
    required:
      - calls
      - threads
      - sourceErrors
    properties:
      calls:
        type: object
        additionalProperties: false
        required: [accepted, pending, replayed]
        properties:
          accepted:
            $ref: "#/$defs/count"
          pending:
            $ref: "#/$defs/count"
          replayed:
            $ref: "#/$defs/count"
      threads:
        type: object
        additionalProperties: false
        required: [accepted, replayed, conflicting]
        properties:
          accepted:
            $ref: "#/$defs/count"
          replayed:
            $ref: "#/$defs/count"
          conflicting:
            $ref: "#/$defs/count"
      sourceErrors:
        $ref: "#/$defs/count"
  error:
    description: The body of every answer other than 200 that the module writes.
    type: object
    required:
      - error
      - message
    properties:
      error:
        type: string
        enum:
          - invalid-request
          - too-large
          - unsupported-media-type
          - unknown-environment
          - internal
      message:
        type: string
      issues:
        type: array
        items:
          type: object
          required: [pointer, message]
          properties:
            pointer:
              type: string
            message:
              type: string
