$schema: https://refinery.systems/ontology/specification
relationships:
  # GAP-EDGE: the specification schema declares no edge to a technical
  # design; `realizes` is the best fit for the design this section configures.
  realizes:
    - agent-tools
  references:
    - service-configuration
    - agent-tools
description: |-
  Defines the `agentTools` section of the service configuration, specified
  by `service-configuration`: how long the service looks for a tool call
  among the activities T3 Code records.
  `docs/specifications/agent-tools-configuration.schema.yml` is the
  machine-readable definition of the section's value. The root names the
  section as `agentTools`, optional, default `{}`, by `$ref` to
  `https://manifold.wyrd.company/schemas/agent-tools-configuration`.

  `identifyTimeoutMs` is the most time in milliseconds, from the arrival of
  a tool call, during which the service reads the followed threads'
  activities for the call's id, every 100 ms, before it identifies the call
  by its `thread` argument or refuses it. Default 3000; from 500 to 30000.
  The harness plugin's request timeout stays above it.

  ```yaml
  agentTools:
    identifyTimeoutMs: 5000
  ```
format: json-schema
validation-criteria: >-
  `docs/specifications/agent-tools-configuration.schema.yml` is a valid
  JSON Schema 2020-12 document. Loading a configuration with no
  `agentTools` section returns the section with `identifyTimeoutMs` 3000.
  The service rejects a configuration whose `agentTools` value the schema
  rejects, naming the property: a value below 500 or above 30000, a value
  that is not an integer, and an unknown property.
