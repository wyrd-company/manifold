# ---
# relationships:
#   # GAP-EDGE: no asset edge is declared; `asset-of` names the specification
#   # whose representative cases these are.
#   asset-of: task-metadata-declaration
# ---
# Representative cases of the task metadata declaration and its front
# matter, for the lint, `scopeOwnership`, and the front matter functions.
# Each declaration case holds `bindings.yml` and `task-metadata.yml` texts
# and the lint's answer: `ok` with what `scopeOwnership` gives for each
# shared scope, its owned entity keys and, for a repository, its owned
# label prefixes, or `findings` in document order, each with its kind and
# location. `undeclared` gives, for a repository's observed label names,
# those an Apply that asks for removal removes. Every bindings text
# validates against
# `bindings-declaration.schema.yml`. Each front matter case
# holds a body, a read, and, for a write, the key, the value, and the body
# after. Values use a parcel domain unrelated to Manifold.
bindings:
  two-of-one-organization: |
    githubProjects:
      parcels: { owner: example-org, number: 1, environment: env-one, item: alpha }
      returns: { owner: example-org, number: 2, environment: env-one, item: alpha }
  user-and-organization: |
    githubProjects:
      parcels: { owner: example-user, number: 1, environment: env-one, item: alpha }
      returns: { owner: example-org, number: 2, environment: env-one, item: alpha }
declarations:
  - name: every kind coalesces across two bindings of one organization
    bindings: two-of-one-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting, Packed] }
          repositories: [example-org/depot]
          fields:
            Effort: { type: single-select, storage: { kind: issue-field }, options: [Light, Heavy] }
            Kind:
              type: single-select
              storage: { kind: issue-type }
              options: [Parcel, { name: Letter, color: blue }]
            Size:
              type: single-select
              storage: { kind: label, prefix: "size: " }
              options: [{ name: small, color: 0e8a16 }, large]
            Route: { type: single-select, storage: { kind: milestone }, options: [North loop] }
            Due: { type: date, storage: { kind: front-matter, key: due } }
        returns:
          lifecycle: { field: Stage, options: [Received] }
          repositories: [example-org/*]
          fields:
            Effort:
              type: single-select
              storage: { kind: issue-field }
              options: [Light, { name: Heavy, color: red }]
            Kind: { type: single-select, storage: { kind: issue-type }, options: [Parcel, Letter] }
            Size:
              type: single-select
              storage: { kind: label, prefix: "size: " }
              options: [small, large]
    ok:
      scopes:
        organization:example-org:
          entities:
            - issue-field:Effort
            - issue-type:letter
            - issue-type:parcel
        repository:example-org/depot:
          entities:
            - "label:size: large"
            - "label:size: small"
            - milestone:North loop
          prefixes:
            - "size: "
  - name: an issue field declared with another type in a second binding conflicts
    bindings: two-of-one-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting] }
          fields:
            Effort: { type: single-select, storage: { kind: issue-field }, options: [Light, Heavy] }
        returns:
          lifecycle: { field: Stage, options: [Received] }
          fields:
            Effort: { type: number, storage: { kind: issue-field } }
    findings:
      - { kind: shared-conflict, location: /projects/returns/fields/Effort }
  - name: a shared option's color differs
    bindings: two-of-one-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting] }
          fields:
            Kind: { type: single-select, storage: { kind: issue-type }, options: [{ name: Parcel, color: red }] }
        returns:
          lifecycle: { field: Stage, options: [Received] }
          fields:
            Kind: { type: single-select, storage: { kind: issue-type }, options: [{ name: parcel, color: blue }] }
    findings:
      - { kind: shared-conflict, location: /projects/returns/fields/Kind/options/0/color }
  - name: one label prefix with different options owns the union of both
    bindings: two-of-one-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting] }
          repositories: [example-org/depot]
          fields:
            Size: { type: single-select, storage: { kind: label, prefix: "size: " }, options: [small, large] }
        returns:
          lifecycle: { field: Stage, options: [Received] }
          repositories: [example-org/depot]
          fields:
            Size: { type: single-select, storage: { kind: label, prefix: "size: " }, options: [small, medium] }
    ok:
      scopes:
        repository:example-org/depot:
          entities:
            - "label:size: large"
            - "label:size: medium"
            - "label:size: small"
          prefixes:
            - "size: "
  - name: nested prefixes in two bindings remove no label either declares
    bindings: two-of-one-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting] }
          repositories: [example-org/depot]
          fields:
            Size: { type: single-select, storage: { kind: label, prefix: "size: " }, options: [small] }
        returns:
          lifecycle: { field: Stage, options: [Received] }
          repositories: [example-org/depot]
          fields:
            Bulk: { type: single-select, storage: { kind: label, prefix: "size: extra: " }, options: [large] }
    ok:
      scopes:
        repository:example-org/depot:
          entities:
            - "label:size: extra: large"
            - "label:size: small"
          prefixes:
            - "size: "
            - "size: extra: "
      undeclared:
        repository:example-org/depot:
          observed:
            ["size: small", "size: extra: large", "size: tiny", "size: extra: huge", "fragile"]
          removable: ["size: tiny", "size: extra: huge"]
  - name: one binding's label without a prefix inside another field's prefix stays declared
    bindings: two-of-one-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting] }
          repositories: [example-org/depot]
          fields:
            Size: { type: single-select, storage: { kind: label, prefix: "size: " }, options: [small] }
            Handling: { type: single-select, storage: { kind: label }, options: ["size: odd", fragile] }
    ok:
      scopes:
        repository:example-org/depot:
          entities:
            - "label:fragile"
            - "label:size: odd"
            - "label:size: small"
          prefixes:
            - "size: "
      undeclared:
        repository:example-org/depot:
          observed: ["size: small", "size: odd", "size: tiny", "fragile", "urgent"]
          removable: ["size: tiny"]
  - name: revert and accept on one shared entity conflict
    bindings: two-of-one-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting] }
          fields:
            Kind: { type: single-select, storage: { kind: issue-type }, options: [Parcel] }
        returns:
          lifecycle: { field: Stage, options: [Received] }
          fields:
            Kind: { type: single-select, storage: { kind: issue-type }, options: [Parcel], whenChanged: accept }
    findings:
      - { kind: shared-conflict, location: /projects/returns/fields/Kind }
  - name: different owners never share an organization scope
    bindings: user-and-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting] }
          fields:
            Effort: { type: number, storage: { kind: issue-field } }
        returns:
          lifecycle: { field: Stage, options: [Received] }
          fields:
            Effort: { type: single-select, storage: { kind: issue-field }, options: [Light] }
    ok:
      scopes:
        organization:example-user:
          entities:
            - issue-field:Effort
        organization:example-org:
          entities:
            - issue-field:Effort
  - name: a user-owned Project names the organization of its issues
    bindings: user-and-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting] }
          fields:
            Effort: { type: single-select, storage: { kind: issue-field, organization: Example-Org }, options: [Light] }
        returns:
          lifecycle: { field: Stage, options: [Received] }
          fields:
            Effort: { type: single-select, storage: { kind: issue-field }, options: [Light] }
    ok:
      scopes:
        organization:example-org:
          entities:
            - issue-field:Effort
  - name: storage kinds refuse what they cannot hold
    bindings: two-of-one-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting] }
          fields:
            Note: { type: text, storage: { kind: label } }
            Size:
              type: single-select
              storage: { kind: label }
              options: [{ name: small, color: green }]
            Effort:
              type: single-select
              storage: { kind: issue-field }
              options: [{ name: Light, color: 0e8a16 }]
            Route:
              type: single-select
              storage: { kind: milestone }
              options: [{ name: North loop, color: blue }]
            Due: { type: date, storage: { kind: front-matter }, whenChanged: accept }
    findings:
      - { kind: storage-mismatch, location: /projects/parcels/fields/Note/type }
      - { kind: storage-scope, location: /projects/parcels/fields/Note/storage }
      - { kind: storage-mismatch, location: /projects/parcels/fields/Size/options/0/color }
      - { kind: storage-scope, location: /projects/parcels/fields/Size/storage }
      - { kind: storage-mismatch, location: /projects/parcels/fields/Effort/options/0/color }
      - { kind: storage-mismatch, location: /projects/parcels/fields/Route/options/0/color }
      - { kind: storage-scope, location: /projects/parcels/fields/Route/storage }
      - { kind: storage-mismatch, location: /projects/parcels/fields/Due/whenChanged }
  - name: one storage place per Project
    bindings: two-of-one-organization
    taskMetadata: |
      projects:
        parcels:
          lifecycle: { field: Stage, options: [Sorting] }
          repositories: [example-org/depot]
          fields:
            Kind: { type: single-select, storage: { kind: issue-type }, options: [Parcel] }
            Class: { type: single-select, storage: { kind: issue-type }, options: [Letter] }
            Due: { type: date, storage: { kind: front-matter, key: due } }
            Deadline: { type: date, storage: { kind: front-matter, key: due } }
            Size: { type: single-select, storage: { kind: label }, options: [small] }
            Bulk: { type: single-select, storage: { kind: label }, options: [Small] }
    findings:
      - { kind: duplicate-field, location: /projects/parcels/fields/Class }
      - { kind: duplicate-field, location: /projects/parcels/fields/Deadline }
      - { kind: duplicate-field, location: /projects/parcels/fields/Bulk }
frontMatter:
  - name: no block reads empty, and a set then a clear gives the body back
    body: "Pack the parcel.\n"
    read: { block: absent, values: { due: { state: empty } } }
    write:
      - key: due
        value: "2026-01-02"
        after: "---\ndue: \"2026-01-02\"\n---\n\nPack the parcel.\n"
      - key: due
        value: null
        after: "Pack the parcel.\n"
  - name: comments, other keys, line endings, and prose stay
    body: "---\r\n# set by the sorter\r\nweight: 3\r\ndue: 2026-01-02\r\n---\r\nPack the parcel.\r\n\r\n- [ ] Label it\r\n"
    read:
      {
        block: present,
        values: { weight: { state: set, value: 3 }, due: { state: set, value: "2026-01-02" } },
      }
    write:
      - key: weight
        value: 4
        after: "---\r\n# set by the sorter\r\nweight: 4\r\ndue: 2026-01-02\r\n---\r\nPack the parcel.\r\n\r\n- [ ] Label it\r\n"
  - name: a value of another type is invalid, not empty
    body: "---\nweight: heavy\n---\n"
    read: { block: present, values: { weight: { state: invalid } } }
  - name: a block that does not parse refuses the write
    body: "---\nweight: [3\n---\nPack the parcel.\n"
    read: { block: invalid, values: { weight: { state: invalid } } }
    write:
      - key: weight
        value: 4
        refused: front-matter-invalid
  - name: a thematic break later in the body is not front matter
    body: "Pack the parcel.\n\n---\nweight: 3\n---\n"
    read: { block: absent, values: { weight: { state: empty } } }
