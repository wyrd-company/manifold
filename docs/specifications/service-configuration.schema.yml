# ---
# relationships:
#   # GAP-EDGE: no asset edge is declared; `asset-of` names the specification
#   # this native definition belongs to.
#   asset-of: service-configuration
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://manifold.wyrd.company/schemas/service-configuration
title: Service configuration
description: >-
  The root document of the service configuration file. Each section other
  than `credentials` is specified by the module that owns it and composed
  here by `$ref` to that section's `$id`.
type: object
additionalProperties: false
required:
  - processRepository
  - store
properties:
  processRepository:
    $ref: https://manifold.wyrd.company/schemas/process-repository-configuration
  store:
    $ref: https://manifold.wyrd.company/schemas/store-configuration
  credentials:
    description: >-
      The credentials behind each name the process repository and the
      service configuration use, keyed by credential name.
    type: object
    default: {}
    propertyNames:
      $ref: "#/$defs/declared-name"
    additionalProperties:
      $ref: "#/$defs/credential"
  comparatorSandbox:
    $ref: https://manifold.wyrd.company/schemas/comparator-sandbox-configuration
    default: {}
  expressions:
    $ref: https://manifold.wyrd.company/schemas/expressions-configuration
    default: {}
  github:
    $ref: https://manifold.wyrd.company/schemas/github-source-configuration
    default: {}
  environments:
    $ref: https://manifold.wyrd.company/schemas/t3code-environments-configuration
    default: {}
  http:
    $ref: https://manifold.wyrd.company/schemas/http-host-configuration
    default: {}
  blueprintLint:
    $ref: https://manifold.wyrd.company/schemas/blueprint-lint-configuration
    default: {}
  escalations:
    $ref: https://manifold.wyrd.company/schemas/escalations-configuration
    default: {}
  agentTools:
    $ref: https://manifold.wyrd.company/schemas/agent-tools-configuration
    default: {}
  retention:
    $ref: https://manifold.wyrd.company/schemas/retention-configuration
    default: {}
$defs:
  declared-name:
    description: >-
      A name the user declares, such as a credential or environment name: a
      lower-case slug of at most 64 characters. A section names one with a
      `$ref` to
      `https://manifold.wyrd.company/schemas/service-configuration#/$defs/declared-name`.
    type: string
    maxLength: 64
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
  credential:
    description: >-
      One credential, discriminated by `kind`. Each kind is an `if`/`then`
      entry, so that the defaults of the kind's schema apply.
    type: object
    required:
      - kind
    properties:
      kind:
        enum:
          - github-app
          - t3code-token
          - ntfy-token
    allOf:
      - if:
          properties:
            kind:
              const: github-app
        then:
          $ref: "#/$defs/github-app-credential"
      - if:
          properties:
            kind:
              const: t3code-token
        then:
          $ref: https://manifold.wyrd.company/schemas/t3code-environments-configuration#/$defs/t3code-token-credential
      - if:
          properties:
            kind:
              const: ntfy-token
        then:
          $ref: https://manifold.wyrd.company/schemas/escalations-configuration#/$defs/ntfy-token-credential
  github-app-credential:
    description: >-
      A GitHub App installation. The service mints a short-lived installation
      token from it each time it authenticates.
    type: object
    additionalProperties: false
    required:
      - kind
      - appId
      - installationId
      - privateKeyFile
    properties:
      kind:
        const: github-app
      appId:
        description: The GitHub App's numeric app ID.
        type: integer
        minimum: 1
      installationId:
        description: The numeric ID of the App's installation on the owner of the repositories it reaches.
        type: integer
        minimum: 1
      privateKeyFile:
        description: >-
          Path of the App's PEM private key file. A relative path resolves
          against the directory of the configuration file.
        type: string
        minLength: 1
      apiUrl:
        description: The base URL of the GitHub REST API that mints tokens.
        type: string
        pattern: "^https?://[^\\s]+$"
        default: https://api.github.com
