# ---
# relationships:
#   realizes: blueprint
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://manifold.wyrd.company/schemas/blueprint
title: Blueprint
description: >-
  The blueprint file a process repository declares, the version identity
  the loader gives it, and the finding the blueprint lint reports.
$defs:
  blueprint:
    description: One blueprint file.
    type: object
    required:
      - machine
      - schemas
    additionalProperties: false
    properties:
      description:
        type: string
      machine:
        $ref: "#/$defs/machine"
      schemas:
        $ref: "https://manifold.wyrd.company/schemas/blueprint-expressions#/$defs/expression-schemas"
  machine:
    description: >-
      The root state node of the machine configuration, with the machine id
      and the initial context.
    type: object
    allOf:
      - $ref: "#/$defs/state-node-properties"
    propertyNames:
      enum:
        - description
        - type
        - initial
        - history
        - target
        - states
        - "on"
        - always
        - after
        - onDone
        - entry
        - exit
        - invoke
        - meta
        - tags
        - output
        - id
        - context
    properties:
      context:
        description: The initial context. `manifold` is the engine's.
        type: object
        not:
          required:
            - manifold
  state-node:
    type: object
    allOf:
      - $ref: "#/$defs/state-node-properties"
    propertyNames:
      enum:
        - description
        - type
        - initial
        - history
        - target
        - states
        - "on"
        - always
        - after
        - onDone
        - entry
        - exit
        - invoke
        - meta
        - tags
        - output
        - id
  state-node-properties:
    description: The keys a state node shares with the root.
    type: object
    properties:
      id:
        type: string
        minLength: 1
      description:
        type: string
      type:
        enum:
          - atomic
          - compound
          - parallel
          - final
          - history
      initial:
        $ref: "#/$defs/state-key"
      history:
        enum:
          - shallow
          - deep
      target:
        $ref: "#/$defs/targets"
      states:
        type: object
        propertyNames:
          $ref: "#/$defs/state-key"
        additionalProperties:
          $ref: "#/$defs/state-node"
      "on":
        type: object
        additionalProperties:
          $ref: "#/$defs/transitions"
      always:
        $ref: "#/$defs/transitions"
      after:
        type: object
        propertyNames:
          description: A delay in milliseconds as decimal digits, or a delay implementation name.
          minLength: 1
        additionalProperties:
          $ref: "#/$defs/transitions"
      onDone:
        $ref: "#/$defs/transitions"
      entry:
        $ref: "#/$defs/actions"
      exit:
        $ref: "#/$defs/actions"
      invoke:
        oneOf:
          - $ref: "#/$defs/invoke"
          - type: array
            items:
              $ref: "#/$defs/invoke"
      meta:
        type: object
        properties:
          gate:
            $ref: "#/$defs/gate-declaration"
      tags:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      output:
        description: >-
          On a top-level final state, the machine's output: static, or an
          `expression.map`.
        $ref: "#/$defs/value-or-mapping"
  gate-declaration:
    description: >-
      The gate a state declares in `meta.gate`: its comparator file, where
      its token is returned, whether a reservation accompanies the token,
      the token event's type, and the region the comparator reads as the
      task's dependency state.
    type: object
    required:
      - comparator
      - return
    additionalProperties: false
    properties:
      comparator:
        description: The repository-relative path of the comparator's TypeScript file.
        type: string
        pattern: "^[^/].*\\.ts$"
        not:
          pattern: "(^|/)\\.{1,2}(/|$)"
      return:
        oneOf:
          - const: exit
          - type: object
            required:
              - state
            additionalProperties: false
            properties:
              state:
                $ref: "#/$defs/state-path"
      reservation:
        type: boolean
        default: false
      token:
        description: The type of the event that delivers the token.
        type: string
        minLength: 1
        default: token
      dependencies:
        $ref: "#/$defs/state-path"
  state-path:
    description: A state node's keys from the root, joined with `.`.
    type: string
    pattern: "^[^.#]+(\\.[^.#]+)*$"
  state-key:
    description: A state key. Targets and state paths separate keys with `.` and ids with `#`.
    type: string
    minLength: 1
    pattern: "^[^.#]+$"
  targets:
    oneOf:
      - type: string
        minLength: 1
      - type: array
        minItems: 1
        items:
          type: string
          minLength: 1
  transitions:
    oneOf:
      - $ref: "#/$defs/transition"
      - type: array
        items:
          $ref: "#/$defs/transition"
  transition:
    oneOf:
      - type: string
        minLength: 1
      - type: object
        additionalProperties: false
        properties:
          target:
            $ref: "#/$defs/targets"
          guard:
            $ref: "#/$defs/guard"
          actions:
            $ref: "#/$defs/actions"
          reenter:
            type: boolean
          description:
            type: string
          meta:
            type: object
  guard:
    description: >-
      A guard: an implementation reference, an expression reference, or the
      built-in `in` guard, which is never written by its bare name.
    allOf:
      - $ref: "#/$defs/reference"
      - not:
          const: in
      - if:
          type: object
          required:
            - type
          properties:
            type:
              const: in
        then:
          $ref: "#/$defs/in-guard"
  in-guard:
    description: >-
      The built-in guard that is true when every listed state is active.
    type: object
    required:
      - type
      - params
    additionalProperties: false
    properties:
      type:
        const: in
      params:
        type: object
        required:
          - states
        additionalProperties: false
        properties:
          states:
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/state-path"
  actions:
    oneOf:
      - $ref: "#/$defs/reference"
      - type: array
        items:
          $ref: "#/$defs/reference"
  reference:
    description: >-
      An implementation referenced by name, with optional parameters, or an
      expression reference. An expression implementation is never
      referenced by its bare name.
    oneOf:
      - $ref: "#/$defs/implementation-name"
      - type: object
        required:
          - type
        additionalProperties: false
        properties:
          type:
            $ref: "#/$defs/implementation-name"
          params:
            type: object
      - $ref: "https://manifold.wyrd.company/schemas/blueprint-expressions#/$defs/expression-reference"
  implementation-name:
    description: >-
      The name of an implementation that code registers. Names beginning
      with `expression.` belong to the expression implementations.
    type: string
    minLength: 1
    not:
      pattern: "^expression\\."
  value-or-mapping:
    description: >-
      A static value, or a mapping. An object whose `type` is
      `expression.map` is a mapping and has the expression reference shape.
    if:
      type: object
      required:
        - type
      properties:
        type:
          const: expression.map
    then:
      $ref: "https://manifold.wyrd.company/schemas/blueprint-expressions#/$defs/expression-reference"
  invoke:
    type: object
    required:
      - src
    additionalProperties: false
    properties:
      src:
        description: An actor implementation name, or a blueprint path that invokes a child blueprint.
        anyOf:
          - $ref: "#/$defs/blueprint-path"
          - $ref: "#/$defs/implementation-name"
      id:
        type: string
        minLength: 1
      systemId:
        type: string
        minLength: 1
      input:
        description: Static input, or an `expression.map`.
        $ref: "#/$defs/value-or-mapping"
      onDone:
        $ref: "#/$defs/transitions"
      onError:
        $ref: "#/$defs/transitions"
      onSnapshot:
        $ref: "#/$defs/transitions"
  blueprint-path:
    description: The repository-relative path of a blueprint file.
    type: string
    pattern: "^blueprints/.+\\.ya?ml$"
  child-blueprint-error:
    description: The error an invoke of a child blueprint that cannot run fails with.
    type: object
    required:
      - type
      - path
      - reason
    additionalProperties: false
    properties:
      type:
        const: child-blueprint
      path:
        $ref: "#/$defs/blueprint-path"
      reason:
        enum:
          - missing
          - invalid
          - cycle
          - schemas
      findings:
        description: For `invalid`, the child's lint findings.
        type: array
        items:
          $ref: "#/$defs/blueprint-finding"
  actor-identity:
    description: The engine's identity of an actor, at `context.manifold`.
    type: object
    additionalProperties: false
    properties:
      project:
        description: The GitHub Project node id.
        type: string
        minLength: 1
      issue:
        description: The issue node id.
        type: string
        minLength: 1
      environment:
        description: The T3 Code environment name from service configuration.
        type: string
        minLength: 1
      threads:
        description: The ids of the threads the actor follows.
        type: array
        items:
          type: string
          minLength: 1
      portfolioItem:
        type: string
        minLength: 1
      blueprintPath:
        $ref: "#/$defs/blueprint-path"
  blueprint-version:
    description: The identity the loader gives a loaded blueprint.
    type: object
    required:
      - commit
      - path
    additionalProperties: false
    properties:
      commit:
        description: The full id of the process repository commit the file was read at.
        type: string
        pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$"
      path:
        description: The repository-relative path of the file.
        type: string
        pattern: "^blueprints/.+\\.ya?ml$"
  blueprint-version-key:
    description: A blueprint version as one string, `<commit>:<path>`.
    type: string
    pattern: "^([0-9a-f]{40}|[0-9a-f]{64}):blueprints/.+\\.ya?ml$"
  blueprint-finding:
    description: One failure the blueprint lint reports for one file.
    type: object
    required:
      - path
      - kind
      - location
      - message
    additionalProperties: false
    properties:
      path:
        description: The file's repository-relative path, or the file as given to the host CLI.
        type: string
      kind:
        enum:
          - yaml
          - shape
          - schema-invalid
          - implementation-unknown
          - machine
          - final-state-missing
          - gate
          - syntax
          - evaluation
          - result
          - schema
          - schema-missing
          - site-unsupported
          - token-violation
          - token-potential
          - token-unknown
      location:
        description: The RFC 6901 JSON Pointer of the failing value in the document.
        type: string
      message:
        type: string
      line:
        description: For `yaml`, the 1-based line.
        type: integer
        minimum: 1
      column:
        description: For `yaml`, the 1-based column.
        type: integer
        minimum: 1
      implementationKind:
        description: For `implementation-unknown`, the kind of the reference.
        enum:
          - actor
          - action
          - guard
          - delay
      name:
        description: For `implementation-unknown`, the name referenced.
        type: string
      expression:
        type: string
      code:
        type: string
      position:
        type: integer
        minimum: 0
      schemaErrors:
        $ref: "https://manifold.wyrd.company/schemas/blueprint-expressions#/$defs/error-detail/properties/schemaErrors"
      sample:
        type: string
        pattern: ^(examples\[[0-9]+\]|full|required)$
      eventType:
        type: string
      gate:
        description: For a token finding, the gated state's path.
        $ref: "#/$defs/state-path"
      steps:
        description: >-
          For `token-violation` and `token-potential`, the path from the
          initial configuration through the grant to the first trap on it.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/token-step"
      choices:
        description: For `token-potential`, each choice of a guard or a raise on the path.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/token-choice"
      configurationBound:
        description: For `token-unknown`, the bound the graph reached.
        type: integer
        minimum: 1
      configurations:
        description: For `token-unknown`, the configurations the graph held when it stopped.
        type: integer
        minimum: 0
  token-step:
    description: >-
      One step of a token finding's path: the event sent, or `xstate.init`
      for the initial configuration, and the key of the configuration
      reached.
    type: object
    required:
      - event
      - configuration
    additionalProperties: false
    properties:
      event:
        type: string
      configuration:
        type: string
      grant:
        description: True on the step that delivers the gate's token.
        const: true
  token-choice:
    description: One choice a token finding's path takes.
    type: object
    required:
      - step
      - location
      - value
    additionalProperties: false
    properties:
      step:
        description: The 0-based index into `steps` of the step that takes the choice.
        type: integer
        minimum: 0
      location:
        description: The JSON Pointer of the guard, or of the action that raises.
        type: string
      raises:
        description: For a raise, the event type raised.
        type: string
      value:
        type: boolean
