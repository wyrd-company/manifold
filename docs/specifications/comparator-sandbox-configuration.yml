$schema: https://refinery.systems/ontology/specification
relationships:
  # GAP-EDGE: the specification schema declares no edge to a technical
  # design; `realizes` is the best fit for the design whose limits this is.
  realizes:
    - comparator-sandbox
description: >-
  Defines the `comparatorSandbox` key of the service configuration: the
  limits every comparator evaluation runs under.
  `docs/specifications/comparator-sandbox-configuration.schema.yml` is the
  machine-readable definition of the key's value.

  `timeoutMs` is the per-evaluation timeout in milliseconds. An evaluation
  whose duration exceeds it fails with kind `timeout`. It is an integer of
  at least 1. Default 100.

  `memoryLimitMiB` is the maximum linear memory per loaded comparator in
  mebibytes, including the engine's allocations. The comparator's heap cannot
  grow beyond this bound. An allocation that exceeds it fails the evaluation
  with kind `memory`. It is an integer from 16 to 2048, so that the maximum
  lies within the 16 MiB to 2 GiB memory the QuickJS wasm binary imports.
  Default 32.

  The key and each property are optional; an absent value takes its
  default. The service reads the key when it starts, and the limits apply to
  every comparator it loads.
format: json-schema
validation-criteria: >-
  `docs/specifications/comparator-sandbox-configuration.schema.yml` is a
  valid JSON Schema 2020-12 document, and its defaults equal
  `comparatorSandboxDefaults` exported by the comparator sandbox. The
  service rejects a configuration whose `comparatorSandbox` value the schema
  rejects, naming the property.
