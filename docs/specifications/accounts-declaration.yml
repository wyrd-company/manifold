$schema: https://refinery.systems/ontology/specification
relationships:
  # GAP-EDGE: the specification schema declares no edge to a technical
  # design; `realizes` names the design that reads this declaration.
  realizes:
    - usage-intake
    - portfolio
  references:
    - portfolio-declaration
    - price-table
    - usage-record
    - service-configuration
terms:
  - capacity
  - credit
  - reset
  - window
description: |-
  Defines `accounts.yml`, the file at the root of the process repository
  that declares the accounts usage is charged to: each account's unit, its
  kind, its capacity per window, and the usage that charges it.
  `docs/specifications/accounts-declaration.schema.yml` is the
  machine-readable definition of its document. An absent file and an empty
  document declare no accounts.

  Accounts. `accounts` maps account names to accounts. An account name is
  a declared name, as `service-configuration` defines it, and is the name
  `portfolio.yml` allocates by and the ledger keys entries by.

  Unit. `unit` is the account's native unit. The unit `usd` counts every
  ledger amount of the account, credit, reservation, and actual, as an
  integer number of millionths of a US dollar, and prices its calls from
  the price table, whose unit is `usd`.

  Kind. `kind` is `api` for an account billed by its usage against a
  budget, and `subscription` for an account with a usage limit that resets
  on the provider's schedule. Both kinds declare their capacity in the
  same shape, and Manifold credits their windows by the same rule.

  Capacity. `capacity` is what the account can spend in each window, in
  the account's unit, and when its windows open. `amount` is a positive
  decimal in the unit; for `usd` it converts once to millionths,
  `Math.round(amount × 1000000)`, which is at least 1 and at most
  `Number.MAX_SAFE_INTEGER`. `reset` is an RFC 3339 date-time with a
  `Z` or a numeric offset: an instant at which one of the account's
  windows opens, from `0001-01-01T00:00:00.000Z` to
  `9999-12-31T23:59:59.999Z` once its offset is applied. `every` is the
  length of a window, exactly one of `hours` from 1 to 87,600, `days`
  from 1 to 3,650, or `months` from 1 to 120, so no window is longer than
  ten calendar years. Hours and days are
  fixed lengths of 3,600,000 and 86,400,000 milliseconds. A month length
  counts calendar months in UTC, so each window opens on the day of the
  month and at the time of day of `reset` in UTC; with `months`, the day
  of the month of `reset` in UTC is at most 28.

  Windows. The account's windows are a series: window `k`, for every
  integer `k`, opens `k` lengths after `reset` and closes when window
  `k + 1` opens. Every instant, before `reset` too, falls in exactly one
  window of the series. A window's key is its open time as an ISO 8601
  UTC string with milliseconds, such as `2026-10-01T00:00:00.000Z`.

  - For an `api` account, `amount` is the budget for one billing period,
    `reset` is the start of a billing period, and `every` is the period,
    usually `months: 1`.

  - For a `subscription` account, `amount` is the operator's estimate of
    the usage limit of one window, priced as the account's unit prices its
    calls, `reset` is a reset the provider reported or the operator
    observed, and `every` is the limit's period, such as `days: 7` for a
    weekly limit. A subscription with several limits declares the one
    Manifold budgets by. The declaration holds every part of a
    subscription's capacity: the amount, the reset, and the period. The
    provider's reported reset times, its reported share of the limit
    used, and the ratio between that share and the amount are
    observations, and are not part of the declaration.

  A window that Manifold has credited keeps its capacity and its bounds. A
  changed capacity applies to the windows credited after the declaration
  that changes it is in force.

  Usage. `usage` lists the usage that charges the account. Each entry
  names an `environment`, as service configuration names it, a `provider`
  of the `usage-record` specification, and, optionally, an `instance`, the
  id of a T3 Code provider instance on that environment. A call charges
  the account of the entry with its environment, its provider, and the
  instance of the thread that ran it; when no entry names that instance,
  it charges the account of the entry with its environment and provider
  and no instance. A call matched by no entry has no account.

  ```yaml
  accounts:
    acct:
      unit: usd
      kind: api
      capacity:
        amount: 250
        reset: 2026-01-01T00:00:00Z
        every:
          months: 1
      usage:
        - environment: env-one
          provider: claude
        - environment: env-one
          provider: codex
    acct-alt:
      unit: usd
      kind: subscription
      capacity:
        amount: 120.5
        reset: 2026-01-05T17:00:00Z
        every:
          days: 7
      usage:
        - environment: env-one
          provider: claude
          instance: claude-alt
  ```

  Findings. `lintUsageDeclaration` in `packages/shared` lints this file
  with `prices.yml`. Each finding has a kind, the file, a location that is
  the RFC 6901 JSON Pointer of the offending value, and a message. The
  kinds for this file:

  - `syntax`: the file does not parse as one YAML document. The location
    is the empty pointer and the message is the parser's, with its line
    and column. No other finding is reported for the file.

  - `schema`: the document does not validate against the schema. The
    message is the validator's. No other finding is reported for the
    file.

  - `duplicate-usage`: a usage entry names the same environment,
    provider, and instance, or the same environment and provider with no
    instance, as an earlier entry in any account. The location is the
    later entry.

  - `invalid-capacity`: a capacity the schema admits and the rules above
    refuse: an `amount` that converts to less than 1 or more than
    `Number.MAX_SAFE_INTEGER` millionths, or that has more than six
    fractional digits; a `reset` that is not an RFC 3339 date-time with a
    `Z` or a numeric offset; a `reset` before `0001-01-01T00:00:00.000Z` or
    after `9999-12-31T23:59:59.999Z` once its offset is applied; or a
    `months` length with a `reset` on a day after the 28th in UTC. A
    length outside its range is a `schema` finding at that length. The location is the offending `amount` or
    `reset`.

  Allocated accounts. An account `portfolio.yml` allocates and this file
  does not declare is the warning `account-undeclared` in `portfolio.yml`,
  which `lintAllocatedAccounts` reports as `portfolio-declaration` states.
  The service credits such an account nothing, so its balances read 0.
format: json-schema
validation-criteria: >-
  `docs/specifications/accounts-declaration.schema.yml` is a valid JSON
  Schema 2020-12 document, and equals the schema `packages/shared` embeds,
  which a test shows. Tests of `lintUsageDeclaration` show an empty
  document, each finding kind with its location, a digit-leading account
  name as a `schema` finding, an account with no `capacity` as a `schema`
  finding at `/accounts/<name>/capacity`, each `invalid-capacity` rule with its location,
  each length at its maximum passing and one above it as a `schema`
  finding at `/accounts/<name>/capacity/every/<unit>`, a `reset` of
  `0001-01-01T00:00:00Z` and of `9999-12-31T23:59:59.999Z` passing, a
  `reset` of `0001-01-01T00:00:00+01:00` as an `invalid-capacity` finding
  at its `reset`, and the account a call resolves to with and without an
  instance entry.
  Tests of the window series show, for each length, the window that holds
  an instant before, at, and after `reset`, a `months` series across a
  year end and a 28th, a `reset` with a numeric offset, and, with each
  length at its maximum, the windows that hold `0011-01-01T00:00:00.000Z`
  and `9989-12-31T23:59:59.999Z` lying inside the representable range
  with four-digit-year keys.
