$schema: https://refinery.systems/ontology/specification
relationships:
  # GAP-EDGE: the specification schema declares no edge to a technical
  # design; `realizes` is the best fit for the designs whose contract this is.
  realizes:
    - gates
    - comparator-sandbox
description: |-
  Defines the comparator contract: the input a gate gives a comparator and
  the selection the comparator returns.
  `docs/specifications/comparator-contract.schema.yml` is the
  machine-readable definition of the data that crosses the sandbox boundary,
  as JSON. `packages/shared/src/comparator.d.ts` is its TypeScript form, the
  declaration file a comparator is typed and linted against.

  Comparator. A comparator is a TypeScript module whose default export is a
  function of type `Comparator`. It imports types from the module
  specifier `manifold:comparator` with `import type` and imports nothing
  else.

  ```ts
  export type Comparator = (input: ComparatorInput) => ComparatorSelection | null;

  export interface ComparatorInput {
    readonly population: readonly ComparatorTask[];
    readonly holders: readonly ComparatorHolder[];
    readonly balances: Readonly<Record<string, Readonly<Record<string, number>>>>;
    readonly random: () => number;
  }

  export interface ComparatorTask {
    readonly id: string;
    readonly fields: Readonly<Record<string, unknown>>;
    readonly age: number;
    readonly dependencies: "blocked" | "clear";
    readonly criticalPath: number;
    readonly item: string;
  }

  export interface ComparatorHolder {
    readonly id: string;
    readonly item: string;
  }

  export interface ComparatorSelection {
    readonly task: string;
    readonly reservations?: readonly ComparatorReservation[];
  }

  export interface ComparatorReservation {
    readonly account: string;
    readonly amount: number;
  }
  ```

  Population. `population` is the task actors in the gated state that hold
  no token from its gate and can take one now: an actor whose present
  entry into the gated state was already granted a token, or which has an
  event pending delivery, waits and is left out. `id` is the task's id. `fields` is the task's
  declared fields as JSON values. `age` is the whole number of milliseconds
  since the task entered the gated state, computed by Manifold when it
  assembles the input. `dependencies` is the state of the task's
  `dependencies` region. `criticalPath` is the number of tasks on the
  longest chain of open tasks that depend on this one, this task included.
  `item` is the name of the task's portfolio item.

  Holders. `holders` is the tasks holding a token from this gate, each with
  its id and portfolio item.

  Balances. `balances` maps a portfolio item name to an account name to
  what that item could reserve now in the account, the sharing rule's
  answer, in the account's native unit. An item the portfolio in force
  does not hold has no entry.

  Random. `random` returns a number in `[0, 1)`. It is a mulberry32
  generator over the evaluation's seed, so one input and one seed give one
  sequence of draws.

  Selection. A comparator returns `null` when no task proceeds, or a
  selection naming one task of the population by `task`, with the
  reservations to hold against that task's portfolio item, each naming an
  account and a whole amount of at least 1 in the account's native unit,
  since the ledger holds whole amounts.

  World. The function receives everything it may read as input. It has no
  clock, no state between calls, no I/O, no timers, and no module other than
  the types of `manifold:comparator`, and it returns synchronously.
format: json-schema
validation-criteria: >-
  `docs/specifications/comparator-contract.schema.yml` is a valid JSON Schema
  2020-12 document. `packages/shared/src/comparator.d.ts` declares the types
  above with the same names and properties. The comparator sandbox's tests
  return `invalid-output` for each value the `selection` definition rejects
  and for a `task` that names no task in the population, and return the
  value for each it accepts. The comparator lint's tests accept a
  comparator assignable to `Comparator` and reject one that is not.
