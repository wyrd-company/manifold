$schema: https://refinery.systems/ontology/specification
# GAP-EDGE: the specification schema declares no edge to a technical design;
# `references` is the best fit for the design this specification realizes.
relationships:
  references:
    - expressions
    - blueprint-expressions
    - blueprint
    - blueprint-loader
    - process-manifest
    - zen-jsonata
  mitigates:
    - decision-table-cell-semantics-unproven
description: |-
  Defines what a Manifold decision model is, how the JSONata decision
  table, JSONata expression node, and JSONata switch evaluate, what an evaluation returns and
  records, how a failure is reported, and what the decision model lint
  checks. `docs/specifications/decision-models.schema.yml` is the
  machine-readable definition of the decision model graph, the three custom
  node configurations, the finding, the error detail, and the evaluation record.
  The engine is `@gorules/zen-engine`, pinned to an exact version. JSONata is
  the primitive `packages/shared` exports, so cells, expression nodes, and
  blueprint expressions share one JSONata version and one error shape.
  Every expression in a decision model is JSONata; a model holds no
  expression in Zen's own expression language.

  Decision model. A decision model is a GoRules JDM graph in a YAML file
  (`.yml`) in the process repository, parsed with the YAML parser into the
  JDM object, and identified by a key the caller supplies, such as its path
  in the process repository. A JSON export from the stock editor is valid
  YAML and loads unchanged when saved as `.yml`. Its nodes are of four
  types: `inputNode`, `outputNode`, and `decisionNode` are stock JDM;
  `customNode` carries one of three kinds in `content.kind`,
  `jsonataDecisionTable`, `jsonataExpression`, or `jsonataSwitch`, with its
  configuration in `content.config`. A `decisionNode` names another model by its key in `content.key`. The
  models evaluated together form a set, and every key a `decisionNode`
  names is in the set. Properties the editor writes beyond those the schema
  names are kept and ignored.

  ```yaml
  id: c3a1
  name: shipping
  type: customNode
  content:
    kind: jsonataDecisionTable
    config:
      hitPolicy: first
      inputs:
        - { id: weight, name: Weight, field: parcel.kg }
      outputs:
        - { id: rate, name: Rate, field: quote.rate }
      rules:
        - { _id: heavy, weight: "$ > 20", rate: parcel.kg * 1.5 }
        - { _id: any, weight: "", rate: "10" }
  ```

  Reads and writes. A setting that reads a value, an input column's
  `field`, is a JSONata expression over the node input. A setting that names
  where a value goes or comes from by path, an output column's `field`,
  `inputField`, and `outputPath`, is a dotted path: property names joined by
  `.`. Writing at a dotted path creates each missing parent object.

  Node input. Zen gives a custom node the upstream output with a `$nodes`
  property holding the outputs of earlier nodes. The node removes `$nodes`;
  what remains is the node's whole input. When `inputField` is present, the
  node input is the value at that path of the whole input, or `null` when the
  path is absent; otherwise the node input is the whole input. A switch has
  no `inputField`, so its node input is its whole input. In `single`
  mode the node evaluates once over the node input. In `loop` mode the node
  input is an array and the node evaluates once per element, with that
  element as the node input; the node's result is the array of per-element
  results in order. A `loop` node whose value at `inputField` is not an array
  fails with a `result` error.

  Bindings. Every expression a custom node evaluates has three bindings
  beside `$`: `$input` is the node input, `$nodes` is the authored
  projection of the `$nodes` value Zen supplied, and JSONata's own functions
  are available unchanged.

  - An input column `field`: `$` is the node input. Its result is the column
    value. An absent or blank `field` makes the column value the node input.
  - An input cell: `$` is the column value. A blank cell matches without
    being evaluated. A non-blank cell matches when its result is exactly
    `true`; any other result, including a truthy value and no result, does
    not match.
  - An output cell: `$` is the node input. Its result is the column's value.
  - An expression node's `expression`: `$` is the node input. Its result is
    the node's result.
  - A switch statement's `condition`: `$` is the node input. It matches as
    an input cell does: blank matches without being evaluated, and a
    non-blank condition matches when its result is exactly `true`.

  A cell or condition is blank when its text is absent, `null`, empty, or whitespace
  only. Zen gives an explicitly `undefined` cell property to the handler as
  `null`, so `null` is blank.

  Decision table. A rule matches when every input cell of the rule matches;
  a rule with no input columns matches. Rules are tried in `rules` order, and
  within a rule input cells in `inputs` order; a rule stops at its first cell
  that does not match. Under `first` the table's result is the output of the
  first matching rule, or `{}` when none matches. Under `collect` it is the
  array of the outputs of every matching rule in order, or `[]`. Output cells
  are evaluated only for a matching rule. A rule's output is an object built
  by writing each output column's value at its `field`, in `outputs` order.
  A blank output cell and an output cell with no result write nothing and
  create no parent object. A `null` result writes `null`.

  Expression node. The node's result is the expression's result. No result
  gives `{}`.

  Switch. A JSONata switch holds `statements` in order, each with an `id`
  and a `condition`, and a `hitPolicy` of `first` or `collect`. An edge
  leaving the switch names a statement by its `id` in `sourceHandle`, and
  only the edges of taken statements carry the switch's input onward. Under
  `first` the first non-blank condition that matches, in `statements`
  order, is taken, and evaluation stops there; under `collect` every
  non-blank condition is evaluated and each that matches is taken. A
  statement with a blank condition is a default: every default is taken
  when no non-blank condition matched, under either policy. The switch's
  output is its node input, which is an object; a node input that is not an
  object fails with a `result` error. The switch has none of the node
  settings.

  Node output. A function result from an output cell or an expression node
  fails with a `result` error. When `outputPath` is present, the node output
  is a new object with the result written at that path; otherwise it is the
  result. When `passThrough` is `true`, the node output is the whole input
  deep-merged with the node output: objects merge property by property and
  any other value from the node output replaces. Pass-through on a node
  output that is not an object fails with a `result` error.

  Trace. Each custom node returns `traceData`. A decision table returns, per
  evaluation, one match object or `null` under `first`, or an array of match
  objects under `collect`; a match object is `{ index, rule: { _id },
  reference_map }`, where `index` is the rule's position and `reference_map`
  maps each input column id to its column value. In `loop` mode `traceData`
  is the array of per-element trace data. An expression node returns
  `{ "expression": <source> }`. A switch returns `{ statements: [{ id }] }`
  listing the taken statements in order.

  Locations. Every expression has a location, passed to `compileExpression`
  so each error it yields names it: `<model>#/nodes/<nodeId>` followed by
  `/rules/<ruleId>/<columnId>` for a cell, `/inputs/<columnId>/field` for an
  input column field, `/expression` for an expression node, and
  `/statements/<statementId>` for a switch condition. Each segment
  after `#` is escaped as in RFC 6901 (`~` as `~0`, `/` as `~1`).

  Shared lint. `packages/shared` exports the lint:

  ```ts
  function lintDecisionModel(model: unknown, key: string): readonly DecisionModelFinding[];
  ```

  `DecisionModelFinding` is `#/$defs/decision-model-finding`. The lint is
  synchronous and pure: it reads no file, network, clock, random source, or
  environment, evaluates no expression, and gives the same findings in the
  same order for the same model. It checks, in this order:

  1. `structure`: the model validates against `#/$defs/decision-model`. A
     node whose `type` or custom `kind` is outside the four types and three
     kinds, including the stock `switchNode`, `decisionTableNode`,
     `expressionNode`, and `functionNode`, is `node-unsupported`, not
     `structure`. When any `structure`
     finding exists the lint stops after this step.
  2. Per node in `nodes` order: `duplicate-id` for a node id seen before;
     for a custom node, `loop-needs-input-field`, and
     `pass-through-needs-object` for `passThrough` without `outputPath` on a
     `collect` table or any node in `loop` mode.
     For a JSONata switch, `duplicate-id` for a statement id seen before in
     that switch, and `switch-handle-unknown` for an edge leaving it whose
     `sourceHandle` names none of its statements.
  3. Per JSONata decision table: `duplicate-id` for a column id or rule id
     seen before in that table, and `output-field-conflict` for an output
     field equal to or a prefix, at a `.` boundary, of another.
  4. Per expression, in node order; within a table, input column fields in
     `inputs` order, then cells in `rules` order and within a rule `inputs`
     then `outputs` order; within a switch, conditions in `statements`
     order: `syntax` when `compileExpression` throws, carrying the JSONata
     `code` and `position`; otherwise, for a non-blank input cell or switch
     condition only, `never-boolean` when its AST is one of the shapes
     below.

  `syntax`, `structure`, `node-unsupported`, `duplicate-id`,
  `output-field-conflict`, `pass-through-needs-object`,
  `loop-needs-input-field`, and `switch-handle-unknown` are errors.
  `never-boolean` is a warning. Every finding names the model, and the
  node, rule, column, statement, and location that apply.

  Never-boolean. The lint reads the AST of the compiled expression,
  `compiled.expression.ast()` on the `CompiledExpression` that
  `compileExpression` returns, and classifies it without evaluating it. An expression is never-boolean when
  its AST root, with no predicate, stage, group, or focus attached, is:

  - a number, string, or `null` literal;
  - a binary `+`, `-`, `*`, `/`, `%`, `&`, or `..` operator;
  - a unary minus;
  - an array constructor or an object constructor;
  - a block whose last expression is never-boolean;
  - a condition whose `then` branch is never-boolean and whose `else` branch
    is absent or never-boolean.

  Every other expression, including a variable, a path, a function call, a
  comparison, and any node with a predicate or stage, is not classified and
  gives no warning; strict matching decides it at run time. `[true][0]` is
  not classified, because its predicate can select a boolean.

  Service seam. `packages/service` exports one function:

  ```ts
  function createDecisionModels(models: Readonly<Record<string, unknown>>): DecisionModels;

  interface DecisionModels {
    readonly findings: readonly DecisionModelFinding[]; // the warnings of every model
    evaluate(key: string, input: Record<string, unknown>): Promise<DecisionModelEvaluation>;
    dispose(): void;
  }
  ```

  `models` maps each key to the parsed YAML of a decision model file. `DecisionModelEvaluation` is
  `#/$defs/decision-model-evaluation`. Creating lints every model in key
  order, adds a `model-missing` error for each `decisionNode` whose key is
  not in `models`, and throws a `DecisionModelLoadError` carrying every error
  finding when any exists. Otherwise it compiles every expression once,
  keeps the compiled forms by location, and builds one Zen engine whose
  loader serves a prepared copy of the set and whose custom handler
  evaluates the three custom kinds. The caller's objects are not changed.
  In the prepared copy:

  - each custom node's configuration carries a `$model` property naming its
    model, from which the handler reads which model a node belongs to;
  - each JSONata switch with id `S` is followed by a routing node with id
    `S~route`. The edges that left `S` leave `S~route`, and one edge joins
    `S` to `S~route`. The handler evaluates the switch's conditions and
    outputs the switch's node input with a `__manifoldSwitch` property, an
    object with `s<i>` set to `true` for each taken statement at position
    `i` and `false` for every other. `S~route` is a stock switch with hit
    policy `collect` and one statement per position, with id `s<i>` and
    condition `__manifoldSwitch.s<i>`; each edge's `sourceHandle` is the
    `s<i>` of the statement it named. The routing conditions are generated
    by the service, read one boolean each, and appear in no file in the
    process repository.

  `__manifoldSwitch` exists only at the top level of a node's input or
  output. The authored projection of a value removes it: a node map, such as
  `$nodes`, loses each generated routing entry for its model, and every
  remaining node output and
  every node input or output loses its top-level `__manifoldSwitch`, so a
  switch's projected output is its node input. Every custom node takes the
  authored projection of its whole input and of `$nodes` before it
  evaluates anything, and the service takes the authored projection of the
  result and of every trace entry. No expression, result, or record sees a
  generated node or `__manifoldSwitch`, at any depth. An authored id ending
  in `~route` remains visible unless it collides with a generated routing id
  in the same model. Creating fails with a `duplicate-id` error when a model already holds a node id equal to
  a generated `S~route`.

  `evaluate` runs the model with the engine's trace on. It resolves to a
  `result` record with the model's result and the full trace, or to an
  `error` record with the error detail and the partial trace; it rejects only
  for a key that is not in the set. The record shows the model as written:
  on success and on failure, the trace holds no generated routing entry, and each
  entry's input and output, including any `$nodes` within them, is its
  authored projection. `dispose`
  releases the engine. The service restores top-level null properties omitted
  by Zen from each subgraph result, using the subgraph's output-node trace
  inputs. The decision-node outputs, their direct output-node inputs, and the
  final result record retain those null properties.

  Errors. `DecisionModelErrorDetail` is
  `#/$defs/decision-model-error-detail`. A cell, field, or expression that
  throws stops the evaluation: no later rule, fallback rule, or downstream
  node runs. Its detail has kind `evaluation`, the `ExpressionErrorDetail`
  fields `evaluateExpression` gave, and the model and node, with the rule
  and column for a cell or field, or the statement for a switch condition.
  A `result` failure names the model and node, and the rule and column when
  an output cell gave it. The handler throws an error whose message is the
  detail as JSON. Zen rejects with an `Error` whose message is a JSON
  envelope `{ nodeId, source, type: "NodeError", trace }`, where `source` is
  the handler's message and `trace` is the partial trace. The service parses
  the envelope, parses the detail from `source`, writes the detail into the
  failing node's `traceData.error` in the partial trace, and resolves the
  `error` record. For a nested model, the detail is written into the inner
  trace held by each ancestor decision node's `traceData`; the ancestor entries
  and the rest of the partial trace are retained. A rejection that is not a
  `NodeError` envelope from a
  Manifold node is an `engine` error with the engine's message and the
  partial trace when the envelope carries one, or `{}`.

  Determinism. Evaluation writes nothing: `evaluate` over the same input
  gives the same record, except through JSONata's clock and random
  functions and the `performance` timings. A `DecisionModels` instance holds
  only what it derived from `models`, so a restarted service rebuilds it
  from the process repository and a repeated evaluation after a crash
  evaluates afresh.

  Model sets. A decision model's key is its repository-relative path, a
  `.yml` path with the path rules of `ProcessRepositoryRevision`. The set
  rooted at a model is that model and, through each `decisionNode`'s
  `content.key`, every model it names, to any depth, each read once.
  `packages/shared` exports the set lint:

  ```ts
  function lintDecisionModelSet(
    read: (path: string) => Promise<string | undefined>,
    root: string,
  ): Promise<DecisionModelSetLint>;

  type DecisionModelSetLint =
    | {
        readonly ok: true;
        readonly models: Readonly<Record<string, unknown>>; // parsed, by path
        readonly findings: readonly ProcessManifestFinding[]; // warnings only
      }
    | { readonly ok: false; readonly findings: readonly ProcessManifestFinding[] };
  ```

  It runs step 4 of the `process-manifest` lint from `root`, with the same
  checks, kinds, locations, and order, so `ProcessManifestFinding` is
  `process-manifest`'s `#/$defs/finding`. A root that fails the path
  check is `model-key-invalid`, and a root with no file is
  `model-missing`, each in the root's file at the empty pointer.
  `lintProcessManifest` runs it from the intake decision model and
  places a missing or invalid root at `/intake/decisionModel` in
  `manifold.yml`. The lint reads only through `read`, and the same
  answers give the same result.

  Invoked models. A blueprint invoke whose `src` is a decision model path
  under `decision-models/` evaluates the set rooted there, as `blueprint`
  states. The blueprint loader lints each such set once per commit and
  path, with the revision's `read`, and passes the error findings of each
  path to the blueprint lint as `decisionModels`, so a version that
  invokes a model the commit does not hold, or holds with an error, does
  not load. A version that loads binds each invoked path as a promise
  logic named by the path. The logic checks that its input is an object,
  builds `createDecisionModels` over the set's models, evaluates the root
  with the input, disposes the instance, and resolves with the
  evaluation's `result`. An input that is not an object rejects with a
  `decision-model-invoke-error` of reason `input`, and an `error` record
  rejects with one of reason `evaluation` that carries the record as
  `evaluation`, so the record names the failing node, rule, column, or
  statement. The logic writes nothing; a restored actor's invoke
  evaluates again over the same commit's models.
format: json-schema
validation-criteria: >-
  Every fixture model, finding, error detail, and evaluation record
  validates against `docs/specifications/decision-models.schema.yml`.
  Fixture models are `.yml` files parsed with the YAML parser, and one is a
  stock editor JSON export saved as `.yml` unchanged. The
  service tests evaluate a model that joins input, a JSONata decision table,
  a JSONata expression node, a JSONata switch with two branches, and output
  through `createDecisionModels`, and assert that only the taken branch's
  nodes run. Downstream of the switch, an expression node returning
  `{ "previous": $nodes.<switchId>, "ids": $keys($nodes) }` gives the
  switch's node input with no `__manifoldSwitch` at any depth, and node ids
  with no generated routing id; the result, and the trace of that run and of a run
  failing in a later cell, hold no generated routing entry and no
  `__manifoldSwitch` property at any depth. Table-driven tests run, under both `first` and
  `collect`, an input cell for each result in `true`, `false`, `null`, `0`,
  `""`, no result, `[1,2]`, `[]`, `{"x":1}`, `7`, and `"sample"`, with the
  column value set equal to the result, and assert that only `true`
  matches; a column value that is present and one that is missing, read
  with `$` and `$input`; blank input cells as empty, whitespace, `null`, and
  absent, each matching present and missing values; an output cell writing a
  nested object, a blank output cell, and an output cell with no result.
  They cover `passThrough`, `inputField`, `outputPath`, and `loop` mode, a
  `decisionNode` into a second model, and a `$nodes` reference. Switch
  tests run, under both `first` and `collect`, the same strict-matching
  results as input cells for a condition; two matching statements, taking
  one under `first` and both under `collect`; a default statement taken
  only when no other matched; and a switch whose node input is an array,
  failing with a `result` error. A failing
  input cell and a failing output cell, each followed by a catch-all rule,
  resolve an `error` record naming node, rule, and column, with that detail
  in the failing node's `traceData.error`, under both policies; a failing
  switch condition resolves an `error` record naming node and statement.
  Tests cover authored ids ending in `~route`, including an id that equals
  a routing id generated only in another model, and nested result and failure
  records at two nesting depths. A contract
  test asserts the `NodeError` envelope shape and the null native
  `traceData` of a failing custom node at the pinned engine version. The
  lint tests in `packages/shared` cover each finding kind; a stock
  `switchNode` giving `node-unsupported`; `structure` findings for
  malformed content, a `decisionNode` with no `key`, a JSONata switch
  statement with no `id`, and a switch `hitPolicy` outside `first` and
  `collect`, while an unknown editor property on a recognized node gives no
  finding; a `syntax` finding in an input cell, an output cell, and a switch
  condition; a `never-boolean` warning on a switch condition; each never-boolean shape,
  and the expressions `true`, `false`, `$ > 3`, `$`, `item.value`,
  `$custom()`, `$number($)`, `true ? true : 3`, and `[true][0]` giving no
  warning. Set lint tests in `packages/shared` call
  `lintDecisionModelSet` with an in-memory reader and show, for a root
  whose `decisionNode` names a second model, both models parsed by path;
  for an absent root, `model-missing` in the root's file at the empty
  pointer; for a root `../x.yml`, `model-key-invalid` with no read; and
  that `lintProcessManifest` gives the findings it gave before for each
  manifest fixture. Service tests load a blueprint whose state invokes
  `decision-models/parcel-quote.yml` at a commit holding the model, start
  an actor, and assert that `onDone` takes the result an evaluation of
  the same input gives; that a mapping input taken from context
  evaluates; that a static input that is not an object takes `onError`
  with reason `input`; that a failing cell takes `onError` with reason
  `evaluation` and the record naming node, rule, and column; that an
  actor restored while the invoke runs takes `onDone` once; and that a
  commit whose model has a `syntax` error, or holds no model at the
  path, loads the blueprint in `failures` with the `decision-model`
  finding. Fixtures use a domain unrelated to Manifold.
