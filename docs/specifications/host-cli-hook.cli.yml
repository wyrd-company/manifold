# ---
# relationships:
#   # GAP-EDGE: no asset edge is declared; `asset-of` names the specification
#   # this native definition belongs to.
#   asset-of: host-cli-hook
# ---
$schema: https://commonclischema.org/draft/2026-04/schema
tool:
  name: manifold-host
  mode: non-interactive
  summary: The Manifold host CLI, installed on each environment.
commands:
  - name: hook
    summary: Run the harness plugin's hooks for a provider harness.
    mode: non-interactive
    subcommands:
      - name: post-tool-use
        summary: Tell the agent of new messages for its thread after a tool call.
        mode: non-interactive
        options:
          - name: service
            flags: [--service]
            kind: option
            description: The base URL of the Manifold service, `http` or `https`.
            required: true
            repeatable: false
            value:
              type: string
            examples:
              - http://127.0.0.1:8080
          - name: environment
            flags: [--environment]
            kind: option
            description: >-
              The name of this environment, as the service configuration's
              `environments` section names it.
            required: true
            repeatable: false
            value:
              type: string
            examples:
              - workstation
          - name: provider
            flags: [--provider]
            kind: option
            description: >-
              The provider harness that runs the hook, which sets the hook
              input it reads and the output it writes: `claude`, `codex`, or
              `cursor`.
            required: true
            repeatable: false
            value:
              type: string
            examples:
              - codex
          - name: t3-home
            flags: [--t3-home]
            kind: option
            description: >-
              T3 Code's data directory, whose `userdata/state.sqlite` holds
              each thread's provider session. When absent, `T3CODE_HOME`,
              else `~/.t3`.
            required: false
            repeatable: false
            value:
              type: string
            examples:
              - /home/example/.t3
          - name: timeout-ms
            flags: [--timeout-ms]
            kind: option
            description: >-
              The most time in milliseconds the hook waits for the service.
              Default 2000; from 100 to 10000.
            required: false
            repeatable: false
            value:
              type: integer
            examples:
              - "2000"
        output:
          modes:
            - name: hook
              description: >-
                Nothing when there is no notice; otherwise one JSON object in
                the provider's hook output format that adds the notice to the
                tool's result as context.
              machine-readable: true
          exit-codes:
            - code: 0
              meaning: >-
                The hook ran, whether or not it found a notice, read its
                input, or reached the service.
            - code: 2
              meaning: >-
                The command line is invalid: an unknown option, a missing
                `--service`, `--environment`, or `--provider`, a service URL
                that is not `http` or `https`, an environment name that is
                not a declared name, an unknown provider, or a timeout out
                of range. Nothing is sent.
        examples:
          - manifold-host hook post-tool-use --service http://127.0.0.1:8080 --environment workstation --provider codex
