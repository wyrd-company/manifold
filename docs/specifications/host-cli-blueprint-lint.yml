$schema: https://refinery.systems/ontology/specification
relationships:
  # GAP-EDGE: the specification schema declares no edge to a technical
  # design; `realizes` is the best fit for the design whose command this is.
  realizes:
    - blueprint-loader
  references:
    - blueprint
    - blueprint-expressions
    - token-lint
    - task-metadata-declaration
description: >-
  Defines the host CLI command `manifold-host blueprint lint`, which runs
  the blueprint lint of `blueprint` on the host. It is the same
  `lintBlueprint` function the service runs on every load, from
  `packages/shared`, called with `manifoldImplementationNames`, the
  implementation names the service registers.
  `docs/specifications/host-cli-blueprint-lint.cli.yml` is the
  machine-readable definition.

  `--configuration-bound <n>` sets the token lint's configuration bound,
  an integer of at least 1, default 20000, the default of the service's
  `blueprintLint.configurationBound`. A value that is not such an integer
  is reported on standard error and ends the command with exit code 2
  before any file is read.

  `--repository <dir>` names the process repository checkout whose task
  metadata declaration the lint checks a literal `status` of a
  `github-card-move` invoke against, as `blueprint` states. The command
  reads `task-metadata.yml` and `bindings.yml` from that directory, an
  absent file as `undefined`, and lints them with
  `lintTaskMetadataDeclaration`, then passes the declared options to
  `lintBlueprint` as `lifecycleOptions`. A directory or file that cannot be
  read ends the command with exit code 2, as an unreadable blueprint file
  does. A declaration with findings is reported on standard error as
  `task-metadata.yml: <n> findings; run manifold-host task-metadata lint`
  and ends the command with exit code 2 before any blueprint is linted.
  With `--repository` and no file argument, the command lints every
  blueprint that repository runs: each blueprint file of the checkout, and
  each blueprint Manifold bundles whose path no file of the checkout
  replaces, each named by its repository path. Without `--repository`,
  the lint does not check `status`, and at least one file is required.

  The command reads every file argument as UTF-8 text before it lints any.
  A file that cannot be read is reported on standard error as
  `<file>: <reason>` and ends the command with exit code 2 before any file
  is linted. Otherwise it lints each file with the file as given on the
  command line as its path, and reports every finding on standard output
  as one line, `<file>:<location> <kind> <message>`, with the location the
  RFC 6901 JSON Pointer of the failing value in the document. A `yaml`
  finding ends with ` (line <line>, column <column>)`; an
  `implementation-unknown` finding ends with ` (<implementationKind>
  <name>)`; a finding that names a sample ends with ` (sample <sample>)`,
  or ` (sample <sample>, event <type>)` when it names an event type; a
  token finding ends with ` (gate <statePath>)`. The lint's warnings,
  `token-potential` and `token-unknown`, are reported on standard output
  in the same form, after the file's findings. A file that is not YAML or
  not a blueprint is a finding, not an error of the command. Files are
  reported in argument order, and findings and warnings in the lint's
  order within a file. The command prints nothing when every file is
  clean and has no warning. It exits 1 when any file has a finding, and 0
  when files have only warnings.
format: cli
validation-criteria: >-
  `docs/specifications/host-cli-blueprint-lint.cli.yml` validates against
  the CLI Command Specification schema. A test compiles the host CLI for
  the current platform and runs `blueprint lint` from a directory with no
  `node_modules`. It observes exit 0 and no output for a clean blueprint;
  exit 1 with a `yaml` line for text that is not YAML, a `shape` line for
  a document with no `schemas`, an `implementation-unknown` line for an
  invoke `src` Manifold does not register, a `machine` line for a target
  that names no state, and a `result` line for a guard whose result is not
  a boolean, each located in the document, and a `token-violation` line
  for a gate with a fixed-choice trap that cannot reach actor completion; exit 0 with a `token-potential`
  line for a gate whose strand needs a named guard's choice, and with a
  `token-unknown` line for a gate linted with `--configuration-bound 10`
  on a graph larger than that; and exit 2 with no standard output for no
  file without `--repository`, for an unreadable file after a valid file, and for
  `--configuration-bound 0`. With `--repository` naming a checkout whose
  declaration lists `Packed`, it observes exit 0 for a blueprint whose
  `github-card-move` input is `{ status: Packed }` and exit 1 with a
  `lifecycle-option` line for `{ status: Pakced }`; exit 0 for the second
  blueprint without `--repository`; exit 1 with a `lifecycle-option` line
  for a bundled blueprint's path when `--repository` is given with no file
  and the checkout's declaration lacks a status that bundled blueprint
  sets, and no line for that path when the checkout replaces it with a
  clean file; and exit 2 with no standard output for a checkout whose
  `task-metadata.yml` has a `schema` finding. For each
  token-lint fixture of `token-lint`,
  the lines equal those built from the loader's findings and warnings for
  the same text.
