# GAP-SCHEMA: the risk schema is marked WIP; as in `github-events-incomplete`,
# no slug is authored and the property is spelled `response-strategy`.
$schema: https://refinery.systems/ontology/risk
title: A thread's provider session is replaced before a usage push reads its mapping, and that session's calls stay unattributed

# GAP-EDGE: the risk schema declares no relationship-types; `related-to`
# names the design that reads the mappings and the risk this narrows.
relationships:
  related-to:
    - usage-intake
    - t3code-session-mapping
    - task-usage-unattributable

description: >-
  A usage push learns which thread a provider session belongs to from T3
  Code's `provider_session_runtime` table, which holds one row per thread:
  the thread's current provider session. When a thread starts or resumes a
  new provider session, T3 Code replaces that row, and the earlier
  session's mapping is gone. A push that runs after the replacement cannot
  send the earlier mapping, so that session's calls the service holds
  without a mapping stay under the session's ledger actor and never reach
  the task. They still count against their account and window, so
  capacity stays right; only the task's actual and variance miss them. The
  window opens at a session's first call and closes at the first push
  that runs while T3 Code still holds that session's mapping. A related
  gap: a call posted after its mapping arrives but before the thread's
  actor saves its ownership of the thread posts under
  the ledger actor `thread:<environment>:<thread id>` on the item of the
  thread's T3code project, not to the task, and a later ownership does not
  move it.

categories:
  - technical

likelihood: 2
impact: 2

response-strategy: accept

status: open

# Acceptance: a push on a timer, as the operator setup guide shows every ten
# minutes, narrows the window to one push interval, and the late attribution
# of a mapping that arrives after its calls covers every session whose
# mapping T3 Code still holds. Attributing calls posted before their
# thread's ownership is wave 6 task 1202.
