# GAP-SCHEMA: the risk schema is marked WIP and has two defects, flagged rather
# than followed: (1) it requires `slug`, which contradicts the standing
# "artifact id = filename" bet — no slug field is authored here; (2) its
# `required` list names `response` but the property is `response-strategy` —
# the property spelling is used.
$schema: https://refinery.systems/ontology/risk
title: Provider session files cannot be reliably attributed to individual tasks

# GAP-EDGE: the risk schema declares no relationship-types; the spike schema's
# `mitigates` edge (inverse: mitigated-by) is the intended link.
relationships:
  mitigated-by:
    - cost-history
    - usage-decoder
    - usage-intake
    - t3code-session-mapping
    - usage-api
  related-to:
    - cursor-usage-unmetered

description: >-
  Manifold's gates request estimates from the user's process, which intends to build
  estimates from task cost history. Cost history must reach Manifold from provider
  session files, attributed to the right task. A session file may be the work of one
  agent on one task (a straightforward case) or an orchestrator spawning multiple child
  threads across multiple tasks (the complex case). Without a reliable way to map a
  session or session-like unit back to the task that owns the work, the usage tool
  cannot settle actuals to the right task, estimates built on history will be wrong,
  and per-task budgets cannot account for the work done.

categories:
  - technical
  - project

likelihood: 3

impact: 4

response-strategy: mitigate
# Mitigation: the host CLI maps each provider session to its T3 Code thread
# from T3 Code's own database, and the service maps the thread to its actor
# and state visit, or to its T3code project's binding, or to the portfolio
# item of the actor that created the project, or to the top-level Other.
# Usage that no actor owns shows on the Portfolio screen as unowned usage,
# and the operator moves it to its task or item. Cursor sessions under T3
# Code are decoded from their ACP session stores and reach their thread
# and task as unmetered calls; their missing token counts are the
# `cursor-usage-unmetered` risk.

status: mitigated
