# GAP-SCHEMA: the risk schema is marked WIP; as in `github-events-incomplete`,
# no slug is authored and the property is spelled `response-strategy`.
$schema: https://refinery.systems/ontology/risk
title: A front matter write can replace a person's body edit that lands while it writes

# GAP-EDGE: the risk schema declares no relationship-types; `mitigated-by`
# names the design that holds the check and the recovery.
relationships:
  mitigated-by:
    - github-event-source
    - task-metadata

description: >-
  GitHub takes an issue's body whole and offers no conditional write: the
  REST `PATCH` and the GraphQL `updateIssue` take no version, and GitHub
  documents conditional requests for reads only. A front matter write
  reads the body, sets one key, and writes the body back, so a person's
  edit that GitHub takes between that read and that write is replaced.
  The source checks the issue's edit history after each write. When the
  write replaced one edit and is itself the newest edit, the source
  repairs once: it sets the key on the replaced text that GitHub's
  `UserContentEdit.diff` gives and writes that. Every other outcome ends
  the write as a durable `body-conflict` with no further write: replaced
  text that `diff` does not give, an edit newer than the write, any edit
  by another account around the repair, and edits whose order GitHub's
  one-second timestamps cannot establish against the recorded basis. A
  person's edit that lands just before the repair write is replaced in
  the body, stays in GitHub's edit history, and is named by the
  `body-conflict`, and the blueprint decides what to do. GitHub keeps at
  most 100 edits of an issue, and its documentation does not state that
  `diff` holds an edit's whole text.

categories:
  - technical

likelihood: 2
impact: 2

response-strategy: mitigate

status: mitigated

# Mitigation: one repair with its own persisted basis, then a durable
# `body-conflict`. Fault tests make a person's edit land before the write,
# during the repair, and across a restart with a check pending. The live
# front matter check set, replayed, and cleared a value on a real issue
# with the issue's prose kept, and `diff` gave the edit's whole body text.
# Residual limit, accepted: GitHub offers no conditional body write, so an
# edit that lands just before the repair write is replaced in the body and
# reported, not prevented.
