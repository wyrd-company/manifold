# GAP-SCHEMA: the risk schema is marked WIP and has two defects, flagged
# rather than followed: (1) it requires `slug`, which contradicts the standing
# "artifact id = filename" bet — no slug field is authored here; (2) its
# `required` list names `response` but the property is `response-strategy` —
# the property spelling is used.
$schema: https://refinery.systems/ontology/risk
title: A gate on an XState state may not survive crashes or rebuild from snapshots

# GAP-EDGE: the risk schema declares no relationship-types; the spike schema's
# `mitigates` edge (inverse: mitigated-by) is the intended link.
relationships:
  mitigated-by:
    - gate-xstate

description: >-
  A gate is an implementation on a gated state in a task blueprint, holding the
  population of tasks waiting for tokens and granting them one at a time.
  Tokens are written to inbox before delivery and snapshots are saved before
  consumption, so they survive crashes. The uncertainty is whether this design
  delivers exactly once across all crash points in the grant loop, rebuilds the
  gate population from persisted snapshots without loading every actor into
  memory, and scales to thousands of concurrent tasks. If durability fails
  (tokens lost, redelivered, or population corrupted), task ordering and budget
  guarantees break. If rebuild requires loading every actor instance, the
  restore operation becomes unsuitable at scale.

categories:
  - technical

likelihood: 3
impact: 4

response-strategy: mitigate
# Mitigation: gate-xstate exercises three grant crash points and real SIGKILL,
# two independent gates with later returns, final-state return of every token,
# reconciliation after a return snapshot is saved, and lazy rebuild of 2000
# snapshot rows plus outstanding consumed or pending token rows with zero
# actors loaded. The measured host assumes one writer and does not prove
# ledger settlement, power-loss durability, or concurrent service instances.
# General token lint is tracked by token-lint-completeness-unproven.

status: mitigated
