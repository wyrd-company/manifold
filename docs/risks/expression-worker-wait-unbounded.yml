$schema: https://refinery.systems/ontology/risk
title: A runaway blueprint expression or an exiting expression worker stalls the service thread

# GAP-EDGE: the risk schema declares no relationship-types; these edges connect
# the decision that accepts the exposure, the design that mitigates it, and the
# specifications that state the bound.
relationships:
  related-to:
    - evaluate-blueprint-expressions-in-a-worker-thread
    - expressions
    - blueprint-expressions
    - expressions-configuration

description: >-
  Blueprint guards, matches, assignments, and mappings evaluate in one worker
  thread per service process, and the calling thread blocks on
  `Atomics.wait` until the result arrives. A worker that exits or hangs
  during an evaluation would leave the calling thread, and every actor it
  runs, waiting with no error. JSONata has no loop construct, but a
  recursive user-defined function can run without end.
  The wait is bounded by `timeoutMs` of the `expressions` section of
  service configuration, and a supervisor thread wakes the calling thread
  as soon as the worker exits. Either failure fails that one evaluation as
  an expression error and restarts the worker. The remaining exposure is a
  stall of the calling thread for the bound, 1000 ms by default, each time
  a runaway expression is evaluated.

categories:
  - technical

likelihood: 2
impact: 2

response-strategy: mitigate

status: mitigated
