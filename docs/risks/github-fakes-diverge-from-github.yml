# GAP-SCHEMA: the risk schema is marked WIP; as in `github-events-incomplete`,
# no slug is authored and the property is spelled `response-strategy`.
$schema: https://refinery.systems/ontology/risk
title: The GitHub fakes of the tests may not behave as GitHub does

# GAP-EDGE: the risk schema declares no relationship-types; `mitigated-by`
# names the design that exposes the difference early.
relationships:
  mitigated-by:
    - live-github-environment
  related-to:
    - github-event-source
    - service-assembly

description: >-
  Every module that talks to GitHub is tested against fakes: signed webhook
  deliveries, GraphQL reads, the sweep, the redelivery scan, and the App
  installation token. A payload shape, a status code, a permission the
  installation token lacks, or a delivery GitHub does not send can differ
  from the fakes, and the tests pass while the service fails against
  GitHub. Such a difference shows only when the service first runs
  against GitHub, at user acceptance if nothing runs it sooner.

categories:
  - technical

likelihood: 3
impact: 3

response-strategy: mitigate

status: mitigated

# Mitigation: the live GitHub environment runs the assembled service against
# a real organization through the App installation and a signed organization
# hook. Its smoke check covers delivery, intake, and the sweep, and the
# default blueprint runs on it through both card moves. A difference it finds is fixed in the fake
# as well as in the module. The fakes model what the live runs measured:
# hook deliveries page by the `Link` cursor, not by page number; a hook
# route takes only the owner parameter its path names, and answers 422 to
# any other; a delivery attempt id can exceed the safe integer range; an
# empty repository answers Git Data reads with 409; `deleteProjectV2`
# returns `projectV2`. The fake models a Project's fields as the GraphQL
# schema documents them: an update that sends an option's `id` keeps the
# option and the item values that hold it, and one that leaves an option out
# clears its values. The Project configuration live check applies a
# declaration to a fresh Project, changes a declared option by hand,
# observes drift, and applies again, so the fake's field writes are
# measured against GitHub. Residual: what no live run crosses, which is a
# user-owned Project, the field value's `updatedAt` that card move
# attribution could read, whether GitHub refuses a second field of one
# name, and the away-and-back case: a person who moves a card away and back
# to a confirmed move's value before the source reads it is reported as
# that move. A field or option recreated between a crash and a card move's
# replay is covered by evidence per resolved id and a regression against
# the fake.
