# and requires response while declaring response-strategy. Follow the same
# documented conventions as gate-durability-unproven.
$schema: https://refinery.systems/ontology/risk
title: Blueprint token lint may accept a path that never returns a token
# GAP-EDGE: the risk schema declares no relationships; these edges connect
# the evidence and governing technical design.
relationships:
  mitigated-by:
    - gate-xstate
  related-to:
    - gates

description: >-
  The gate design requires blueprint lint to prove that every path after a
  guarded transition reaches the declared token return point or actor
  completion. Configuration traversal catches the tested parallel, ancestor,
  eventless, multi-target, dead-end, cycle, and history traps, but active-state
  sets alone merge different remembered histories and accept a runnable
  counterexample. Sound graph identity needs history memory or equivalent
  successor expansion, internal event semantics, and transient return entry.
  Branching opaque guards true and false can reject a valid blueprint whose
  named guard is always false; abstract cycle diagnostics need feasible
  witnesses. Invocation lifetimes and outputs, delay cancellation, named
  action behavior, wildcard event classes, and payload/context-dependent
  execution remain undecided. Three four-state regions produce 65 graph
  nodes; eight produce 65537 and take about six seconds in the probe. Nine
  exceed its 100000-node research cutoff. No supported-shape restriction or
  production resource limit is selected. The universal supported-shape
  guarantee remains unproved before the loader relies on it.

categories:
  - technical
likelihood: 4
impact: 4
response-strategy: mitigate
status: open
