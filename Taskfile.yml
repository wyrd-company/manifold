# ---
# relationships:
#   implements: operator-console
# ---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds: [task --list]
    silent: true

  install:
    desc: Install dependencies
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm --filter @wyrd-company/manifold-service exec playwright install chromium

  build:
    desc: Build every package; the host CLI compiles for the current platform
    cmds: [pnpm run build]

  build:targets:
    desc: Compile the host CLI for Linux x64/arm64, macOS arm64, and Windows x64
    cmds: [pnpm --filter @wyrd-company/manifold-host-cli run build:targets]

  format:
    desc: Format every file
    cmds: [pnpm run fmt]

  format:check:
    desc: Fail on any file that is not formatted
    cmds: [pnpm run fmt:check]

  lint:
    desc: Lint every package
    cmds: [pnpm run lint]

  typecheck:
    desc: Type-check every package
    cmds: [pnpm run typecheck]

  test:
    desc: Run every package's tests
    cmds: [pnpm run test]

  check:
    desc: Everything a change must pass; CI runs this
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: test

  live:provision:
    desc: Provision the isolated live GitHub test environment
    cmds: [node testing/live-github/src/provision.ts]
    env:
      CONTENT: '{{.CONTENT | default ""}}'

  live:start:
    desc: Start the live GitHub service and restricted tunnel in the foreground
    cmds:
      - task: build
      - node testing/live-github/src/start.ts
    env:
      ANSWERS: '{{.ANSWERS | default "0"}}'
      OVERLAY: '{{.OVERLAY | default ""}}'
      SERVICE_PORT: '{{.SERVICE_PORT | default ""}}'

  live:stop:
    desc: Stop the live environment or recover its recorded children
    cmds: [node testing/live-github/src/stop.ts]

  live:smoke:
    desc: Check live GitHub delivery, intake, sweep, and tunnel paths
    cmds: [node testing/live-github/src/smoke.ts]

  live:teardown:
    desc: Remove only marked live GitHub test resources
    cmds: [node testing/live-github/src/teardown.ts]
  package:service:
    desc: Build a Linux glibc service archive (ARCH=x64 or arm64)
    cmds:
      - node packages/service/scripts/package-service.mjs '{{.ARCH | default ""}}'

  package:smoke:
    desc: Start the native service archive outside the workspace and check upgrades
    cmds:
      - node packages/service/scripts/package-smoke.mjs
